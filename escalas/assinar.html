<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Assinatura de contrato · Hotel Fazenda Oasis</title>
<link rel="icon" href="icone.svg">
<style>
:root{--pri:#0f4c5c;--ok:#15803d;--err:#b91c1c;--ink:#1f2937;--ink2:#6b7280;--line:#e5e7eb;--bg:#f3f5f8}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:16px;line-height:1.5}
header{background:linear-gradient(90deg,#0f4c5c,#13677a);color:#fff;padding:14px 16px;display:flex;align-items:center;gap:12px}
header img{height:34px}
header b{font-size:17px}
main{max-width:760px;margin:0 auto;padding:14px 12px 40px}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
h1{font-size:18px;text-align:center;margin:4px 0 12px}
h2{font-size:16px;margin:0 0 10px}
.cl b{display:block;margin-top:12px}
.cl p{margin:2px 0 0}
.muted{color:var(--ink2)}.small{font-size:14px}
label{display:block;font-weight:600;margin:12px 0 4px}
input[type=text]{width:100%;font-size:17px;padding:11px 12px;border:1px solid #cfd6df;border-radius:10px;background:#fff}
input.erro{border-color:var(--err);background:#fff5f5}
.msg-err{color:var(--err);font-size:14px;margin-top:4px;min-height:1px}
.aceite{display:flex;gap:10px;align-items:flex-start;margin-top:14px;font-weight:400}
.aceite input{width:24px;height:24px;flex:0 0 auto;margin-top:1px}
.pad{position:relative;border:2px dashed #9aa8b6;border-radius:12px;background:#fff;touch-action:none;height:190px}
.pad canvas{width:100%;height:100%;display:block;border-radius:10px;touch-action:none}
.pad .dica{position:absolute;left:0;right:0;bottom:46px;text-align:center;color:#b6c0ca;pointer-events:none;font-size:15px}
.pad .base{position:absolute;left:8%;right:8%;bottom:38px;border-top:1px solid #c8d0d8;pointer-events:none}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px}
.btn{appearance:none;border:1px solid #cfd6df;background:#fff;color:var(--ink);border-radius:10px;padding:12px 16px;font-size:16px;font-weight:600;cursor:pointer;min-height:48px}
.btn.pri{background:var(--pri);border-color:var(--pri);color:#fff;flex:1}
.btn:disabled{opacity:.55}
.alerta{border-radius:12px;padding:14px 16px;margin-bottom:14px}
.alerta.ok{background:#ecfdf3;border:1px solid #a7e3bd}
.alerta.err{background:#fef2f2;border:1px solid #f5c2c2}
.alerta.info{background:#eff6ff;border:1px solid #c7dbf7}
.cod{font-family:ui-monospace,Menlo,monospace;letter-spacing:.5px}
.carregando{text-align:center;padding:40px 10px;color:var(--ink2)}
</style>
<script>window.NUVEM = {"url": "https://cxddpwyqxfpjqrbcffhk.supabase.co", "key": "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImN4ZGRwd3lxeGZwanFyYmNmZmhrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTQxNTM1MjksImV4cCI6MjEwOTcyOTUyOX0.3e71_a8CQWfrRShr56pBAtt8aD4rg2U2J0JOS4b2OK8"};</script>
</head>
<body>
<header><img src="logo.png" alt="" onerror="this.remove()"><b>Assinatura de contrato</b></header>
<main id="app"><div class="carregando">Abrindo o contrato…</div></main>
<script>
(function () {
  'use strict';
  var app = document.getElementById('app');
  var link = (location.hash || '').replace(/^#/, '').trim();
  var esc = function (s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); };
  var dataHora = function (iso) { var d = new Date(iso); return d.toLocaleDateString('pt-BR') + ' às ' + d.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' }); };
  var dataBR = function (iso) { if (!iso) return ''; var p = String(iso).slice(0, 10).split('-'); return p[2] + '/' + p[1] + '/' + p[0]; };
  var brl = function (v) { return (Number(v) || 0).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' }); };

  function rpc(fn, args) {
    return fetch(window.NUVEM.url + '/rest/v1/rpc/' + fn, {
      method: 'POST', headers: { 'Content-Type': 'application/json', apikey: window.NUVEM.key, Authorization: 'Bearer ' + window.NUVEM.key }, body: JSON.stringify(args)
    }).then(function (r) { return r.text().then(function (t) { var j = t ? JSON.parse(t) : null; if (!r.ok) { var e = new Error((j && j.message) || 'Erro'); throw e; } return j; }); });
  }

  function cpfValido(c) {
    c = String(c || '').replace(/\D/g, '');
    if (c.length !== 11 || /^(\d)\1{10}$/.test(c)) return false;
    var s = 0, i, r;
    for (i = 0; i < 9; i++) s += +c[i] * (10 - i); r = (s * 10) % 11; if (r === 10) r = 0; if (r !== +c[9]) return false;
    s = 0; for (i = 0; i < 10; i++) s += +c[i] * (11 - i); r = (s * 10) % 11; if (r === 10) r = 0; return r === +c[10];
  }
  function mascaraCpf(v) {
    v = v.replace(/\D/g, '').slice(0, 11);
    return v.replace(/^(\d{3})(\d)/, '$1.$2').replace(/^(\d{3})\.(\d{3})(\d)/, '$1.$2.$3').replace(/\.(\d{3})(\d{1,2})$/, '.$1-$2');
  }

  function msg(tipo, titulo, texto) { app.innerHTML = '<div class="alerta ' + tipo + '"><b>' + esc(titulo) + '</b><div>' + texto + '</div></div>'; }

  function contratoHtml(d) {
    var h = '<div class="card"><h1>' + esc(d.titulo) + '</h1><div class="small muted" style="text-align:center;margin-top:-6px">Contrato ' + esc(d.numero) + '</div>';
    h += '<p><b>CONTRATANTE:</b> ' + esc(d.hotel) + ', CNPJ ' + esc(d.cnpj) + ', neste ato representado por seu responsável legal.</p>';
    h += '<p><b>CONTRATADA:</b> ' + esc(d.contratada && d.contratada.nome || '') + (d.contratada && d.contratada.doc ? ', CPF/CNPJ ' + esc(d.contratada.doc) : ', CPF informado na assinatura abaixo') + '.</p>';
    h += '<div class="cl">' + (d.clausulas || []).map(function (c) { return '<b>' + esc(c.titulo) + '</b><p>' + esc(c.texto) + '</p>'; }).join('') + '</div></div>';
    return h;
  }

  function reciboHtml(d) {
    var h = '<div class="card"><h1>Recibo de pagamento</h1><div class="small muted" style="text-align:center;margin-top:-6px">Nº ' + esc(d.numero) + '</div>';
    h += '<p>Recebi do ' + esc(d.hotel) + ' (CNPJ ' + esc(d.cnpj) + ') a importância líquida de <b>' + brl(d.liquido) + '</b>, referente a serviços prestados no período de ' + dataBR(d.inicio) + ' a ' + dataBR(d.fim) + ' (' + esc(d.lote) + ').</p>';
    h += '<table style="width:100%;border-collapse:collapse;font-size:15px">';
    (d.linhas || []).forEach(function (l) { h += '<tr style="' + (l.negrito ? 'font-weight:700;background:#f6f8f8;' : '') + '"><td style="padding:7px 4px;border-bottom:1px solid #e5e7eb">' + esc(l.t) + '</td><td style="padding:7px 4px;border-bottom:1px solid #e5e7eb;text-align:right;white-space:nowrap">' + esc(l.v) + '</td></tr>'; });
    h += '</table>';
    if (d.pendencia > 0) h += '<p class="small muted">Pendência para conferência (não descontada neste recibo): ' + brl(d.pendencia) + '.</p>';
    return h + '</div>';
  }

  function telaAssinar(r) {
    var d = r.documento || {};
    var rec = d.tipo === 'recibo';
    var titulo = rec ? 'Assinatura de recibo' : 'Assinatura de contrato';
    document.title = titulo + ' · Hotel Fazenda Oasis';
    var hdr = document.querySelector('header b'); if (hdr) hdr.textContent = titulo;
    app.innerHTML = '<div class="alerta info small">' + (rec ? 'Leia o recibo com atenção. No fim da página, informe seus dados, assine com o dedo e toque em <b>Confirmar recebimento</b>.' : 'Leia o contrato com atenção. No fim da página, informe seus dados, assine com o dedo e toque em <b>Assinar contrato</b>.') + ' Este link vale até ' + dataHora(r.expira) + '.</div>' +
      (rec ? reciboHtml(d) : contratoHtml(d)) +
      '<div class="card" id="form"><h2>Seus dados e assinatura</h2>' +
      '<label for="nome">Nome completo</label><input type="text" id="nome" autocomplete="name" value="' + esc(d.contratada && d.contratada.nome || '') + '"><div class="msg-err" id="eNome"></div>' +
      '<label for="cpf">CPF</label><input type="text" id="cpf" inputmode="numeric" autocomplete="off" placeholder="000.000.000-00" value="' + esc(mascaraCpf(d.contratada && d.contratada.doc || '')) + '"><div class="msg-err" id="eCpf"></div>' +
      '<label>Assinatura</label><div class="pad"><canvas id="pad"></canvas><div class="base"></div><div class="dica" id="dica">Assine aqui com o dedo</div></div><div class="msg-err" id="eAss"></div>' +
      '<div class="row"><button class="btn" type="button" id="limpar">Limpar assinatura</button></div>' +
      '<label class="aceite"><input type="checkbox" id="aceite"><span>' + (rec ? 'Confirmo que recebi o valor líquido deste recibo e que os dados acima são meus.' : 'Li e concordo com todas as cláusulas deste contrato e confirmo que os dados acima são meus.') + '</span></label><div class="msg-err" id="eAce"></div>' +
      '<div class="row"><button class="btn pri" type="button" id="assinar">' + (rec ? 'Confirmar recebimento' : 'Assinar contrato') + '</button></div>' +
      '<p class="small muted">Ao assinar ficam registrados a data e a hora, o seu aparelho e o código do texto <span class="cod">' + esc(r.codigo) + '</span>, que garante que o contrato não foi alterado.</p></div>';
    document.getElementById('aceite').addEventListener('change', function () { if (this.checked) document.getElementById('eAce').textContent = ''; });
    var cpf = document.getElementById('cpf');
    cpf.addEventListener('input', function () { cpf.value = mascaraCpf(cpf.value); });
    var pad = iniciarPad(document.getElementById('pad'));
    document.getElementById('limpar').onclick = function () { pad.limpar(); document.getElementById('dica').style.display = ''; };
    document.getElementById('assinar').onclick = function () { enviar(pad, this); };
  }

  function iniciarPad(cv) {
    // a assinatura é guardada como traços (pontos); o quadro e a imagem final são redesenhados a partir deles,
    // então nada se perde se a tela girar, rolar ou mudar de tamanho
    var tracos = [], atual = null, ctx, dpr = Math.max(1, window.devicePixelRatio || 1), COR = '#0b1f4d', ESP = 2.6;
    function desenhar(c, t, esp) {
      c.lineCap = 'round'; c.lineJoin = 'round'; c.strokeStyle = COR; c.fillStyle = COR; c.lineWidth = esp;
      t.forEach(function (tr) {
        if (tr.length === 1) { c.beginPath(); c.arc(tr[0].x, tr[0].y, esp / 2, 0, 7); c.fill(); return; }
        c.beginPath(); c.moveTo(tr[0].x, tr[0].y); for (var i = 1; i < tr.length; i++) c.lineTo(tr[i].x, tr[i].y); c.stroke();
      });
    }
    function ajustar() {
      var r = cv.getBoundingClientRect(); if (!r.width) return;
      cv.width = Math.round(r.width * dpr); cv.height = Math.round(r.height * dpr);
      ctx = cv.getContext('2d'); ctx.setTransform(dpr, 0, 0, dpr, 0, 0); desenhar(ctx, tracos, ESP);
    }
    ajustar(); window.addEventListener('resize', ajustar);
    function pos(e) { var r = cv.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; }
    cv.addEventListener('pointerdown', function (e) {
      e.preventDefault(); try { cv.setPointerCapture(e.pointerId); } catch (x) { }
      if (!ctx || cv.width !== Math.round(cv.getBoundingClientRect().width * dpr)) ajustar();
      atual = [pos(e)]; tracos.push(atual); document.getElementById('dica').style.display = 'none'; desenhar(ctx, [atual], ESP);
    });
    cv.addEventListener('pointermove', function (e) {
      if (!atual) return; e.preventDefault(); var p = pos(e), u = atual[atual.length - 1];
      atual.push(p); ctx.lineCap = 'round'; ctx.strokeStyle = COR; ctx.lineWidth = ESP; ctx.beginPath(); ctx.moveTo(u.x, u.y); ctx.lineTo(p.x, p.y); ctx.stroke();
    });
    ['pointerup', 'pointercancel', 'pointerleave'].forEach(function (t) { cv.addEventListener(t, function () { atual = null; }); });
    var total = function () { return tracos.reduce(function (n, t) { return n + t.length; }, 0); };
    return {
      vazio: function () { return total() < 12; },
      limpar: function () { tracos = []; atual = null; ajustar(); },
      // imagem só da área assinada, redesenhada dos traços em boa resolução
      imagem: function () {
        if (!tracos.length) return null;
        var x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9;
        tracos.forEach(function (t) { t.forEach(function (p) { x0 = Math.min(x0, p.x); y0 = Math.min(y0, p.y); x1 = Math.max(x1, p.x); y1 = Math.max(y1, p.y); }); });
        var m = 6, w = x1 - x0 + 2 * m, h = y1 - y0 + 2 * m, k = Math.min(3, 700 / w);
        var o = document.createElement('canvas'); o.width = Math.max(1, Math.round(w * k)); o.height = Math.max(1, Math.round(h * k));
        var c = o.getContext('2d'); c.setTransform(k, 0, 0, k, (m - x0) * k, (m - y0) * k); desenhar(c, tracos, ESP);
        return o.toDataURL('image/png');
      }
    };
  }

  function enviar(pad, btn) {
    var nome = document.getElementById('nome'), cpf = document.getElementById('cpf'), ok = true;
    var set = function (id, t) { document.getElementById(id).textContent = t || ''; if (t) ok = false; };
    var n = nome.value.trim().replace(/\s+/g, ' ');
    set('eNome', n.length < 5 || n.indexOf(' ') < 0 ? 'Escreva o nome completo (nome e sobrenome).' : '');
    nome.classList.toggle('erro', !!document.getElementById('eNome').textContent);
    set('eCpf', !cpfValido(cpf.value) ? 'CPF inválido. Confira os números.' : '');
    cpf.classList.toggle('erro', !!document.getElementById('eCpf').textContent);
    set('eAss', pad.vazio() ? 'Faça a sua assinatura no quadro.' : '');
    set('eAce', !document.getElementById('aceite').checked ? 'Marque que leu e concorda com o contrato.' : '');
    var img = ok ? pad.imagem() : null;
    if (ok && !img) set('eAss', 'Faça a sua assinatura no quadro.');
    if (!ok) { var e = document.querySelector('.msg-err:not(:empty)'); if (e) e.scrollIntoView({ block: 'center', behavior: 'smooth' }); return; }
    btn.disabled = true; btn.textContent = 'Enviando…';
    rpc('esc_assinatura_assinar', { p_link: link, p_nome: n, p_cpf: cpf.value, p_assinatura: img, p_aceite: true, p_aparelho: navigator.userAgent })
      .then(function (r) {
        window.scrollTo(0, 0);
        msg('ok', 'Assinatura registrada. Obrigado!', '<p style="margin:6px 0 0">Assinado por <b>' + esc(n) + '</b> em ' + dataHora(r.assinado_em) + '.</p><p class="small muted" style="margin:6px 0 0">Código de verificação: <span class="cod">' + esc(r.codigo) + '</span>. O ' + 'Hotel Fazenda Oasis já recebeu o contrato assinado. Você pode fechar esta página.</p>');
      }, function (e) {
        btn.disabled = false; btn.textContent = 'Assinar contrato';
        var m = String(e.message || '');
        var t = /CPF_INVALIDO/.test(m) ? 'CPF inválido. Confira os números.' : /NOME_INVALIDO/.test(m) ? 'Escreva o nome completo.' : /ASSINATURA/.test(m) ? 'Faça a assinatura no quadro (um pouco maior).' :
          /EXPIRADO/.test(m) ? 'Este link expirou. Peça um novo ao hotel.' : /JA_ASSINADO/.test(m) ? 'Este contrato já foi assinado.' : /LINK_INVALIDO/.test(m) ? 'Este link não vale mais. Peça um novo ao hotel.' : 'Não deu para enviar. Verifique a internet e tente de novo.';
        set('eAce', t); document.getElementById('eAce').scrollIntoView({ block: 'center' });
      });
  }

  if (!/^[0-9a-f]{20,}$/i.test(link)) { msg('err', 'Link incompleto', 'Abra o link exatamente como recebeu (ele é longo). Se não funcionar, peça um novo ao hotel.'); return; }
  rpc('esc_assinatura_ver', { p_link: link }).then(function (r) {
    if (r.situacao === 'pendente') return telaAssinar(r);
    if (r.situacao === 'assinado') return msg('ok', 'Este contrato já foi assinado', '<p style="margin:6px 0 0">Assinado por <b>' + esc(r.nome) + '</b> em ' + dataHora(r.assinado_em) + '. Código <span class="cod">' + esc(r.codigo) + '</span>.</p>');
    if (r.situacao === 'expirado') return msg('err', 'Link expirado', 'O prazo para assinar acabou. Peça um novo link ao hotel.');
    msg('err', 'Link inválido', 'Este link não vale mais (foi cancelado ou substituído). Peça um novo ao hotel.');
  }, function () { msg('err', 'Não deu para abrir o contrato', 'Verifique a internet e tente de novo.'); });
})();
</script>
