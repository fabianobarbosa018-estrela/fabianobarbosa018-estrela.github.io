  <tr>${L.map((l, i) => thN(l, i, `<span class="vts" ${vtValorTxt(m, l, per) ? '' : 'style="color:#b91c1c"'}>${vtValorTxt(m, l, per) || 'sem valor'}</span>`, `class="edit-click" data-act="vtValor" data-id="${l.id}" title="Valor diário de ${esc(l.nome)}${l.qtd > 1 ? ' (' + l.qtd + ' × ' + rs(l.passagem) + ')' : ''}"`)).join('')}</tr>
  </thead><tbody>`;
  const sub = (q, rot) => `<tr class="vtsub"><td class="fnm">${rot}</td>${L.map((l, i) => `<td style="background:${VT_COR[i % 2]}">${l[q].valor ? brl(l[q].valor) : '-'}</td>`).join('')}</tr>`;
  for (let k = ini; k <= fim; k++) {
    const d = m.dias[k - 1], fer = feriadoEm(d);
    h += `<tr><td class="fnm" ${fer ? `style="background:${COR_FERIADO}" title="Feriado: ${esc(fer.nome)}"` : ''}>${k} ${C.DIAS_CURTO[C.diaSemana(d)].toUpperCase()}</td>`;
    L.forEach((l, i) => {
      const c = l.cel[k - 1];

      h += `<td class="${cls}" style="${c.tipo === 'ferias' ? '' : 'background:' + VT_COR[i % 2]}" data-act="vtDia" data-id="${l.id}" data-d="${d}" title="${esc(vtCelTitulo(l, c))}">${vtCelTxt(c)}</td>`;
    });
    h += `</tr>`;
    if (per === 'mes' && k === 15) h += sub('q1', '1ª QUINZ.');

  if (per === 'mes') h += sub('q2', '2ª QUINZ.');
  const totP = L.reduce((a, l) => a + vtTot(l, per).valor, 0), pagoP = L.reduce((a, l) => a + vtPago(l, per), 0);
  h += `</tbody><tfoot>
  <tr class="vtv"><td class="fnm">VALOR</td>${L.map((l, i) => `<td style="background:${VT_COR[i % 2]}">${vtTot(l, per).valor ? brl(vtTot(l, per).valor) : '-'}</td>`).join('')}</tr>
  <tr><td class="fnm">DIAS</td>${L.map((l, i) => `<td style="background:${VT_COR[i % 2]}">${vtTot(l, per).dias}</td>`).join('')}</tr>
  <tr><td class="fnm">PAGO</td>${L.map((l, i) => { const p = vtPago(l, per); const pg = (vtDoc(m.mes).pagamentos || {})[l.id] || {}; const info = ['q1', 'q2'].filter(q => (per === 'mes' || per === q) && pg[q]).map(q => VT_PER[q] + ': ' + rs(pg[q].valor) + (pg[q].data ? ' em ' + C.dataBR(pg[q].data) : '') + (pg[q].forma ? ' (' + pg[q].forma + ')' : '')).join(' · '); return `<td style="background:${VT_COR[i % 2]}" class="edit-click" data-act="vtPag" data-id="${l.id}" title="${esc(info || 'Registrar pagamento de ' + l.nome)}">${p ? brl(p) : '<span class="muted">—</span>'}</td>`; }).join('')}</tr>
  <tr class="vtsaldo"><td class="fnm">SALDO</td>${L.map((l, i) => { const s = Math.round((vtTot(l, per).valor - vtPago(l, per)) * 100) / 100; return `<td style="background:${VT_COR[i % 2]};color:${s > 0 ? '#C00000' : s < 0 ? '#1d4ed8' : '#000'}">${s ? brl(s) : '-'}</td>`; }).join('')}</tr>

function vtCadastroHTML(m) {
  const ref = m.dias[m.dim - 1];
  const fs = vtOrdenados().filter(f => f.ativo || (f.vt && f.vt.hist && f.vt.hist.length));
  let h = `<div class="alert i"><span class="ic">i</span><div>O valor diário é <b>valor da passagem × passagens por dia</b>. Ao mudar um valor, escolha a partir de quando ele vale: os meses anteriores continuam com o valor antigo.</div></div>
  <div class="tw"><table class="list"><thead><tr><th>Funcionário</th><th>Setor</th><th>Chave Pix</th><th class="r">Valor da passagem</th><th class="r">Passagens/dia</th><th class="r">Valor diário</th><th>Vale desde</th><th></th></tr></thead><tbody>`;
  fs.forEach(f => {
    const v = C.vtValorEm(f, ref), nao = f.vt && f.vt.nao;
    const px = vtPix(f.id);
    h += `<tr><td><b>${esc(f.nome)}</b>${f.ativo ? '' : ' <span class="badge b-off">inativo</span>'}</td><td>${esc(nomeSetor(f.setorId))}</td><td>${px.pix ? esc(px.pix) + (px.titular ? '<div class="small muted">' + esc(px.titular) + '</div>' : '') : '<span class="muted">—</span>'}</td>

  return h + '</tbody></table></div>';
}

/* ---- edição ---- */
async function vtSalvarDoc(ym, mut, texto) {
  const doc = clone(vtDoc(ym)); doc.mes = ym;
  mut(doc);
  doc.alteracoes = (doc.alteracoes || []).concat([{ ts: agoraISO(), texto }]).slice(-300);
  doc.atualizadoEm = agoraISO();
  try { await Store.set('vt', ym, doc); log('vt', 'VT ' + ym.slice(5) + '/' + ym.slice(0, 4) + ': ' + texto); return true; } catch (e) { return false; }
}
function vtEditarDia(fid, d) {

  const fx = l.fixo ? { padrao: cf.fixoPadrao || 0, editado: !!cf.fixoEditado, atual: cf.fixoQ || 0 } : null;
  const base = { trab: 'Trabalho', folga: 'Folga', ferias: 'Férias', semEscala: 'Semana sem escala', fora: 'Fora do período' }[c.base];
  const w = abrirModal(`<div class="mh">${esc(l.nome)} — ${C.DIAS[C.diaSemana(d)].toLowerCase()}, ${C.dataBR(d)}</div><div class="mbd">
  <p>Pela escala: <b>${base}</b> · valor diário ${rs(l.valorDia)}</p>
  <div class="fld"><label class="f">Neste dia</label><select id="vtT" style="width:100%"><option value="">Seguir a escala (automático)</option>${Object.entries(C.VT_TIPOS).map(([k, t]) => `<option value="${k}" ${a.t === k ? 'selected' : ''}>${t.nome}</option>`).join('')}</select></div>

      const s = setorPorId(id); const n = S.funcionarios.filter(f => f.setorId === id).length;
      if (n) return modalMsg('Setor com funcionários', `<p>O setor <b>${esc(s.nome)}</b> tem ${n} funcionário(s) cadastrado(s) (ativos ou inativos). Transfira-os para outro setor antes de excluir.</p>`);
      if (!await confirmar('Excluir setor?', `<p>Excluir o setor <b>${esc(s.nome)}</b>?</p>`, 'Excluir', true)) return;
      try { await Store.del('setores', id); log('setor', 'Setor excluído: ' + s.nome); } catch (e) { }
      return;
    }
    case 'addSug': try { const o = S.setores.reduce((mx, x) => Math.max(mx, x.ordem ?? -1), -1) + 1; await Store.set('setores', uid('s'), { nome: el.dataset.n, ordem: o, cor: PALETA[o % PALETA.length], criadoEm: agoraISO() }); log('setor', 'Setor criado: ' + el.dataset.n); } catch (e) { } return;
    case 'histTab': UI.histTab = el.dataset.t; return render();
    case 'selSetor': { const id = el.dataset.id, a = UI.setoresSel || []; UI.setoresSel = a.includes(id) ? a.filter(x => x !== id) : a.concat(id); return render(); }
    case 'selLimpar': UI.setoresSel = []; return render();
    case 'mesPDF': case 'mesXLS': case 'mesPrint': {
      const ids = setoresOrd().map(x => x.id).filter(id => (UI.setoresSel || []).includes(id));
      if (!ids.length) return toast('Marque pelo menos um setor para baixar.');
      const antes = { p: UI.expPeriodo, e: UI.expEscopo, s: UI.expSetores };
      UI.expPeriodo = 'mes'; UI.expEscopo = 'setor'; UI.expSetores = ids;
      try { return await (act === 'mesPDF' ? exportarPDF(false) : act === 'mesXLS' ? exportarExcel() : exportarPDF(true)); }
      finally { UI.expPeriodo = antes.p; UI.expEscopo = antes.e; UI.expSetores = antes.s; }
    }
    case 'delAntigas':
      if (!await confirmar('Excluir escalas antigas?', `<p>${Object.keys(S.escalasAntigas).length} escala(s) no formato antigo (segunda a domingo) serão excluídas.</p>`, 'Excluir', true)) return;
      try { for (const k of Object.keys(S.escalasAntigas)) await Store.del('escalas', k); log('sistema', 'Escalas no formato antigo excluídas'); toast('Excluídas.'); } catch (e) { }
      return;
    case 'ferAdd': {
      const d = document.getElementById('ferData').value, n = document.getElementById('ferNome').value.trim();
      if (!d) return toast('Escolha a data.');
      const l = feriadosLista().filter(f => f.data !== d).concat([{ data: d, nome: n || 'Feriado' }]).sort((a, b) => a.data.localeCompare(b.data));
      try { await Store.set('config', 'geral', Object.assign({}, S.config, { feriados: l })); log('sistema', 'Feriado adicionado: ' + C.dataBR(d) + ' ' + (n || '')); } catch (e) { }
      return;
    }
    case 'ferDel': { const l = feriadosLista().filter(f => f.data !== el.dataset.d); try { await Store.set('config', 'geral', Object.assign({}, S.config, { feriados: l })); log('sistema', 'Feriado removido: ' + C.dataBR(el.dataset.d)); } catch (e) { } return; }
    case 'ferNac': {
      const y = +document.getElementById('ferAno').value; if (!y) return;
      const atual = feriadosLista(); const novos = C.feriadosNacionais(y).filter(f => !atual.some(a => a.data === f.data));
      try { await Store.set('config', 'geral', Object.assign({}, S.config, { feriados: atual.concat(novos).sort((a, b) => a.data.localeCompare(b.data)) })); toast(novos.length + ' feriado(s) nacional(is) de ' + y + ' adicionado(s).'); } catch (e) { }
      return;
    }
    case 'reconectar': ev.preventDefault(); try { await Nuvem.carregarTudo(); toast('Conectado.'); } catch (e) { toast('Ainda sem conexão.'); } return;
    case 'sairNuvem': if (await confirmar('Sair?', '<p>Você precisará da senha para entrar de novo neste aparelho.</p>', 'Sair')) Nuvem.sair(false); return;
    case 'trocarSenha': {
      const at = document.getElementById('snAtual').value, nv = document.getElementById('snNova').value;
      if (nv.length < 6) return toast('A nova senha precisa ter pelo menos 6 caracteres.');
      try { await Nuvem.rpc('esc_trocar_senha', { p_atual: at, p_nova: nv }); document.getElementById('snAtual').value = ''; document.getElementById('snNova').value = ''; log('sistema', 'Senha alterada'); modalMsg('Senha alterada', '<p>A senha foi trocada. Os outros aparelhos precisarão entrar com a nova senha.</p>'); }
      catch (e) { toast(e.code === 'SENHA_INCORRETA' ? 'Senha atual incorreta.' : e.code === 'SEM_CONEXAO' ? 'Sem conexão.' : 'Erro: ' + e.message); }
      return;
    }
    case 'listarBk': {
      try { const l = await Nuvem.rpc('esc_listar_backups', {}); document.getElementById('bkAuto').innerHTML = l.length ? '<ul class="list-sm">' + l.map(b => `<li><span>${dtHora(b.em)}</span><button class="btn sm" data-act="baixarBk" data-id="${b.id}">Baixar</button></li>`).join('') + '</ul>' : '<p class="muted">O primeiro backup automático é feito na madrugada de hoje para amanhã (3h).</p>'; }
      catch (e) { toast('Não foi possível listar.'); }
      return;
    }
    case 'baixarBk': {
      try {
        const b = await Nuvem.rpc('esc_obter_backup', { p_id: +id });
        const d = { sistema: 'escalas-hotel', versao: 1, exportadoEm: b.feito_em, config: CONFIG_PADRAO, setores: [], funcionarios: [], escalas: {}, vt: {}, auditoria: [] };
        (b.docs || []).forEach(x => { const o = Object.assign({ id: x.i }, x.d); if (x.c === 'vt') d.vt[x.i] = x.d; else if (x.c === 'escalas') d.escalas[x.i] = Object.assign({}, x.d, { semana: x.i }); else if (x.c === 'config') { if (x.i === 'geral') d.config = x.d; } else d[x.c].push(o); });
        await salvarArquivo('backup-automatico-' + String(b.feito_em).slice(0, 10) + '.json', JSON.stringify(d, null, 1));
      } catch (e) { toast('Não foi possível baixar.'); }
      return;
    }
    case 'vtMesAnt': case 'vtMesProx': { ev.preventDefault(); let [y, m] = UI.vtMes.split('-').map(Number); m += act === 'vtMesAnt' ? -1 : 1; if (m < 1) { m = 12; y--; } if (m > 12) { m = 1; y++; } UI.vtMes = y + '-' + String(m).padStart(2, '0'); return render(); }
    case 'vtTab': ev.preventDefault(); UI.vtTab = el.dataset.t; return render();
    case 'vtPer': UI.vtPer = el.dataset.p; return render();
    case 'vtDia': if (S.somenteLeitura) return; return vtEditarDia(id, el.dataset.d);
    case 'vtValor': if (S.somenteLeitura) return; return vtEditarValor(id);
    case 'vtPag': if (S.somenteLeitura) return; return vtPagamento(id);
    case 'vtFechar': ev.preventDefault(); return vtFechar(el.dataset.q);
    case 'vtReabrir': return vtReabrir(el.dataset.q);
    case 'vtPagarTodos': return vtPagarTodos(el.dataset.q);
    case 'vtPDF': return vtPDF(UI.vtPer, false);
    case 'vtPrint': return vtPDF(el.dataset.p, true);
    case 'vtXLS': return vtExcel();
    case 'expPDF': return exportarPDF(false);
    case 'expPrint': return exportarPDF(true);
    case 'expXLS': return exportarExcel();
    case 'backup': return baixarBackup();
    case 'salvarCfg': { const n = document.getElementById('cfgNome').value.trim(), t = document.getElementById('cfgTitulo').value.trim(), imp = document.getElementById('cfgImp').value.trim(); try { await Store.set('config', 'geral', Object.assign({}, S.config, { nomeHotel: n, tituloFolha: t || 'ESCALA DE FOLGA', textoImportante: imp, feriados: feriadosLista() })); log('sistema', 'Configurações alteradas'); toast('Configurações salvas.'); } catch (e) { } return; }
  }
});
document.addEventListener('change', ev => {
  const t = ev.target;
  if (t.dataset && t.dataset.svc === 'dia') { window.__svcT = Date.now(); servDia(t.dataset.mes, t.dataset.pid, t.dataset.dd, t.value).catch(() => { }); return; }
  if (t.id === 'inServMes' && t.value) { UI.servMes = t.value; render(); return; }
  if (t.id === 'selPer') { UI.servPer = t.value; render(); return; }
  if (t.id === 'selPainelSetor') { UI.painelSetor = t.value; UI.painelDia = undefined; render(); return; }
  if (t.id === 'selGrupo') { UI.servGrupo = t.value; render(); return; }
  if (t.id === 'chkSoValor') { UI.servSoValor = t.checked; return; }
  if (t.id === 'selFormato') { UI.servFormato = t.value; return; }
  if (t.id === 'chkFechAnt') { UI.servFechAnt = t.checked; return; }
  if (t.id === 'inSemana' && t.value) { UI.semana = C.inicioSemana(t.value); render(); }
  else if (t.id === 'inMes' && t.value) { UI.mes = t.value; render(); }
  else if (t.id === 'painelDia' && t.value) { UI.painelDia = t.value; render(); }
  else if (t.id === 'vtMes' && t.value) { UI.vtMes = t.value; render(); }
  else if (t.id === 'fSetor') { UI.filtroSetor = t.value; render(); }
  else if (t.id === 'fSit') { UI.situacao = t.value; render(); }
  else if (t.id === 'expPeriodo') { UI.expPeriodo = t.value; render(); }
  else if (t.id === 'expEscopo') { UI.expEscopo = t.value; if (t.value === 'setor' && !UI.expSetor) UI.expSetor = (setoresOrd()[0] || {}).id; if (t.value === 'func' && !UI.expFunc) UI.expFunc = (S.funcionarios.slice().sort((a, b) => a.nome.localeCompare(b.nome))[0] || {}).id; render(); }
  else if (t.id === 'expSetor') { UI.expSetor = t.value; render(); }
  else if (t.id === 'expFunc') { UI.expFunc = t.value; render(); }
  else if (t.id === 'inRestore' && t.files[0]) { restaurar(t.files[0]); t.value = ''; }
  else if (t.dataset.act === 'mudarGrupo') mudarGrupo(t.dataset.id, +t.value);
});
document.addEventListener('input', ev => {
  if (ev.target.dataset && ev.target.dataset.svc === 'dia') window.__svcT = Date.now();
  if (ev.target.id === 'busca') { UI.busca = ev.target.value; const l = document.getElementById('listaFunc'); if (l) l.innerHTML = listaFuncHTML(); }
});
// toque longo no nome (celular) abre ações
let lp = null;
document.addEventListener('touchstart', ev => {
  const td = ev.target.closest('.esc td.nm'); if (!td || UI.rota !== 'escala') return;
  const tr = td.parentElement; const sel = tr.querySelector('select[data-act=mudarGrupo]'); const lockBtn = tr.querySelector('[data-act=bloq]');
  const id = (sel && sel.dataset.id) || (lockBtn && lockBtn.dataset.id); if (!id) return;
  lp = setTimeout(async () => {
    const e = S.escalas[UI.semana]; const a = e.atribuicoes[id];
    const r = await modalMsg(esc((funcPorId(id) || a).nome), '<p>Escolha uma ação:</p>', [{ t: 'Cancelar', v: 0 }, { t: a.bloq ? 'Desbloquear' : 'Bloquear combinação', v: 1 }, { t: 'Trocar folgas', c: 'pri', v: 2 }]);
    if (r === 1) { const at = clone(e.atribuicoes); at[id].bloq = !at[id].bloq; salvarAlteracao(UI.semana, at, (at[id].bloq ? 'Bloqueada' : 'Desbloqueada') + ' a combinação de ' + (funcPorId(id) || at[id]).nome); }
    if (r === 2) trocarFolgas(id);
  }, 600);
}, { passive: true });
['touchend', 'touchmove', 'touchcancel'].forEach(n => document.addEventListener(n, () => clearTimeout(lp), { passive: true }));

irRota();
Store.init();
</script>
