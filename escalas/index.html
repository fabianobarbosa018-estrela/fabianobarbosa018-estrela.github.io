<style>

  --r:12px; --sh:0 1px 2px rgba(16,24,40,.06),0 1px 3px rgba(16,24,40,.08);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--ink);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--pri2)}
.app{display:flex;min-height:100vh}
/* Sidebar */
.side{width:236px;background:var(--pri);color:#e6f1f3;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;flex-shrink:0;z-index:30}
.brand{padding:20px 18px 14px;border-bottom:1px solid rgba(255,255,255,.1)}
.brand b{display:block;font-size:15px;font-weight:800;letter-spacing:.2px;color:#fff}
.brand small{opacity:.75;font-size:12px}
.nav{padding:10px 8px;flex:1;overflow:auto}
.nav a{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:9px;color:#d6e7ea;text-decoration:none;font-weight:500;margin-bottom:2px}
.nav a:hover{background:rgba(255,255,255,.08)}
.nav a.on{background:#fff;color:var(--pri);font-weight:700}
.nav svg{width:18px;height:18px;flex-shrink:0}
.side-foot{padding:12px 16px;font-size:12px;border-top:1px solid rgba(255,255,255,.1);opacity:.85}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;background:#9ca3af}
.dot.g{background:#4ade80}.dot.y{background:#facc15}
/* Main */
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.top{display:none;align-items:center;gap:10px;padding:10px 14px;background:var(--pri);color:#fff;position:sticky;top:0;z-index:20}
.top b{font-size:15px}
.burger{background:none;border:0;color:#fff;padding:6px;cursor:pointer}
.content{padding:24px 28px 60px;max-width:1400px;width:100%}
h1{font-size:22px;margin:0 0 4px;font-weight:800;letter-spacing:-.2px}
.sub{color:var(--ink2);margin:0 0 20px}
h2{font-size:16px;margin:0 0 12px;font-weight:700}
h3{font-size:14px;margin:0 0 8px;font-weight:700}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);padding:18px}
.grid{display:grid;gap:16px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.kpi .n{font-size:28px;font-weight:800;letter-spacing:-.5px}
.kpi .l{color:var(--ink2);font-size:13px}
.kpi .x{font-size:12px;color:var(--ink3);margin-top:2px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.sp{flex:1}
.mt{margin-top:16px}.mb{margin-bottom:16px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:#fff;border-radius:9px;padding:8px 14px;cursor:pointer;font-weight:600;white-space:nowrap;text-decoration:none;color:var(--ink)}
.btn:hover{background:#f9fafb}
.btn.pri{background:var(--pri);border-color:var(--pri);color:#fff}
.btn.pri:hover{background:var(--pri2)}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.danger{color:var(--err);border-color:#fecaca}
.btn.danger:hover{background:var(--err-bg)}
.btn.wa{background:#25d366;border-color:#25d366;color:#fff}
.btn.sm{padding:5px 10px;font-size:13px;border-radius:8px}
.btn.icon{padding:6px 8px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn svg{width:16px;height:16px}
.big{font-size:16px;padding:14px 22px;border-radius:12px;font-weight:800;letter-spacing:.3px;box-shadow:0 4px 14px rgba(15,76,92,.25)}
input[type=text],input[type=password],input[type=date],input[type=month],input[type=search],select,textarea{border:1px solid #d1d5db;border-radius:9px;padding:8px 10px;background:#fff;min-height:38px;max-width:100%}
textarea{width:100%;min-height:90px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid var(--pri2);outline-offset:-1px;border-color:var(--pri2)}

.b-off{background:#f3f4f6;color:#6b7280}
.b-err{background:var(--err-bg);color:var(--err)}

.muted{color:var(--ink2)}.small{font-size:12px}
.alert{border-radius:10px;padding:10px 12px;margin-bottom:8px;display:flex;gap:10px;align-items:flex-start;font-size:13.5px}
.alert.e{background:var(--err-bg);color:#7f1d1d}
.alert.w{background:var(--warn-bg);color:#713f12}
.alert.i{background:var(--pri-soft);color:#134e5e}
.alert.s{background:var(--ok-bg);color:#14532d}
.alert b{font-weight:700}
.alert .ic{font-weight:800;flex-shrink:0;width:18px;text-align:center}
/* Tables */
.tw{overflow:auto;border:1px solid var(--line);border-radius:var(--r);background:#fff;-webkit-overflow-scrolling:touch}
table{border-collapse:separate;border-spacing:0;width:100%}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
th{background:#f9fafb;font-size:12px;text-transform:uppercase;letter-spacing:.4px;color:var(--ink2);font-weight:700;position:sticky;top:0;z-index:2}
tr:last-child td{border-bottom:0}
table.list tr:hover td{background:#fafbfc}
.esc th.d,.esc td.d{text-align:center;padding:5px 4px;min-width:62px}
.esc td.nm{position:sticky;left:0;background:#fff;z-index:1;min-width:190px;max-width:260px;border-right:1px solid var(--line)}

.cell{display:block;border-radius:7px;padding:6px 2px;font-weight:700;font-size:12px;border:1px solid}
.c-T{background:var(--ok-bg);color:var(--ok);border-color:var(--ok-bd)}
.c-F{background:var(--off-bg);color:var(--off);border-color:var(--off-bd)}
.c-X{background:var(--fix-bg);color:var(--fix);border-color:var(--fix-bd)}
.c-V{background:#ff3b30;color:#fff;border-color:#e11d48}
.c--{background:#fafafa;color:#c0c4cc;border-color:#eee;border-style:dashed}
.esc tr.tot td{background:#f9fafb;font-size:12px;color:var(--ink2);font-weight:600}
.esc td.nm .fn{font-weight:700}
.esc td.nm .fu{font-size:12px;color:var(--ink3)}
.today{box-shadow:inset 0 -3px 0 var(--acc)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--ink2)}

.lockon{color:var(--acc)}
.mini select{min-height:30px;padding:3px 6px;font-size:13px;border-radius:7px}
.mes td.d,.mes th.d{min-width:38px;padding:4px 2px}
.mes .cell{padding:4px 0;font-size:11px}
.mes th.wk{background:#eef2f6}
/* bars */
.bars{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;align-items:end;height:170px;margin-top:8px}
.bar{display:flex;flex-direction:column;justify-content:flex-end;align-items:stretch;height:100%;gap:2px}
.bar .w{background:#4ade80;border-radius:6px 6px 0 0}
.bar .o{background:#60a5fa;border-radius:0 0 6px 6px}
.bar .lb{text-align:center;font-size:12px;color:var(--ink2);margin-top:4px;font-weight:600}
.bar .nn{text-align:center;font-size:11px;color:var(--ink2)}
/* tabs */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:16px;overflow:auto}
.tabs button{border:0;background:none;padding:10px 14px;font-weight:600;color:var(--ink2);cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap}

.mbg{position:fixed;inset:0;background:rgba(17,24,39,.45);display:flex;align-items:center;justify-content:center;z-index:100;padding:16px}
.modal{background:#fff;border-radius:16px;max-width:560px;width:100%;max-height:90vh;overflow:auto;box-shadow:0 20px 50px rgba(0,0,0,.25)}
.modal.wide{max-width:820px}
.mh{padding:18px 20px 6px;font-weight:800;font-size:17px}
.mbd{padding:8px 20px 4px}
.mf{padding:14px 20px 18px;display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#111827;color:#fff;padding:10px 16px;border-radius:10px;z-index:200;font-weight:600;box-shadow:0 10px 30px rgba(0,0,0,.25);max-width:90vw}
.empty{text-align:center;padding:36px 16px;color:var(--ink2)}
.empty b{display:block;color:var(--ink);font-size:16px;margin-bottom:4px}
.list-sm{margin:0;padding:0;list-style:none}
.list-sm li{padding:7px 0;border-bottom:1px dashed var(--line);display:flex;gap:8px;justify-content:space-between}
.list-sm li:last-child{border-bottom:0}
.chip{display:inline-block;background:#f3f4f6;border-radius:6px;padding:1px 7px;margin:2px 3px 2px 0;font-size:12.5px}
.chip.b{background:var(--off-bg);color:var(--off)}
.hide{display:none!important}
.show-m{display:none}
.loading{padding:60px;text-align:center;color:var(--ink2)}
.spin{width:28px;height:28px;border:3px solid #d1d5db;border-top-color:var(--pri);border-radius:50%;animation:sp 1s linear infinite;margin:0 auto 10px}
@keyframes sp{to{transform:rotate(360deg)}}
.g-pill{display:inline-block;min-width:24px;text-align:center;border-radius:6px;padding:1px 6px;font-weight:700;font-size:12px}
.gp1{background:#ede9fe;color:#6d28d9}.gp2{background:#fce7f3;color:#be185d}.gp3{background:#ffedd5;color:#c2410c}.gp4{background:var(--off-bg);color:var(--off)}
.readonly .edit-only{display:none!important}
@media (max-width:1100px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:820px){
  .side{position:fixed;left:-260px;transition:left .2s;box-shadow:0 0 40px rgba(0,0,0,.3)}
  .side.open{left:0}
  .top{display:flex}
  .content{padding:16px 12px 70px}
  .g2,.g3{grid-template-columns:1fr}
  h1{font-size:19px}
  .esc td.nm{min-width:130px;max-width:150px}
  .esc td.nm .fu{display:none}
  .big{width:100%}
  .hide-m{display:none!important}
  table.folha th.ft1,table.folha th.ft2{text-align:left}
  table.folha th.ft1 span,table.folha th.ft2 span{position:sticky;left:8px}
  .fimp{text-align:left}
  .show-m{display:block}
}
@media (max-width:480px){.g4{grid-template-columns:1fr 1fr}.kpi .n{font-size:22px}.card{padding:14px}}
/* folha no formato da planilha */
.folha-wrap{overflow:auto;background:#fff;border-radius:var(--r);padding:12px;border:1px solid var(--line);-webkit-overflow-scrolling:touch}
table.folha{border-collapse:collapse;width:100%;min-width:900px;font-family:Calibri,Carlito,Arial,sans-serif;border:2px solid #000}
table.folha th,table.folha td{border:1px solid #000;padding:2px 3px;text-align:center;font-weight:700;font-size:12px;height:22px;position:static;background:#fff;color:#000;text-transform:none;letter-spacing:0}
table.folha th.ft1{color:#C00000;font-size:20px;border-bottom:1px solid #000;padding:4px}
table.folha th.ft2{color:#C00000;font-size:15px;padding:3px}
table.folha th.fer{background:#DDEBF7}
table.folha .fnm{text-align:left;white-space:nowrap;min-width:96px;font-size:12px;position:sticky;left:0;z-index:1}
table.folha th.fnm{text-align:center;font-size:13px}
table.folha td.fv{background:#FF0000;color:#000;font-size:13px;letter-spacing:.5px}
table.folha td.nd{background:repeating-linear-gradient(45deg,#f3f4f6,#f3f4f6 4px,#e5e7eb 4px,#e5e7eb 8px)!important}
table.folha tr.sep td{height:22px}
.fimp{border:2px solid #000;border-top:0;text-align:center;padding:4px 14px 10px;font-family:Calibri,Carlito,Arial,sans-serif;min-width:900px}
.fimp-t{color:#C00000;font-weight:800;font-size:40px;line-height:1.15}
.fimp p{margin:4px 0;font-size:15px}
.fleg{margin:14px 0 0 60px;display:flex;align-items:center;gap:10px;font-family:Calibri,Carlito,Arial,sans-serif;font-size:16px}
.fleg-f{display:inline-block;border:1.5px solid #000;width:44px;text-align:center;font-weight:800;padding:2px 0}
.cor-in{width:44px;height:34px;padding:2px;border:1px solid #d1d5db;border-radius:8px;background:#fff;cursor:pointer}
.ferias-row{display:flex;gap:6px;align-items:center;margin-bottom:6px;flex-wrap:wrap}
.shade{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:25;display:none}
.shade.on{display:block}
</style>

<script>
/* =====================================================================
   NÚCLEO DO SISTEMA DE ESCALAS — funções puras (sem interface)
   Regras:
   - Semana de domingo (0) a sábado (6), como na folha de escala do hotel.
   - Sexta (5) e sábado (6): ninguém folga.
   - Combinações permitidas (exatamente uma por funcionário) — REGRAS FIXAS DO HOTEL:
       1 = Segunda e terça | 2 = Terça e quarta | 4 = Domingo, segunda e quinta
       (a combinação 3, quarta e quinta, NÃO é permitida)
   - No máximo 1 funcionário por setor de folga no domingo (combinação 4),
     e quem folga domingo folga a segunda e a quinta da mesma semana.
   - Cada funcionário folga no máximo 1 domingo por mês (mês do domingo).
   - Cobertura (setor com 2 ou mais): pelo menos 1 trabalhando nos dias em que o hotel funciona
     (domingo, segunda, quinta, sexta e sábado). Terça e quarta o hotel fecha: setor com mais de
     2 funcionários tem no máximo 1 trabalhando nesses dias.
   - Modelo:
       semana COM domingo: quem folga domingo folga dom+seg+qui; os demais terça+quarta;
       semana SEM domingo: 1 pessoa segunda+terça e as demais terça+quarta.
   - Funcionário de férias em qualquer dia da semana não recebe folgas nela.
   ===================================================================== */
(function (root) {
  'use strict';

  var DIAS = ['Domingo', 'Segunda', 'Terça', 'Quarta', 'Quinta', 'Sexta', 'Sábado'];
  var DIAS_CURTO = ['Dom', 'Seg', 'Ter', 'Qua', 'Qui', 'Sex', 'Sáb'];
  var GRUPOS = {
    1: { dias: [1, 2], nome: 'Segunda e terça' },
    2: { dias: [2, 3], nome: 'Terça e quarta' },
    3: { dias: [3, 4], nome: 'Quarta e quinta (não permitida)' },
    4: { dias: [0, 1, 4], nome: 'Domingo, segunda e quinta' }
  };
  var IDX_TER = 2, IDX_QUA = 3;
  var PERMITIDAS = [1, 2, 4];
  var DIAS_FUNCIONAMENTO = [0, 1, 4, 5, 6]; // terça e quarta o hotel fecha
  var DIAS_PROIBIDOS = [5, 6]; // sexta e sábado
  var IDX_DOMINGO = 0, IDX_QUINTA = 4;

  /* ---------------- Datas (strings AAAA-MM-DD, sem fuso) ---------------- */
  function parse(s) { var p = s.split('-'); return Date.UTC(+p[0], +p[1] - 1, +p[2]); }
  function fmt(ms) { var d = new Date(ms); return d.getUTCFullYear() + '-' + pad(d.getUTCMonth() + 1) + '-' + pad(d.getUTCDate()); }
  function pad(n) { return (n < 10 ? '0' : '') + n; }
  function addDias(s, n) { return fmt(parse(s) + n * 86400000); }
  function diaSemana(s) { return new Date(parse(s)).getUTCDay(); } // 0=domingo
  function inicioSemana(s) { return addDias(s, -diaSemana(s)); }
  function fimSemana(sem) { return addDias(sem, 6); }
  function semanasEntre(a, b) { return Math.round((parse(b) - parse(a)) / (7 * 86400000)); }
  function dataBR(s) { if (!s) return ''; var p = s.split('-'); return p[2] + '/' + p[1] + '/' + p[0]; }
  function hojeISO() { var d = new Date(); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
  function numeroSemana(sem) { return semanasEntre('2023-12-31', sem); } // 2023-12-31 é domingo

  function diasDaSemana(sem) { var r = []; for (var i = 0; i < 7; i++) r.push(addDias(sem, i)); return r; }

  /** Devolve vetor de 7 posições: true = folga */
  function folgasDoGrupo(g) {
    var v = [false, false, false, false, false, false, false];
    if (GRUPOS[g]) GRUPOS[g].dias.forEach(function (d) { v[d] = true; });
    return v;
  }

  function hash(str) { var h = 0; for (var i = 0; i < str.length; i++) { h = ((h << 5) - h + str.charCodeAt(i)) | 0; } return Math.abs(h); }

  /* --------------- Elegibilidade --------------- */
  function elegivel(f, sem) {
    if (!f || !f.ativo) return false;
    if (f.dataEntrada && f.dataEntrada > fimSemana(sem)) return false;
    if (feriasNoPeriodo(f, sem, fimSemana(sem))) return false;
    return true;
  }
  /** férias: lista [{ini, fim}] no cadastro do funcionário */
  function feriasNoPeriodo(f, ini, fim) {
    return (f && f.ferias || []).some(function (p) { return p && p.ini && p.fim && p.ini <= fim && p.fim >= ini; });
  }
  function emFerias(f, dataISO) { return feriasNoPeriodo(f, dataISO, dataISO); }
  /** motivo pelo qual um funcionário ativo não entra na semana */
  function motivoFora(f, sem) {
    if (!f) return 'removido';
    if (!f.ativo) return 'inativo';
    if (f.dataEntrada && f.dataEntrada > fimSemana(sem)) return 'nao_admitido';
    if (feriasNoPeriodo(f, sem, fimSemana(sem))) return 'ferias';
    return null;
  }

  /* --------------- Cobertura de terça e quarta --------------- */
  /** funcionários ativos cadastrados no setor e já admitidos até o fim da semana (inclui quem está de férias) */
  function cadastradosSetor(funcionarios, sid, sem) {
    return (funcionarios || []).filter(function (f) { return f.ativo && f.setorId === sid && (!f.dataEntrada || f.dataEntrada <= fimSemana(sem)); });

/* =====================================================================
   ALERTAS GLOBAIS
   ===================================================================== */
function alertasGerais() {
  const out = [];
  if (S.modo === 'local' && S.funcionarios.length) {
    let ub = null; try { ub = localStorage.getItem('escalas_ultimo_backup'); } catch (e) { }
    const dias = ub ? Math.floor((Date.now() - new Date(ub).getTime()) / 86400000) : null;
    if (dias === null) out.push({ t: 'w', m: 'Você ainda não fez nenhum backup. Os dados ficam só neste aparelho: baixe um backup e guarde no Google Drive, WhatsApp ou pen drive.', link: 'backup' });
    else if (dias >= 7) out.push({ t: 'w', m: 'Seu último backup foi há ' + dias + ' dias. Baixe um backup novo.', link: 'backup' });
  }
  const hoje = C.hojeISO(), semAtual = C.inicioSemana(hoje), prox = C.addDias(semAtual, 7);
  const ativos = S.funcionarios.filter(f => f.ativo);
  if (Object.keys(S.escalasAntigas).length) out.push({ t: 'w', m: Object.keys(S.escalasAntigas).length + ' escala(s) no formato antigo (semana de segunda a domingo) foram ignoradas. Exclua-as em Backup e configurações e gere de novo.', link: 'backup' });
  if (!S.setores.length) out.push({ t: 'i', m: 'Cadastre os setores do hotel para começar.', link: 'setores' });
  if (!ativos.length) out.push({ t: 'i', m: 'Nenhum funcionário ativo cadastrado.', link: 'funcionarios' });
  ativos.filter(f => !setorPorId(f.setorId)).forEach(f => out.push({ t: 'e', m: f.nome + ' está ativo sem setor definido. A escala não pode ser gerada até corrigir.', link: 'funcionarios' }));
  S.setores.forEach(s => {
    const n = ativos.filter(f => f.setorId === s.id).length;
    if (n === 0) out.push({ t: 'w', m: 'Setor "' + s.nome + '" não tem funcionários ativos.', link: 'setores' });
    else if (n === 1) out.push({ t: 'w', m: 'Setor "' + s.nome + '" tem apenas 1 funcionário: nos dias de folga dele o setor ficará sem ninguém.', link: 'funcionarios' });
  });
  [[semAtual, 'desta semana'], [prox, 'da próxima semana']].forEach(([sem, rot]) => {
    const e = S.escalas[sem];
    if (!e) { if (ativos.length) out.push({ t: sem === semAtual ? 'e' : 'w', m: 'A escala ' + rot + ' (' + semanaLabel(sem) + ') ainda não foi gerada.', link: 'escala', sem }); return; }
    if (e.status !== 'aprovada') out.push({ t: 'w', m: 'A escala ' + rot + ' (' + semanaLabel(sem) + ') está em rascunho, aguardando aprovação.', link: 'escala', sem });
    const v = C.validarEscala(e, S.funcionarios, S.setores, historicoArr());
    v.erros.forEach(x => out.push({ t: 'e', m: 'Escala ' + rot + ': ' + x.msg, link: 'escala', sem }));
    v.avisos.filter(a => a.fora).forEach(x => out.push({ t: 'e', m: 'Escala ' + rot + ': ' + x.msg, link: 'escala', sem }));
    v.avisos.filter(a => !/repete a combinação/.test(a.msg) && !a.fora).forEach(x => out.push({ t: 'w', m: 'Escala ' + rot + ': ' + x.msg, link: 'escala', sem }));
  });
  return out;
}

  const sy = window.scrollY;

  let topo = '';
  if (S.lento) topo += '<div class="alert w"><span class="ic">!</span><div>Os dados estão demorando para carregar. O que aparece pode estar desatualizado.</div></div>';
  if (S.modo === 'local' && window.STANDALONE) { if (S.localFalhou) topo += '<div class="alert e"><span class="ic">!</span><div>Este navegador não está permitindo salvar dados. Abra o arquivo no Google Chrome, Edge ou Firefox (fora da janela anônima).</div></div>'; }
  else if (S.modo === 'local') topo += '<div class="alert w"><span class="ic">!</span><div>Armazenamento na nuvem indisponível nesta visualização: os dados estão sendo salvos <b>apenas neste navegador</b>. Faça backups regulares em <a href="#backup">Backup</a>.</div></div>';
  if (S.modo === 'nuvem' && (S.offline || S.semRede)) topo += `<div class="alert w"><span class="ic">!</span><div><b>Sem internet.</b> ${S.offline ? 'Mostrando a última cópia salva neste aparelho' + (S.copiaEm ? ' (' + dtHora(S.copiaEm) + ')' : '') + ', só para consulta.' : 'As alterações não serão salvas até a conexão voltar.'} <a href="#" data-act="reconectar">Tentar de novo</a></div></div>`;
  else if (S.somenteLeitura) topo += '<div class="alert i"><span class="ic">i</span><div>Você está em modo somente leitura.</div></div>';
  v.innerHTML = topo + fn();
  const foco = UI._foco; if (foco) { const el = document.getElementById(foco); if (el) { el.focus(); try { el.setSelectionRange(el.value.length, el.value.length); } catch (e) { } } UI._foco = null; }
  window.scrollTo(0, sy);
}

/* ---------------- PAINEL ---------------- */
function vPainel() {
  const hoje = C.hojeISO(), sem = C.inicioSemana(hoje);
  const ativos = S.funcionarios.filter(f => f.ativo), inat = S.funcionarios.length - ativos.length;
  const escA = S.escalas[sem];
  const dias = C.diasDaSemana(sem);
  const trab = [0, 0, 0, 0, 0, 0, 0], folg = [0, 0, 0, 0, 0, 0, 0];
  if (escA) Object.keys(escA.atribuicoes || {}).forEach(id => {
    const f = funcPorId(id); dias.forEach((d, i) => { const st = C.statusDia(escA.atribuicoes[id], d, f, true); if (st === 'F') folg[i]++; else if (st === 'T' || st === 'X') trab[i]++; });
  });
  const maxB = Math.max(1, ...trab.map((t, i) => t + folg[i]));
  // domingos
  const tres = C.addDias(sem, -7 * 12);
  let domTotal = 0; const domPorFunc = {};
  historicoArr().filter(e => e.semana >= tres && e.semana <= sem).forEach(e => Object.entries(e.atribuicoes || {}).forEach(([id, a]) => { if (a.g === 4) { domTotal++; domPorFunc[id] = (domPorFunc[id] || 0) + 1; } }));
  const domSem = escA ? Object.values(escA.atribuicoes || {}).filter(a => a.g === 4) : [];
  // próximas folgas
  const prox = [];
  for (let i = 0; i < 10; i++) {
    const d = C.addDias(hoje, i), e = S.escalas[C.inicioSemana(d)];
    if (!e) continue;
    const nomes = Object.entries(e.atribuicoes || {}).filter(([id, a]) => C.statusDia(a, d, funcPorId(id)) === 'F').map(([id, a]) => (funcPorId(id) || a).nome);
    if (nomes.length) prox.push({ d, nomes });
  }
  const al = alertasGerais();
  const ult = historicoArr().sort((a, b) => b.semana.localeCompare(a.semana)).slice(0, 6);
  return `
  <div class="row mb"><div><h1>Painel</h1><p class="sub" style="margin:0">${esc(S.config.nomeHotel || '')} · hoje é ${C.DIAS[C.diaSemana(hoje)].toLowerCase()}, ${C.dataBR(hoje)}</p></div><div class="sp"></div>
  <a class="btn pri big edit-only" href="#escala" data-act="irGerar" data-sem="${sem}">${ic('bolt')} GERAR ESCALA AUTOMÁTICA</a></div>
  <div class="grid g4">
    <div class="card kpi"><div class="l">Funcionários ativos</div><div class="n">${ativos.length}</div><div class="x">${inat} inativo(s) · ${S.funcionarios.length} cadastrados</div></div>
    <div class="card kpi"><div class="l">Setores</div><div class="n">${S.setores.length}</div><div class="x">${S.setores.filter(s => ativos.some(f => f.setorId === s.id)).length} com funcionários ativos</div></div>
    <div class="card kpi"><div class="l">Escala desta semana</div><div class="n" style="font-size:18px;margin-top:6px">${escA ? (escA.status === 'aprovada' ? '<span class="badge b-ok">Aprovada</span>' : '<span class="badge b-draft">Rascunho</span>') : '<span class="badge b-err">Não gerada</span>'}</div><div class="x">${semanaLabel(sem)}</div></div>
    <div class="card kpi"><div class="l">Folgas dominicais</div><div class="n">${domSem.length}</div><div class="x">neste domingo · ${domTotal} nas últimas 12 semanas</div></div>
  </div>
  <div class="grid g2 mt">
    <div class="card"><div class="row"><h2 style="margin:0">Trabalhando × folga por dia</h2><div class="sp"></div><span class="small muted">${semanaLabel(sem)}</span></div>
      ${escA ? `<div class="bars">${dias.map((d, i) => `<div class="bar"><div class="nn">${trab[i]} / ${folg[i]}</div><div class="w" style="height:${trab[i] / maxB * 120}px" title="${trab[i]} trabalhando"></div><div class="o" style="height:${folg[i] / maxB * 120}px" title="${folg[i]} de folga"></div><div class="lb ${d === hoje ? 'today' : ''}">${C.DIAS_CURTO[i]}</div></div>`).join('')}</div>
      <div class="legend mt"><span><i style="background:#4ade80;border-color:#4ade80"></i>Trabalhando</span><span><i style="background:#60a5fa;border-color:#60a5fa"></i>De folga</span></div>`
      : '<div class="empty"><b>Sem escala nesta semana</b>Gere a escala para ver a distribuição por dia.</div>'}
    </div>
    <div class="card"><h2>Alertas de problemas</h2>
      ${al.length ? al.slice(0, 12).map(a => `<div class="alert ${a.t}"><span class="ic">${a.t === 'e' ? '!' : 'i'}</span><div>${esc(a.m)} ${a.link ? `<a href="#${a.link}" ${a.sem ? `data-act="irSemana" data-sem="${a.sem}"` : ''}>Abrir</a>` : ''}</div></div>`).join('') + (al.length > 12 ? `<div class="small muted">+ ${al.length - 12} alerta(s)</div>` : '')
      : '<div class="alert s"><span class="ic">✓</span><div>Nenhum problema encontrado.</div></div>'}
    </div>
  </div>
  <div class="grid g3 mt">
    <div class="card"><h2>Próximas folgas</h2>
      ${prox.length ? '<ul class="list-sm">' + prox.slice(0, 7).map(p => `<li><div><b>${C.DIAS_CURTO[C.diaSemana(p.d)]} ${C.dataBR(p.d).slice(0, 5)}</b>${p.d === hoje ? ' <span class="badge b-blue">hoje</span>' : ''}<div>${p.nomes.map(n => '<span class="chip b">' + esc(n) + '</span>').join('')}</div></div></li>`).join('') + '</ul>' : '<p class="muted">Nenhuma folga programada nos próximos dias (gere as escalas).</p>'}
    </div>
    <div class="card"><h2>Folga no domingo desta semana</h2>
      ${domSem.length ? '<ul class="list-sm">' + Object.entries(escA.atribuicoes).filter(([, a]) => a.g === 4).map(([id, a]) => `<li><span>${esc((funcPorId(id) || a).nome)}</span><span class="muted small">${esc(nomeSetor((funcPorId(id) || a).setorId))}</span></li>`).join('') + '</ul>' : '<p class="muted">Ninguém de folga no domingo (ou escala não gerada).</p>'}
      <h3 class="mt">Mais domingos (12 semanas)</h3>
      ${Object.keys(domPorFunc).length ? '<ul class="list-sm">' + Object.entries(domPorFunc).sort((a, b) => b[1] - a[1]).slice(0, 5).map(([id, n]) => `<li><span>${esc((funcPorId(id) || {}).nome || 'Removido')}</span><b>${n}</b></li>`).join('') + '</ul>' : '<p class="muted small">Sem histórico ainda.</p>'}
    </div>
    <div class="card"><h2>Últimas escalas</h2>
      ${ult.length ? '<ul class="list-sm">' + ult.map(e => `<li><a href="#escala" data-act="irSemana" data-sem="${e.semana}">${semanaLabel(e.semana)}</a><span>${e.status === 'aprovada' ? '<span class="badge b-ok">Aprovada</span>' : '<span class="badge b-draft">Rascunho</span>'}</span></li>`).join('') + '</ul>' : '<p class="muted">Nenhuma escala gerada ainda.</p>'}
    </div>
  </div>`;
}

  const aprov = e && e.status === 'aprovada';

  </div>
  <div class="row mt edit-only">

/* ---------------- ESCALA MENSAL ---------------- */
function semanasDoMes(ym) {
  const ini = ym + '-01'; const [y, m] = ym.split('-').map(Number);
  const fim = C.addDias(C.fmt(Date.UTC(y, m, 1)), -1);
  const fimFolha = C.addDias(ini, Math.max(31, +fim.slice(8)) - 1); // a folha mostra 31 colunas, como a planilha do hotel
  const sems = []; let s = C.inicioSemana(ini);
  while (s <= fimFolha) { sems.push(s); s = C.addDias(s, 7); }
  return { ini, fim, sems };
}
function vMensal() {

  ${faltam.length ? `<div class="row mt edit-only"><button class="btn pri" data-act="gerarMes">${ic('bolt')} Gerar as ${faltam.length} semana(s) que faltam</button><span class="small muted">Cada semana (domingo a sábado) é gerada em sequência, considerando o rodízio da anterior.</span></div>` : ''}

  return h + folhaHTML(m);

/* =====================================================================
   FOLHA DE FOLGA (formato da planilha do hotel)
   ===================================================================== */
function periodoFolha(tipo) {
  if (tipo === 'semana') return { ini: UI.semana, n: 7, sub: 'SEMANA DE ' + C.dataBR(UI.semana) + ' A ' + C.dataBR(C.fimSemana(UI.semana)) };
  const [y, mm] = UI.mes.split('-').map(Number);
  const dim = new Date(Date.UTC(y, mm, 0)).getUTCDate();
  return { ini: UI.mes + '-01', n: Math.max(31, dim), sub: MESES[mm - 1] + ' DE ' + y };
}
function folhaModelo(o) {
  const cols = []; for (let i = 0; i < o.n; i++) cols.push(C.addDias(o.ini, i));
  const fimP = cols[cols.length - 1];
  const sems = [...new Set(cols.map(d => C.inicioSemana(d)))];
  const ids = new Set(S.funcionarios.filter(f => f.ativo && setorPorId(f.setorId) && (!f.dataEntrada || f.dataEntrada <= fimP)).map(f => f.id));
  sems.forEach(s => Object.keys((S.escalas[s] || {}).atribuicoes || {}).forEach(id => ids.add(id)));
  let linhas = [...ids].map(id => {
    const f = funcPorId(id); let a = null;
    sems.forEach(s => { const e = S.escalas[s]; if (e && e.atribuicoes && e.atribuicoes[id]) a = e.atribuicoes[id]; });
    if (!f && !a) return null;
    const sid = f ? f.setorId : a.setorId;
    const cel = cols.map(d => { const e = S.escalas[C.inicioSemana(d)]; const st = C.statusDia(e && e.atribuicoes ? e.atribuicoes[id] : null, d, f, !!e); return st === 'F' ? 'F' : st === 'V' ? 'V' : st === '-' ? '-' : ''; });
    const gs = sems.map(s => { const e = S.escalas[s]; return e && e.atribuicoes && e.atribuicoes[id] ? e.atribuicoes[id].g : null; });
    return { id, f, nome: (f || a).nome, funcao: (f || a).funcao || '', sid, sNome: f ? nomeSetor(sid) : (a.setorNome || 'Sem setor'), cel, gs, criado: (f && f.criadoEm) || '' };
  }).filter(Boolean);
  if (o.setorId) linhas = linhas.filter(l => l.sid === o.setorId);
  if (o.funcId) linhas = linhas.filter(l => l.id === o.funcId);
  const gm = {}; linhas.forEach(l => (gm[l.sid] = gm[l.sid] || []).push(l));
  const grupos = Object.keys(gm).sort(cmpSetor).map(sid => ({ sid, nome: gm[sid][0].sNome, cor: corSetor(sid), linhas: gm[sid].sort((a, b) => (a.criado || '').localeCompare(b.criado || '') || a.nome.localeCompare(b.nome)) }));
  const feriados = cols.map(d => feriadoEm(d) || null);
  const semEscala = sems.filter(s => !S.escalas[s]);
  const pend = sems.filter(s => S.escalas[s] && S.escalas[s].status !== 'aprovada').length;
  return { cols, sems, grupos, linhas, feriados, semEscala, pend, sub: o.sub, titulo: S.config.tituloFolha || 'ESCALA DE FOLGA' };
}
/** percorre as células de uma linha agrupando dias seguidos de férias: [{tipo, ini, n}] */
function segmentos(cel) {
  const r = [];
  for (let i = 0; i < cel.length; i++) {
    if (cel[i] === 'V') { let k = i; while (k + 1 < cel.length && cel[k + 1] === 'V') k++; r.push({ tipo: 'V', i, n: k - i + 1 }); i = k; }
    else r.push({ tipo: cel[i], i, n: 1 });
  }
  return r;
}
const COR_FERIADO = '#DDEBF7', COR_FERIAS = '#FF0000', COR_TITULO = '#C00000';

  return h;

        if (JSON.stringify(f.ferias || []) !== JSON.stringify(ferias)) mud.push('férias: ' + (ferias.map(p => C.dataBR(p.ini) + ' a ' + C.dataBR(p.fim)).join(', ') || 'nenhuma'));

function abrirImportFunc() {
  const w = abrirModal(`<div class="mh">Cadastrar vários funcionários</div><div class="mbd">
  <p class="muted">Cole uma linha por funcionário, no formato <b>Nome ; Setor ; Função ; Data de entrada (opcional)</b>. Setores que não existirem serão criados.</p>
  <textarea id="impTxt" style="min-height:180px" placeholder="Maria da Silva; Recepção; Recepcionista; 01/03/2024&#10;João Souza; Cozinha; Auxiliar de cozinha"></textarea>
  <div id="impPrev" class="small muted mt"></div></div><div class="mf"><button class="btn" data-x="c">Cancelar</button><button class="btn pri" data-x="s">Cadastrar</button></div>`, true);
  const ta = w.querySelector('#impTxt');
  const parse = () => ta.value.split(/\r?\n/).map(l => l.trim()).filter(Boolean).map(l => { const p = l.split(/[;\t]/).map(x => x.trim()); let d = p[3] || ''; const m = d.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/); if (m) d = m[3] + '-' + m[2].padStart(2, '0') + '-' + m[1].padStart(2, '0'); else if (!/^\d{4}-\d{2}-\d{2}$/.test(d)) d = ''; return { nome: p[0], setor: p[1] || '', funcao: p[2] || '', data: d }; }).filter(x => x.nome);
  ta.oninput = () => { const l = parse(); w.querySelector('#impPrev').textContent = l.length + ' funcionário(s) reconhecido(s)' + (l.some(x => !x.setor) ? ' — atenção: há linhas sem setor.' : ''); };
  w.querySelector('[data-x=c]').onclick = () => fecharModal(w);
  w.querySelector('[data-x=s]').onclick = async () => {
    const l = parse(); if (!l.length) return toast('Nada para cadastrar.');
    if (l.some(x => !x.setor)) return toast('Todas as linhas precisam do setor.');
    const mapa = {}, novosSet = {}; S.setores.forEach(s => mapa[s.nome.toLowerCase()] = s.id);
    const baseOrdem = S.setores.reduce((mx, x) => Math.max(mx, x.ordem ?? -1), -1) + 1;
    try {
      for (const x of l) {
        let sid = mapa[x.setor.toLowerCase()];
        if (!sid) { sid = uid('s'); mapa[x.setor.toLowerCase()] = sid; const o = baseOrdem + Object.keys(novosSet).length; novosSet[sid] = 1; await Store.set('setores', sid, { nome: x.setor, ordem: o, cor: PALETA[o % PALETA.length], criadoEm: agoraISO() }); }
        await Store.set('funcionarios', uid('f'), { nome: x.nome, setorId: sid, funcao: x.funcao, ativo: true, dataEntrada: x.data || '', obs: '', criadoEm: agoraISO() });
      }
      log('funcionario', 'Cadastro em lote: ' + l.length + ' funcionário(s)');
      fecharModal(w); toast(l.length + ' funcionário(s) cadastrado(s).');
    } catch (e) { }
  };
}

/* ---------------- SETORES ---------------- */
const SUGESTOES = ['Recepção', 'Cozinha', 'Copa', 'Governança / Camareiras', 'Restaurante / Salão', 'Bar', 'Lazer', 'Manutenção', 'Jardinagem', 'Lavanderia', 'Portaria / Segurança', 'Administrativo'];

  const ativos = S.funcionarios.filter(f => f.ativo);

  ${lista.map((s, i) => { const n = ativos.filter(f => f.setorId === s.id).length, ni = S.funcionarios.filter(f => !f.ativo && f.setorId === s.id).length; const e = S.escalas[C.inicioSemana(C.hojeISO())]; const dom = e ? Object.entries(e.atribuicoes || {}).filter(([id, a]) => a.g === 4 && (funcPorId(id) || a).setorId === s.id).map(([id, a]) => (funcPorId(id) || a).nome) : []; return `<tr><td class="edit-only" style="white-space:nowrap"><button class="btn icon sm" data-act="setorMover" data-id="${s.id}" data-d="-1" ${i === 0 ? 'disabled' : ''} title="Subir">▲</button> <button class="btn icon sm" data-act="setorMover" data-id="${s.id}" data-d="1" ${i === lista.length - 1 ? 'disabled' : ''} title="Descer">▼</button></td><td><span style="display:inline-block;width:14px;height:14px;border-radius:4px;border:1px solid #0003;vertical-align:-2px;margin-right:8px;background:${corSetor(s.id)}"></span><b>${esc(s.nome)}</b>${n === 1 ? ' <span class="badge b-draft">1 pessoa</span>' : ''}${n >= 3 ? ' <span class="badge b-blue" title="Terça e quarta (hotel fechado): no máximo 1 trabalhando">ter/qua: máx. 1</span>' : ''}</td><td>${n}</td><td class="hide-m">${ni}</td><td class="hide-m">${dom.length ? dom.map(esc).join(', ') : '<span class="muted">—</span>'}</td><td class="edit-only" style="white-space:nowrap"><button class="btn icon sm" data-act="editSetor" data-id="${s.id}" title="Editar nome e cor">${ic('edit')}</button> <button class="btn icon sm danger" data-act="delSetor" data-id="${s.id}" title="Excluir">${ic('trash')}</button></td></tr>`; }).join('')}
  </tbody></table></div>` : '<div class="card empty"><b>Nenhum setor cadastrado</b>Crie os setores do hotel.</div>'}
  ${faltam.length ? `<div class="card mt edit-only"><h3>Adicionar setores comuns de hotel com um clique</h3><div class="row">${faltam.map(n => `<button class="btn sm" data-act="addSug" data-n="${esc(n)}">${ic('plus')} ${esc(n)}</button>`).join('')}</div></div>` : ''}`;
}
async function moverSetor(id, d) {
  const l = setoresOrd(); const i = l.findIndex(s => s.id === id), j = i + d;
  if (i < 0 || j < 0 || j >= l.length) return;
  [l[i], l[j]] = [l[j], l[i]];
  try {
    for (let k = 0; k < l.length; k++) if (l[k].ordem !== k || !l[k].cor) await Store.set('setores', l[k].id, Object.assign({}, l[k], { ordem: k, cor: l[k].cor || corSetor(l[k].id) }));
    log('setor', 'Ordem dos setores: ' + l.map(s => s.nome).join(', '));
  } catch (e) { }
}
function abrirFormSetor(s) {
  const cor = s ? corSetor(s.id) : PALETA[S.setores.length % PALETA.length];
  const w = abrirModal(`<div class="mh">${s ? 'Editar setor' : 'Novo setor'}</div><form class="mbd"><div class="fld"><label class="f">Nome do setor</label><input type="text" id="sNome" value="${esc(s ? s.nome : '')}" maxlength="60" style="width:100%"></div>
  <div class="fld"><label class="f">Cor na folha de folga</label><div class="row"><input type="color" id="sCor" class="cor-in" value="${cor}">${PALETA.map(c => `<button type="button" class="btn icon sm" data-cor="${c}" style="background:${c};width:28px;height:28px" title="${c}"></button>`).join('')}</div></div></form>
  <div class="mf"><button class="btn" data-x="c">Cancelar</button><button class="btn pri" data-x="s">Salvar</button></div>`);
  w.querySelectorAll('[data-cor]').forEach(b => b.onclick = () => { w.querySelector('#sCor').value = b.dataset.cor; });
  const salvar = async () => {
    const n = w.querySelector('#sNome').value.trim(); const c = w.querySelector('#sCor').value.toUpperCase();
    if (!n) return toast('Informe o nome.');
    if (S.setores.some(x => x.nome.toLowerCase() === n.toLowerCase() && (!s || x.id !== s.id))) return toast('Já existe um setor com esse nome.');
    const ordem = s ? (s.ordem ?? ordemSetor(s.id)) : S.setores.reduce((mx, x) => Math.max(mx, x.ordem ?? -1), -1) + 1;
    try { await Store.set('setores', s ? s.id : uid('s'), { nome: n, cor: c, ordem, criadoEm: s ? s.criadoEm || agoraISO() : agoraISO() }); log('setor', s ? 'Setor editado: ' + s.nome + (s.nome !== n ? ' → ' + n : '') : 'Setor criado: ' + n); fecharModal(w); } catch (e) { }
  };
  w.querySelector('[data-x=c]').onclick = () => fecharModal(w); w.querySelector('[data-x=s]').onclick = salvar; w.querySelector('form').onsubmit = e => { e.preventDefault(); salvar(); };
}

/* ---------------- HISTÓRICO ---------------- */
function vHistorico() {
  const tabs = [['escalas', 'Escalas anteriores'], ['domingos', 'Folgas aos domingos'], ['combinacoes', 'Combinações utilizadas'], ['rodizio', 'Rodízio de folgas'], ['alteracoes', 'Histórico de alterações']];
  let h = `<div class="row mb"><div><h1>Histórico</h1><p class="sub" style="margin:0">O histórico é usado automaticamente para organizar as próximas escalas</p></div></div>
  <div class="tabs">${tabs.map(([k, t]) => `<button class="${UI.histTab === k ? 'on' : ''}" data-act="histTab" data-t="${k}">${t}</button>`).join('')}</div>`;
  const escs = historicoArr().sort((a, b) => b.semana.localeCompare(a.semana));
  const nomeDe = (id, a) => (funcPorId(id) || a || {}).nome || 'Removido';
  if (UI.histTab === 'escalas') {
    if (!escs.length) return h + '<div class="card empty"><b>Nenhuma escala ainda</b></div>';
    h += `<div class="tw"><table class="list"><thead><tr><th>Semana</th><th>Situação</th><th>Funcionários</th><th class="hide-m">Domingo</th><th class="hide-m">Comb. 1/2/3/4</th><th class="hide-m">Alterações</th><th></th></tr></thead><tbody>`;
    escs.forEach(e => { const at = Object.values(e.atribuicoes || {}); const c = C.PERMITIDAS.map(g => at.filter(a => a.g === g).length); h += `<tr><td><b>${semanaLabel(e.semana)}</b></td><td>${e.status === 'aprovada' ? '<span class="badge b-ok">Aprovada</span>' : '<span class="badge b-draft">Rascunho</span>'}</td><td>${at.length}</td><td class="hide-m">${c[3]}</td><td class="hide-m">${c.join(' / ')}</td><td class="hide-m">${(e.alteracoes || []).length}</td><td><a class="btn sm" href="#escala" data-act="irSemana" data-sem="${e.semana}">Abrir</a></td></tr>`; });
    return h + '</tbody></table></div>';
  }
  if (UI.histTab === 'domingos') {
    const linhas = [];
    const ids = new Set(S.funcionarios.filter(f => f.ativo).map(f => f.id)); escs.forEach(e => Object.keys(e.atribuicoes || {}).forEach(id => ids.add(id)));
    ids.forEach(id => { let a0 = null; const doms = []; escs.forEach(e => { const a = (e.atribuicoes || {})[id]; if (a) { a0 = a0 || a; if (a.g === 4) doms.push(C.addDias(e.semana, 6)); } }); const f = funcPorId(id); linhas.push({ id, nome: nomeDe(id, a0), setor: f ? nomeSetor(f.setorId) : (a0 ? a0.setorNome : ''), doms, ativo: f && f.ativo }); });
    linhas.sort((a, b) => a.setor.localeCompare(b.setor) || a.nome.localeCompare(b.nome));
    h += `<div class="tw"><table class="list"><thead><tr><th>Funcionário</th><th>Setor</th><th>Total</th><th>Último domingo de folga</th><th class="hide-m">Domingos de folga</th></tr></thead><tbody>${linhas.map(l => `<tr><td><b>${esc(l.nome)}</b>${!l.ativo ? ' <span class="badge b-off">inativo</span>' : ''}</td><td>${esc(l.setor)}</td><td>${l.doms.length}</td><td>${l.doms[0] ? C.dataBR(l.doms[0]) : '<span class="muted">nunca</span>'}</td><td class="hide-m">${l.doms.slice(0, 8).map(d => '<span class="chip b">' + C.dataBR(d).slice(0, 5) + '</span>').join('')}${l.doms.length > 8 ? '…' : ''}</td></tr>`).join('')}</tbody></table></div>`;
    return h;
  }
  if (UI.histTab === 'combinacoes') {
    const ult = escs.slice(0, 12).reverse();
    if (!ult.length) return h + '<div class="card empty"><b>Sem histórico</b></div>';
    const ids = new Set(); ult.forEach(e => Object.keys(e.atribuicoes || {}).forEach(id => ids.add(id)));
    const ls = [...ids].map(id => { let a0 = null; ult.forEach(e => { if ((e.atribuicoes || {})[id]) a0 = e.atribuicoes[id]; }); const f = funcPorId(id); return { id, nome: nomeDe(id, a0), setor: f ? nomeSetor(f.setorId) : a0.setorNome }; }).sort((a, b) => a.setor.localeCompare(b.setor) || a.nome.localeCompare(b.nome));
    h += legenda() + `<div class="tw mt"><table class="list esc"><thead><tr><th class="nm">Funcionário</th><th class="hide-m">Setor</th>${ult.map(e => `<th class="d">${C.dataBR(e.semana).slice(0, 5)}</th>`).join('')}</tr></thead><tbody>${ls.map(l => `<tr><td class="nm"><b>${esc(l.nome)}</b></td><td class="hide-m">${esc(l.setor)}</td>${ult.map(e => { const a = (e.atribuicoes || {})[l.id]; return `<td class="d">${a ? gPill(a.g) : '<span class="muted">·</span>'}</td>`; }).join('')}</tr>`).join('')}</tbody></table></div><p class="small muted mt">Últimas ${ult.length} semanas. O número é a combinação de folgas recebida.</p>`;
    return h;
  }
  if (UI.histTab === 'rodizio') {
    const cont = {};
    escs.forEach(e => Object.entries(e.atribuicoes || {}).forEach(([id, a]) => { cont[id] = cont[id] || { 1: 0, 2: 0, 3: 0, 4: 0, n: 0, a }; cont[id][a.g]++; cont[id].n++; }));
    const ls = Object.entries(cont).map(([id, c]) => { const f = funcPorId(id); return { id, c, nome: nomeDe(id, c.a), setor: f ? nomeSetor(f.setorId) : c.a.setorNome }; }).sort((a, b) => a.setor.localeCompare(b.setor) || a.nome.localeCompare(b.nome));
    if (!ls.length) return h + '<div class="card empty"><b>Sem histórico</b></div>';
    h += `<div class="tw"><table class="list"><thead><tr><th>Funcionário</th><th class="hide-m">Setor</th><th>Semanas</th>${C.PERMITIDAS.map(g => `<th title="${C.GRUPOS[g].nome}">${gPill(g)}</th>`).join('')}</tr></thead><tbody>${ls.map(l => `<tr><td><b>${esc(l.nome)}</b></td><td class="hide-m">${esc(l.setor)}</td><td>${l.c.n}</td>${C.PERMITIDAS.map(g => `<td>${l.c[g]}</td>`).join('')}</tr>`).join('')}</tbody></table></div><p class="small muted mt">Quantas vezes cada funcionário recebeu cada combinação. ${C.PERMITIDAS.map(g => gPill(g) + ' ' + C.GRUPOS[g].nome).join(' · ')}</p>`;
    return h;
  }
  // alterações
  if (!S.auditoria.length) return h + '<div class="card empty"><b>Nenhuma alteração registrada</b></div>';
  h += `<div class="tw"><table class="list"><thead><tr><th>Data</th><th>Tipo</th><th>Descrição</th></tr></thead><tbody>${S.auditoria.slice().sort((a, b) => b.ts.localeCompare(a.ts)).slice(0, 400).map(x => `<tr><td style="white-space:nowrap">${dtHora(x.ts)}</td><td><span class="badge ${x.tipo === 'escala' ? 'b-blue' : 'b-off'}">${esc(x.tipo)}</span></td><td>${esc(x.texto)}${x.semana ? ` <a href="#escala" data-act="irSemana" data-sem="${x.semana}" class="small">(${semanaLabel(x.semana)})</a>` : ''}</td></tr>`).join('')}</tbody></table></div>`;
  return h;
}

    const ok = await confirmar('Regenerar escala?', `<p>A escala de <b>${semanaLabel(sem)}</b> ${atual.status === 'aprovada' ? '<b>já está aprovada</b> e' : ''} será refeita automaticamente${nb ? `, mantendo as <b>${nb} combinação(ões) bloqueada(s)</b>` : ''}. Ela voltará para rascunho.</p>`, 'Regenerar');
    if (!ok) return false;
  }
  const bloqueios = {};

    await modalMsg('Não foi possível gerar a escala', `<p>A escala de <b>${semanaLabel(sem)}</b> <b>não foi gerada</b>, porque não é possível montar uma escala que respeite todas as regras. Corrija os pontos abaixo e tente de novo:</p>${listaProblemas(r.erros, [])}`);

  }

  try { await Store.set('escalas', sem, doc); } catch (e) { return false; }
  log('escala', (atual ? 'Escala regenerada' : 'Escala gerada') + ' automaticamente (' + Object.keys(r.atribuicoes).length + ' funcionários)', sem);
  if (!opts.silencioso) {
    const at = Object.values(r.atribuicoes); const c = C.PERMITIDAS.map(g => at.filter(a => a.g === g).length);
    await modalMsg('Escala gerada — confira e aprove', `<div class="alert s"><span class="ic">✓</span><div>Todas as regras foram conferidas: ${at.length} funcionário(s), só as combinações seg+ter, ter+qua e dom+seg+qui, ninguém folga sexta ou sábado, no máximo 1 domingo por mês para cada um, quem folga domingo folga segunda e quinta, e a cobertura de cada setor está correta.</div></div>
      <p>Distribuição: ${C.PERMITIDAS.map((g, i) => gPill(g) + ' ' + C.GRUPOS[g].nome + ': <b>' + c[i] + '</b>').join('<br>')}</p>${r.avisos.length ? '<h3>Avisos</h3>' + listaProblemas([], r.avisos) : ''}<p class="muted">A escala está em <b>rascunho</b>. Revise a tabela e clique em <b>Aprovar escala</b>.</p>`);
  }
  return true;
}

}

async function trocarFolgas(id) {

    await salvarAlteracao(sem, at, 'Troca de folgas: ' + (f || a).nome + ' (→ ' + C.GRUPOS[g2].nome + ') ⇄ ' + (funcPorId(outro) || at[outro]).nome + ' (→ ' + C.GRUPOS[g1].nome + ')');

async function completarEscala() {
  const sem = UI.semana, e = S.escalas[sem];
  const bloqueios = {}; Object.entries(e.atribuicoes).forEach(([id, a]) => { const f = funcPorId(id); if (f && C.elegivel(f, sem)) bloqueios[id] = a.g; });
  const r = C.gerarEscala({ semana: sem, funcionarios: S.funcionarios, setores: S.setores, historico: historicoArr().filter(x => x.semana !== sem), bloqueios });
  if (!r.ok) return modalMsg('Não foi possível completar', listaProblemas(r.erros, []) + '<p>Use <b>Regenerar</b> para refazer a escala inteira.</p>');
  Object.keys(r.atribuicoes).forEach(id => { r.atribuicoes[id].bloq = !!(e.atribuicoes[id] && e.atribuicoes[id].bloq); });
  const novos = Object.keys(r.atribuicoes).filter(id => !e.atribuicoes[id]).map(id => r.atribuicoes[id].nome);

async function gerarMes() {
  const { sems } = semanasDoMes(UI.mes);
  const faltam = sems.filter(s => !S.escalas[s]);
  for (const s of faltam) {
    const ok = await acaoGerar(s, { semConfirmar: true, silencioso: true });
    if (!ok) return;
    // garante que a próxima semana veja esta no histórico (modo nuvem atualiza por snapshot)
    await new Promise(r => setTimeout(r, 120));
  }
  toast(faltam.length + ' semana(s) gerada(s) em rascunho.');
}

/* ---------------- EXPORTAÇÕES ---------------- */
const libs = {};
function carregarScript(src) {
  if (libs[src]) return libs[src];
  const emb = document.getElementById('lib:' + src);
  if (emb) { // versão independente: bibliotecas embutidas no próprio arquivo
    libs[src] = new Promise((res, rej) => { try { const s = document.createElement('script'); s.src = URL.createObjectURL(new Blob([emb.textContent], { type: 'text/javascript' })); s.onload = res; s.onerror = () => rej(new Error('Falha ao carregar ' + src)); document.head.appendChild(s); } catch (e) { rej(e); } });
    return libs[src];
  }
  libs[src] = new Promise((res, rej) => { const s = document.createElement('script'); s.src = src; s.onload = res; s.onerror = () => { delete libs[src]; rej(new Error('Falha ao carregar ' + src)); }; document.head.appendChild(s); });
  return libs[src];
}
async function salvarArquivo(nome, data) {
  if (DL) {
    try { await DL.save({ filename: nome, data }); toast('Arquivo salvo.'); return; }
    catch (e) { if (e && e.code === 'declined') { toast('Download cancelado.'); return; } if (e && e.code === 'rate_limited') { toast('Aguarde um instante e tente de novo.'); return; } }
  }
  try {
    const blob = data instanceof Blob ? data : new Blob([data]);
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = nome; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 2000);
  } catch (e) { modalMsg('Download indisponível', '<p>Este ambiente não permite baixar arquivos.</p>'); }
}

const rgb = hex => { const h = hex.replace('#', ''); return [parseInt(h.slice(0, 2), 16), parseInt(h.slice(2, 4), 16), parseInt(h.slice(4, 6), 16)]; };

async function exportarExcel() {
  try { await carregarScript('libs/exceljs.min.js'); } catch (e) { return modalMsg('Erro', '<p>Não foi possível carregar o gerador de Excel.</p>'); }
  const m = dadosExport(); if (!m.linhas.length) return toast('Nada para exportar.');
  const n = m.cols.length, nCols = n + 1;
  const argb = hex => 'FF' + hex.replace('#', '').toUpperCase();
  const wb = new ExcelJS.Workbook(); wb.creator = S.config.nomeHotel || 'Escalas';
  const ws = wb.addWorksheet((m.sub || 'Escala').replace(/[\[\]:*?\/\\]/g, '-').slice(0, 31), { pageSetup: { orientation: 'landscape', paperSize: 9, fitToPage: true, fitToWidth: 1, fitToHeight: 1, margins: { left: 0.3, right: 0.3, top: 0.4, bottom: 0.4, header: 0.2, footer: 0.2 } }, views: [{ showGridLines: false }] });
  const fino = { style: 'thin', color: { argb: 'FF000000' } }, grosso = { style: 'medium', color: { argb: 'FF000000' } };
  const borda = { top: fino, left: fino, bottom: fino, right: fino };
  const fill = hex => ({ type: 'pattern', pattern: 'solid', fgColor: { argb: argb(hex) } });
  const center = { horizontal: 'center', vertical: 'middle' };
  const fer = i => m.feriados[i] ? COR_FERIADO : null;
  ws.mergeCells(1, 1, 1, nCols); Object.assign(ws.getCell(1, 1), { value: m.titulo, font: { name: 'Calibri', bold: true, size: 18, color: { argb: argb(COR_TITULO) } }, alignment: center });
  ws.mergeCells(2, 1, 2, nCols); Object.assign(ws.getCell(2, 1), { value: m.sub, font: { name: 'Calibri', bold: true, size: 12, color: { argb: argb(COR_TITULO) } }, alignment: center });
  ws.mergeCells(3, 1, 4, 1); Object.assign(ws.getCell(3, 1), { value: 'FUNCIONÁRIOS', font: { name: 'Calibri', bold: true, size: 11 }, alignment: Object.assign({ wrapText: true }, center) });
  m.cols.forEach((d, i) => {
    const c1 = ws.getCell(3, i + 2), c2 = ws.getCell(4, i + 2);
    c1.value = +d.slice(8); c2.value = C.DIAS_CURTO[C.diaSemana(d)].toUpperCase();
    [c1, c2].forEach(c => { c.font = { name: 'Calibri', bold: true, size: 9 }; c.alignment = center; if (fer(i)) c.fill = fill(fer(i)); });
  });
  let r = 5;
  m.grupos.forEach((g, gi) => {
    if (gi > 0) { m.cols.forEach((d, i) => { if (fer(i)) ws.getCell(r, i + 2).fill = fill(fer(i)); }); r++; }
    g.linhas.forEach(l => {
      Object.assign(ws.getCell(r, 1), { value: l.nome.toUpperCase(), font: { name: 'Calibri', bold: true, size: 10 }, fill: fill(g.cor), alignment: { vertical: 'middle' } });
      segmentos(l.cel).forEach(sg => {
        const c = ws.getCell(r, sg.i + 2);
        if (sg.tipo === 'V') { if (sg.n > 1) ws.mergeCells(r, sg.i + 2, r, sg.i + 1 + sg.n); Object.assign(c, { value: 'FÉRIAS', fill: fill(COR_FERIAS), font: { name: 'Calibri', bold: true, size: 10 }, alignment: center }); }
        else Object.assign(c, { value: sg.tipo === 'F' ? 'F' : null, fill: fill(fer(sg.i) || (sg.tipo === '-' ? '#F3F4F6' : g.cor)), font: { name: 'Calibri', bold: true, size: 11 }, alignment: center });
      });
      r++;
    });
  });
  const ultima = r - 1;
  for (let rr = 1; rr <= ultima; rr++) for (let cc = 1; cc <= nCols; cc++) {
    const c = ws.getCell(rr, cc);
    c.border = { top: rr === 1 ? grosso : fino, bottom: rr === ultima ? grosso : fino, left: cc === 1 ? grosso : fino, right: cc === nCols ? grosso : fino };
  }
  // IMPORTANTE
  r = ultima + 1;
  ws.mergeCells(r, 1, r, nCols); Object.assign(ws.getCell(r, 1), { value: 'IMPORTANTE', font: { name: 'Calibri', bold: true, size: 28, color: { argb: argb(COR_TITULO) } }, alignment: center }); ws.getRow(r).height = 38;
  const ini = r;
  (S.config.textoImportante || '').split('\n').filter(Boolean).forEach(t => { r++; ws.mergeCells(r, 1, r, nCols); Object.assign(ws.getCell(r, 1), { value: t, font: { name: 'Calibri', size: 11 }, alignment: Object.assign({ wrapText: true }, center) }); ws.getRow(r).height = Math.max(16, Math.ceil(t.length / 150) * 16); });
  for (let rr = ini; rr <= r; rr++) { ws.getCell(rr, 1).border = { top: rr === ini ? grosso : undefined, bottom: rr === r ? grosso : undefined, left: grosso, right: grosso }; }
  r += 2;
  Object.assign(ws.getCell(r, 2), { value: 'F', font: { name: 'Calibri', bold: true, size: 12 }, alignment: center, border: borda });
  ws.mergeCells(r, 3, r, 10); Object.assign(ws.getCell(r, 3), { value: 'FOLGA SEMANAL', font: { name: 'Calibri', bold: true, size: 12 } });
  ws.getColumn(1).width = n > 7 ? 14 : 28; for (let i = 2; i <= nCols; i++) ws.getColumn(i).width = n > 7 ? 5.2 : 9;
  for (let rr = 3; rr <= ultima; rr++) if (!ws.getRow(rr).height) ws.getRow(rr).height = 18;
  const buf = await wb.xlsx.writeBuffer();
  await salvarArquivo(nomeArq('xlsx', m), new Blob([buf]));
}
function textoWhatsApp() {
  const m = dadosExport();
  let t = '*' + (S.config.nomeHotel || '') + '*\n*' + m.titulo + '*\n' + m.sub + '\n';
  if (m.pend) t += '_(escala em rascunho, sujeita a alteração)_\n';
  m.grupos.forEach(g => {
    t += '\n*' + g.nome + '*\n';
    g.linhas.forEach(l => {
      const fol = m.cols.filter((x, i) => l.cel[i] === 'F');
      const fer = m.cols.filter((x, i) => l.cel[i] === 'V');
      let linha = '• ' + l.nome + ': ';
      const juntar = l => l.length > 1 ? l.slice(0, -1).join(', ') + ' e ' + l[l.length - 1] : l.join('');
      if (UI.expPeriodo === 'semana') linha += fol.length ? 'folga ' + juntar(fol.map(x => C.DIAS[C.diaSemana(x)].toLowerCase() + ' (' + C.dataBR(x).slice(0, 5) + ')')) : 'sem folga nesta semana';
      else linha += fol.length ? fol.map(x => C.DIAS_CURTO[C.diaSemana(x)].toLowerCase() + ' ' + C.dataBR(x).slice(0, 5)).join(', ') : 'sem folgas no período';
      if (fer.length) linha += ' · férias ' + C.dataBR(fer[0]).slice(0, 5) + ' a ' + C.dataBR(fer[fer.length - 1]).slice(0, 5);
      t += linha + '\n';
    });
  });
  const fs = m.cols.map((d, i) => m.feriados[i] ? C.dataBR(d).slice(0, 5) + ' ' + m.feriados[i].nome : null).filter(Boolean);
  if (fs.length) t += '\nFeriados: ' + fs.join('; ');
  t += '\nSexta e sábado: todos trabalham.';
  if (S.config.textoImportante) t += '\n\n*IMPORTANTE:* ' + S.config.textoImportante.replace(/\n/g, ' ');
  return t;
}

async function baixarBackup() {
  const dados = { sistema: 'escalas-hotel', versao: 1, exportadoEm: agoraISO(), config: S.config, setores: S.setores, funcionarios: S.funcionarios, escalas: Object.assign({}, S.escalasAntigas, S.escalas), auditoria: S.auditoria };
  await salvarArquivo('backup-escalas-' + C.hojeISO() + '.json', JSON.stringify(dados, null, 1));
  try { localStorage.setItem('escalas_ultimo_backup', agoraISO()); } catch (e) { }
  log('sistema', 'Backup baixado');
}
async function restaurar(file) {
  let d;
  try { d = JSON.parse(await file.text()); } catch (e) { return modalMsg('Arquivo inválido', '<p>Não foi possível ler o arquivo de backup.</p>'); }
  if (!d || d.sistema !== 'escalas-hotel' || !Array.isArray(d.setores) || !Array.isArray(d.funcionarios)) return modalMsg('Arquivo inválido', '<p>Este arquivo não é um backup deste sistema.</p>');
  const ok = await confirmar('Restaurar backup?', `<p>Backup de <b>${dtHora(d.exportadoEm)}</b>: ${d.setores.length} setor(es), ${d.funcionarios.length} funcionário(s), ${Object.keys(d.escalas || {}).length} escala(s).</p><div class="alert w"><span class="ic">!</span><div>Todos os dados atuais serão <b>substituídos</b>. Recomendo baixar um backup dos dados atuais antes.</div></div>`, 'Restaurar', true);
  if (!ok) return;
  try {
    const ids = { setores: new Set(d.setores.map(x => x.id)), funcionarios: new Set(d.funcionarios.map(x => x.id)), escalas: new Set(Object.keys(d.escalas || {})) };
    for (const s of S.setores.slice()) if (!ids.setores.has(s.id)) await Store.del('setores', s.id);
    for (const f of S.funcionarios.slice()) if (!ids.funcionarios.has(f.id)) await Store.del('funcionarios', f.id);
    for (const k of Object.keys(S.escalas).concat(Object.keys(S.escalasAntigas))) if (!ids.escalas.has(k)) await Store.del('escalas', k);
    for (const s of d.setores) await Store.set('setores', s.id, s);
    for (const f of d.funcionarios) await Store.set('funcionarios', f.id, f);
    for (const k of Object.keys(d.escalas || {})) await Store.set('escalas', k, d.escalas[k]);
    if (d.config) await Store.set('config', 'geral', d.config);
    const existentes = new Set(S.auditoria.map(a => a.id));
    if (S.modo === 'db') { for (const a of (d.auditoria || []).slice(0, 500)) if (!existentes.has(a.id)) await Store.set('auditoria', a.id, a); }
    else { S.auditoria = (d.auditoria || []).concat(S.auditoria.filter(a => !(d.auditoria || []).some(b => b.id === a.id))); Store.salvarLocal(); }
    log('sistema', 'Backup restaurado (arquivo de ' + dtHora(d.exportadoEm) + ')');
    toast('Backup restaurado.');
  } catch (e) { }
}

    }
    case 'listarBk': {
      try { const l = await Nuvem.rpc('esc_listar_backups', {}); document.getElementById('bkAuto').innerHTML = l.length ? '<ul class="list-sm">' + l.map(b => `<li><span>${dtHora(b.em)}</span><button class="btn sm" data-act="baixarBk" data-id="${b.id}">Baixar</button></li>`).join('') + '</ul>' : '<p class="muted">O primeiro backup automático é feito na madrugada de hoje para amanhã (3h).</p>'; }
      catch (e) { toast('Não foi possível listar.'); }
      return;
    }
    case 'baixarBk': {
      try {
        const b = await Nuvem.rpc('esc_obter_backup', { p_id: +id });
        const d = { sistema: 'escalas-hotel', versao: 1, exportadoEm: b.feito_em, config: CONFIG_PADRAO, setores: [], funcionarios: [], escalas: {}, auditoria: [] };
        (b.docs || []).forEach(x => { const o = Object.assign({ id: x.i }, x.d); if (x.c === 'escalas') d.escalas[x.i] = Object.assign({}, x.d, { semana: x.i }); else if (x.c === 'config') { if (x.i === 'geral') d.config = x.d; } else d[x.c].push(o); });
        await salvarArquivo('backup-automatico-' + String(b.feito_em).slice(0, 10) + '.json', JSON.stringify(d, null, 1));
      } catch (e) { toast('Não foi possível baixar.'); }
      return;
    }
    case 'expPDF': return exportarPDF(false);
    case 'expPrint': return exportarPDF(true);
    case 'expXLS': return exportarExcel();
    case 'expWA': return abrirWhatsApp();
    case 'backup': return baixarBackup();
    case 'salvarCfg': { const n = document.getElementById('cfgNome').value.trim(), t = document.getElementById('cfgTitulo').value.trim(), imp = document.getElementById('cfgImp').value.trim(); try { await Store.set('config', 'geral', Object.assign({}, S.config, { nomeHotel: n, tituloFolha: t || 'ESCALA DE FOLGA', textoImportante: imp, feriados: feriadosLista() })); log('sistema', 'Configurações alteradas'); toast('Configurações salvas.'); } catch (e) { } return; }
  }
});
document.addEventListener('change', ev => {
  const t = ev.target;
  if (t.id === 'inSemana' && t.value) { UI.semana = C.inicioSemana(t.value); render(); }
  else if (t.id === 'inMes' && t.value) { UI.mes = t.value; render(); }
  else if (t.id === 'fSetor') { UI.filtroSetor = t.value; render(); }
  else if (t.id === 'fSit') { UI.situacao = t.value; render(); }
  else if (t.id === 'expPeriodo') { UI.expPeriodo = t.value; render(); }
  else if (t.id === 'expEscopo') { UI.expEscopo = t.value; if (t.value === 'setor' && !UI.expSetor) UI.expSetor = (setoresOrd()[0] || {}).id; if (t.value === 'func' && !UI.expFunc) UI.expFunc = (S.funcionarios.slice().sort((a, b) => a.nome.localeCompare(b.nome))[0] || {}).id; render(); }
  else if (t.id === 'expSetor') { UI.expSetor = t.value; render(); }
  else if (t.id === 'expFunc') { UI.expFunc = t.value; render(); }
  else if (t.id === 'inRestore' && t.files[0]) { restaurar(t.files[0]); t.value = ''; }
  else if (t.dataset.act === 'mudarGrupo') mudarGrupo(t.dataset.id, +t.value);
});
document.addEventListener('input', ev => {
  if (ev.target.id === 'busca') { UI.busca = ev.target.value; const l = document.getElementById('listaFunc'); if (l) l.innerHTML = listaFuncHTML(); }
});
// toque longo no nome (celular) abre ações
let lp = null;
document.addEventListener('touchstart', ev => {
  const td = ev.target.closest('.esc td.nm'); if (!td || UI.rota !== 'escala') return;
  const tr = td.parentElement; const sel = tr.querySelector('select[data-act=mudarGrupo]'); const lockBtn = tr.querySelector('[data-act=bloq]');
  const id = (sel && sel.dataset.id) || (lockBtn && lockBtn.dataset.id); if (!id) return;
  lp = setTimeout(async () => {
    const e = S.escalas[UI.semana]; const a = e.atribuicoes[id];
    const r = await modalMsg(esc((funcPorId(id) || a).nome), '<p>Escolha uma ação:</p>', [{ t: 'Cancelar', v: 0 }, { t: a.bloq ? 'Desbloquear' : 'Bloquear combinação', v: 1 }, { t: 'Trocar folgas', c: 'pri', v: 2 }]);
    if (r === 1) { const at = clone(e.atribuicoes); at[id].bloq = !at[id].bloq; salvarAlteracao(UI.semana, at, (at[id].bloq ? 'Bloqueada' : 'Desbloqueada') + ' a combinação de ' + (funcPorId(id) || at[id]).nome); }
    if (r === 2) trocarFolgas(id);
  }, 600);
}, { passive: true });
['touchend', 'touchmove', 'touchcancel'].forEach(n => document.addEventListener(n, () => clearTimeout(lp), { passive: true }));

irRota();
Store.init();
</script>
</body>
</html>
