<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta http-equiv="Cache-Control" content="no-cache">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Escalas — Hotel Fazenda Oasis</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icone.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icone-180.png">
<meta name="theme-color" content="#0f4c5c">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f4f6f9; --card:#fff; --ink:#111827; --ink2:#4b5563; --ink3:#9ca3af; --line:#e5e7eb;
  --pri:#0f4c5c; --pri2:#13687d; --pri-soft:#e6f1f3; --acc:#e9a23b;
  --ok:#15803d; --ok-bg:#dcfce7; --ok-bd:#86efac;
  --off:#1d4ed8; --off-bg:#dbeafe; --off-bd:#93c5fd;
  --fix:#6b7280; --fix-bg:#eef0f3; --fix-bd:#d1d5db;
  --err:#b91c1c; --err-bg:#fee2e2; --warn:#a16207; --warn-bg:#fef3c7;
  --r:12px; --sh:0 1px 2px rgba(16,24,40,.06),0 1px 3px rgba(16,24,40,.08);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--ink);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--pri2)}
.app{display:flex;min-height:100vh}
/* Sidebar */
.side{width:236px;background:var(--pri);color:#e6f1f3;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;flex-shrink:0;z-index:30}
.brand{padding:18px 18px 14px;border-bottom:1px solid rgba(255,255,255,.1)}
.brand b{display:block;font-size:15px;font-weight:800;letter-spacing:.2px;color:#fff}
.brand small{opacity:.75;font-size:12px}
.brand-logo{display:block;width:170px;max-width:100%;height:auto;margin:0 0 10px}
.nav{padding:10px 8px;flex:1;overflow:auto}
.nav-g{font-size:10.5px;letter-spacing:.9px;text-transform:uppercase;color:rgba(255,255,255,.55);font-weight:700;padding:14px 12px 6px}
.nav-g:first-child{padding-top:4px}
.nav a{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:9px;color:#d6e7ea;text-decoration:none;font-weight:500;margin-bottom:2px}
.nav a:hover{background:rgba(255,255,255,.08)}
.nav a.on{background:#fff;color:var(--pri);font-weight:700}
.nav svg{width:18px;height:18px;flex-shrink:0}
.side-foot{padding:12px 16px;font-size:12px;border-top:1px solid rgba(255,255,255,.1);color:#d6e7ea}
.sync-l{display:flex;align-items:center;gap:8px;font-size:13px}
.sync-l b{color:#fff}
.sync-r{margin-top:3px;opacity:.85;line-height:1.35}
.side-foot .small{opacity:.85}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;background:#9ca3af}
.dot.g{background:#4ade80}.dot.y{background:#facc15}
/* Main */
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.top{display:none;align-items:center;gap:10px;padding:10px 14px;background:var(--pri);color:#fff;position:sticky;top:0;z-index:20}
.top b{font-size:15px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.top-logo{height:26px;width:auto;display:block;flex-shrink:0}
.burger{background:none;border:0;color:#fff;padding:6px;cursor:pointer}
.atu{background:rgba(255,255,255,.14);border:0;color:#fff;border-radius:8px;padding:7px 12px;font:inherit;font-size:13px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.atu:active{background:rgba(255,255,255,.28)}
.atu.girando svg{animation:sp .8s linear infinite}
.top .atu{margin-left:auto}
.side-atu{margin:0 16px 10px;width:calc(100% - 32px);justify-content:center}
.content{padding:24px 28px 60px;max-width:1400px;width:100%}
h1{font-size:22px;margin:0 0 4px;font-weight:800;letter-spacing:-.2px}
.sub{color:var(--ink2);margin:0 0 20px}
h2{font-size:16px;margin:0 0 12px;font-weight:700}
h3{font-size:14px;margin:0 0 8px;font-weight:700}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);padding:18px}
.grid{display:grid;gap:16px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.kpi .n{font-size:28px;font-weight:800;letter-spacing:-.5px}
.kpi .l{color:var(--ink2);font-size:13px}
.kpi .x{font-size:12px;color:var(--ink3);margin-top:2px}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.situ{padding:18px}
.situ-b{margin:8px 0 6px}
.fin{display:block;text-decoration:none;color:inherit;border-top:4px solid #e9a23b;padding:18px;cursor:pointer}
.fin:hover{box-shadow:0 6px 18px rgba(15,76,92,.14)}
.fin-v{font-size:28px;font-weight:800;letter-spacing:-.5px;margin:4px 0 2px}
.secao{font-size:12px;text-transform:uppercase;letter-spacing:.7px;color:var(--ink2);margin:24px 0 10px;font-weight:700}
.kico{width:36px;height:36px;border-radius:10px;background:#e6f1f3;color:var(--pri);display:flex;align-items:center;justify-content:center;margin-bottom:10px}
.kico svg{width:19px;height:19px}
.kpi-link{display:block;text-decoration:none;color:inherit;cursor:pointer}
.bar{cursor:pointer;border-radius:10px;padding-bottom:2px}
.bar.sel{background:rgba(15,76,92,.08)}
.bar.sel .lb{color:var(--pri);font-weight:800}
.pdet{border-top:1px solid var(--line);padding-top:12px}
.pdet-h{margin-bottom:10px;font-size:15px}
.pdet-c{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.pdet-t{display:block;font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--ink2);margin-bottom:6px}
.pdet-t.tr{color:#15803d}.pdet-t.fo{color:#1d4ed8}
.pdet .chip{margin:0 4px 6px 0}
.cats{display:flex;flex-wrap:wrap;gap:6px}
.catb{border:1px solid var(--line);background:#fff;border-radius:999px;padding:5px 11px;font:inherit;font-size:12.5px;cursor:pointer;color:var(--ink2)}
.catb b{color:var(--ink)}
.catb.on{background:var(--pri);border-color:var(--pri);color:#fff}
.catb.on b{color:#fff}
.pg-l{display:flex;justify-content:space-between;align-items:baseline;gap:8px;padding:5px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.pg-l:last-of-type{border-bottom:0}
.pg-l b{font-size:15px}
.pg-t{font-weight:700}
@media (max-width:820px){.pdet-c{grid-template-columns:1fr}}
.kpi-link:hover{box-shadow:0 6px 18px rgba(15,76,92,.14)}
.atalhos{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px}
.atalho{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:14px 6px;border-radius:14px;background:#fff;border:1px solid var(--line);text-decoration:none;color:var(--ink);font-size:12.5px;font-weight:600;text-align:center;min-height:78px}
.atalho svg{width:22px;height:22px;color:var(--pri)}
.atalho:hover{border-color:var(--pri)}
@media (max-width:820px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.atalhos{grid-template-columns:repeat(3,minmax(0,1fr))}}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.sp{flex:1}
.mt{margin-top:16px}.mb{margin-bottom:16px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:#fff;border-radius:9px;padding:8px 14px;cursor:pointer;font-weight:600;white-space:nowrap;text-decoration:none;color:var(--ink)}
.btn:hover{background:#f9fafb}
.btn.pri{background:var(--pri);border-color:var(--pri);color:#fff}
.btn.pri:hover{background:var(--pri2)}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.danger{color:var(--err);border-color:#fecaca}
.btn.danger:hover{background:var(--err-bg)}
.btn.wa{background:#25d366;border-color:#25d366;color:#fff}
.btn.sm{padding:5px 10px;font-size:13px;border-radius:8px}
.btn.icon{padding:6px 8px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn svg{width:16px;height:16px}
.big{font-size:16px;padding:14px 22px;border-radius:12px;font-weight:800;letter-spacing:.3px;box-shadow:0 4px 14px rgba(15,76,92,.25)}
input[type=text],input[type=password],input[type=date],input[type=month],input[type=search],select,textarea{border:1px solid #d1d5db;border-radius:9px;padding:8px 10px;background:#fff;min-height:38px;max-width:100%}
textarea{width:100%;min-height:90px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid var(--pri2);outline-offset:-1px;border-color:var(--pri2)}
label.f{display:block;font-weight:600;font-size:13px;margin:0 0 4px;color:var(--ink2)}
.fld{margin-bottom:12px}
.fld input,.fld select,.fld textarea{width:100%}
.badge{display:inline-block;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:700}
.b-ok{background:var(--ok-bg);color:var(--ok)}
.b-draft{background:var(--warn-bg);color:var(--warn)}
.b-off{background:#f3f4f6;color:#6b7280}
.b-err{background:var(--err-bg);color:var(--err)}
.b-blue{background:var(--off-bg);color:var(--off)}
.muted{color:var(--ink2)}.small{font-size:12px}
.alert{border-radius:10px;padding:10px 12px;margin-bottom:8px;display:flex;gap:10px;align-items:flex-start;font-size:13.5px}
.alert.e{background:var(--err-bg);color:#7f1d1d}
.alert.w{background:var(--warn-bg);color:#713f12}
.alert.i{background:var(--pri-soft);color:#134e5e}
.alert.s{background:var(--ok-bg);color:#14532d}
.alert b{font-weight:700}
.alert .ic{font-weight:800;flex-shrink:0;width:18px;text-align:center}
/* Tables */
.tw{overflow:auto;border:1px solid var(--line);border-radius:var(--r);background:#fff;-webkit-overflow-scrolling:touch}
table{border-collapse:separate;border-spacing:0;width:100%}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
th{background:#f9fafb;font-size:12px;text-transform:uppercase;letter-spacing:.4px;color:var(--ink2);font-weight:700;position:sticky;top:0;z-index:2}
tr:last-child td{border-bottom:0}
table.list tr:hover td{background:#fafbfc}
.esc th.d,.esc td.d{text-align:center;padding:5px 4px;min-width:62px}
.esc td.nm{position:sticky;left:0;background:#fff;z-index:1;min-width:190px;max-width:260px;border-right:1px solid var(--line)}
.esc th.nm{position:sticky;left:0;z-index:3;border-right:1px solid var(--line)}
.esc tr.sec td{background:var(--pri-soft);color:var(--pri);font-weight:800;font-size:13px;letter-spacing:.3px;position:sticky;left:0}
.esc tr.sec td span{font-weight:500;color:var(--ink2);margin-left:8px;font-size:12px}
.cell{display:block;border-radius:7px;padding:6px 2px;font-weight:700;font-size:12px;border:1px solid}
.c-T{background:var(--ok-bg);color:var(--ok);border-color:var(--ok-bd)}
.c-F{background:var(--off-bg);color:var(--off);border-color:var(--off-bd)}
.c-X{background:var(--fix-bg);color:var(--fix);border-color:var(--fix-bd)}
.c-V{background:#ff3b30;color:#fff;border-color:#e11d48}
.c--{background:#fafafa;color:#c0c4cc;border-color:#eee;border-style:dashed}
.esc tr.tot td{background:#f9fafb;font-size:12px;color:var(--ink2);font-weight:600}
.esc td.nm .fn{font-weight:700}
.esc td.nm .fu{font-size:12px;color:var(--ink3)}
.today{box-shadow:inset 0 -3px 0 var(--acc)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--ink2)}
.legend i{display:inline-block;width:14px;height:14px;border-radius:4px;vertical-align:-3px;margin-right:5px;border:1px solid}
.lockon{color:var(--acc)}
.mini select{min-height:30px;padding:3px 6px;font-size:13px;border-radius:7px}
.mes td.d,.mes th.d{min-width:38px;padding:4px 2px}
.mes .cell{padding:4px 0;font-size:11px}
.mes th.wk{background:#eef2f6}
/* bars */
.bars{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;align-items:end;height:170px;margin-top:8px}
.bar{display:flex;flex-direction:column;justify-content:flex-end;align-items:stretch;height:100%;gap:2px}
.bar .w{background:#4ade80;border-radius:6px 6px 0 0}
.bar .o{background:#60a5fa;border-radius:0 0 6px 6px}
.bar .lb{text-align:center;font-size:12px;color:var(--ink2);margin-top:4px;font-weight:600}
.bar .nn{text-align:center;font-size:11px;color:var(--ink2)}
/* tabs */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:16px;overflow:auto}
.tabs button{border:0;background:none;padding:10px 14px;font-weight:600;color:var(--ink2);cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap}
.tabs button.on{color:var(--pri);border-color:var(--pri)}
/* modal */
.mbg{position:fixed;inset:0;background:rgba(17,24,39,.45);display:flex;align-items:center;justify-content:center;z-index:100;padding:16px}
.modal{background:#fff;border-radius:16px;max-width:560px;width:100%;max-height:90vh;overflow:auto;box-shadow:0 20px 50px rgba(0,0,0,.25)}
.modal.wide{max-width:820px}
.mh{padding:18px 20px 6px;font-weight:800;font-size:17px}
.mbd{padding:8px 20px 4px}
.mf{padding:14px 20px 18px;display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#111827;color:#fff;padding:10px 16px;border-radius:10px;z-index:200;font-weight:600;box-shadow:0 10px 30px rgba(0,0,0,.25);max-width:90vw}
.empty{text-align:center;padding:36px 16px;color:var(--ink2)}
.empty b{display:block;color:var(--ink);font-size:16px;margin-bottom:4px}
.list-sm{margin:0;padding:0;list-style:none}
.list-sm li{padding:7px 0;border-bottom:1px dashed var(--line);display:flex;gap:8px;justify-content:space-between}
.list-sm li:last-child{border-bottom:0}
.chip{display:inline-block;background:#f3f4f6;border-radius:6px;padding:1px 7px;margin:2px 3px 2px 0;font-size:12.5px}
.chip.b{background:var(--off-bg);color:var(--off)}
.hide{display:none!important}
.show-m{display:none}
.loading{padding:60px;text-align:center;color:var(--ink2)}
.spin{width:28px;height:28px;border:3px solid #d1d5db;border-top-color:var(--pri);border-radius:50%;animation:sp 1s linear infinite;margin:0 auto 10px}
@keyframes sp{to{transform:rotate(360deg)}}
.g-pill{display:inline-block;min-width:24px;text-align:center;border-radius:6px;padding:1px 6px;font-weight:700;font-size:12px}
.gp1{background:#ede9fe;color:#6d28d9}.gp2{background:#fce7f3;color:#be185d}.gp3{background:#ffedd5;color:#c2410c}.gp4{background:var(--off-bg);color:var(--off)}
.readonly .edit-only{display:none!important}
@media (max-width:1100px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:820px){
  .side{position:fixed;left:-260px;transition:left .2s;box-shadow:0 0 40px rgba(0,0,0,.3)}
  .side.open{left:0}
  .top{display:flex}
  .content{padding:16px 12px 70px}
  .g2,.g3{grid-template-columns:1fr}
  h1{font-size:19px}
  .esc td.nm{min-width:130px;max-width:150px}
  .esc td.nm .fu{display:none}
  .big{width:100%}
  .hide-m{display:none!important}
  table.folha th.ft1,table.folha th.ft2{text-align:left}
  table.folha th.ft1 span,table.folha th.ft2 span{position:sticky;left:8px}
  .fimp{text-align:left}
  .show-m{display:block}
}
@media (max-width:480px){.g4{grid-template-columns:1fr 1fr}.kpi .n{font-size:22px}.card{padding:14px}}
/* folha no formato da planilha */
.folha-wrap{overflow:auto;background:#fff;border-radius:var(--r);padding:12px;border:1px solid var(--line);-webkit-overflow-scrolling:touch}
table.folha{border-collapse:collapse;width:100%;min-width:900px;font-family:Calibri,Carlito,Arial,sans-serif;border:2px solid #000}
table.folha th,table.folha td{border:1px solid #000;padding:2px 3px;text-align:center;font-weight:700;font-size:12px;height:22px;position:static;background:#fff;color:#000;text-transform:none;letter-spacing:0}
table.folha th.ft1{color:#C00000;font-size:20px;border-bottom:1px solid #000;padding:4px}
table.folha th.ft2{color:#C00000;font-size:15px;padding:3px}
table.folha th.fer{background:#DDEBF7}
table.folha .fnm{text-align:left;white-space:nowrap;min-width:96px;font-size:12px;position:sticky;left:0;z-index:1}
table.folha th.fnm{text-align:center;font-size:13px}
table.folha td.fv{background:#FF0000;color:#000;font-size:13px;letter-spacing:.5px}
table.folha td.nd{background:repeating-linear-gradient(45deg,#f3f4f6,#f3f4f6 4px,#e5e7eb 4px,#e5e7eb 8px)!important}
table.folha tr.sep td{height:22px}
.fimp{border:2px solid #000;border-top:0;text-align:center;padding:4px 14px 10px;font-family:Calibri,Carlito,Arial,sans-serif;min-width:900px}
.fimp-t{color:#C00000;font-weight:800;font-size:40px;line-height:1.15}
.fimp p{margin:4px 0;font-size:15px}
.fleg{margin:14px 0 0 60px;display:flex;align-items:center;gap:10px;font-family:Calibri,Carlito,Arial,sans-serif;font-size:16px}
.fr{color:#FF0000}
.svc-wrap{overflow:auto;-webkit-overflow-scrolling:touch;max-width:100%;border-radius:8px}
table.svc{border-collapse:separate;border-spacing:0;font-size:13px;white-space:nowrap}
table.svc th,table.svc td{border-bottom:1px solid #d9dee5;border-right:1px solid #d9dee5;padding:4px 6px;text-align:center;min-width:112px;background:#fff}
table.svc th{background:#f3f6f9;font-weight:700}
table.svc .svc-f{font-weight:400;font-size:11px;color:#667085;background:#f3f6f9}
table.svc td.svc-dia,table.svc th.svc-dia{position:sticky;left:0;z-index:1;text-align:left;min-width:120px;font-weight:600}
table.svc .svc-in{width:96px;border:0;background:transparent;text-align:right;font:inherit;padding:2px 4px}
table.svc .svc-in:focus{outline:2px solid #2563eb;background:#eef4ff}
table.svc tr.svc-sum td{background:#eef2f6;font-weight:600}
.ajrow{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:6px}
.ajrow input[type=number]{width:110px}
table.svc tr.svc-fora td{opacity:.4}
.lote-g{display:grid;grid-template-columns:1.4fr .7fr .7fr .95fr 1.7fr 30px;gap:6px;align-items:center}
.lote-g input,.lote-aj input{width:100%;min-width:0;box-sizing:border-box}
.lote-aj{display:grid;grid-template-columns:1.2fr 1fr 1.4fr;gap:8px;align-items:center}

.fleg-f{display:inline-block;border:1.5px solid #000;width:44px;text-align:center;font-weight:800;padding:2px 0}
.cor-in{width:44px;height:34px;padding:2px;border:1px solid #d1d5db;border-radius:8px;background:#fff;cursor:pointer}
.ferias-row{display:flex;gap:6px;align-items:center;margin-bottom:6px;flex-wrap:wrap}
.shade{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:25;display:none}
.shade.on{display:block}
/* vale-transporte */
table.folha.vt{min-width:0;width:auto}
table.folha.vt th,table.folha.vt td{font-size:11.5px;min-width:64px;white-space:nowrap;height:20px;padding:1px 4px}
table.folha.vt th{white-space:normal;line-height:1.15}
table.folha.vt .fnm{min-width:62px;background:#fff;font-weight:700}
table.folha.vt .vts{font-weight:800;font-size:12px;color:#1f4ea0}
table.folha.vt thead tr:nth-child(3) th:not(.fnm):not(.vtt){font-size:13.5px;font-weight:800;padding:4px}
table.folha.vt thead tr:nth-child(4) th,table.folha.vt thead tr:nth-child(5) th{padding:3px 4px}
table.folha.vt td.vtc{font-weight:500;cursor:pointer;text-align:right;padding-right:6px}
table.folha.vt td.vt-folga,table.folha.vt td.vt-semvt,table.folha.vt td.vt-faltaJ,table.folha.vt td.vt-afast{color:#6b7280;text-align:center;font-weight:700}

/* ===== Visual refinado (tema claro e escuro automático) ===== */
:root{
  --bg:#f3f5f8; --card:#ffffff; --ink:#0b1220; --ink2:#475467; --ink3:#8a94a6; --line:#e4e8ee;
  --pri:#0d4a5a; --pri2:#156a7f; --pri-soft:#e8f2f4; --acc:#e8a33d;
  --r:14px;
  --sh:0 1px 2px rgba(16,24,40,.05),0 2px 8px rgba(16,24,40,.06);
  --sh2:0 12px 32px rgba(13,74,90,.16);
  --ring:0 0 0 3px rgba(21,106,127,.28);
}
body{letter-spacing:.005em}
h1{font-size:24px;letter-spacing:-.4px}
h2{letter-spacing:-.2px}
.side{background:linear-gradient(180deg,#0d4a5a 0%,#093643 100%);box-shadow:inset -1px 0 0 rgba(255,255,255,.06)}
.nav a{position:relative;transition:background .15s,color .15s}
.nav a.on{box-shadow:0 1px 3px rgba(0,0,0,.14)}
.nav a.on::before{content:'';position:absolute;left:-8px;top:8px;bottom:8px;width:3px;border-radius:0 3px 3px 0;background:var(--acc)}
.top{background:linear-gradient(90deg,#0d4a5a,#156a7f);box-shadow:0 2px 10px rgba(0,0,0,.12)}
.card{border-color:#e6eaf0}
.kpi-link{transition:transform .15s,box-shadow .15s,border-color .15s}
.kpi-link:hover{transform:translateY(-2px);box-shadow:var(--sh2);border-color:#cfe0e5}
.kico{background:linear-gradient(135deg,#e3f0f3,#d2e7ec)}
.fin{border-top-color:var(--acc)}
.btn{transition:background .15s,border-color .15s,box-shadow .15s,transform .05s;box-shadow:0 1px 1px rgba(16,24,40,.04)}
.btn:active{transform:translateY(1px)}
.btn.pri{background:linear-gradient(180deg,#136277,#0d4a5a);border-color:#0d4a5a;box-shadow:0 2px 6px rgba(13,74,90,.25)}
.btn.pri:hover{background:linear-gradient(180deg,#17708a,#0f5566)}
.btn:focus-visible,.atalho:focus-visible,.nav a:focus-visible,.catb:focus-visible{outline:none;box-shadow:var(--ring)}
input[type=text],input[type=password],input[type=date],input[type=month],input[type=search],select,textarea{border-color:#cfd6df;transition:border-color .15s,box-shadow .15s}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--pri2);box-shadow:var(--ring)}
.big{box-shadow:0 6px 18px rgba(13,74,90,.28)}
th{background:#f7f9fb}
table.list tr:hover td{background:#f8fbfc}
.tw{box-shadow:var(--sh)}
.atalho{transition:transform .15s,box-shadow .15s,border-color .15s}
.atalho:hover{transform:translateY(-2px);box-shadow:var(--sh2)}
.modal{border-radius:18px;box-shadow:0 24px 60px rgba(2,12,20,.3)}
.mbg{background:rgba(11,18,32,.42);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
.mh{font-size:18px;letter-spacing:-.2px}
.toast{border-radius:12px}
.badge{letter-spacing:.2px}

<script>
/* =====================================================================
   NÚCLEO DO SISTEMA DE ESCALAS — funções puras (sem interface)
   Regras:
   - Semana de domingo (0) a sábado (6), como na folha de escala do hotel.
   - Sexta (5) e sábado (6): ninguém folga.
   - Combinações permitidas (exatamente uma por funcionário) — REGRAS FIXAS DO HOTEL:
       1 = Segunda e terça | 2 = Terça e quarta | 3 = Quarta e quinta
       4 = Domingo, segunda e quinta (semana do domingo de folga)
   - No máximo 1 funcionário por setor de folga no domingo (combinação 4),
     e quem folga domingo folga a segunda e a quinta da mesma semana.
   - Cada funcionário folga no máximo 1 domingo por mês (mês do domingo).
   - Ninguém trabalha mais de 6 dias seguidos (contando a virada de uma semana para a outra).
   - Cobertura (setor com 2 ou mais): SEMPRE pelo menos 1 trabalhando, todos os dias.
     Terça e quarta (hotel fechado): setor com mais de 2 funcionários tem no máximo 1 trabalhando.
   - Modelo:
       semana COM domingo: quem folga domingo folga dom+seg+qui; os demais terça+quarta;
       semana SEM domingo: 1 pessoa segunda+terça, 1 pessoa quarta+quinta e as demais terça+quarta.
   - Funcionário de férias em qualquer dia da semana não recebe folgas nela.
   ===================================================================== */
(function (root) {

  var DIAS_CURTO = ['Dom', 'Seg', 'Ter', 'Qua', 'Qui', 'Sex', 'Sáb'];
  var GRUPOS = {
    1: { dias: [1, 2], nome: 'Segunda e terça' },
    2: { dias: [2, 3], nome: 'Terça e quarta' },
    3: { dias: [3, 4], nome: 'Quarta e quinta' },
    4: { dias: [0, 1, 4], nome: 'Domingo, segunda e quinta' }
  };
  var IDX_TER = 2, IDX_QUA = 3;
  var PERMITIDAS = [1, 2, 3, 4];
  var DIAS_FUNCIONAMENTO = [0, 1, 2, 3, 4, 5, 6]; // sempre pelo menos 1 trabalhando, todos os dias
  var DIAS_PROIBIDOS = [5, 6]; // sexta e sábado
  var IDX_DOMINGO = 0, IDX_QUINTA = 4;

  /* ---------------- Datas (strings AAAA-MM-DD, sem fuso) ---------------- */
  function parse(s) { var p = s.split('-'); return Date.UTC(+p[0], +p[1] - 1, +p[2]); }

  function inicioSemana(s) { return addDias(s, -diaSemana(s)); }

  function semanasEntre(a, b) { return Math.round((parse(b) - parse(a)) / (7 * 86400000)); }
  function dataBR(s) { if (!s) return ''; var p = s.split('-'); return p[2] + '/' + p[1] + '/' + p[0]; }

  /** Devolve vetor de 7 posições: true = folga */
  function folgasDoGrupo(g) {

    if (GRUPOS[g]) GRUPOS[g].dias.forEach(function (d) { v[d] = true; });
    return v;
  }

  /** folgas de uma atribuição: usa 'dias' (semanas especiais) ou a combinação g */
  function folgasDe(a) {

const MESES = ['JANEIRO', 'FEVEREIRO', 'MARÇO', 'ABRIL', 'MAIO', 'JUNHO', 'JULHO', 'AGOSTO', 'SETEMBRO', 'OUTUBRO', 'NOVEMBRO', 'DEZEMBRO'];

const Store = {
  filas: {},
  async init() {
    if (window.STANDALONE) { try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) { } }
    if (window.NUVEM) { S.modo = 'nuvem'; return Nuvem.iniciar(); }
    try {
      if (!window.STANDALONE && window.claude && typeof window.claude.use === 'function') {
        DB = await window.claude.use('db');
        try { DL = await window.claude.use('downloads'); } catch (e) { DL = null; }
        try {
          const u = await window.claude.use('user');
          if (u && typeof u.can === 'function') { const pode = await u.can('data.write'); if (pode === false) S.somenteLeitura = true; }
        } catch (e) { }
      }
    } catch (e) { DB = null; }
    if (DB) { S.modo = 'db'; this.assinar(); }
    else { S.modo = 'local'; this.carregarLocal(); S.pronto = true; render(); }

  },
  assinar() {
    const cols = ['setores', 'funcionarios', 'escalas', 'auditoria', 'config', 'vt'];
    const timer = setTimeout(() => { if (!S.pronto) { S.pronto = true; S.lento = true; render(); atualizarStatus(); } }, 10000);
    const marcar = (c, snap) => {
      if (!snap.metadata.fromCache) S.carregados[c] = true;
      if (cols.every(x => S.carregados[x])) { clearTimeout(timer); S.lento = false; }
      if (!S.pronto && cols.every(x => S.carregados[x])) S.pronto = true;
      agendarRender(); atualizarStatus();
    };
    const erro = c => e => { S.carregados[c] = true; if (e && e.code === 'revoked') S.somenteLeitura = true; S.erroDb = e && e.message; agendarRender(); atualizarStatus(); };
    DB.collection('setores').onSnapshot(s => { S.setores = s.docs.map(d => Object.assign({ id: d.id }, d.data())); marcar('setores', s); }, erro('setores'));
    DB.collection('funcionarios').onSnapshot(s => { S.funcionarios = s.docs.map(d => Object.assign({ id: d.id }, d.data())); marcar('funcionarios', s); }, erro('funcionarios'));
    DB.collection('escalas').onSnapshot(s => { const o = {}, ant = {}; s.docs.forEach(d => { const e = Object.assign({}, d.data(), { semana: d.id }); if (C.diaSemana(d.id) === 0) o[d.id] = e; else ant[d.id] = e; }); S.escalas = o; S.escalasAntigas = ant; marcar('escalas', s); }, erro('escalas'));
    DB.collection('auditoria').orderBy('ts', 'desc').limit(800).onSnapshot(s => { S.auditoria = s.docs.map(d => Object.assign({ id: d.id }, d.data())); marcar('auditoria', s); }, erro('auditoria'));
    DB.collection('vt').onSnapshot(s => { const o = {}; s.docs.forEach(d => { o[d.id] = d.data(); }); S.vt = o; marcar('vt', s); }, erro('vt'));
    DB.collection('config').onSnapshot(s => { const g = s.docs.find(d => d.id === 'geral'); if (g) S.config = Object.assign({}, CONFIG_PADRAO, g.data()); marcar('config', s); }, erro('config'));
  },
  carregarLocal() {
    try { const raw = localStorage.getItem(LS_KEY); if (raw) { const d = JSON.parse(raw); Object.assign(S, { setores: d.setores || [], funcionarios: d.funcionarios || [], vt: d.vt || {}, escalas: {}, escalasAntigas: {}, auditoria: d.auditoria || [], config: Object.assign({}, CONFIG_PADRAO, d.config || {}) }); Object.entries(d.escalas || {}).forEach(([k, e]) => { if (C.diaSemana(k) === 0) S.escalas[k] = e; else S.escalasAntigas[k] = e; }); } } catch (e) { S.localFalhou = true; }
  },
  salvarLocal() {
    if (S.modo === 'nuvem') return Nuvem.guardarCopia();
    try { localStorage.setItem(LS_KEY, JSON.stringify({ setores: S.setores, funcionarios: S.funcionarios, vt: S.vt, escalas: Object.assign({}, S.escalasAntigas, S.escalas), auditoria: S.auditoria.slice(0, 2000), config: S.config })); } catch (e) { S.localFalhou = true; }
  },
  enfileirar(chave, fn) {
    const ant = this.filas[chave] || Promise.resolve();
    const p = ant.catch(() => { }).then(fn);
    this.filas[chave] = p;
    this.pendentes = (this.pendentes || 0) + 1;
    p.then(() => { }, () => { }).then(() => { this.pendentes--; atualizarStatus(); });
    return p;
  },
  aplicar(col, id, limpo) {
    if (col === 'escalas') { if (C.diaSemana(id) === 0) S.escalas[id] = Object.assign({}, limpo, { semana: id }); else S.escalasAntigas[id] = Object.assign({}, limpo, { semana: id }); }
    else if (col === 'config') { if (id === 'geral') S.config = Object.assign({}, CONFIG_PADRAO, limpo); }
    else if (col === 'vt') S.vt[id] = limpo;
    else if (col === 'servicos') S.servicos[id] = limpo;
    else if (col === 'auditoria') { const i = S.auditoria.findIndex(x => x.id === id); const o = Object.assign({ id }, limpo); if (i >= 0) S.auditoria[i] = o; else S.auditoria.unshift(o); }
    else { const arr = S[col]; const i = arr.findIndex(x => x.id === id); const obj = Object.assign({ id }, limpo); if (i >= 0) arr[i] = obj; else arr.push(obj); }
  },
  remover(col, id) {
    if (col === 'escalas') { delete S.escalas[id]; delete S.escalasAntigas[id]; }
    else if (col === 'config') S.config = Object.assign({}, CONFIG_PADRAO);
    else if (col === 'vt') delete S.vt[id];
    else if (col === 'servicos') delete S.servicos[id];
    else S[col] = S[col].filter(x => x.id !== id);
  },
  async set(col, id, data) {
    if (S.somenteLeitura) { toast(S.modo === 'nuvem' ? 'Sem conexão: não é possível alterar agora.' : 'Você tem acesso somente leitura.'); throw new Error('ro'); }
    const limpo = JSON.parse(JSON.stringify(data));
    delete limpo.id;
    if (S.modo === 'db') {
      return this.enfileirar(col + '/' + id, () => DB.collection(col).doc(id).set(limpo)).catch(e => this.falha(e));
    }
    this.aplicar(col, id, limpo);
    this.salvarLocal(); agendarRender();
    if (S.modo === 'nuvem') return this.enfileirar(col + '/' + id, () => Nuvem.rpc('esc_salvar', { p_colecao: col, p_id: id, p_dados: limpo })).catch(e => Nuvem.falhaGravacao(e));
  },
  async del(col, id) {
    if (S.somenteLeitura) { toast(S.modo === 'nuvem' ? 'Sem conexão: não é possível alterar agora.' : 'Você tem acesso somente leitura.'); throw new Error('ro'); }
    if (S.modo === 'db') return this.enfileirar(col + '/' + id, () => DB.collection(col).doc(id).delete()).catch(e => this.falha(e));
    this.remover(col, id);
    this.salvarLocal(); agendarRender();
    if (S.modo === 'nuvem') return this.enfileirar(col + '/' + id, () => Nuvem.rpc('esc_apagar', { p_colecao: col, p_id: id })).catch(e => Nuvem.falhaGravacao(e));
  },
  falha(e) {
    const code = e && e.code;
    if (code === 'invalid_argument' || code === 'not_granted' || code === 'revoked') { S.somenteLeitura = true; agendarRender(); }
    modalMsg('Não foi possível salvar', '<div class="alert e"><span class="ic">!</span><div>O armazenamento recusou a gravação' + (code ? ' (' + esc(code) + ')' : '') + '. ' + (code === 'quota_exceeded' ? 'O limite de armazenamento foi atingido: exclua escalas antigas ou faça um backup e limpe o histórico.' : 'Verifique sua conexão e tente de novo.') + '</div></div>');
    throw e;
  }
};

const Nuvem = {
  TOKEN: 'esc_token', COPIA: 'esc_copia_nuvem',
  token() { try { return localStorage.getItem(this.TOKEN); } catch (e) { return null; } },
  async rpc(fn, args, semToken) {
    const body = Object.assign({}, args || {}); if (!semToken) body.p_token = this.token();
    const ctrl = new AbortController(); const t = setTimeout(() => ctrl.abort(), 20000);
    let r;
    try {
      r = await fetch(window.NUVEM.url + '/rest/v1/rpc/' + fn, { method: 'POST', signal: ctrl.signal, headers: { 'Content-Type': 'application/json', apikey: window.NUVEM.key, Authorization: 'Bearer ' + window.NUVEM.key }, body: JSON.stringify(body) });
    } catch (e) { const x = new Error('SEM_CONEXAO'); x.code = 'SEM_CONEXAO'; throw x; }
    finally { clearTimeout(t); }
    const txt = await r.text(); let j = null; try { j = txt ? JSON.parse(txt) : null; } catch (e) { }
    if (!r.ok) { const x = new Error((j && j.message) || ('HTTP ' + r.status)); x.code = (j && j.message) || ('HTTP_' + r.status); throw x; }
    return j;
  },
  async iniciar() {
    if (!this.token()) { S.precisaLogin = true; S.pronto = true; render(); atualizarStatus(); return; }
    try { await this.carregarTudo(); }
    catch (e) {
      if (e.code === 'SESSAO_INVALIDA') return this.sair(true);
      // sem internet: mostra a última cópia, só para consulta
      if (this.lerCopia()) { S.offline = true; S.somenteLeitura = true; S.pronto = true; render(); }
      else { S.erroConexao = true; S.pronto = true; render(); }
    }
    atualizarStatus();
    this.agendarSync();
  },
  aplicarDocs(docs) {
    docs.forEach(d => { if (d.x) Store.remover(d.c, d.i); else Store.aplicar(d.c, d.i, d.d || {}); });
    S.auditoria.sort((a, b) => (b.ts || '').localeCompare(a.ts || ''));
  },
  async carregarTudo() {
    const r = await this.rpc('esc_ler', { p_desde: null });
    Object.assign(S, { setores: [], funcionarios: [], prestadores: [], servicos: {}, vt: {}, escalas: {}, escalasAntigas: {}, auditoria: [], config: Object.assign({}, CONFIG_PADRAO) });
    this.aplicarDocs(r.docs || []);
    S.desde = r.agora; S.offline = false; S.somenteLeitura = false; S.erroConexao = false; S.precisaLogin = false; S.pronto = true; S.sincAt = new Date();
    this.guardarCopia(); render(); atualizarStatus();
  },
  async sincronizar() {
    if (!S.desde || S.precisaLogin || document.hidden) return;
    if (Object.values(Store.filas).length && await Promise.race([Promise.all(Object.values(Store.filas)).then(() => false, () => false), new Promise(r => setTimeout(() => r(true), 50))])) return; // gravações em andamento
    try {
      if (S.offline) return await this.carregarTudo();
      const r = await this.rpc('esc_ler', { p_desde: S.desde });
      if (r.docs && r.docs.length) { this.aplicarDocs(r.docs); this.guardarCopia(); agendarRender(); }
      S.desde = r.agora; S.sincAt = new Date(); if (S.semRede) S.semRede = false; atualizarStatus();
    } catch (e) {
      if (e.code === 'SESSAO_INVALIDA') return this.sair(true);
      if (e.code === 'SEM_CONEXAO' && !S.semRede) { S.semRede = true; atualizarStatus(); }
    }
  },
  agendarSync() {
    if (this._t) return;
    this._t = setInterval(() => this.sincronizar(), 30000);
    document.addEventListener('visibilitychange', () => { if (!document.hidden) this.sincronizar(); });
    window.addEventListener('online', () => this.sincronizar());
  },
  guardarCopia() { try { localStorage.setItem(this.COPIA, JSON.stringify({ em: agoraISO(), setores: S.setores, funcionarios: S.funcionarios, prestadores: S.prestadores, servicos: S.servicos, vt: S.vt, escalas: S.escalas, auditoria: S.auditoria.slice(0, 300), config: S.config })); } catch (e) { } },
  lerCopia() {
    try { const d = JSON.parse(localStorage.getItem(this.COPIA) || 'null'); if (!d) return false; Object.assign(S, { setores: d.setores || [], funcionarios: d.funcionarios || [], prestadores: d.prestadores || [], servicos: d.servicos || {}, vt: d.vt || {}, escalas: d.escalas || {}, escalasAntigas: {}, auditoria: d.auditoria || [], config: Object.assign({}, CONFIG_PADRAO, d.config || {}) }); S.copiaEm = d.em; return true; } catch (e) { return false; }
  },
  async falhaGravacao(e) {
    if (e && e.code === 'SESSAO_INVALIDA') { this.sair(true); throw e; }
    const dom = e && /^DOMINGO_NO_MES/.test(e.message || '');
    await modalMsg('Alteração não salva', `<div class="alert e"><span class="ic">!</span><div>${e && e.code === 'SEM_CONEXAO' ? 'Sem conexão com a internet. A última alteração <b>não foi salva</b>.' : /^COMBINACAO_INVALIDA/.test(e.message || '') ? 'A escala tem uma combinação de folgas não permitida (' + esc((e.message.split(':')[1] || '').trim()) + '). Use só seg+ter, ter+qua, qua+qui ou dom+seg+qui.' : dom ? '<b>' + esc((e.message.split(':')[1] || '').trim()) + '</b> já folgou um domingo neste mês. Cada funcionário só pode folgar 1 domingo por mês, então a escala <b>não foi salva</b>. Atualize a página (tecla F5) e gere de novo.' : 'O servidor recusou a gravação (' + esc(e && e.message) + ').'} Os dados serão recarregados do servidor.</div></div>`);
    try { await this.carregarTudo(); } catch (x) { S.offline = true; S.somenteLeitura = true; render(); atualizarStatus(); }
    throw e;
  },
  async entrar(senha) {
    try { const tok = await this.rpc('esc_entrar', { p_senha: senha }, true); localStorage.setItem(this.TOKEN, tok); await this.carregarTudo(); this.agendarSync(); return null; }
    catch (e) { return e.code === 'SENHA_INCORRETA' ? 'Senha incorreta.' : e.code === 'BLOQUEADO' ? 'Muitas tentativas erradas. Aguarde 15 minutos.' : e.code === 'SEM_CONEXAO' ? 'Sem conexão com a internet.' : 'Erro: ' + e.message; }
  },
  async sair(expirou) {
    if (!expirou) { try { await this.rpc('esc_sair', {}); } catch (e) { } }
    try { localStorage.removeItem(this.TOKEN); localStorage.removeItem(this.COPIA); } catch (e) { }
    Object.assign(S, { setores: [], funcionarios: [], vt: {}, escalas: {}, escalasAntigas: {}, auditoria: [], precisaLogin: true, pronto: true, desde: null });
    if (expirou) toast('Sua sessão expirou. Entre de novo.');
    render(); atualizarStatus();
  }
};
function vLogin() {
  return `<div style="max-width:380px;margin:8vh auto 0" class="card"><h1 style="text-align:center">${esc(S.config.nomeHotel || 'Gestão de Escalas')}</h1><p class="sub" style="text-align:center">Sistema de escalas de folga</p>

document.addEventListener('submit', async ev => {
  if (ev.target.id !== 'fLogin') return;
  ev.preventDefault();
  const b = ev.target.querySelector('button'); b.disabled = true; b.textContent = 'Entrando…';
  const err = await Nuvem.entrar(document.getElementById('loginSenha').value);
  if (err) { const e = document.getElementById('loginErro'); if (e) e.textContent = err; b.disabled = false; b.textContent = 'Entrar'; }
});
async function log(tipo, texto, semana) {
  const e = { ts: agoraISO(), tipo, texto, semana: semana || null };
  if (S.modo === 'db' || S.modo === 'nuvem') { try { await Store.set('auditoria', uid('log'), e); } catch (x) { } }
  else { S.auditoria.unshift(Object.assign({ id: uid('log') }, e)); Store.salvarLocal(); }
}
let rT = null;
function agendarRender() {
  if (rT) return;
  // enquanto a pessoa digita um valor na tabela de serviços, não redesenha a tela (senão o cursor e a rolagem voltam ao início)
  if (Date.now() - (window.__svcT || 0) < 2500) { rT = setTimeout(() => { rT = null; agendarRender(); }, 1500); return; }
  rT = setTimeout(() => { rT = null; render(); }, 30);
}
function atualizarStatus() {
  const el = document.getElementById('storeStatus');
  let h;
  if (!S.modo) h = '<span class="dot"></span>Conectando…';
  else if (S.modo === 'db') h = S.lento ? '<span class="dot y"></span>Dados salvos na nuvem (conexão lenta)' : '<span class="dot g"></span>Dados salvos na nuvem';
  else if (S.modo === 'nuvem') h = S.precisaLogin ? '<span class="dot"></span>Aguardando senha' : (S.offline || S.semRede) ? '<span class="dot y"></span>Sem internet — só consulta' : '<span class="dot g"></span>Salvo na nuvem';
  else h = window.STANDALONE ? '<span class="dot g"></span>Salvo neste aparelho — faça backups' : '<span class="dot y"></span>Salvo só neste navegador — faça backups';
  if (S.somenteLeitura && S.modo !== 'nuvem') h += '<br><span class="small">Modo somente leitura</span>';
  const pend = Store.pendentes || 0;
  const estado = !S.modo ? ['', 'Conectando…'] : S.modo === 'nuvem'
    ? (S.precisaLogin ? ['y', 'Aguardando senha'] : (S.offline || S.semRede) ? ['y', 'Sem conexão'] : pend > 0 ? ['y', 'Gravando alterações…'] : ['g', 'Conectado'])
    : S.modo === 'db' ? (S.lento ? ['y', 'Conectado (conexão lenta)'] : ['g', 'Conectado'])
    : (window.STANDALONE ? ['g', 'Salvo neste aparelho'] : ['y', 'Salvo só neste navegador']);
  const sincOk = S.modo === 'nuvem' && !S.precisaLogin && !(S.offline || S.semRede) && pend === 0;
  const quando = S.sincAt ? S.sincAt.toLocaleString('pt-BR', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit', timeZone: 'America/Recife' }).replace(',', '') : '';
  h = '<div class="sync-l"><span class="dot ' + estado[0] + '"></span><b>' + estado[1] + '</b></div>'
    + '<div class="sync-r small">' + (S.modo === 'nuvem' ? (sincOk ? 'Dados sincronizados' : 'Alterações ainda não enviadas') + (quando ? ' · última sincronização ' + quando : '') : 'Faça backups regulares') + '</div>';
  if (S.somenteLeitura && S.modo !== 'nuvem') h += '<div class="small">Modo somente leitura</div>';
  el.innerHTML = h;
  document.getElementById('brandName').textContent = S.config.nomeHotel || 'Gestão de Escalas';
}

/* Marca ou desmarca como pago um lote de um prestador, com confirmação */
async function servPagar(mes, pid, loteId) {
  const c = servCalc(mes, pid), x = c.pagos.find(y => y.id === loteId);
  if (!x) return;
  const desfazer = x.pago, nome = _capNome((c.p || {}).nome || '');
  const ok = await modalMsg(desfazer ? 'Desfazer pagamento' : 'Confirmar pagamento',
    `<p>${desfazer ? 'Desfazer o pagamento de' : 'Marcar como pago'} <b>R$ ${servMoeda(desfazer && x.valorPago != null ? x.valorPago : x.valor)}</b> para <b>${esc(nome)}</b>?</p><p class="small muted">${esc(x.nome)} (dias ${x.de} a ${x.ate}) · ${servMesNome(mes)}</p>`,
    [{ t: 'Cancelar', v: false }, { t: desfazer ? 'Desfazer' : 'Confirmar pagamento', c: 'pri', v: true }]);
  if (!ok) return;
  const novo = Object.assign({}, servPagosDoc(c.l));
  novo[loteId] = desfazer
    ? Object.assign({}, novo[loteId], { pago: false, valorPago: undefined })
    : Object.assign({}, novo[loteId], { pago: true, valorPago: x.valor });
  try { await servSalvar(mes, pid, { pagos: novo }); log('servicos', (desfazer ? 'Pagamento desfeito: ' : 'Pago: ') + nome + ' · ' + mes + ' · ' + x.nome + ' · R$ ' + servMoeda(x.valor)); } catch (e) { }
  render();
}
/* Marca como pago, de uma vez, todos os pendentes do grupo escolhido num lote */
async function servPagarGrupo(mes, loteId) {
  const lotesG = servLotesMes(mes, UI.servGrupo || 'diaria'), idxG = lotesG.findIndex(x => x.id === loteId);
  const lote = lotesG[idxG];
  if (!lote) return;
  const alvo = servPrestadoresGrupo().filter(p => S.servicos[servKey(mes, p.id)]).map(p => {
    const c = servCalc(mes, p.id), x = c.pagos[idxG];
    return { c, x, pid: p.id };
  }).filter(o => o.x && !o.x.pago && o.x.valor > 0);
  if (!alvo.length) return toast('Nada pendente neste grupo para este lote.');
  const total = r2(alvo.reduce((a, o) => a + o.x.valor, 0));
  const lista = alvo.map(o => `<li>${esc(_capNome(o.c.p.nome))}: R$ ${servMoeda(o.x.valor)}</li>`).join('');
  const ok = await modalMsg('Confirmar pagamentos',
    `<p>Marcar como pagos <b>${alvo.length}</b> pagamento(s) de <b>${esc(lote.nome)}</b> (${servMesNome(mes)}), ${esc(servGrupoNome[UI.servGrupo || 'diaria'].toLowerCase())}, total <b>R$ ${servMoeda(total)}</b>?</p><ul>${lista}</ul>`,
    [{ t: 'Cancelar', v: false }, { t: 'Confirmar pagamentos', c: 'pri', v: true }]);
  if (!ok) return;
  for (const o of alvo) {
    const novo = Object.assign({}, servPagosDoc(o.c.l));
    novo[o.x.id] = Object.assign({}, novo[o.x.id], { pago: true, valorPago: o.x.valor });
    try { await servSalvar(mes, o.pid, { pagos: novo }); } catch (e) { }
  }
  log('servicos', 'Pagos em lote: ' + lote.nome + ' · ' + alvo.length + ' pessoa(s) · R$ ' + servMoeda(total));
  render();
}

   ===================================================================== */
function alertasGerais() {
  const out = [];
  const dev = C.folgasDevidas(historicoArr());
  const devem = Object.entries(dev).filter(([id, q]) => q > 0 && funcPorId(id) && funcPorId(id).ativo);
  if (devem.length) out.push({ t: 'w', m: 'Folgas das festas ainda a devolver: ' + devem.map(([id, q]) => funcPorId(id).nome + ' (' + q + ')').join(', ') + '. Nesses setores de 2 pessoas a devolução em bloco não cabe sem deixar o setor vazio.', link: 'mensal' });
  if (S.modo === 'local' && S.funcionarios.length) {
    let ub = null; try { ub = localStorage.getItem('escalas_ultimo_backup'); } catch (e) { }
    const dias = ub ? Math.floor((Date.now() - new Date(ub).getTime()) / 86400000) : null;
    if (dias === null) out.push({ t: 'w', m: 'Você ainda não fez nenhum backup. Os dados ficam só neste aparelho: baixe um backup e guarde no Google Drive, WhatsApp ou pen drive.', link: 'backup' });
    else if (dias >= 7) out.push({ t: 'w', m: 'Seu último backup foi há ' + dias + ' dias. Baixe um backup novo.', link: 'backup' });
  }
  const hoje = C.hojeISO(), semAtual = C.inicioSemana(hoje), prox = C.addDias(semAtual, 7);
  const ativos = S.funcionarios.filter(f => f.ativo);
  if (Object.keys(S.escalasAntigas).length) out.push({ t: 'w', m: Object.keys(S.escalasAntigas).length + ' escala(s) no formato antigo (semana de segunda a domingo) foram ignoradas. Exclua-as em Backup e configurações e gere de novo.', link: 'backup' });
  if (!S.setores.length) out.push({ t: 'i', m: 'Cadastre os setores do hotel para começar.', link: 'setores' });
  if (!ativos.length) out.push({ t: 'i', m: 'Nenhum funcionário ativo cadastrado.', link: 'funcionarios' });
  ativos.filter(f => !setorPorId(f.setorId)).forEach(f => out.push({ t: 'e', m: f.nome + ' está ativo sem setor definido. A escala não pode ser gerada até corrigir.', link: 'funcionarios' }));
  S.setores.forEach(s => {
    const n = ativos.filter(f => f.setorId === s.id).length;
    if (n === 0) out.push({ t: 'w', m: 'Setor "' + s.nome + '" não tem funcionários ativos.', link: 'setores' });
  });
  [[semAtual, 'desta semana'], [prox, 'da próxima semana']].forEach(([sem, rot]) => {
    const e = S.escalas[sem];
    if (!e) { if (ativos.length) out.push({ t: sem === semAtual ? 'e' : 'w', m: 'A escala ' + rot + ' (' + semanaLabel(sem) + ') ainda não foi gerada.', link: 'mensal', sem }); return; }
    const v = C.validarEscala(e, S.funcionarios, S.setores, historicoArr());
    v.erros.forEach(x => out.push({ t: 'e', m: 'Escala ' + rot + ': ' + x.msg, link: 'mensal', sem }));
    v.avisos.filter(a => a.fora).forEach(x => out.push({ t: 'e', m: 'Escala ' + rot + ': ' + x.msg, link: 'mensal', sem }));
    v.avisos.filter(a => !/repete a combinação/.test(a.msg) && !a.fora).forEach(x => out.push({ t: 'w', m: 'Escala ' + rot + ': ' + x.msg, link: 'mensal', sem }));
    if (e.status !== 'aprovada') out.push({ t: 'i', m: 'Escala ' + rot + ' (' + semanaLabel(sem) + ') está em ' + (e.status || 'rascunho') + ', aguardando aprovação.', link: 'mensal', sem });
  });
  // domingo de folga previsto no mês: só cobra depois que todos os domingos do mês já estão planejados
  const mesAtual = hoje.slice(0, 7), ultDia = new Date(+mesAtual.slice(0, 4), +mesAtual.slice(5, 7), 0).getDate();
  const domMes = [];
  for (let dd = 1; dd <= ultDia; dd++) { const iso = mesAtual + '-' + String(dd).padStart(2, '0'); if (C.diaSemana(iso) === 0) domMes.push(iso); }
  // Lê a escala salva com a mesma regra que monta a escala (grupo ou dias da semana), sem olhar o status de aprovação
  if (domMes.length && domMes.every(dm => S.escalas[dm])) {
    ativos.forEach(f => {
      const st = domMes.map(dm => C.statusDia(S.escalas[dm].atribuicoes ? S.escalas[dm].atribuicoes[f.id] || null : null, dm, f, true));
      const trabDom = st.filter(x => x === 'T' || x === 'X').length;
      const folgaDom = st.filter(x => x === 'F').length;
      if (trabDom > 0 && folgaDom === 0) out.push({ t: 'w', m: f.nome + ' não tem domingo de folga previsto em ' + servMesNome(mesAtual) + ' (trabalha nos ' + trabDom + ' domingos do mês). Abra a escala para ajustar.', link: 'mensal' });
    });
  }
  out.forEach(a => { if (!a.cat) a.cat = catAlerta(a.m); });
  return out;
}
// Categoria de cada alerta, pelo texto (os alertas já vêm prontos das regras)
function catAlerta(m) {
  if (/ainda não foi gerada|aguardando aprovação/.test(m)) return 'status';
  if (/backup|formato antigo|Cadastre|sem setor definido|Nenhum funcionário ativo|cópia|copiada/.test(m)) return 'sistema';
  if (/folga|dias seguidos|folgou|folgar|combinação|não existe mais|festas|domingo de folga/.test(m)) return 'pessoas';
  if (/Setor "|ninguém|insuficiente|sem funcionários|pessoas de folga no mesmo/.test(m)) return 'setores';
  return 'conflito';
}

// Pendências de pagamento de serviços: saldo de cada prestador no mês (já inclui o que ficou de meses anteriores e desconta o que foi pago)
function servPendentes(mes) {
  const lista = S.prestadores.map(p => ({ p, c: servCalc(mes, p.id) })).filter(o => o.c.saldo > 0.005);
  return { valor: r2(lista.reduce((a, o) => a + o.c.saldo, 0)), qtd: lista.length, lista };
}
function contagemSemana(semana, setorF) {
  const esc = S.escalas[semana], dd = C.diasDaSemana(semana);
  const out = dd.map(d => ({ d, trab: [], folg: [] }));
  if (esc) Object.keys(esc.atribuicoes || {}).forEach(id => {
    const f = funcPorId(id);
    if (!f || !f.ativo || (setorF && f.setorId !== setorF)) return;
    dd.forEach((d, i) => { const st = C.statusDia(esc.atribuicoes[id], d, f, true); if (st === 'F') out[i].folg.push(f.nome); else if (st === 'T' || st === 'X') out[i].trab.push(f.nome); });
  });
  out.forEach(o => { o.trab.sort(); o.folg.sort(); });
  return out;
}
/* Início do controle financeiro: novembro/2026. Registros anteriores são histórico e não entram como pendência. */
const INICIO_CONTROLE = '2026-11';
/* Próximo pagamento de serviços: a data mais antiga, a partir de INICIO_CONTROLE, com lote ainda com saldo a pagar.
   Meses anteriores a INICIO_CONTROLE são histórico: não entram como pendência.
   Ao marcar o lote como pago, ele sai da lista e o próximo aparece sozinho. Nunca mostra R$ 0,00. */
function servProximo() {
  const hoje = C.hojeISO(), datas = {};
  let semData = 0;
  servMeses().forEach(mes => S.prestadores.forEach(p => {
    servCalc(mes, p.id).pagos.forEach(q => {
      const falta = q.pago ? r2(q.valor - (q.valorPago != null ? q.valorPago : q.valor)) : q.valor;
      if (!(falta > 0.005)) return;
      if (mes < INICIO_CONTROLE) return; // histórico: não é pendência atual
      if (!/^\d{4}-\d{2}-\d{2}$/.test(q.data || '')) { semData++; return; }
      const d = datas[q.data] || (datas[q.data] = { valor: 0, pids: new Set() });
      d.valor = r2(d.valor + falta); d.pids.add(p.id);
    });
  }));
  if (semData) return { estado: 'nc', motivo: semData + ' lote(s) sem data de pagamento. Defina a data na página Serviços prestados.' };
  const ds = Object.keys(datas).sort();
  if (!ds.length) return { estado: 'nada' };
  const d = ds[0];
  return { estado: 'ok', data: d, valor: datas[d].valor, qtd: datas[d].pids.size, atraso: d < hoje };
}
/* O período tem pelo menos um dia coberto por escala? Antes disso, o VT não é controlado pelo sistema. */
function vtCobre(ym, a, b) {
  for (let i = a; i <= b; i++) if (S.escalas[C.inicioSemana(ym + '-' + String(i).padStart(2, '0'))]) return true;
  return false;
}
/* Nomes de funcionários ativos que trabalharam no período (pela escala) sem valor de passagem cadastrado.
   Quem está marcado como "Não recebe vale-transporte" fica de fora: não tem direito, não é pendência. */
function vtSemPassagem(ym, a, b) {
  const doc = vtDoc(ym), quem = new Map();
  for (let i = a; i <= b; i++) {
    const dd = ym + '-' + String(i).padStart(2, '0');
    const e = S.escalas[C.inicioSemana(dd)];
    if (!e || !e.atribuicoes) continue;
    S.funcionarios.forEach(f => {
      if (!f.ativo || quem.has(f.id) || (f.vt && f.vt.nao)) return;
      if (!['T', 'X'].includes(C.statusDia(e.atribuicoes[f.id] || null, dd, f, true))) return;
      const aj = doc.ajustes && doc.ajustes[f.id] && doc.ajustes[f.id][dd];
      if (aj && aj.t === 'trab' && aj.v != null && aj.v !== '') return;
      const v = C.vtValorEm(f, dd);
      if (!v || (!v.fixo && !(v.total > 0))) quem.set(f.id, f.nome);
    });
  }
  return [...quem.values()];
}
/* Próximo pagamento de VT: quinzena 1 (dias 1 a 15) paga dia 20 do mês; quinzena 2 (dias 16 ao fim) paga dia 5 do mês seguinte.
   Considera só a partir de INICIO_CONTROLE. Saldo = VT da escala menos o já pago (nunca negativo).
   Faltando escala ou valor de passagem em período já iniciado, mostra Não calculado (com os nomes), em vez de um valor incompleto. */
function vtProximo() {
  const hoje = C.hojeISO(), mesHoje = hoje.slice(0, 7);
  const chaves = Object.keys(S.escalas).map(s => s.slice(0, 7)).concat([mesHoje]).filter(k => k >= INICIO_CONTROLE).sort();
  const lo = INICIO_CONTROLE, hi = chaves[chaves.length - 1];
  const cand = [];
  for (let ym = lo; ym <= hi; ym = servMesVizinho(ym, 1)) {
    const m = vtModelo(ym), prox = servMesVizinho(ym, 1);
    [['q1', ym + '-01', ym + '-20', 1, 15], ['q2', ym + '-16', prox + '-05', 16, m.dim]].forEach(([q, ini, pag, a, b]) => {
      if (!vtCobre(ym, a, b)) return; // período anterior ao uso das escalas: não faz parte do controle
      const pend = m.linhas.map(l => ({ l, v: r2(Math.max(0, l[q].valor - l.pago[q])) })).filter(o => o.v > 0.004);
      const valor = r2(pend.reduce((s, o) => s + o.v, 0));
      const pgs = vtDoc(ym).pagamentos || {};
      const registrado = m.linhas.some(l => pgs[l.id] && pgs[l.id][q]); // já houve registro de pagamento nesta quinzena
      const faltaEscala = m.linhas.some(l => l.cel.some((c, i) => i + 1 >= a && i + 1 <= b && c.tipo === 'semEscala'));
      const semPass = vtSemPassagem(ym, a, b);
      const periodo = vtTituloPer(m, q);
      if ((faltaEscala || semPass.length) && ini <= hoje && (pend.length || !registrado)) {
        const motivo = [faltaEscala ? 'Faltam escalas para alguns dias deste período.' : '', semPass.length ? 'Sem valor de passagem cadastrado: ' + semPass.join(', ') + '. Corrija em Funcionários.' : ''].filter(Boolean).join(' ');
        cand.push({ pag, periodo, nc: motivo });
      } else if (pend.length) cand.push({ pag, periodo, valor, qtd: pend.length });
    });
  }
  if (!cand.length) return { estado: 'nada' };
  cand.sort((x, y) => x.pag < y.pag ? -1 : x.pag > y.pag ? 1 : 0);
  const c = cand[0];
  if (c.nc) return { estado: 'nc', periodo: c.periodo, dataPag: c.pag, motivo: c.nc };
  return { estado: 'ok', periodo: c.periodo, dataPag: c.pag, valor: c.valor, qtd: c.qtd, atraso: c.pag < hoje };
}

function vEscala() {

  const hoje = C.hojeISO();
  const dias = C.diasDaSemana(sem);
  const aprov = e && e.status === 'aprovada';
  let h = `<div class="row mb"><div><h1>Escala semanal</h1><p class="sub" style="margin:0">Domingo a sábado · ${semanaLabel(sem)}</p></div></div>
  <div class="card mb"><div class="row">

  </div>
  <div class="row mt edit-only">
    <button class="btn pri big" data-act="gerar">${ic('bolt')} ${e ? 'REGENERAR ESCALA AUTOMÁTICA' : 'GERAR ESCALA AUTOMÁTICA'}</button>
    ${e && !aprov ? `<button class="btn ok" data-act="aprovar">${ic('check')} Aprovar escala</button>` : ''}
    ${aprov && !S.somenteLeitura ? `<button class="btn pri" data-act="editarAprovada">${ic('edit')} Editar escala</button>` : ''}
    ${aprov ? `<button class="btn" data-act="reabrir">${ic('edit')} Reabrir para edição</button>` : ''}
    ${e ? `<a class="btn" href="#exportar" data-act="irExport">${ic('exportar')} Exportar</a>` : ''}
    ${e ? `<button class="btn danger sm" data-act="excluirEscala">${ic('trash')} Excluir escala</button>` : ''}
  </div></div>`;
  if (!e) {
    const ativos = S.funcionarios.filter(f => C.elegivel(f, sem));
    h += `<div class="card empty"><b>Nenhuma escala para ${semanaLabel(sem)}</b>${ativos.length ? `Há ${ativos.length} funcionário(s) ativo(s) em ${new Set(ativos.map(f => f.setorId)).size} setor(es). Clique em <b>GERAR ESCALA AUTOMÁTICA</b>.` : 'Cadastre setores e funcionários primeiro.'}</div>`;
    return h + legenda();
  }
  const v = C.validarEscala(e, S.funcionarios, S.setores, historicoArr());
  if (v.erros.length) h += `<div class="card mb" style="border-color:#fecaca"><h2 style="color:var(--err)">Esta escala tem problemas</h2>${listaProblemas(v.erros, [])}
    </div>`;
  const fora = v.avisos.filter(a => a.fora);
  if ((v.erros.some(x => /não tem combinação/.test(x.msg)) || fora.length) && !aprov) h += `<div class="card mb edit-only" style="border-color:#fde68a">${fora.length ? listaProblemas([], fora) : ''}<button class="btn pri" data-act="completar">Atualizar escala: incluir quem falta e retirar quem está de férias/inativo (sem mexer nos demais)</button></div>`;
  const avisos = v.avisos.filter(a => !a.fora);
  if (avisos.length) h += `<details class="card mb"><summary style="cursor:pointer;font-weight:700">${avisos.length} aviso(s) — não impedem a aprovação</summary><div class="mt">${listaProblemas([], avisos)}</div></details>`;
  h += legenda();
  // tabela
  const ids = Object.keys(e.atribuicoes || {});
  const linhas = ids.map(id => ({ id, a: e.atribuicoes[id], f: funcPorId(id) }));
  const grupos = {};
  linhas.forEach(l => { const sid = l.f ? l.f.setorId : l.a.setorId; (grupos[sid] = grupos[sid] || []).push(l); });
  const ordem = Object.keys(grupos).sort(cmpSetor).filter(sid => !UI.filtroSetor || sid === UI.filtroSetor);
  const editavel = !aprov && !S.somenteLeitura && !semanaEspecial(e);
  if (semanaEspecial(e)) h += `<div class="alert i"><span class="ic">★</span><div><b>${e.modo === 'festas' ? 'Festas' : e.modo === 'devolucao' ? 'Devolução de folgas' : 'Novembro (PDF)'}</b> — ${textoEspecial(e)} Esta semana não é alterada pelo botão de troca; ela foi montada à parte e já conferida.</div></div>`;
  h += `<div class="tw mt"><table class="esc"><thead><tr><th class="nm">Funcionário</th>${dias.map((d, i) => `<th class="d ${d === hoje ? 'today' : ''}" ${feriadoEm(d) ? `style="background:#DDEBF7" title="Feriado: ${esc(feriadoEm(d).nome)}"` : ''}>${C.DIAS_CURTO[i]}<br><span style="font-weight:500">${C.dataBR(d).slice(0, 5)}</span>${feriadoEm(d) ? '<br><span style="color:var(--off);font-size:10px">feriado</span>' : ''}</th>`).join('')}<th>Combinação</th>${editavel ? '<th class="hide-m">Ações</th>' : ''}</tr></thead><tbody>`;
  const totT = [0, 0, 0, 0, 0, 0, 0], totF = [0, 0, 0, 0, 0, 0, 0];
  ordem.forEach(sid => {
    const ls = grupos[sid].sort((x, y) => (x.f || x.a).nome.localeCompare((y.f || y.a).nome));
    const cad = C.cadastradosSetor(S.funcionarios, sid, sem), regra = C.regraCobertura(cad.length);
    let cob = '';
    if (regra) { const atr = {}; cad.forEach(f => { if (e.atribuicoes[f.id]) atr[f.id] = e.atribuicoes[f.id].g; }); const t = C.trabalhandoTerQua(cad, atr, sem); cob = ` · <b>Hotel fechado</b> — Ter: ${t.ter.map(f => esc(f.nome)).join(', ') || 'ninguém'} · Qua: ${t.qua.map(f => esc(f.nome)).join(', ') || 'ninguém'}${regra === 'reduzida' ? ' <span>(no máximo 1)</span>' : ''}`; }
    h += `<tr class="sec"><td colspan="${editavel ? 10 : 9}" style="background:${corSetor(sid)};color:#1f2937">${esc(nomeSetor(sid) === 'Sem setor' ? (ls[0].a.setorNome || 'Sem setor') : nomeSetor(sid))}<span>${ls.length} funcionário(s)</span><span style="color:#1f2937">${cob}</span></td></tr>`;
    ls.forEach(({ id, a, f }) => {
      const nome = (f || a).nome;
      h += `<tr><td class="nm"><div class="fn">${a.bloq ? '<span class="lockon" title="Combinação bloqueada">🔒 </span>' : ''}${esc(nome)}</div><div class="fu">${esc((f || a).funcao || '')}${f && !f.ativo ? ' · <span style="color:var(--err)">inativo</span>' : ''}</div></td>`;
      dias.forEach((d, i) => { const st = C.statusDia(a, d, f, true); if (st === 'F') totF[i]++; else if (st === 'T' || st === 'X') totT[i]++; h += `<td class="d">${cellHTML(st)}</td>`; });
      h += `<td class="mini">${editavel ? `<select data-act="mudarGrupo" data-id="${id}" ${a.bloq ? 'disabled title="Desbloqueie para alterar"' : ''}>${C.PERMITIDAS.map(g => `<option value="${g}" ${a.g === g ? 'selected' : ''}>${g} · ${C.GRUPOS[g].nome}</option>`).join('')}</select>` : pillA(a) + ' <span class="small muted hide-m">' + esc(C.rotulo(a)) + '</span>'}</td>`;
      if (editavel) h += `<td class="hide-m" style="white-space:nowrap"><button class="btn icon sm" data-act="bloq" data-id="${id}" title="${a.bloq ? 'Desbloquear' : 'Bloquear esta combinação (a regeneração não altera)'}">${ic(a.bloq ? 'lock' : 'unlock')}</button> <button class="btn icon sm" data-act="trocar" data-id="${id}" title="Trocar folgas com outro funcionário">${ic('swap')}</button></td>`;
      h += '</tr>';
    });
  });
  h += `<tr class="tot"><td class="nm" style="background:#f9fafb">Trabalhando</td>${totT.map(n => `<td class="d">${n}</td>`).join('')}<td colspan="2"></td></tr>`;
  h += `<tr class="tot"><td class="nm" style="background:#f9fafb">De folga</td>${totF.map(n => `<td class="d">${n}</td>`).join('')}<td colspan="2"></td></tr>`;
  h += '</tbody></table></div>';
  if (editavel) h += '<p class="small muted mt">No celular, toque e segure o nome para bloquear ou trocar folgas. Toda alteração é conferida contra as regras antes de ser salva.</p>';
  if (aprov) h += '<p class="small muted mt">Escala aprovada: para ajustes pontuais use <b>Editar escala</b>. Para refazer a escala inteira, use <b>Reabrir para edição</b>.</p>';
  h += `<div class="small muted mt">Gerada em ${dtHora(e.geradaEm)}${e.aprovadaEm && aprov ? ' · aprovada em ' + dtHora(e.aprovadaEm) : ''}</div>`;
  if ((e.alteracoes || []).length) h += `<details class="card mt"><summary style="cursor:pointer;font-weight:700">Alterações desta escala (${e.alteracoes.length})</summary><ul class="list-sm mt">${e.alteracoes.slice().reverse().map(x => `<li><span>${esc(x.texto)}</span><span class="small muted">${dtHora(x.ts)}</span></li>`).join('')}</ul></details>`;
  return h;
}

/* ---------------- ESCALA MENSAL ---------------- */
function semanasDoMes(ym) {
  const ini = ym + '-01'; const [y, m] = ym.split('-').map(Number);
  const fim = C.addDias(C.fmt(Date.UTC(y, m, 1)), -1);
  const fimFolha = C.addDias(ini, Math.max(31, +fim.slice(8)) - 1); // a folha mostra 31 colunas, como a planilha do hotel
  const sems = []; let s = C.inicioSemana(ini);
  while (s <= fimFolha) { sems.push(s); s = C.addDias(s, 7); }
  return { ini, fim, sems };
}
function vMensal() {
  const { sems } = semanasDoMes(UI.mes);

  const faltam = sems.filter(s => !S.escalas[s]);
  let h = `<div class="row mb"><div><h1>Escala mensal</h1><p class="sub" style="margin:0">Folha de folga do mês, no mesmo formato da planilha do hotel</p><p class="small muted" style="margin:2px 0 0">Versão ${VERSAO_APP}</p></div></div>

  ${faltam.length ? `<div class="row mt edit-only"><button class="btn pri" data-act="gerarMes">${ic('bolt')} Gerar as ${faltam.length} semana(s) que faltam</button><span class="small muted">Cada semana (domingo a sábado) é gerada em sequência, considerando o rodízio da anterior.</span></div>` : ''}
  ${!S.somenteLeitura && semanasDoMes(UI.mes).sems.some(s => S.escalas[s] && S.escalas[s].status !== 'aprovada') ? `<div class="row mt"><button class="btn ok" data-act="aprovarMes" data-mes="${UI.mes}">${ic('check')} Aprovar escala do mês (${semanasDoMes(UI.mes).sems.filter(s => S.escalas[s] && S.escalas[s].status !== 'aprovada').length} semana(s) em rascunho)</button></div>` : ''}

  return h + folhaHTML(m);
}

/* =====================================================================
   FOLHA DE FOLGA (formato da planilha do hotel)

function periodoFolha(tipo) {

function folhaModelo(o) {

    const cel = cols.map(d => { const sd = C.inicioSemana(d), e = S.escalas[sd]; const at = e && e.atribuicoes ? e.atribuicoes[id] : null; const st = C.statusDia(at, d, f, !!e); if (st === 'F' && C.addDias(sd, 4) === d && C.statusDia(at, sd, f, true) === 'F') return 'R'; return st === 'F' ? 'F' : st === 'V' ? 'V' : st === '-' ? '-' : ''; });

/** percorre as células de uma linha agrupando dias seguidos de férias: [{tipo, ini, n}] */
function segmentos(cel) {

  </tbody></table></div>` : '<div class="card empty"><b>Nenhum setor cadastrado</b>Crie os setores do hotel.</div>'}
  ${faltam.length ? `<div class="card mt edit-only"><h3>Adicionar setores comuns de hotel com um clique</h3><div class="row">${faltam.map(n => `<button class="btn sm" data-act="addSug" data-n="${esc(n)}">${ic('plus')} ${esc(n)}</button>`).join('')}</div></div>` : ''}`;
}
async function moverSetor(id, d) {
  const l = setoresOrd(); const i = l.findIndex(s => s.id === id), j = i + d;
  if (i < 0 || j < 0 || j >= l.length) return;
  [l[i], l[j]] = [l[j], l[i]];
  try {
    for (let k = 0; k < l.length; k++) if (l[k].ordem !== k || !l[k].cor) await Store.set('setores', l[k].id, Object.assign({}, l[k], { ordem: k, cor: l[k].cor || corSetor(l[k].id) }));
    log('setor', 'Ordem dos setores: ' + l.map(s => s.nome).join(', '));
  } catch (e) { }
}
function abrirFormSetor(s) {
  const cor = s ? corSetor(s.id) : PALETA[S.setores.length % PALETA.length];
  const w = abrirModal(`<div class="mh">${s ? 'Editar setor' : 'Novo setor'}</div><form class="mbd"><div class="fld"><label class="f">Nome do setor</label><input type="text" id="sNome" value="${esc(s ? s.nome : '')}" maxlength="60" style="width:100%"></div>
  <div class="fld"><label class="f">Cor na folha de folga</label><div class="row"><input type="color" id="sCor" class="cor-in" value="${cor}">${PALETA.map(c => `<button type="button" class="btn icon sm" data-cor="${c}" style="background:${c};width:28px;height:28px" title="${c}"></button>`).join('')}</div></div></form>
  <div class="mf"><button class="btn" data-x="c">Cancelar</button><button class="btn pri" data-x="s">Salvar</button></div>`);
  w.querySelectorAll('[data-cor]').forEach(b => b.onclick = () => { w.querySelector('#sCor').value = b.dataset.cor; });
  const salvar = async () => {
    const n = w.querySelector('#sNome').value.trim(); const c = w.querySelector('#sCor').value.toUpperCase();
    if (!n) return toast('Informe o nome.');
    if (S.setores.some(x => x.nome.toLowerCase() === n.toLowerCase() && (!s || x.id !== s.id))) return toast('Já existe um setor com esse nome.');
    const ordem = s ? (s.ordem ?? ordemSetor(s.id)) : S.setores.reduce((mx, x) => Math.max(mx, x.ordem ?? -1), -1) + 1;
    try { await Store.set('setores', s ? s.id : uid('s'), { nome: n, cor: c, ordem, criadoEm: s ? s.criadoEm || agoraISO() : agoraISO() }); log('setor', s ? 'Setor editado: ' + s.nome + (s.nome !== n ? ' → ' + n : '') : 'Setor criado: ' + n); fecharModal(w); } catch (e) { }
  };
  w.querySelector('[data-x=c]').onclick = () => fecharModal(w); w.querySelector('[data-x=s]').onclick = salvar; w.querySelector('form').onsubmit = e => { e.preventDefault(); salvar(); };
}

  const escs = historicoArr().sort((a, b) => b.semana.localeCompare(a.semana));
  const nomeDe = (id, a) => (funcPorId(id) || a || {}).nome || 'Removido';
  if (UI.histTab === 'escalas') {
    if (!escs.length) return h + '<div class="card empty"><b>Nenhuma escala ainda</b></div>';
    h += `<div class="tw"><table class="list"><thead><tr><th>Semana</th><th>Situação</th><th>Funcionários</th><th class="hide-m">Domingo</th><th class="hide-m">Comb. 1/2/3/4</th><th class="hide-m">Alterações</th><th></th></tr></thead><tbody>`;

    return h + '</tbody></table></div>';
  }
  if (UI.histTab === 'domingos') {
    const linhas = [];
    const ids = new Set(S.funcionarios.filter(f => f.ativo).map(f => f.id)); escs.forEach(e => Object.keys(e.atribuicoes || {}).forEach(id => ids.add(id)));
    ids.forEach(id => { let a0 = null; const doms = []; escs.forEach(e => { const a = (e.atribuicoes || {})[id]; if (a) { a0 = a0 || a; if (a.g === 4) doms.push(C.addDias(e.semana, 6)); } }); const f = funcPorId(id); linhas.push({ id, nome: nomeDe(id, a0), setor: f ? nomeSetor(f.setorId) : (a0 ? a0.setorNome : ''), doms, ativo: f && f.ativo }); });
    linhas.sort((a, b) => a.setor.localeCompare(b.setor) || a.nome.localeCompare(b.nome));
    h += `<div class="tw"><table class="list"><thead><tr><th>Funcionário</th><th>Setor</th><th>Total</th><th>Último domingo de folga</th><th class="hide-m">Domingos de folga</th></tr></thead><tbody>${linhas.map(l => `<tr><td><b>${esc(l.nome)}</b>${!l.ativo ? ' <span class="badge b-off">inativo</span>' : ''}</td><td>${esc(l.setor)}</td><td>${l.doms.length}</td><td>${l.doms[0] ? C.dataBR(l.doms[0]) : '<span class="muted">nunca</span>'}</td><td class="hide-m">${l.doms.slice(0, 8).map(d => '<span class="chip b">' + C.dataBR(d).slice(0, 5) + '</span>').join('')}${l.doms.length > 8 ? '…' : ''}</td></tr>`).join('')}</tbody></table></div>`;

  if (UI.histTab === 'combinacoes') {

    h += legenda() + `<div class="tw mt"><table class="list esc"><thead><tr><th class="nm">Funcionário</th><th class="hide-m">Setor</th>${ult.map(e => `<th class="d">${C.dataBR(e.semana).slice(0, 5)}</th>`).join('')}</tr></thead><tbody>${ls.map(l => `<tr><td class="nm"><b>${esc(l.nome)}</b></td><td class="hide-m">${esc(l.setor)}</td>${ult.map(e => { const a = (e.atribuicoes || {})[l.id]; return `<td class="d">${a ? pillA(a) : '<span class="muted">·</span>'}</td>`; }).join('')}</tr>`).join('')}</tbody></table></div><p class="small muted mt">Últimas ${ult.length} semanas. O número é a combinação de folgas recebida.</p>`;

    return h;
  }
  // alterações
  if (!S.auditoria.length) return h + '<div class="card empty"><b>Nenhuma alteração registrada</b></div>';
  h += `<div class="tw"><table class="list"><thead><tr><th>Data</th><th>Tipo</th><th>Descrição</th></tr></thead><tbody>${S.auditoria.slice().sort((a, b) => b.ts.localeCompare(a.ts)).slice(0, 400).map(x => `<tr><td style="white-space:nowrap">${dtHora(x.ts)}</td><td><span class="badge ${x.tipo === 'escala' ? 'b-blue' : 'b-off'}">${esc(x.tipo)}</span></td><td>${esc(x.texto)}${x.semana ? ` <a href="#mensal" data-act="irSemana" data-sem="${x.semana}" class="small">(${semanaLabel(x.semana)})</a>` : ''}</td></tr>`).join('')}</tbody></table></div>`;
  return h;
}

/* =====================================================================

   ===================================================================== */
async function acaoGerar(sem, opts) {
  opts = opts || {};
  const atual = S.escalas[sem];
  if (atual && !opts.semConfirmar) {
    const nb = Object.values(atual.atribuicoes || {}).filter(a => a.bloq).length;
    const ok = await confirmar('Regenerar escala?', `${semanaEspecial(atual) ? '<div class="alert w"><span class="ic">!</span><div><b>Atenção:</b> esta é uma semana especial (' + (atual.modo === 'festas' ? 'festas' : atual.modo === 'devolucao' ? 'devolução de folgas' : 'copiada do PDF de novembro') + '). Ao regenerar, ela vira uma semana normal e perde esse ajuste.</div></div>' : ''}<p>A escala de <b>${semanaLabel(sem)}</b> ${atual.status === 'aprovada' ? '<b>já está aprovada</b> e' : ''} será refeita automaticamente${nb ? `, mantendo as <b>${nb} combinação(ões) bloqueada(s)</b>` : ''}. Ela voltará para rascunho.</p>`, 'Regenerar');
    if (!ok) return false;
  }
  const bloqueios = {};
  if (atual) Object.entries(atual.atribuicoes || {}).forEach(([id, a]) => { if (a.bloq) bloqueios[id] = a.g; });
  const historico = historicoArr().filter(e => e.semana !== sem);
  const r = C.gerarEscala({ semana: sem, funcionarios: S.funcionarios, setores: S.setores, historico, bloqueios });
  if (!r.ok) {

const MOTIVOS_AJUSTE = { falta: 'Falta', troca: 'Troca de folga', outro: 'Outro' };
async function abrirEdicaoAprovada(sem) {

}

const libs = {};
function carregarScript(src) {
  if (libs[src]) return libs[src];
  const emb = document.getElementById('lib:' + src);
  if (emb) { // versão independente: bibliotecas embutidas no próprio arquivo
    libs[src] = new Promise((res, rej) => { try { const s = document.createElement('script'); s.src = URL.createObjectURL(new Blob([emb.textContent], { type: 'text/javascript' })); s.onload = res; s.onerror = () => rej(new Error('Falha ao carregar ' + src)); document.head.appendChild(s); } catch (e) { rej(e); } });
    return libs[src];
  }
  libs[src] = new Promise((res, rej) => { const s = document.createElement('script'); s.src = src; s.onload = res; s.onerror = () => { delete libs[src]; rej(new Error('Falha ao carregar ' + src)); }; document.head.appendChild(s); });
  return libs[src];
}
async function salvarArquivo(nome, data) {
  if (DL) {
    try { await DL.save({ filename: nome, data }); toast('Arquivo salvo.'); return; }
    catch (e) { if (e && e.code === 'declined') { toast('Download cancelado.'); return; } if (e && e.code === 'rate_limited') { toast('Aguarde um instante e tente de novo.'); return; } }
  }
  try {
    const blob = data instanceof Blob ? data : new Blob([data]);
    // celular: entrega o arquivo pelo compartilhamento (anexo), sem abrir endereço temporário
    try {
      const arq = new File([blob], nome, { type: blob.type || 'application/pdf' });
      if (navigator.canShare && navigator.canShare({ files: [arq] })) { await navigator.share({ files: [arq], title: nome }); return; }
    } catch (e) { if (e && e.name === 'AbortError') return; }
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = nome; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 2000);
  } catch (e) { modalMsg('Download indisponível', '<p>Este ambiente não permite baixar arquivos.</p>'); }
}

async function restaurar(file) {
  let d;
  try { d = JSON.parse(await file.text()); } catch (e) { return modalMsg('Arquivo inválido', '<p>Não foi possível ler o arquivo de backup.</p>'); }
  if (!d || d.sistema !== 'escalas-hotel' || !Array.isArray(d.setores) || !Array.isArray(d.funcionarios)) return modalMsg('Arquivo inválido', '<p>Este arquivo não é um backup deste sistema.</p>');
  const ok = await confirmar('Restaurar backup?', `<p>Backup de <b>${dtHora(d.exportadoEm)}</b>: ${d.setores.length} setor(es), ${d.funcionarios.length} funcionário(s), ${Object.keys(d.escalas || {}).length} escala(s).</p><div class="alert w"><span class="ic">!</span><div>Todos os dados atuais serão <b>substituídos</b>. Recomendo baixar um backup dos dados atuais antes.</div></div>`, 'Restaurar', true);
  if (!ok) return;
  try {
    const ids = { setores: new Set(d.setores.map(x => x.id)), funcionarios: new Set(d.funcionarios.map(x => x.id)), escalas: new Set(Object.keys(d.escalas || {})) };
    for (const s of S.setores.slice()) if (!ids.setores.has(s.id)) await Store.del('setores', s.id);
    for (const f of S.funcionarios.slice()) if (!ids.funcionarios.has(f.id)) await Store.del('funcionarios', f.id);
    for (const k of Object.keys(S.escalas).concat(Object.keys(S.escalasAntigas))) if (!ids.escalas.has(k)) await Store.del('escalas', k);
    for (const s of d.setores) await Store.set('setores', s.id, s);
    for (const f of d.funcionarios) await Store.set('funcionarios', f.id, f);
    for (const k of Object.keys(d.escalas || {})) await Store.set('escalas', k, d.escalas[k]);
    if (d.vt) { for (const k of Object.keys(S.vt)) if (!d.vt[k]) await Store.del('vt', k); for (const k of Object.keys(d.vt)) await Store.set('vt', k, d.vt[k]); }
    if (d.config) await Store.set('config', 'geral', d.config);
    const existentes = new Set(S.auditoria.map(a => a.id));
    if (S.modo === 'db') { for (const a of (d.auditoria || []).slice(0, 500)) if (!existentes.has(a.id)) await Store.set('auditoria', a.id, a); }
    else { S.auditoria = (d.auditoria || []).concat(S.auditoria.filter(a => !(d.auditoria || []).some(b => b.id === a.id))); Store.salvarLocal(); }
    log('sistema', 'Backup restaurado (arquivo de ' + dtHora(d.exportadoEm) + ')');
    toast('Backup restaurado.');
  } catch (e) { }
}

function vtOrdenados() { return S.funcionarios.slice().sort((a, b) => cmpSetor(a.setorId, b.setorId) || (a.criadoEm || '').localeCompare(b.criadoEm || '') || a.nome.localeCompare(b.nome)); }

function vtFaixa(per, dim) { return per === 'q1' ? [1, 15] : per === 'q2' ? [16, dim] : [1, dim]; }
function vtTituloPer(m, per) { const [a, b] = vtFaixa(per, m.dim); return String(a).padStart(2, '0') + ' A ' + String(b).padStart(2, '0') + '/' + m.mes.slice(5, 7) + '/' + m.mes.slice(0, 4); }
function vtValorPer(m, l, per) { const v = C.vtValorEm(funcPorId(l.id), m.dias[vtFaixa(per, m.dim)[1] - 1]); return v ? v.total : l.valorDia; }
function vtValorTxt(m, l, per) { const v = C.vtValorEm(funcPorId(l.id), m.dias[vtFaixa(per, m.dim)[1] - 1]); if (v && v.fixo) return 'FIXO ' + (per === 'mes' ? brl(v.q1) + ' + ' + brl(v.q2) : brl(v[per])); const t = v ? v.total : l.valorDia; return t ? 'R$ ' + brl(t) : ''; }
/* Chave Pix de quem recebe VT: o cadastro do funcionário; se não tiver, usa o da Serviços prestados com o mesmo nome */
function vtPix(fid) {
  const f = funcPorId(fid) || {}, norm = t => (t || '').trim().toLowerCase();
  if (f.pix) return { pix: f.pix, titular: f.titular || '' };
  const p = S.prestadores.find(x => norm(x.nome) === norm(f.nome) && x.pix);
  return p ? { pix: p.pix, titular: p.titular || '' } : { pix: '', titular: '' };
}
function vtTot(l, per) { return per === 'mes' ? l.mes : l[per]; }
function vtPago(l, per) { return per === 'mes' ? l.pago.q1 + l.pago.q2 : l.pago[per]; }
const vtCelTxt = c => c.fixoQ ? brl(c.valor) + (c.tipo === 'trab' ? '' : ' ' + c.cod) : c.tipo === 'trab' ? (c.valor > 0 ? brl(c.valor) : c.fixoDia ? '•' : '—') : c.cod;
const vtCelTitulo = (l, c) => {
  const base = { trab: 'trabalho', folga: 'folga', ferias: 'férias', semEscala: 'semana sem escala gerada', fora: 'fora do período de trabalho' }[c.base];
  let t = l.nome + ' — ' + C.dataBR(c.d) + ': ' + (c.ajuste ? C.VT_TIPOS[c.ajuste.t].nome + ' (ajuste manual; pela escala: ' + base + ')' : 'pela escala: ' + base);
  if (c.ajuste && c.ajuste.obs) t += ' — ' + c.ajuste.obs;
  if (c.fixoEditado) t += ' — VT fixo da quinzena alterado à mão: ' + rs(c.fixoQ || 0) + ' (normal ' + rs(c.fixoPadrao) + ')';
  return t;
};
/** diferenças entre o fechamento guardado e o cálculo atual */
function vtDifFechamento(m, q) {
  const fe = (vtDoc(m.mes).fechamentos || {})[q]; if (!fe) return null;
  const dif = [];
  const ids = new Set(Object.keys(fe.porFunc || {}).concat(m.linhas.map(l => l.id)));
  ids.forEach(id => {
    const l = m.linhas.find(x => x.id === id), ant = (fe.porFunc || {})[id], agora = l ? l[q].valor : 0, antes = ant ? ant.valor : 0;
    if (Math.abs(agora - antes) > 0.004) dif.push({ nome: l ? l.nome : (ant && ant.nome) || '?', antes, agora });
  });
  return { fe, dif };
}

function vVT() {

    <button class="btn icon" data-act="vtMesAnt" title="Mês anterior">${ic('chevL')}</button><input type="month" id="vtMes" value="${ym}"><button class="btn icon" data-act="vtMesProx" title="Próximo mês">${ic('chevR')}</button>
    <b style="margin-left:6px">${MESES[mm - 1]} DE ${y}</b>

  </div>
  <div class="tabs">${[['controle', 'Controle diário'], ['resumo', 'Resumo e fechamento'], ['cadastro', 'Valores por funcionário']].map(([k, t]) => `<button class="${UI.vtTab === k ? 'on' : ''}" data-act="vtTab" data-t="${k}">${t}</button>`).join('')}</div>`;

  });
  if (!m.linhas.length && UI.vtTab !== 'cadastro') return h + `<div class="card empty"><b>Ninguém com vale-transporte neste mês</b>Cadastre o valor da passagem de cada funcionário na aba <a href="#" data-act="vtTab" data-t="cadastro">Valores por funcionário</a>.</div>`;
  if (UI.vtTab === 'resumo') return h + vtResumoHTML(m);
  if (UI.vtTab === 'cadastro') return h + vtCadastroHTML(m);

}

  let h = `<div class="folha-wrap"><table class="folha vt"><thead>
  <tr><th colspan="${n + 1}" class="ft1" style="background:#C4D79B;color:#000"><span>VALE TRANSPORTE</span></th></tr>
  <tr><th colspan="${n + 1}" class="ft2" style="background:#C4D79B;color:#000"><span>${vtTituloPer(m, per)}</span></th></tr>
  <tr><th rowspan="3" class="fnm" style="background:#C4D79B">DATA</th>${L.map((l, i) => thN(l, i, esc(l.nome.toUpperCase()))).join('')}</tr>
