  return {html:`<div class="ph"><div><h1>🤖 Tutor IA</h1><p>Tire dúvidas, peça explicações, exemplos e dicas para estudar.</p></div>${TUT.msgs.length?'<button class="btn sm" data-a="tutLimpar">Nova conversa</button>':''}</div>
  ${st&&!st.ativa?'<div class="note">O tutor está desligado no momento.</div>':''}
  <label style="max-width:520px">Sobre o quê? <select id="tutAtiv"><option value="">Qualquer matéria (pergunta livre)</option>${ops.map(a=>`<option value="${a.id}" ${TUT.ativ===a.id?'selected':''}>${ic(a.disciplina)} ${esc(a.titulo)}</option>`).join('')}</select></label>
  <div class="card" id="tutChat" style="min-height:240px;max-height:60vh;overflow:auto;background:#f7f8fc">
   ${TUT.msgs.length?TUT.msgs.map(bolha).join(''):`<div class="empty" style="padding:14px"><div class="e">👋</div><h3>Oi! Eu sou o seu tutor.</h3><p>Pergunte, por exemplo:<br>“Me explica o que são números primos?”<br>“Me dá uma dica para a questão 3?”<br>“Faz um exemplo de verbo no futuro?”</p></div>`}</div>
  <div id="tutPrev"></div>
  ${st&&st.provedor==='gemini'?'<div class="note">🔒 <b>Atenção:</b> suas perguntas são enviadas ao serviço de IA do Google (Gemini), que pode usá-las para melhorar os produtos dele. <b>Nunca escreva seu nome, endereço, telefone ou outros dados pessoais.</b> E-mails, telefones e CPF são apagados automaticamente antes do envio.</div>':''}
  <div style="display:flex;gap:8px;align-items:flex-end">${st&&st.fotoTutor?'<label class="btn" style="margin:0;min-width:48px" title="Enviar foto da dúvida">📷<input type="file" accept="image/*" id="tutFoto" hidden></label>':''}
  <textarea id="tutTxt" rows="2" style="margin:0;flex:1;min-height:48px" placeholder="Escreva sua dúvida…"></textarea><button class="btn pri" data-a="tutEnviar" style="min-height:48px">Enviar</button></div>
  <p class="small muted" style="margin-top:8px">O tutor é uma inteligência artificial e pode errar: confira com seu professor. Não escreva dados pessoais (endereço, telefone). As conversas não ficam salvas.${st?` • Perguntas hoje: ${st.usados}/${st.limite}`:''}</p>`,
  depois(){const c=$('#tutChat');c.scrollTop=c.scrollHeight;
    $('#tutAtiv').onchange=e=>{TUT.ativ=e.target.value};
    if($('#tutFoto'))$('#tutFoto').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{TUT.img=await comprimir(f);$('#tutPrev').innerHTML=`<div class="ft" style="margin-bottom:8px"><img src="${TUT.img}"><button class="x" data-a="tutSemFoto">✕</button></div>`}catch(x){toast(x.message)}};
    $('#tutTxt').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();ACOES.tutEnviar({},$('[data-a="tutEnviar"]'))}});}};
};
ACOES.tutSemFoto=()=>{TUT.img=null;$('#tutPrev').innerHTML=''};
ACOES.tutLimpar=()=>{TUT.msgs=[];render()};
ACOES.tutEnviar=async(d,b)=>{
  const t=$('#tutTxt').value.trim();if(!t){toast('Escreva sua pergunta.');return}
  const hist=TUT.msgs.map(m=>({role:m.role,texto:m.texto}));
  const img=TUT.img;TUT.msgs.push({role:'user',texto:t,img});TUT.img=null;
  const c=$('#tutChat');c.innerHTML=TUT.msgs.map(m=>`<div style="text-align:${m.role==='user'?'right':'left'};margin:8px 0"><span style="display:inline-block;max-width:86%;padding:10px 13px;border-radius:16px;${m.role==='user'?'background:var(--pri);color:#fff':'background:#fff;border:1px solid var(--line)'}">${m.role==='user'?esc(m.texto):mdSimples(m.texto)}</span></div>`).join('')+'<div class="muted small" style="margin:8px 0">🤖 pensando…</div>';c.scrollTop=c.scrollHeight;
  $('#tutTxt').value='';$('#tutPrev').innerHTML='';
  await busy(b,async()=>{try{const r=await api('iaTutor',{pergunta:t,historico:hist,atividadeId:TUT.ativ||'',imagem:img||''});TUT.msgs.push({role:'assistant',texto:r.resposta})}
    catch(e){TUT.msgs.pop();toast(e.message);$('#tutTxt').value=t}});
  render();
};

};

/* ---- contagem regressiva (todas as telas) ---- */
function dur(ms){if(ms<0)ms=0;const s=Math.floor(ms/1000),d=Math.floor(s/86400),h=Math.floor(s%86400/3600),m=Math.floor(s%3600/60),x=s%60;const p=n=>String(n).padStart(2,'0');return (d?d+'d ':'')+p(h)+':'+p(m)+':'+p(x)}
function cd(ts,prefixo){return `<span class="cd" data-cd="${ts}">${prefixo||''}${dur(ts-Date.now())}</span>`}
let CD_REND=0;let PROVA=null;
setInterval(()=>{const els=document.querySelectorAll('[data-cd]');let fim=false;els.forEach(el=>{const ts=+el.dataset.cd;const r=ts-Date.now();el.textContent=dur(r);if(r<=0&&r>-1500)fim=true;el.classList.toggle('urg',r>0&&r<15*60e3)});
  if(fim&&Date.now()-CD_REND>3000&&!(PROVA&&PROVA.ativa)){CD_REND=Date.now();setTimeout(()=>render(),800)}},1000);
function hora(ts){return new Date(ts).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})}
function quando(ts){const d=new Date(ts),h=new Date();const am=new Date(Date.now()+864e5);const mesmo=(a,b)=>a.toDateString()===b.toDateString();return (mesmo(d,h)?'hoje':mesmo(d,am)?'amanhã':d.toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit'}))+' às '+hora(ts)}

const DISC_ORDEM=['Português','Matemática','História','Geografia','Educação Física','Física','Química','Biologia'];
function respondida(q,i){const r=PL.resp[i];if(q.tipo==='disc')return !!String(r||'').trim()||(PL.fotos[i]||[]).length>0;return r!==null&&r!==undefined}
function blocosDisc(qs){const B=[];qs.forEach((q,i)=>{const d=q.disciplina||'Geral';const u=B[B.length-1];if(u&&u.d===d)u.fim=i;else B.push({d,ini:i,fim:i})});return B}
function dataExt(ts){return new Date(ts).toLocaleDateString('pt-BR',{weekday:'long',day:'2-digit',month:'2-digit',year:'numeric'})}
function tempoTxt(min){if(!min)return 'até o horário de encerramento';const h=Math.floor(min/60),m=min%60;return (h?h+'h':'')+(m?(h?' ':'')+m+' min':'')}
async function turmaDoAluno(a){if(!alunoCache)await alunoDados();const T=(alunoCache&&alunoCache.turmas)||[];const t=T.find(x=>(a.turmas||[]).includes(x.id)&&x.status==='aprovado')||T[0];return t?{nome:t.nome,serie:t.serie||''}:{nome:'—',serie:''}}
function cabecalhoProva(a,t,extra){const tot=a.questoes.reduce((s,q)=>s+(Number(q.pontos)||0),0);const niv={F1I:'Anos iniciais (1º ao 3º ano)',F1:'Ensino Fundamental I',F2:'Ensino Fundamental II',EM:'Ensino Médio'}[(a.desafio||{}).nivel]||'';
  return `<div class="pv-cab"><div class="pv-topo"><div class="pv-logo">🎓</div><div><div class="pv-escola">${esc(S.info.nome||'Sala Digital')}</div><div class="pv-tit">PROVA DO DIA</div><div class="pv-sub">Avaliação diária multidisciplinar${niv?' · '+niv:''}</div></div></div>
  <div class="pv-campos"><div><span>Aluno(a)</span><b>${esc(S.u.nome)}</b></div><div><span>Turma</span><b>${esc(t.nome)}</b></div><div><span>Série</span><b>${esc(t.serie||'—')}</b></div>
  <div><span>Data da prova</span><b>${(a.desafio&&a.desafio.dia?a.desafio.dia.split('-').reverse().join('/'):fdh(a.abertura).slice(0,10))}</b></div><div><span>Prazo para finalizar</span><b>${a.encerramento?quando(a.encerramento):'—'}</b></div>
  <div><span>Tempo para responder</span><b>${tempoTxt((a.desafio||{}).duracaoMin)}</b></div><div><span>Questões</span><b>${a.questoes.length} · ${pts(tot)} pontos</b></div>${extra||''}</div></div>`}
VIEWS.a_atividades=async function(){
  const [h,H]=await Promise.all([api('desafioHoje'),api('desafioHistorico').catch(()=>({lista:[],sequencia:0,feitos:0,aproveitamento:null}))]);
  const outras=(alunoCache?alunoCache.atividades:(await alunoDados()).atividades).filter(a=>a.tipo!=='desafio');const outrasPend=outras.filter(a=>a.situacao==='pendente'||a.situacao==='atrasada'&&a.podeEnviar).length;
  let corpo='';
  if(!h.desafios.length){corpo=`<div class="pv-vazio"><div style="font-size:46px">📝</div><h2>Nenhuma prova aberta agora</h2>${h.temDesafio&&h.proximo?`<p>A próxima Prova do dia abre ${quando(h.proximo)}.</p><div class="pv-cd">Abre em ${cd(h.proximo)}</div>`:'<p class="muted">Quando o professor ativar a Prova do dia para a sua turma, ela aparece aqui.</p>'}</div>`}
  else corpo=h.desafios.map(x=>{const tur=x.turmas&&x.turmas[0]||{};
    let estado='',botao='';
    if(x.situacao==='agendada'){estado=`<div class="pv-est">🔒 A prova abre ${quando(x.abertura)}</div><div class="pv-cd">Abre em ${cd(x.abertura)}</div>`}
    else if(!x.enviadoEm&&x.podeEnviar){estado=x.rascunho?`<div class="pv-est">✍️ Prova em andamento · ${x.respondidas} de ${x.qtd} respondidas</div>`:`<div class="pv-est">🟢 Prova aberta</div>`;
      estado+=`<div class="pv-cd">⏳ ${x.rascunho&&x.duracaoMin?'Seu tempo termina em':'Encerra em'} ${cd(x.rascunho?x.fim:x.encerramento)}</div>`;
      botao=`<div class="pv-opcoes"><button class="btn pri pv-btn" data-go="a_prova" data-p="${P({id:x.id})}">${x.rascunho?'▶ CONTINUAR A PROVA':'▶ INICIAR PROVA'}<small>Responder pelo celular ou computador</small></button><button class="btn pv-btn pv-imprimir" data-a="provaImprimir" data-id="${x.id}">🖨️ IMPRIMIR PROVA<small>Baixar em PDF para responder no papel</small></button></div>`}
    else if(x.enviadoEm){estado=`<div class="pv-est">✅ Prova entregue ${quando(x.enviadoEm)}</div>${x.acertos!==undefined?`<div class="dz-placar"><span class="ok">✔ ${x.acertos} acertos</span><span class="bad">✘ ${x.erros} erros</span>${x.discPendentes?`<span>✍️ ${x.discPendentes} discursiva${x.discPendentes>1?'s':''} em correção</span>`:''}</div>`:''}${x.liberado&&x.nota!==undefined?`<div class="pv-est">Nota: <b>${nota(x.nota,x.notaMax)}</b></div>`:''}`;
      botao=`<button class="btn pv-btn" data-go="a_prova" data-p="${P({id:x.id})}">${x.liberado?'VER RESULTADO E GABARITO':'VER MINHA PROVA'}</button>`}
    else{estado=`<div class="pv-est">⏰ Prova encerrada sem entrega.</div>`;botao=x.liberado?`<button class="btn pv-btn" data-go="a_prova" data-p="${P({id:x.id})}">VER GABARITO</button>`:''}
    return `<div class="pv-folha pv-capa"><div class="pv-tit">PROVA DO DIA</div><div class="pv-sub">${x.reforco?'🎯 Reforço: '+esc((x.discs||[]).join(' e ')):esc(x.nivelNome||'')} · ${x.dia.split('-').reverse().join('/')}</div>
      <div class="pv-campos"><div><span>Aluno(a)</span><b>${esc(S.u.nome)}</b></div><div><span>Turma</span><b>${esc(tur.nome||'—')}</b></div><div><span>Série</span><b>${esc(tur.serie||'—')}</b></div><div><span>Questões</span><b>${x.qtd} · ${x.reforco&&x.discs&&x.discs.length?esc(x.discs.join(' e ')):(x.discs&&x.discs.length||8)+' disciplinas'}</b></div><div><span>Início</span><b>${quando(x.abertura)}</b></div><div><span>Encerramento</span><b>${quando(x.encerramento)}</b></div></div>
      ${estado}${botao}</div>`}).join('');
  const hist=H.lista.filter(x=>!h.desafios.some(d=>d.id===x.id));
  return `<div class="ph"><div><h1>📝 Prova do dia</h1><p>${h.desafios.some(x=>x.reforco)?'Sua prova de reforço de hoje, feita só para você.':'Uma prova por dia com 50 questões de todas as disciplinas.'}</p></div></div>${outras.filter(a=>/^Atividade de reforço/.test(a.titulo)&&(a.situacao==='pendente'||a.situacao==='atrasada')).map(a=>`<button class="rf-ativ" data-go="a_fazer" data-p="${P({id:a.id})}"><span style="font-size:28px">🎯</span><span><b>${esc(a.titulo)}</b><br><span class="small">${a.qtd} questões para treinar · a nota sai na hora</span></span><span class="rf-ir">FAZER ▶</span></button>`).join('')}${corpo}
  ${hist.length||H.feitos?`<h3 style="margin:22px 0 8px">📈 Meu histórico</h3><div class="pv-resumo"><span><b>${H.sequencia}🔥</b> dias seguidos</span><span><b>${H.feitos}</b> provas entregues</span><span><b>${H.aproveitamento===null?'—':H.aproveitamento.toLocaleString('pt-BR')+'%'}</b> de acertos</span></div>
   <div class="tbl"><table><tr><th>Data</th><th>Acertos</th><th>Erros</th><th>Nota</th><th></th></tr>${hist.map(x=>`<tr><td>${String(x.dia).split('-').reverse().join('/')}</td><td>${x.acertos??'—'}</td><td>${x.erros??'—'}</td><td>${x.nota!==undefined&&x.nota!==null?nota(x.nota,x.notaMax):x.enviadoEm?'Em correção':'Não entregue'}</td><td>${x.antigo?'':`<button class="btn sm" data-go="a_prova" data-p="${P({id:x.id})}">Ver</button>`}</td></tr>`).join('')}</table></div>`:''}
  <button class="pv-outras" data-go="a_lista">📂 Atividades do professor${outrasPend?` · <b>${outrasPend} pendente${outrasPend>1?'s':''}</b>`:''} →</button>`;
};

  const pend=d.atividades.filter(a=>a.situacao==='pendente'||a.situacao==='atrasada'&&a.podeEnviar).length;const x=h&&h.desafios[0];

    card=`<div class="pv-folha pv-capa"><div class="pv-tit">PROVA DO DIA</div><div class="pv-sub">${esc(x.nivelNome||'')} · ${x.qtd} questões</div>
    ${x.situacao==='agendada'?`<div class="pv-cd">Abre em ${cd(x.abertura)}</div>`:aberta?`<div class="pv-cd">⏳ Encerra em ${cd(x.rascunho?x.fim:x.encerramento)}</div>`:x.enviadoEm?`<div class="pv-est">✅ Entregue${x.acertos!==undefined?` · ✔ ${x.acertos} acertos · ✘ ${x.erros} erros`:''}</div>`:'<div class="pv-est">⏰ Encerrada</div>'}
    <button class="btn pri pv-btn" data-go="${aberta?'a_prova':'a_atividades'}" data-p="${P(aberta?{id:x.id}:{})}">${aberta?(x.rascunho?'CONTINUAR A PROVA ▶':'ABRIR A PROVA ▶'):'IR PARA A PROVA DO DIA'}</button>${aberta||x.enviadoEm?`<button class="btn pv-btn pv-imprimir" data-a="provaImprimir" data-id="${x.id}">🖨️ IMPRIMIR PROVA</button>`:''}</div>`}
  else if(h&&h.temDesafio&&h.proximo)card=`<div class="pv-folha pv-capa"><div class="pv-tit">PROVA DO DIA</div><div class="pv-sub">Próxima prova ${quando(h.proximo)}</div><div class="pv-cd">Abre em ${cd(h.proximo)}</div></div>`;
  return `<div class="ph"><div><h1>Olá, ${esc(S.u.nome.split(' ')[0])}! 👋</h1><p>${d.turmas.filter(t=>t.status==='aprovado').length?'Bons estudos!':'Entre em uma turma para começar.'}</p></div></div>${card}
  ${!d.turmas.some(t=>t.status==='aprovado')?`<div class="card"><h3>Entre na sua turma</h3><p class="muted">Peça o código ao professor.</p><button class="btn pri" data-go="a_turmas">Usar código da turma</button></div>`:''}
  <button class="pv-outras" data-go="a_lista">📂 Atividades do professor${pend?` · <b>${pend} pendente${pend>1?'s':''}</b>`:''} →</button>`};

const _aFazer=VIEWS.a_fazer;
VIEWS.a_fazer=async function(p){const r=await _aFazer(p);if(PL&&PL.a.tipo==='desafio'){S.view='a_prova';return VIEWS.a_prova(p)}
  const html=(typeof r==='string'?r:r.html).replace('<button class="back" data-go="a_atividades">← Atividades</button>','<button class="back" data-go="a_lista">← Atividades do professor</button>');return typeof r==='string'?html:Object.assign({},r,{html})};
VIEWS.a_prova=async function(p){
  const r=await api('abrirAtividade',{id:p.id});const a=r.atividade,e=r.entrega;const t=await turmaDoAluno(a);
  const enviado=e&&(e.status==='enviada'||e.status==='corrigida');
  PL={a,e,resp:(e&&e.respostas)||[],fotos:(e&&e.fotos)||{},dirty:false,timer:null,salvoEm:e&&e.atualizadoEm,pode:r.podeEnviar,envi:enviado,sit:r.situacao};
  a.questoes.forEach((q,i)=>{if(PL.resp[i]===undefined)PL.resp[i]=null});
  const durMin=(a.desafio||{}).duracaoMin||0;const fim=Math.min(a.encerramento||9e15,durMin&&e&&e.iniciadoEm?e.iniciadoEm+durMin*60000:9e15);
  PROVA={i:PROVA&&PROVA.id===a.id?PROVA.i:0,id:a.id,fim,ativa:false,enviando:false};
  const voltar=`<button class="back" data-go="a_atividades">← Prova do dia</button>`;
  // 1) entregue ou encerrada: resultado e (se liberado) gabarito comentado
  if(enviado||!r.podeEnviar){const lib=enviado&&e.correcao&&(e.status==='corrigida'||a.tipo==='desafio');
    let res='';
    let placar='';if(enviado&&!lib){try{const H=await api('desafioHistorico');const x=H.lista.find(y=>y.id===a.id);if(x&&x.acertos!==undefined)placar=`<div class="dz-placar" style="justify-content:center"><span class="ok">✔ ${x.acertos} acertos</span><span class="bad">✘ ${x.erros} erros</span>${x.discPendentes?`<span>✍️ ${x.discPendentes} em correção</span>`:''}</div>`}catch(er){}}
    if(enviado){const qs=a.questoes;let ac=0,er=0,dp=0;if(e.correcao){qs.forEach((q,i)=>{const pt=e.correcao.pontos[i];if(q.tipo==='disc'){if(pt==null)dp++}else if(Number(pt)>0)ac++;else er++})}
      res=`<div class="pv-folha pv-res"><div class="pv-tit" style="font-size:20px">${lib||e.notaAgora?'RESULTADO':'PROVA ENTREGUE'}</div><p class="muted">Entregue em ${fdh(e.enviadoEm)}${e.autoEnviada?' (enviada automaticamente no fim do tempo)':''} · Protocolo ${esc(e.id.toUpperCase())}</p>
       ${lib?`<div class="score">${nota(e.nota,e.notaMax)}</div><div class="muted">${pts(e.nota)} de ${pts(e.notaMax)} pontos${dp?' (sem as discursivas ainda em correção)':''}</div><div class="dz-placar" style="justify-content:center"><span class="ok">✔ ${ac} acertos</span><span class="bad">✘ ${er} erros</span>${dp?`<span>✍️ ${dp} em correção</span>`:''}</div>${e.comentario?`<div class="fb" style="text-align:left">💬 ${esc(e.comentario)}</div>`:''}`
        :e.notaAgora?`<div class="score">${nota(e.notaAgora.nota,e.notaAgora.notaMax)}</div><div class="muted">${pts(e.notaAgora.nota)} de ${pts(e.notaAgora.notaMax)} pontos</div><div class="dz-placar" style="justify-content:center"><span class="ok">✔ ${e.notaAgora.acertos} acertos</span><span class="bad">✘ ${e.notaAgora.erros} erros</span>${e.notaAgora.discursivas?`<span>✍️ ${e.notaAgora.discursivas} discursiva${e.notaAgora.discursivas>1?'s':''} corrigida${e.notaAgora.discursivas>1?'s':''}</span>`:''}</div><p class="small muted">Prova corrigida automaticamente. O gabarito comentado aparece ${a.encerramento>Date.now()?'depois do encerramento ('+quando(a.encerramento)+')':'quando o professor liberar'}.</p>`
        :`${placar}<p>O resultado com a nota, o gabarito e as explicações será mostrado ${a.encerramento>Date.now()?'depois do encerramento ('+quando(a.encerramento)+')':'quando o professor liberar'}.</p>`}</div>`}
    else res=`<div class="pv-folha pv-res"><div class="pv-tit" style="font-size:20px">PROVA ENCERRADA</div><p>O prazo terminou e esta prova não recebe mais respostas.</p></div>`;
    let corpo='';if(lib||(!enviado&&a.questoes.every(q=>q.tipo==='disc'||q.correta!==undefined))){blocosDisc(a.questoes).forEach(b=>{corpo+=`<div class="pv-disc">${ic(b.d)} ${esc(b.d.toUpperCase())} <span>questões ${b.ini+1} a ${b.fim+1}</span></div>`;for(let i=b.ini;i<=b.fim;i++)corpo+=htmlQuestaoAluno(a.questoes[i],i,lib?e:null,true)+`<div class="estudo-linha"><button type="button" class="btn sm estudo-btn" data-a="estudoAbrir" data-a2="" data-i="${i}">📚 Estudar o assunto</button></div>`})}
    return {html:voltar+cabecalhoProva(a,t)+res+(corpo?`<h3 style="margin:18px 0 8px">${lib?'Gabarito comentado':'Questões'}</h3>`+corpo:''),depois:()=>{}}}
  // 2) ainda não começou: folha de rosto com as instruções
  if(!e||e.status!=='rascunho'){const B=blocosDisc(a.questoes);
    return {html:voltar+cabecalhoProva(a,t)+`<div class="pv-folha"><h3>Instruções</h3><ol class="pv-instr"><li>A prova tem <b>${a.questoes.length} questões</b> numeradas de 1 a ${a.questoes.length}, agrupadas por disciplina.</li><li>Marque uma alternativa nas questões objetivas e escreva com suas palavras nas discursivas.</li><li>Use <b>Anterior</b> e <b>Próxima</b> ou o quadro de questões para navegar. Suas respostas são salvas automaticamente.</li><li>${durMin?`Você terá <b>${tempoTxt(durMin)}</b> a partir do início, até no máximo ${quando(a.encerramento)}.`:`A prova pode ser feita até <b>${quando(a.encerramento)}</b>.`} No fim do tempo, a prova é enviada automaticamente.</li><li>Ao terminar, clique em <b>FINALIZAR E ENVIAR PROVA</b>. Depois do envio não é possível alterar.</li></ol>
      <table class="pv-tab"><tr><th>Disciplina</th><th>Questões</th></tr>${B.map(b=>`<tr><td>${ic(b.d)} ${esc(b.d)}</td><td>${b.ini+1} a ${b.fim+1}</td></tr>`).join('')}</table>
      <div class="pv-opcoes"><button class="btn pri pv-btn" data-a="provaIniciar">▶ INICIAR PROVA<small>Responder agora pelo celular ou computador</small></button>
      <button class="btn pv-btn pv-imprimir" data-a="provaImprimir">🖨️ IMPRIMIR PROVA<small>Baixar em PDF para responder no papel</small></button></div>
      <p class="small muted center">Imprimir não inicia nem envia a prova digital.</p></div>`,depois:()=>{}}}
  // 3) prova em andamento
  PROVA.ativa=true;
  return {html:`<div class="pv-barra"><div class="pv-relogio">⏳ <span data-cd="${fim}">${dur(fim-Date.now())}</span></div><div class="pv-cont" id="pvCont"></div><button class="btn sm" data-a="provaImprimir" title="Imprimir a prova em PDF">🖨️ Imprimir</button><button class="btn sm" data-a="provaMapa">☰ Questões</button></div>
   <div class="pv-cab pv-mini"><b>PROVA DO DIA</b> · ${esc(S.u.nome)} · ${esc(t.nome)}${t.serie?' ('+esc(t.serie)+')':''} · ${(a.desafio&&a.desafio.dia||'').split('-').reverse().join('/')} · entrega até ${quando(fim)}</div><div class="pv-grade"><div class="pv-esq"><div id="pvDisc" class="pv-disc"></div><div id="pvQ"></div>
   <div class="pv-nav"><button class="btn" data-a="provaAnt">◀ Anterior</button><span id="pvN" class="pv-num"></span><button class="btn pri" data-a="provaProx">Próxima ▶</button></div>
   <div class="small muted center" id="svst">${PL.salvoEm?'Salvo às '+hora(PL.salvoEm):'Suas respostas são salvas automaticamente'}</div></div>
   <div class="pv-dir" id="pvMapa"></div></div>
   <button class="btn pv-final" data-a="provaFinalizar">FINALIZAR E ENVIAR PROVA</button>`,depois:()=>provaMostrar(PROVA.i)};
};
function provaMapaHtml(){const qs=PL.a.questoes;return `<div class="pv-mapa-t">Quadro de questões</div>${blocosDisc(qs).map(b=>{let h=`<div class="pv-mapa-d">${ic(b.d)} ${esc(b.d)}</div><div class="pv-mapa-g">`;for(let i=b.ini;i<=b.fim;i++)h+=`<button class="${respondida(qs[i],i)?'ok':''} ${i===PROVA.i?'at':''}" data-a="provaIr" data-i="${i}">${i+1}</button>`;return h+'</div>'}).join('')}<div class="pv-leg"><span class="ok">■</span> respondida <span>■</span> pendente</div>`}
function provaAtualizar(){const qs=PL.a.questoes;const n=qs.filter((q,i)=>respondida(q,i)).length;const c=$('#pvCont');if(c)c.innerHTML=`<b>${n}</b> respondidas · <b>${qs.length-n}</b> pendentes`;const m=$('#pvMapa');if(m)m.innerHTML=provaMapaHtml()}
function provaMostrar(i){const qs=PL.a.questoes;if(PL.dirty&&!PL.envi){clearTimeout(PL.timer);salvarRasc()}i=Math.max(0,Math.min(qs.length-1,i));PROVA.i=i;const q=qs[i];
  const b=blocosDisc(qs).find(x=>i>=x.ini&&i<=x.fim);$('#pvDisc').innerHTML=`${ic(q.disciplina||'Geral')} ${esc((q.disciplina||'Geral').toUpperCase())} <span>questões ${b.ini+1} a ${b.fim+1}</span>`;
  $('#pvQ').innerHTML=htmlQuestaoAluno(q,i,null,false);$('#pvN').textContent=`Questão ${i+1} de ${qs.length}`;
  $$('[data-a="provaAnt"]').forEach(x=>x.disabled=i===0);$$('[data-a="provaProx"]').forEach(x=>{x.disabled=i===qs.length-1});
  bindPlayer();const box=$('#pvQ');['change','input'].forEach(ev=>box.addEventListener(ev,()=>setTimeout(provaAtualizar,0)));provaAtualizar();
  const top=$('#pvDisc');if(top&&top.getBoundingClientRect&&top.getBoundingClientRect().top<70)try{window.scrollBy(0,top.getBoundingClientRect().top-80)}catch(e){}}

/* =================== IMPRIMIR PROVA (PDF) =================== */
// Gera no próprio aparelho do aluno um PDF com as mesmas questões da prova digital, na mesma ordem,
// SEM gabarito e SEM explicações. Não chama o servidor: imprimir não inicia nem envia a prova.
const PDF_FAIXAS=[[0x20,0x7E],[0xA0,0x24F],[0x2B0,0x36F],[0x370,0x3FF],[0x1D00,0x1DBF],[0x2000,0x23FF],[0x2460,0x24FF],[0x2500,0x257F],[0x25A0,0x27BF]];
function pdfTxt(s){return Array.from(String(s==null?'':s).replace(/\r/g,'').replace(/\t/g,' ')).map(ch=>{const c=ch.codePointAt(0);if(c===10)return ch;return PDF_FAIXAS.some(([a,b])=>c>=a&&c<=b)?ch:''}).join('')}
let PDFLIB=null;
function carregarScript(src){return new Promise((ok,err)=>{const s=document.createElement('script');s.src=src;s.onload=ok;s.onerror=()=>err(new Error('Não foi possível carregar o gerador de PDF. Verifique a internet e tente de novo.'));document.head.appendChild(s)})}
async function b64DeUrl(u){const r=await fetch(u);if(!r.ok)throw new Error('Não foi possível carregar a fonte do PDF.');const b=new Uint8Array(await r.arrayBuffer());let s='';for(let i=0;i<b.length;i+=8192)s+=String.fromCharCode.apply(null,b.subarray(i,i+8192));return btoa(s)}
async function prepararPdf(){if(PDFLIB)return PDFLIB;if(!window.jspdf)await carregarScript('vendor/jspdf.umd.min.js');
  const [n,b]=await Promise.all([b64DeUrl('vendor/DejaVuSans.ttf'),b64DeUrl('vendor/DejaVuSans-Bold.ttf')]);PDFLIB={n,b};return PDFLIB}
function nomeArquivo(s){return String(s).normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^A-Za-z0-9]+/g,'-').replace(/^-|-$/g,'')}
async function gerarPdfProva(a,t,aluno){
  const F=await prepararPdf();const {jsPDF}=window.jspdf;const doc=new jsPDF({unit:'mm',format:'a4',compress:true});
  doc.addFileToVFS('DV.ttf',F.n);doc.addFont('DV.ttf','DV','normal');doc.addFileToVFS('DVB.ttf',F.b);doc.addFont('DVB.ttf','DV','bold');
  const W=210,H=297,M=15,LW=W-2*M,BASE=H-M-8;let y=M;
  const dia=(a.desafio&&a.desafio.dia?a.desafio.dia.split('-').reverse().join('/'):new Date(a.abertura||Date.now()).toLocaleDateString('pt-BR'));
  const niv={F1I:'Anos iniciais (1º ao 3º ano)',F1:'Ensino Fundamental I',F2:'Ensino Fundamental II',EM:'Ensino Médio'}[(a.desafio||{}).nivel]||'';
  // só os campos que o aluno pode ver: nunca usa "correta" nem "explicacao"
  const qs=(a.questoes||[]).map(q=>({tipo:q.tipo,enunciado:q.enunciado,textoApoio:q.textoApoio||'',opcoes:q.tipo==='mc'?(q.opcoes||[]).slice():null,pontos:Number(q.pontos)||0,disciplina:q.disciplina||'Geral',imagem:!!q.imagem}));
  const tot=qs.reduce((s,q)=>s+q.pontos,0);
  const fonte=(sz,b)=>{doc.setFont('DV',b?'bold':'normal');doc.setFontSize(sz)};
  const lh=sz=>sz*0.3528*1.35;
  const quebra=(txt,larg,sz,b)=>{fonte(sz,b);return doc.splitTextToSize(pdfTxt(txt),larg)};
  const cor=c=>doc.setTextColor(c[0],c[1],c[2]);
  const ESC=[22,28,45],CINZA=[100,108,125],AZUL=[47,91,234];
  function topoPagina(){fonte(8,false);cor(CINZA);doc.text(pdfTxt('Sala Digital · Prova do dia · '+dia+(aluno?' · '+aluno:'')),M,M-4);doc.setDrawColor(210,214,224);doc.line(M,M-2.5,W-M,M-2.5);y=M+2}
  function novaPagina(){doc.addPage();topoPagina()}
  function escreve(linhas,x,sz,b,c){fonte(sz,b);cor(c||ESC);for(const l of linhas){if(y+lh(sz)>BASE){novaPagina();fonte(sz,b);cor(c||ESC)}doc.text(l,x,y+lh(sz)*0.78);y+=lh(sz)}}
  // ---------- capa ----------
  doc.setDrawColor(22,28,45);doc.setLineWidth(0.6);doc.roundedRect(M,y,LW,58,3,3);
  doc.setFillColor(47,91,234);doc.roundedRect(M+5,y+5,13,13,2.5,2.5,'F');fonte(13,true);doc.setTextColor(255,255,255);doc.text('SD',M+11.5,y+13.6,{align:'center'});
  fonte(8.5,true);cor(CINZA);doc.text('SALA DIGITAL',M+22,y+8.5);fonte(18,true);cor(ESC);doc.text('PROVA DO DIA',M+22,y+16);
  fonte(9.5,false);cor(CINZA);doc.text(pdfTxt('Avaliação diária multidisciplinar'+(niv?' · '+niv:'')),M+22,y+21.5);
  doc.setLineWidth(0.4);doc.line(M+5,y+25,W-M-5,y+25);
  const campos=[['Aluno(a)',aluno||'______________________________'],['Turma',t.nome||'—'],['Série',t.serie||'—'],['Data da avaliação',dia],['Prazo para finalizar',a.encerramento?new Date(a.encerramento).toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'}):'—'],['Questões',qs.length+' questões · '+String(Math.round(tot*100)/100).replace('.',',')+' pontos']];
  campos.forEach((c,i)=>{const col=i%2,lin=Math.floor(i/2);const x=M+5+col*(LW-10)/2,yy=y+30+lin*8.5;fonte(7,true);cor(CINZA);doc.text(c[0].toUpperCase(),x,yy);fonte(9.5,true);cor(ESC);doc.text(quebra(c[1],(LW-10)/2-4,9.5,true)[0]||'',x,yy+4.2)});
  y+=62;
  fonte(9.5,true);cor(ESC);doc.text('Nota: ______________',M,y+4);doc.text('Assinatura do(a) aluno(a): ______________________________',M+55,y+4);y+=10;
  // instruções
  doc.setFillColor(243,245,250);const instr=['Esta é a versão impressa da prova digital: as questões são as mesmas e estão na mesma ordem.','Nas questões objetivas, marque um X em apenas uma alternativa. Você também pode usar a folha de respostas no final.','Nas questões discursivas, responda nas linhas, com suas palavras.','Imprimir não envia a prova. Entregue esta folha ao professor ou registre as respostas na prova digital até o prazo.'];
  const li=instr.map(s=>quebra('• '+s,LW-8,9,false));const hI=6+li.reduce((s,l)=>s+l.length*lh(9),0)+3;
  doc.roundedRect(M,y,LW,hI,2,2,'F');fonte(9.5,true);cor(ESC);doc.text('INSTRUÇÕES',M+4,y+5);y+=7;li.forEach(l=>escreve(l,M+4,9,false));y+=4;
  // quadro das disciplinas
  const blocos=[];qs.forEach((q,i)=>{const u=blocos[blocos.length-1];if(u&&u.d===q.disciplina)u.fim=i;else blocos.push({d:q.disciplina,ini:i,fim:i})});
  fonte(9,true);cor(ESC);doc.text(pdfTxt(blocos.map(b=>b.d+' '+(b.ini+1)+'–'+(b.fim+1)).join('   ·   ')),M,y+3,{maxWidth:LW});y+=4+lh(9)*Math.max(1,quebra(blocos.map(b=>b.d+' '+(b.ini+1)+'–'+(b.fim+1)).join('   ·   '),LW,9,true).length);y+=2;
  // ---------- questões ----------
  const L=j=>String.fromCharCode(65+j);
  function altura(q,i){let h=lh(10.5)+1.5;if(q.textoApoio)h+=quebra(q.textoApoio,LW-8,9,false).length*lh(9)+5;h+=quebra(q.enunciado,LW,10.5,false).length*lh(10.5)+1.5;
    if(q.tipo==='mc')q.opcoes.forEach(o=>{h+=quebra(o,LW-16,10,false).length*lh(10)+1});else if(q.tipo==='vf')h+=lh(10)+1;else h+=7*7.5;return h+5}
  blocos.forEach(b=>{
    if(y+12+altura(qs[b.ini],b.ini)>BASE)novaPagina();
    doc.setFillColor(232,237,253);doc.roundedRect(M,y,LW,8,1.5,1.5,'F');fonte(10,true);cor(AZUL);doc.text(pdfTxt(b.d.toUpperCase()),M+3,y+5.5);
    fonte(8.5,false);cor(CINZA);doc.text('questões '+(b.ini+1)+' a '+(b.fim+1),W-M-3,y+5.5,{align:'right'});y+=11;
    for(let i=b.ini;i<=b.fim;i++){const q=qs[i];const h=altura(q,i);if(h<BASE-M-4&&y+h>BASE)novaPagina();
      fonte(10.5,true);cor(ESC);doc.text('Questão '+(i+1),M,y+lh(10.5)*0.78);fonte(8.5,false);cor(CINZA);
      doc.text(pdfTxt(({mc:'Múltipla escolha',vf:'Verdadeiro ou falso',disc:'Discursiva'}[q.tipo]||'')+' · '+String(q.pontos).replace('.',',')+(q.pontos===1?' ponto':' pontos')),W-M,y+lh(10.5)*0.78,{align:'right'});y+=lh(10.5)+1.5;
      if(q.textoApoio){const la=quebra(q.textoApoio,LW-8,9,false);const y0=y;y+=2;escreve(la,M+5,9,false,[55,62,80]);doc.setDrawColor(150,160,190);doc.setLineWidth(0.6);if(y>y0)doc.line(M+1.5,y0,M+1.5,y);y+=3}
      if(q.imagem){escreve(quebra('[Esta questão tem uma imagem: consulte a prova digital.]',LW,8.5,false),M,8.5,false,CINZA)}
      escreve(quebra(q.enunciado,LW,10.5,false),M,10.5,false);y+=1.5;
      if(q.tipo==='mc')q.opcoes.forEach((o,j)=>{const lo=quebra(o,LW-16,10,false);if(y+lh(10)>BASE)novaPagina();fonte(10,true);cor(ESC);doc.text('(   ) '+L(j)+')',M+1,y+lh(10)*0.78);const y1=y;escreve(lo,M+16,10,false);if(y===y1)y+=lh(10);y+=1});
      else if(q.tipo==='vf'){fonte(10,false);cor(ESC);doc.text('(   ) Verdadeiro            (   ) Falso',M+1,y+lh(10)*0.78);y+=lh(10)+1}
      else{doc.setDrawColor(190,196,210);doc.setLineWidth(0.25);for(let k=0;k<7;k++){if(y+7.5>BASE)novaPagina();y+=7.5;doc.line(M,y,W-M,y)}y+=1}
      y+=5}
  });
  // ---------- folha de respostas ----------
  novaPagina();fonte(14,true);cor(ESC);doc.text('FOLHA DE RESPOSTAS',W/2,y+5,{align:'center'});y+=9;
  fonte(9,false);cor(CINZA);doc.text(pdfTxt('Aluno(a): '+(aluno||'______________________')+'   ·   Turma: '+(t.nome||'—')+'   ·   Data: '+dia),W/2,y+2,{align:'center',maxWidth:LW});y+=7;
  fonte(8.5,false);doc.text('Pinte ou marque com X uma opção por questão. As discursivas são respondidas nas linhas da prova.',W/2,y+2,{align:'center'});y+=7;
  const colW=LW/3,rowH=7.2,porCol=Math.ceil(qs.length/3);const y0=y;
  qs.forEach((q,i)=>{const col=Math.floor(i/porCol),lin=i%porCol;const x=M+col*colW+2,yy=y0+lin*rowH+4;
    if(lin%2===0){doc.setFillColor(246,247,251);doc.rect(M+col*colW,yy-4.2,colW-2,rowH,'F')}
    fonte(9,true);cor(ESC);doc.text(String(i+1).padStart(2,'0'),x,yy+0.6);
    const ops=q.tipo==='mc'?q.opcoes.map((o,j)=>L(j)):q.tipo==='vf'?['V','F']:null;
    if(!ops){fonte(7.5,false);cor(CINZA);doc.text('discursiva',x+9,yy+0.4);return}
    ops.forEach((o,j)=>{const cx=x+11+j*8.5;doc.setDrawColor(90,98,120);doc.setLineWidth(0.3);doc.circle(cx,yy-0.6,2.6);fonte(7.5,true);cor([90,98,120]);doc.text(o,cx,yy+0.5,{align:'center'})});
  });
  // rodapé com numeração
  const n=doc.getNumberOfPages();for(let p=1;p<=n;p++){doc.setPage(p);fonte(8,false);cor(CINZA);doc.text(pdfTxt('Sala Digital'),M,H-8);doc.text('Página '+p+' de '+n,W-M,H-8,{align:'right'})}
  return {blob:doc.output('blob'),nome:'Prova-do-dia-'+nomeArquivo(dia.split('/').reverse().join('-'))+(aluno?'-'+nomeArquivo(aluno).slice(0,40):'-turma')+'.pdf',paginas:n};
}
// imprime a prova aberta na tela, ou (pelo cartão/lista) busca a prova pelo id sem iniciá-la
async function provaParaImprimir(d){
  if(d&&d.id&&(!PL||!PL.a||PL.a.id!==d.id)){
    if(S.u.perfil==='aluno'){const r=await api('abrirAtividade',{id:d.id});return {a:r.atividade,t:await turmaDoAluno(r.atividade),aluno:S.u.nome}}
    const r=await api('atividadeObter',{id:d.id});const T=r.turmas||[];const a=r.atividade;
    return {a,t:{nome:T.filter(x=>(a.turmas||[]).includes(x.id)).map(x=>x.nome).join(', ')||'—',serie:''},aluno:''}}
  return {a:PL.a,t:await turmaDoAluno(PL.a),aluno:S.u.nome}}
ACOES.provaImprimir=async(d,b)=>{
  await busy(b,async()=>{try{
    const P0=await provaParaImprimir(d);const a=P0.a,t=P0.t;const r=await gerarPdfProva(a,t,P0.aluno);
    const url=URL.createObjectURL(r.blob);S.ultimoPdf=r;
    const lk=document.createElement('a');lk.href=url;lk.download=r.nome;document.body.appendChild(lk);try{lk.click()}catch(e){}lk.remove();
    modal(`<div class="hd"><h2>🖨️ Prova em PDF pronta</h2><button class="x" data-a="fechar">✕</button></div><p>O arquivo <b>${esc(r.nome)}</b> (${r.paginas} páginas) tem as mesmas ${a.questoes.length} questões da prova digital, sem gabarito${P0.aluno?'':' e com o nome do aluno em branco para preencher'}, com espaço para as respostas e uma folha de respostas no final.</p>
      <div class="list"><a class="btn pri full" href="${url}" download="${esc(r.nome)}">⬇️ Baixar o PDF</a><a class="btn full" href="${url}" target="_blank" rel="noopener">📄 Abrir para imprimir</a></div>
      <p class="small muted">Imprimir não inicia nem envia a prova digital. Para que a nota seja registrada, entregue a folha ao professor ou responda na prova digital até o prazo.</p>`);
  }catch(e){toast(e.message||'Não foi possível gerar o PDF.')}})};

const DIAS_SEM=['domingo','segunda','terça','quarta','quinta','sexta','sábado'];
function ftCap(s){return String(s||'').toLowerCase().replace(/(^|[\s-])(\S)/g,(m,a,b)=>a+b.toUpperCase())}
const FT_COMPOSTOS=['joao','maria','ana','jose','pedro','luiz','luis','carlos','paulo','joana','anna','luana','davi','miguel','gabriel','arthur','enzo','lucas','vitor','victor','marco','marcos'];
function ftPrimeiro(nome){const p=String(nome||'').trim().split(/\s+/);const n=x=>String(x||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');const dois=p.length>2&&['joao','maria','ana','jose','pedro','luiz','luis','carlos','paulo','davi','anna'].indexOf(n(p[0]))>=0&&FT_COMPOSTOS.indexOf(n(p[1]))>=0;return ftCap(dois?p[0]+' '+p[1]:(p[0]||''))}
function ftDia(dia){const [a,m,d]=String(dia).split('-').map(Number);const w=new Date(Date.UTC(a,m-1,d,12)).getUTCDay();return `${DIAS_SEM[w]} (${String(d).padStart(2,'0')}/${String(m).padStart(2,'0')})`}
function ftLista(xs){return xs.length<=1?(xs[0]||''):xs.slice(0,-1).join(', ')+' e '+xs[xs.length-1]}
function ftDatas(x){const fs=(x.novas?x.faltas.filter(f=>f.dia>x.avisadoAte):x.faltas);return fs.map(f=>ftDia(f.dia))}
function ftMensagem(g,d){
  const mae=g.responsavel?ftPrimeiro(g.responsavel):'';const al=g.alunos.map(x=>({n:ftPrimeiro(x.nome),ds:ftDatas(x)}));
  const nomes=ftLista(al.map(x=>x.n));const varios=al.length>1;
  let t=`Olá${mae?', '+mae:''}! Tudo bem? 😊\n\nAqui é da Sala Digital. `;
  if(!varios){const x=al[0];t+=`Passando para avisar que ${x.n} não fez a Prova do dia de ${ftLista(x.ds)}.`}
  else{t+='Passando para avisar sobre a Prova do dia:\n'+al.map(x=>`• ${x.n} não fez a prova de ${ftLista(x.ds)}.`).join('\n')}
  t+=`\n\nA prova diária é rápida e ajuda muito a fixar o conteúdo da escola. Peço que converse com ${nomes} e acompanhe para que ${varios?'façam':'faça'} a próxima prova: ela fica disponível das ${d.abertura} às ${d.encerramento} na Sala Digital.\n\nQualquer dúvida, estou à disposição. Obrigado!`;

}

const PUSH={};
function pushSuportado(){return 'serviceWorker' in navigator&&'PushManager' in window&&'Notification' in window}
function pushIOS(){return /iphone|ipad|ipod/i.test(navigator.userAgent)&&!window.navigator.standalone}
function b64uParaU8(s){const p=(s+'='.repeat((4-s.length%4)%4)).replace(/-/g,'+').replace(/_/g,'/');const b=atob(p);const u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u}
async function pushSubAtual(){try{const r=await navigator.serviceWorker.getRegistration();return r?await r.pushManager.getSubscription():null}catch(e){return null}}
async function pushEstado(){if(!pushSuportado())return pushIOS()?'ios':'nao';if(Notification.permission==='denied')return 'bloqueado';const s=await pushSubAtual();return s&&Notification.permission==='granted'?'ativo':'desligado'}
function pushCartao(est){
  if(est==='ativo'||est==='nao')return '';
  if(est==='ios')return `<div class="info push-card">🔔 <b>Quer receber aviso quando a prova abrir?</b> No iPhone: toque em <b>Compartilhar</b> ⬆️ e depois em <b>Adicionar à Tela de Início</b>. Abra a Sala Digital pelo ícone novo e toque em Ativar avisos.</div>`;
  if(est==='bloqueado')return `<div class="info push-card">🔕 Os avisos estão bloqueados neste aparelho. Para receber o aviso da prova, libere as notificações deste site nas configurações do navegador.</div>`;
  return `<div class="note push-card" style="display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap"><div>🔔 <b>Receba um aviso no celular quando a Prova do dia abrir.</b></div><button class="btn pri" data-a="pushAtivar">Ativar avisos</button></div>`;
}
ACOES.pushAtivar=async()=>{
  try{
    if(!pushSuportado()){toast(pushIOS()?'No iPhone, adicione a Sala Digital à Tela de Início primeiro.':'Este navegador não aceita avisos.');return}
    const perm=await Notification.requestPermission();if(perm!=='granted'){toast('Você não permitiu os avisos.');return}
    let reg=await navigator.serviceWorker.getRegistration();if(!reg)reg=await navigator.serviceWorker.register('sw.js');reg=await navigator.serviceWorker.ready;
    const {chave}=await api('pushChave');
    let s=await reg.pushManager.getSubscription();if(!s)s=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:b64uParaU8(chave)});
    const j=s.toJSON();const r=await api('pushInscrever',{endpoint:j.endpoint,keys:j.keys});
    toast(r&&r.enviados?'Avisos ativados! Você deve receber uma notificação de teste.':'Avisos ativados.');$$('.push-card').forEach(x=>x.remove());
  }catch(e){toast('Não foi possível ativar os avisos: '+(e&&e.message||e))}
};

function estudoHtml(r,extra){
  const sem=!r.texto&&!r.video;
  return `<div class="hd"><h2>📚 ${esc(r.assunto||r.disciplina||'Estudar')}</h2><button class="x" data-a="fechar">✕</button></div>

  ${r.texto?`<div class="est-sec">📖 Entenda o assunto</div><div class="apoio bib-texto">${esc(r.texto)}</div>`:''}
  ${estudoExemploHtml(r.exemplo)}

}

['professor','admin'].forEach(p=>{const i=MENUS[p].findIndex(m=>m[0]==='p_faltas');MENUS[p].splice(i,0,['p_pendentes','⏳','Quem não fez'])});
const PEND={dia:null,q:null};
function pendHoje(){return new Date(Date.now()-3*3600e3).toISOString().slice(0,10)}
function pendHora(ms){return new Date(ms).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})}
function pendDias(q){const s=new Set();q.turmas.forEach(tu=>tu.provas.forEach(p=>s.add(p.dia)));return [...s].sort().reverse()}
// alunos de um dia, agrupados por situação
function pendLinhas(q,dia){const out=[];q.turmas.forEach(tu=>{tu.provas.forEach((p,j)=>{if(p.dia!==dia)return;tu.alunos.forEach(al=>{const c=al.provas[j];if(!c||c.s==='nova'||c.s==='na')return;out.push({tu,p,al,c})})})});return out}
function pendMsgMae(al,p){const mae=al.responsavel?ftPrimeiro(al.responsavel):'';const n=ftPrimeiro(al.nome);
  return `Olá${mae?', '+mae:''}! Tudo bem? 😊\n\nAqui é da Sala Digital. ${n} ainda não fez a Prova do dia de hoje. Ela fica aberta até as ${pendHora(p.encerramento)} e leva pouco tempo.\n\nPode lembrar ${n} de entrar e fazer? Obrigado!`}
VIEWS.p_pendentes=async function(){
  const q=await api('desafioQuadro');PEND.q=q;const dias=pendDias(q);
  if(!dias.length)return `<div class="ph"><div><h1>⏳ Quem não fez a prova</h1></div></div><div class="info">Ainda não há Prova do dia liberada.</div>`;
  const dia=PEND.dia&&dias.indexOf(PEND.dia)>=0?PEND.dia:dias[0];PEND.dia=dia;
  const L=pendLinhas(q,dia).filter(x=>!x.al.ignorar);
  const naoFez=L.filter(x=>x.c.s==='aberta'||x.c.s==='faltou'),fazendo=L.filter(x=>x.c.s==='fazendo'),fez=L.filter(x=>x.c.s==='corrigida'||x.c.s==='enviada'),extra=L.filter(x=>x.c.s==='extra');
  const aberta=L.some(x=>!x.p.encerrada);const fecha=L.length?Math.max(...L.map(x=>x.p.encerramento)):0;
  if(dia===pendHoje())S.badge.p_pendentes=aberta?naoFez.length+fazendo.length:0;
  const linha=(x,extraHtml)=>`<div class="it"><div class="ic">🎒</div><div class="mid"><div class="t">${esc(x.al.nome)}${x.al.avisos?' <span title="Avisos no celular ativados">🔔</span>':''}</div><div class="s">${esc(x.tu.nome)}${x.al.responsavel?' · mãe/resp.: '+esc(ftPrimeiro(x.al.responsavel)):''}</div></div><div class="end">${extraHtml}</div></div>`;
  const idx=x=>L.indexOf(x);
  return `<div class="ph"><div><h1>⏳ Quem não fez a prova</h1><p>Situação de cada aluno na Prova do dia</p></div></div>
  <div class="ft-tabs" style="margin-bottom:12px">${dias.slice(0,7).map(d=>`<a href="#" data-a="pendDia" data-d="${d}" style="${d===dia?'background:var(--pri);color:#fff':''}">${d===pendHoje()?'Hoje':esc(ftDia(d))}</a>`).join('')}</div>
  <div class="grid g3" style="margin-bottom:14px">
    <div class="stat"><b style="color:#dc2626">${naoFez.length}</b><span>${aberta?'⏳ ainda não fizeram':'✘ não fizeram'}</span></div>
    <div class="stat"><b style="color:#b45309">${fazendo.length}</b><span>✍️ fazendo agora</span></div>
    <div class="stat"><b style="color:#15803d">${fez.length}</b><span>✅ entregaram</span></div></div>
  ${aberta?`<div class="note">🕐 A prova está aberta até as <b>${pendHora(fecha)}</b>. Ainda dá tempo de cobrar quem não fez.</div>`:`<div class="info">🔒 Prova encerrada. Quem não fez ficou com falta (veja em <a href="#" data-go="p_faltas">Notas e faltas</a> a mensagem para a mãe).</div>`}
  <div class="card" style="margin-bottom:14px"><h3 style="margin:0 0 10px">${aberta?'⏳ Ainda não fizeram':'✘ Não fizeram'} (${naoFez.length})</h3>
    ${naoFez.length?`<div class="list pend-l">${naoFez.map(x=>linha(x,aberta?`<button class="btn sm" data-a="pendMae" data-i="${idx(x)}" style="background:#25d366;color:#fff;border-color:#25d366">💬 Cobrar</button>`:'<span class="pill pendente">falta</span>')).join('')}</div>`:(fazendo.length?'<p class="muted" style="margin:0">Todos já começaram. Veja abaixo quem ainda está fazendo.</p>':'<p class="muted" style="margin:0">🎉 Todo mundo já fez!</p>')}
    ${aberta&&naoFez.length+fazendo.length?`<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:12px"><button class="btn" data-a="pushAvisarAgora">🔔 Avisar no celular quem não fez</button><button class="btn" data-a="pendCopiar">📋 Copiar lista</button></div>`:''}</div>
  ${fazendo.length?`<div class="card" style="margin-bottom:14px"><h3 style="margin:0 0 10px">✍️ Fazendo agora (${fazendo.length})</h3><div class="list pend-l">${fazendo.map(x=>linha(x,`<span class="small"><b>${x.c.respondidas||0}</b> de ${x.c.total||'?'} respondidas</span>${aberta?` <button class="btn sm" data-a="pendMae" data-i="${idx(x)}" style="background:#25d366;color:#fff;border-color:#25d366">💬</button>`:''}`)).join('')}</div></div>`:''}
  <div class="card"><div style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px"><h3 style="margin:0">✅ Entregaram (${fez.length})</h3>${fez.length?'<button class="btn pri sm" data-a="notasMaes">📤 Mandar notas para as mães</button>':''}</div>
    ${fez.length?`<div class="nt-grid">${fez.sort((a,b)=>(a.c.em||0)-(b.c.em||0)).map(x=>notaCard(x)).join('')}</div>`:'<p class="muted" style="margin:0">Ninguém entregou ainda.</p>'}</div>
  ${extra.length?`<p class="small muted" style="margin-top:10px">Prova extra (não obrigatória): ${extra.length} aluno(s) não fizeram.</p>`:''}`;
};

ACOES.pendMae=(d)=>{const x=pendLinhas(PEND.q,PEND.dia).filter(y=>!y.al.ignorar)[+d.i];if(!x)return;const txt=pendMsgMae(x.al,x.p);

/* =================== NOTA PARA A MÃE (depois que o aluno entrega a prova) =================== */
function notaEnvLista(){try{return JSON.parse(localStorage.getItem('sd_notas_env')||'[]')}catch(e){return []}}
function notaEnviada(id){return !!id&&notaEnvLista().indexOf(id)>=0}
function notaMarcar(ids){try{const L=notaEnvLista();ids.forEach(i=>{if(i&&L.indexOf(i)<0)L.push(i)});localStorage.setItem('sd_notas_env',JSON.stringify(L.slice(-500)))}catch(e){}}
function notaRotulo(p){const r=String(p.titulo||'').replace(/^Prova do dia — \S+ · /,'');if(/^(Fund\. I|Fund\. II|Anos iniciais|Médio)$/.test(r))return 'Prova do dia';if(/^Reda/.test(r))return 'Redação';if(/^Reforço/.test(r))return 'Prova do dia (reforço)';return r||'Prova do dia'}
// grupos por mãe (irmãos juntos) com todas as provas do dia de cada aluno
function notaGrupos(q,dia){const L=pendLinhas(q,dia).filter(x=>!x.al.ignorar);const G={};
  L.forEach(x=>{const k=x.al.responsavel?'r:'+normNomeFt(x.al.responsavel):'a:'+x.al.id;const g=G[k]||(G[k]={resp:x.al.responsavel,tel:'',alunos:{}});if(!g.tel&&x.al.telefone)g.tel=x.al.telefone;
    const a=g.alunos[x.al.id]||(g.alunos[x.al.id]={al:x.al,itens:[]});a.itens.push(x)});
  return Object.values(G).map(g=>({...g,alunos:Object.values(g.alunos)})).filter(g=>g.alunos.some(a=>a.itens.some(x=>x.c.s==='corrigida'||x.c.s==='enviada')))}
function normNomeFt(s){return String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/\s+/g,' ').trim()}
function notaMsg(g,dia){const mae=g.resp?ftPrimeiro(g.resp):'';const esc10=S.cfg.escalaNota||10;const hoje=dia===pendHoje();
  let t=`Olá${mae?', '+mae:''}! Tudo bem? 😊\n\nAqui é da Sala Digital. ${g.alunos.length>1?'Seguem as notas':'Segue a nota'} da Prova do dia ${hoje?'de hoje':'de '+ftDia(dia)} (${dia.split('-').reverse().slice(0,2).join('/')}):\n`;
  g.alunos.forEach(a=>{const n=ftPrimeiro(a.al.nome);t+=`\n📝 *${n}*\n`;
    a.itens.forEach(x=>{const c=x.c,r=notaRotulo(x.p);
      if(c.s==='corrigida'||c.s==='enviada'){t+=`• ${r}: nota *${nota(c.nota,c.notaMax)}* de ${esc10}`;if(c.objetivas)t+=` (${c.acertos} acerto${c.acertos===1?'':'s'} e ${c.erros} erro${c.erros===1?'':'s'})`;if(c.discPendentes)t+=` — ainda tem resposta escrita em correção`;t+='\n'}
      else if(c.s==='fazendo')t+=`• ${r}: começou, mas ainda não entregou (${c.respondidas||0} de ${c.total} respondidas)\n`;
      else if(c.s==='aberta')t+=`• ${r}: ainda não fez (fica aberta até as ${pendHora(x.p.encerramento)})\n`;
      else if(c.s==='faltou')t+=`• ${r}: não fez\n`});
    const ns=a.itens.filter(x=>x.c.s==='corrigida'||x.c.s==='enviada').map(x=>x.c.nota/x.c.notaMax);
    if(ns.length){const m=ns.reduce((p,v)=>p+v,0)/ns.length;t+=m>=0.8?'Excelente resultado! 🌟\n':m>=0.6?'Bom resultado! Vamos continuar estudando. 👏\n':'Precisa reforçar os estudos. Vale rever as questões que errou com o botão "Estudar o assunto". 📚\n'}});
  return t+`\nQualquer dúvida, estou à disposição. Obrigado! 🙏`}
function notaWhats(g,txt){let n=String(g.tel||'').replace(/\D/g,'');if(n&&n.length<=11)n='55'+n;return `https://wa.me/${n}?text=${encodeURIComponent(txt)}`}
function notaIds(g){const o=[];g.alunos.forEach(a=>a.itens.forEach(x=>{if(x.c.entregaId)o.push(x.c.entregaId)}));return o}
ACOES.notaMae=(d)=>{const gs=notaGrupos(PEND.q,PEND.dia);const g=gs.find(g=>g.alunos.some(a=>a.al.id===d.al));if(!g)return;notaModal([g])};
ACOES.notasMaes=()=>{const gs=notaGrupos(PEND.q,PEND.dia);if(!gs.length){toast('Ninguém entregou ainda.');return}notaModal(gs)};
function notaModal(gs){NOTA.gs=gs;
  modal(`<div class="hd"><h2>📤 Nota para a mãe</h2><button class="x" data-a="fechar">✕</button></div>
  <p class="small muted" style="margin-top:0">Toque em <b>WhatsApp</b> para abrir a conversa com a mensagem pronta${gs.some(g=>!g.tel)?' (sem telefone cadastrado, você escolhe a conversa da mãe)':''}. Irmãos da mesma mãe vão juntos numa mensagem só.</p>
  ${gs.map((g,i)=>{const txt=notaMsg(g,PEND.dia);const env=notaIds(g).every(notaEnviada);return `<div class="card" style="margin-bottom:12px"><b>${g.resp?'👩 '+esc(g.resp):'👤 Responsável não cadastrado'}</b> <span class="small muted">· ${g.alunos.map(a=>esc(ftPrimeiro(a.al.nome))).join(', ')}</span>${env?' <span class="pill corrigida">enviada</span>':''}
    <textarea id="notaTxt${i}" rows="9" style="margin-top:8px;font-size:14px">${esc(txt)}</textarea>
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:8px"><a class="btn" href="${notaWhats(g,txt)}" target="_blank" rel="noopener" data-a="notaZap" data-i="${i}" style="background:#25d366;color:#fff;border-color:#25d366">💬 WhatsApp</a><button class="btn" data-a="notaCopiar" data-i="${i}">📋 Copiar</button></div></div>`}).join('')}`)}
const NOTA={gs:[]};
ACOES.notaZap=(d,b)=>{const g=NOTA.gs[+d.i];const txt=($('#notaTxt'+d.i)||{}).value||notaMsg(g,PEND.dia);window.open(notaWhats(g,txt),'_blank');notaMarcar(notaIds(g));if(!g.tel)toast('Escolha a conversa da mãe no WhatsApp.')};
ACOES.notaCopiar=async(d)=>{const g=NOTA.gs[+d.i];const txt=($('#notaTxt'+d.i)||{}).value||'';const ok=await ftCopiar(txt);if(ok)notaMarcar(notaIds(g));toast(ok?'Mensagem copiada! Cole no WhatsApp da mãe.':'Não deu para copiar.')};
/* no Início do professor: avisa quando há notas novas para mandar */
queueMicrotask(()=>{['p_inicio','ad_inicio'].forEach(v=>{const orig=VIEWS[v];if(!orig)return;VIEWS[v]=async function(p){
  const r=await orig(p);let q=null;try{q=await api('desafioQuadro')}catch(e){return r}const hoje=pendHoje();
  const novas=pendLinhas(q,hoje).filter(x=>!x.al.ignorar&&(x.c.s==='corrigida'||x.c.s==='enviada')&&!notaEnviada(x.c.entregaId));if(!novas.length)return r;
  const nomes=[...new Set(novas.map(x=>ftPrimeiro(x.al.nome)))];
  const faixa=`<div class="note" style="cursor:pointer;border-color:#25d366;background:#f0fdf4" data-a="notasInicio">📤 <b>${nomes.join(', ')}</b> ${nomes.length>1?'terminaram':'terminou'} a prova de hoje. Toque para mandar a nota para a mãe.</div>`;
  const h=typeof r==='string'?r:r.html;const i=h.indexOf('</div></div>')+12;const nh=h.slice(0,i)+faixa+h.slice(i);return typeof r==='string'?nh:Object.assign({},r,{html:nh})}})});
ACOES.notasInicio=async()=>{try{const q=await api('desafioQuadro');PEND.q=q;PEND.dia=pendHoje();const gs=notaGrupos(q,PEND.dia);gs.length?notaModal(gs):toast('Ninguém entregou ainda.')}catch(e){toast(e.message)}};

function notaCor(c){const f=c.notaMax?c.nota/c.notaMax:0;return f>=0.85?'#15803d':f>=0.65?'#2563eb':f>=0.5?'#b45309':'#dc2626'}
function notaCard(x){const env=notaEnviada(x.c.entregaId);const red=notaRotulo(x.p)==='Redação';const e10=S.cfg.escalaNota||10;
  return `<div class="nt-card"><div class="nt-top"><div class="nt-av">${red?'✍️':'🎒'}</div><div class="nt-info"><b>${esc(x.al.nome)}</b><span>${esc(notaRotulo(x.p))} · entregou às ${pendHora(x.c.em)}${x.c.auto?' ⏱':''}</span>${x.al.responsavel?`<span>👩 ${esc(ftPrimeiro(x.al.responsavel))}</span>`:''}</div>
    <div class="nt-nota" style="color:${notaCor(x.c)};border-color:${notaCor(x.c)}">${nota(x.c.nota,x.c.notaMax)}<small>de ${e10}</small></div></div>
    ${x.c.objetivas?`<div class="nt-placar"><span class="ok">✔ ${x.c.acertos} acertos</span><span class="bad">✘ ${x.c.erros} erros</span></div>`:''}
    <div class="nt-bot">${red?`<button class="btn sm nt-red" data-a="redacaoAbrir" data-id="${esc(x.c.entregaId)}">✍️ Ver redação</button>`:''}<button class="btn sm ${env?'nt-ok':'nt-zap'}" data-a="notaMae" data-al="${esc(x.al.id)}">${env?'✓ Nota enviada':'💬 Nota p/ mãe'}</button></div></div>`}
/* =================== REDAÇÃO: correção detalhada para o professor =================== */
const RED_COR={'Péssimo':'#dc2626','Fraco':'#ea580c','Regular':'#ca8a04','Bom':'#2563eb','Ótimo':'#15803d','Enviada por foto':'#6b7280'};
const RED_EMO={'Péssimo':'😟','Fraco':'😕','Regular':'🙂','Bom':'😀','Ótimo':'🤩','Enviada por foto':'📷'};
function redacaoHtml(r){const an=r.analise||{};const cor=RED_COR[an.nivel]||'#6b7280';const e10=S.cfg.escalaNota||10;const nt=r.nota==null?'—':nota(r.nota,r.max);
  const lista=(t,L,ic)=>L&&L.length?`<div class="rd-sec">${t}</div><ul class="rd-ul">${L.map(x=>`<li>${ic} ${esc(x)}</li>`).join('')}</ul>`:'';
  return `<div class="hd"><h2>✍️ Redação de ${esc(ftPrimeiro(r.aluno))}</h2><button class="x" data-a="fechar">✕</button></div>
  <div class="rd-topo" style="border-color:${cor}"><div class="rd-nota" style="background:${cor}">${nt}<small>de ${e10}</small></div><div><div class="rd-nivel" style="color:${cor}">${RED_EMO[an.nivel]||''} ${esc(an.nivel||'Sem correção')}</div><div class="small muted">${esc(r.atividade)} · ${r.enviadoEm?fdh(r.enviadoEm):''}${an.palavras?` · ${an.palavras} palavras`:''}</div>${an.ia?'':'<div class="small" style="color:#b45309">Correção automática provisória (sem IA)</div>'}</div></div>
  ${an.resumo?`<div class="rd-resumo">🧑‍🏫 <b>Avaliação:</b> ${esc(an.resumo)}</div>`:''}
  ${an.criterios&&an.criterios.length?`<div class="rd-sec">📊 Nota por critério</div><div class="rd-crit">${an.criterios.map(k=>{const f=k.max?k.nota/k.max:0;const c=f>=0.8?'#15803d':f>=0.5?'#ca8a04':'#dc2626';return `<div class="rd-k"><div class="rd-kh"><b>${esc(k.nome)}</b><span style="color:${c}">${String(k.nota).replace('.',',')} / ${k.max}</span></div><div class="rd-bar"><i style="width:${Math.round(f*100)}%;background:${c}"></i></div>${k.comentario?`<div class="small muted">${esc(k.comentario)}</div>`:''}</div>`}).join('')}</div>`:''}
  ${an.criatividade?`<div class="rd-sec">🎨 Criatividade</div><p style="margin:0">${esc(an.criatividade)}</p>`:''}
  ${lista('💪 Pontos fortes',an.fortes,'✅')}${lista('🧩 O que faltou',an.faltou,'⚠️')}
  ${an.erros&&an.erros.length?`<div class="rd-sec">✏️ Correções de português</div><div class="rd-erros">${an.erros.map(z=>`<div><s>${esc(z.trecho)}</s> → <b>${esc(z.correcao)}</b>${z.tipo?` <span class="small muted">(${esc(z.tipo)})</span>`:''}</div>`).join('')}</div>`:''}
  ${lista('💡 Dicas para melhorar',an.dicas,'👉')}
  ${an.comentarioAluno?`<div class="rd-sec">💬 O que o aluno vê</div><div class="info small">${esc(an.comentarioAluno)}</div>`:''}
  <div class="rd-sec">📄 Redação do aluno</div><div class="rd-texto">${r.texto?esc(r.texto):'<span class="muted">(sem texto digitado)</span>'}</div>
  ${r.fotos&&r.fotos.length?`<div class="fotos" style="margin-top:8px">${r.fotos.map(id=>`<div class="ft"><img data-img="${esc(id)}" alt="Foto da redação"></div>`).join('')}</div>`:''}
  <details style="margin-top:10px"><summary class="small muted">Ver a proposta da redação</summary><div class="apoio small" style="white-space:pre-wrap">${esc(r.apoio?r.apoio+'\n\n':'')}${esc(r.tema)}</div></details>
  <div class="rd-acoes"><button class="btn" data-a="redacaoRefazer" data-id="${esc(r.entregaId)}">🔄 Corrigir de novo com IA</button><button class="btn" data-a="redacaoMae" data-id="${esc(r.entregaId)}" style="background:#25d366;color:#fff;border-color:#25d366">💬 Contar para a mãe</button></div>`}
const RED={r:null};
ACOES.redacaoAbrir=async(d,b)=>{await busy(b,async()=>{try{const r=await api('redacaoVer',{entregaId:d.id});RED.r=r;modal(redacaoHtml(r));if(typeof carregaImgs==='function')carregaImgs()}catch(e){toast(e.message)}})};
ACOES.redacaoRefazer=async(d,b)=>{await busy(b,async()=>{try{const x=await api('redacaoAnalisar',{entregaId:d.id});if(x.semIA){toast('A correção com IA não está ligada.');return}if(!x.ok){toast('A IA não respondeu agora. Tente de novo em instantes.');return}
  const r=await api('redacaoVer',{entregaId:d.id});RED.r=r;modal(redacaoHtml(r));toast('Redação corrigida de novo.')}catch(e){toast(e.message)}})};
ACOES.redacaoMae=()=>{const r=RED.r;if(!r)return;const an=r.analise||{};const mae=r.responsavel?ftPrimeiro(r.responsavel):'';const n=ftPrimeiro(r.aluno);
  let t=`Olá${mae?', '+mae:''}! Tudo bem? 😊\n\nAqui é da Sala Digital. ${n} fez a redação "${(r.tema.match(/tema:?\s*"([^"]+)"/i)||[])[1]||'da prova'}".\n\n📝 Nota: *${r.nota==null?'—':nota(r.nota,r.max)}* de ${S.cfg.escalaNota||10} (${an.nivel||'em correção'})\n`;
  if(an.fortes&&an.fortes.length)t+=`\n💪 Pontos fortes: ${an.fortes.slice(0,2).join('; ')}.\n`;if(an.faltou&&an.faltou.length)t+=`\n🧩 Precisa melhorar: ${an.faltou.slice(0,3).join('; ')}.\n`;
  t+=`\nQualquer dúvida, estou à disposição. Obrigado! 🙏`;
  let tel=String(r.telefone||'').replace(/\D/g,'');if(tel&&tel.length<=11)tel='55'+tel;window.open(`https://wa.me/${tel}?text=${encodeURIComponent(t)}`,'_blank');if(!r.telefone)toast('Escolha a conversa da mãe no WhatsApp.')};
['professor','admin'].forEach(p=>{const i=MENUS[p].findIndex(m=>m[0]==='p_reforco');MENUS[p].splice(i+1,0,['p_redacoes','✍️','Redações'])});
VIEWS.p_redacoes=async function(){const d=await api('redacoesListar');const e10=S.cfg.escalaNota||10;
  return `<div class="ph"><div><h1>✍️ Redações</h1><p>Correção detalhada de cada redação entregue (últimos 30 dias)</p></div></div>
  ${d.lista.length?`<div class="nt-grid">${d.lista.map(x=>{const cor=RED_COR[x.nivel]||'#6b7280';return `<button class="nt-card rd-item" data-a="redacaoAbrir" data-id="${esc(x.entregaId)}"><div class="nt-top"><div class="nt-av">✍️</div><div class="nt-info"><b>${esc(x.aluno)}</b><span>${esc(x.atividade.replace(/^Prova do dia — /,''))}</span><span>${x.em?fdh(x.em):''}</span></div><div class="nt-nota" style="color:${cor};border-color:${cor}">${x.nota==null?'—':nota(x.nota,x.max)}<small>de ${e10}</small></div></div><div class="nt-bot"><span class="rd-tag" style="background:${cor}">${RED_EMO[x.nivel]||''} ${esc(x.nivel||'—')}</span><span class="small muted">${x.ia?'corrigida pela IA':'correção provisória'} · ver tudo →</span></div></button>`}).join('')}</div>`:'<div class="card">Nenhuma redação entregue ainda. Quando um aluno entregar, a correção completa aparece aqui.</div>'}`};

/* =================== LAYOUT DE APLICATIVO: menu ⋮, menu lateral, início e barra inferior =================== */
const LY={aberto:false};
const LY_PERFIL={aluno:'Aluno',professor:'Professor',admin:'Administrador'};
// seções do menu lateral (usa só as páginas que já existem)
const LY_SECOES={
  admin:[['Principal',['ad_inicio','__alunos','__professores','ad_usuarios']],['Acompanhamento',['p_pendentes','p_faltas','p_reforco','p_redacoes','p_correcoes']],
    ['Pedagógico',['p_turmas','p_atividades']],['Gestão',['ad_relatorios','ad_config','ad_ia']],['Conta',['atualizacoes','perfil']]],
  professor:[['Principal',['p_inicio','p_turmas','p_atividades']],['Acompanhamento',['p_pendentes','p_faltas','p_reforco','p_redacoes','p_correcoes']],
    ['Relatórios',['p_relatorios']],['Conta',['atualizacoes','perfil']]],
  aluno:[['Estudos',['a_inicio','a_atividades','__lista','a_biblioteca','a_tutor']],['Minha vida escolar',['a_notas','a_turmas']],['Conta',['atualizacoes','perfil']]]
};
const LY_EXTRA={__alunos:['ad_usuarios','🎒','Alunos',{perfil:'aluno'}],__professores:['ad_usuarios','🧑‍🏫','Professores',{perfil:'professor'}],
  __desafio:['p_desafio','🗓️','Prova do dia (configurar)'],__banco:['p_banco','📚','Banco de Atividades'],__lista:['a_lista','📂','Atividades do professor']};
const LY_NOMES={ad_inicio:'Início (painel administrativo)',ad_usuarios:'Todos os usuários',a_atividades:'Prova do dia'};
const LY_COR=['#2f5bea','#7c3aed','#0891b2','#16a34a','#ea580c','#db2777','#ca8a04','#4f46e5'];
function lyItens(){
  const pf=S.u.perfil;const menu=lyMenu();const porId={};menu.forEach(m=>{porId[m[0]]=m});
  const usados=new Set();const secs=[];
  (LY_SECOES[pf]||[]).forEach(([t,ids])=>{const L=[];ids.forEach(id=>{
    if(LY_EXTRA[id]){const [v,ic,l,p]=LY_EXTRA[id];if(VIEWS[v]&&(pf!=='aluno'||v.indexOf('a_')===0))L.push({v,ic,l,p:p||{},k:id})}
    else if(porId[id]){const [v,ic,l]=porId[id];L.push({v,ic,l:LY_NOMES[v]||l,p:{},k:v});usados.add(v)}});if(L.length)secs.push([t,L])});
  const resto=menu.filter(m=>!usados.has(m[0])).map(([v,ic,l])=>({v,ic,l,p:{},k:v}));
  if(resto.length)secs.splice(Math.max(1,secs.length-1),0,['Mais',resto]);
  return secs;
}
function lyMenu(){return (MENUS[S.u.perfil]||[]).filter(([k])=>(k!=='p_ia'||S.iaAtiva)&&(k!=='a_tutor'||S.iaTutor))}
function lyIniciais(n){const p=String(n||'').trim().split(/\s+/);return ((p[0]||'')[0]||'')+((p.length>1?p[p.length-1]:'')[0]||'')}
function lyAtivo(it){const at=MENU_DE[S.view]||S.view;if(it.v!==at)return false;if(it.p&&it.p.perfil)return (S.p&&S.p.perfil)===it.p.perfil;return !(S.view==='ad_usuarios'&&S.p&&S.p.perfil&&it.k==='ad_usuarios')}
function lyDrawerHtml(){
  const u=S.u;
  return `<div class="ly-dh"><div class="ly-logo"><div class="mk">🎓</div><b>Sala Digital</b></div><button class="ly-x" data-a="lyFechar" aria-label="Fechar menu">✕</button></div>
  <div class="ly-user"><div class="ly-av ${u.perfil}">${esc(lyIniciais(u.nome).toUpperCase())||'👤'}</div><div class="ly-un"><b>${esc(u.nome)}</b><span class="role ${u.perfil}">${LY_PERFIL[u.perfil]}</span></div></div>
  <nav class="ly-menu">${lyItens().map(([t,L])=>`<div class="ly-sec">${esc(t)}</div>${L.map((it,i)=>{const b=S.badge[it.v];return `<button class="ly-it${lyAtivo(it)?' on':''}" data-go="${it.v}"${Object.keys(it.p).length?` data-p="${P(it.p)}"`:''}><span class="ly-ic" style="--c:${LY_COR[i%LY_COR.length]}">${it.ic}</span><span class="ly-l">${esc(it.l)}</span>${b?`<span class="bdg">${b==='novo'?'novo':b}</span>`:''}</button>`}).join('')}`).join('')}</nav>
  <a href="#" class="ly-sair" data-a="lySair"><span class="ly-ic" style="--c:#dc2626">🚪</span><span class="ly-l">Sair</span></a>`;
}
// barra inferior (celular): 4 atalhos por perfil
function lyBarra(){
  const pf=S.u.perfil;
  const B={admin:[['ad_inicio','🏠','Início'],['ad_relatorios','📊','Relatórios'],['__notif','🔔','Avisos'],['ad_config','⚙️','Ajustes']],
    professor:[['p_inicio','🏠','Início'],['p_relatorios','📊','Relatórios'],['__notif','🔔','Avisos'],['perfil','⚙️','Perfil']],
    aluno:[['a_inicio','🏠','Início'],['a_notas','📊','Notas'],['__notif','🔔','Avisos'],['perfil','⚙️','Perfil']]}[pf]||[];
  const at=MENU_DE[S.view]||S.view;const n=lyNotifs().reduce((s,x)=>s+(typeof x.n==='number'?x.n:1),0);
  return B.filter(([v])=>v==='__notif'||VIEWS[v]).map(([v,ic,l])=>v==='__notif'
    ?`<button class="ly-b" data-a="lyNotif"><span class="ly-bi">${ic}${n?`<i class="ly-dot">${n>9?'9+':n}</i>`:''}</span><span>${l}</span></button>`
    :`<button class="ly-b${at===v?' on':''}" data-go="${v}"><span class="ly-bi">${ic}</span><span>${l}</span></button>`).join('')
  +`<button class="ly-b" data-a="lyAbrir"><span class="ly-bi">☰</span><span>Menu</span></button>`;
}
// avisos: tudo que tem contador no menu
function lyNotifs(){const menu=MENUS[S.u.perfil]||[];const L=[];
  menu.forEach(([v,ic,l])=>{const b=S.badge[v];if(!b)return;
    const txt={p_pendentes:'aluno(s) ainda não fizeram a prova de hoje',p_faltas:'responsável(is) para avisar sobre faltas',p_correcoes:'entrega(s) esperando correção',a_atividades:'prova(s) para fazer',atualizacoes:'Há novidades no sistema'}[v];
    L.push({v,ic,l,n:b==='novo'?'novo':b,txt:txt?(b==='novo'?txt:b+' '+txt):l})});
  return L}
function lyNotifHtml(){const L=lyNotifs();
  return `<div class="hd"><h2>🔔 Avisos</h2><button class="x" data-a="fechar">✕</button></div>
  ${L.length?`<div class="ly-nl">${L.map(x=>`<button class="ly-n" data-a="lyIr" data-v="${x.v}"><span class="ly-ic" style="--c:#2f5bea">${x.ic}</span><span class="ly-nt"><b>${esc(x.l)}</b><span>${esc(x.txt)}</span></span><span class="ly-seta">›</span></button>`).join('')}</div>`
  :`<div class="empty" style="padding:26px 10px;text-align:center"><div style="font-size:42px">🎉</div><h3 style="margin:8px 0 4px">Nenhum aviso agora</h3><p class="muted" style="margin:0">Quando houver algo importante, aparece aqui.</p></div>`}
  ${'Notification' in window&&typeof ACOES.pushAtivar==='function'?`<button class="btn full" style="margin-top:14px" data-a="pushAtivar">📲 Receber avisos no celular</button>`:''}`}
ACOES.lyNotif=()=>{modal(lyNotifHtml())};
ACOES.lyIr=(d)=>{fechar();go(d.v)};
function lyAbrirMenu(){const d=$('#lyDrawer');if(!d)return;d.innerHTML=lyDrawerHtml();document.body.classList.add('ly-on');LY.aberto=true;d.setAttribute('aria-hidden','false');const on=d.querySelector('.ly-it.on');if(on)on.scrollIntoView({block:'center'})}
function lyFecharMenu(){document.body.classList.remove('ly-on');LY.aberto=false;const d=$('#lyDrawer');if(d)d.setAttribute('aria-hidden','true')}
ACOES.lyAbrir=()=>lyAbrirMenu();ACOES.lyFechar=()=>lyFecharMenu();
ACOES.lySair=()=>{lyFecharMenu();['pf-aluno','pf-professor','pf-admin'].forEach(c=>document.body.classList.remove(c));if(ACOES.sair)ACOES.sair({},null,null);else sairLocal()};
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&LY.aberto)lyFecharMenu()});
// fecha o menu ao navegar
{const _go=go;go=function(v,p){lyFecharMenu();return _go(v,p)}}
// cabeçalho, menu lateral e barra inferior montados junto com o shell
{const _shell=shell;shell=function(){_shell();
  const tin=$('.top-in');if(tin&&!$('#lyMais')){tin.insertAdjacentHTML('beforeend',`<button class="ly-mais" id="lyMais" data-a="lyAbrir" aria-label="Abrir menu">⋮</button>`)}
  const app=$('#app');if(app&&!$('#lyDrawer')){app.insertAdjacentHTML('beforeend',`<div class="ly-fundo" data-a="lyFechar"></div><aside class="ly-drawer" id="lyDrawer" aria-hidden="true"></aside><nav class="ly-barra" id="lyBarra"></nav>`)}
  const who=$('#who');if(who){const b=who.querySelector('b');if(b)b.textContent=String(S.u.nome||'').split(' ')[0]}
  const bar=$('#lyBarra');if(bar)bar.innerHTML=lyBarra();document.body.classList.toggle('ly-semBarra',S.view==='a_prova');
  ['pf-aluno','pf-professor','pf-admin'].forEach(c=>document.body.classList.remove(c));document.body.classList.add('pf-'+S.u.perfil);
  const nav=$('#nav');if(nav)nav.innerHTML=`<div class="ly-navu"><div class="ly-av sm">${esc(lyIniciais(S.u.nome).toUpperCase())}</div><div class="ly-un"><b>${esc(S.u.nome)}</b><span class="role ${S.u.perfil}">${LY_PERFIL[S.u.perfil]}</span></div></div>`+lyItens().map(([t,L])=>`<div class="ly-sec">${esc(t)}</div>${L.map((it,i)=>{const b=S.badge[it.v];return `<button class="ly-it${lyAtivo(it)?' on':''}" data-go="${it.v}"${Object.keys(it.p).length?` data-p="${P(it.p)}"`:''}><span class="ly-ic" style="--c:${LY_COR[i%LY_COR.length]}">${it.ic}</span><span class="ly-l">${esc(it.l)}</span>${b?`<span class="bdg">${b==='novo'?'novo':b}</span>`:''}</button>`}).join('')}`).join('')+`<a href="#" class="ly-sair" data-a="lySair"><span class="ly-ic" style="--c:#dc2626">🚪</span><span class="ly-l">Sair</span></a>`;
  if(LY.aberto){const d=$('#lyDrawer');if(d)d.innerHTML=lyDrawerHtml()}}}
// depois de cada tela: atualiza contadores da barra e monta o novo Início
{const _render=render;render=async function(){const r=await _render.apply(this,arguments);try{lyDepois()}catch(e){}return r}}
function lyDepois(){if(!S.u)return;const bar=$('#lyBarra');if(bar)bar.innerHTML=lyBarra();
  if(['a_inicio','p_inicio','ad_inicio'].indexOf(S.view)>=0)lyInicio()}
// ---------- TELA INICIAL ----------
const LY_ATALHOS={
  admin:[['__alunos','Alunos','Cadastro e acesso'],['__professores','Professores','Equipe e turmas'],['p_pendentes','Quem não fez','Prova de hoje'],['p_faltas','Notas e faltas','Quadro e avisos às mães'],['p_redacoes','Redações','Correção completa'],['p_reforco','Reforço','Por aluno'],['ad_relatorios','Relatórios','Desempenho geral'],['ad_config','Configurações','Ajustes do sistema']],
  professor:[['p_turmas','Turmas','Alunos e códigos'],['p_atividades','Atividades','Criar e publicar'],['p_pendentes','Quem não fez','Prova de hoje'],['p_faltas','Notas e faltas','Quadro e avisos às mães'],['p_correcoes','Correções','Entregas para corrigir'],['p_redacoes','Redações','Correção completa'],['p_reforco','Reforço','Por aluno'],['p_relatorios','Relatórios','Desempenho da turma']],
  aluno:[['a_atividades','Prova do dia','Fazer a prova de hoje'],['__lista','Atividades do professor','Exercícios e trabalhos'],['a_biblioteca','Biblioteca','Vídeos e explicações'],['a_tutor','Tutor IA','Tire suas dúvidas'],['a_notas','Minhas notas','Resultados'],['a_turmas','Turmas','Minhas turmas']]
};
const LY_FUNDO=['#e8efff','#f1e9ff','#e0f7fb','#e3f8ea','#fff0e3','#ffe8f2','#fff7d6','#ecebff'];
function lyInicio(){
  const m=$('#main');if(!m||m.querySelector('.ly-hero'))return;const u=S.u;const pf=u.perfil;const menu=lyMenu();const porId={};menu.forEach(x=>{porId[x[0]]=x});
  const at=(LY_ATALHOS[pf]||[]).map(([k,l,d])=>{if(LY_EXTRA[k]){const [v,ic,,p]=LY_EXTRA[k];return VIEWS[v]&&(porId[v]||v==='a_lista')?{v,ic,l,d,p:p||{}}:null}
    return porId[k]&&VIEWS[k]?{v:k,ic:porId[k][1],l,d,p:{}}:null}).filter(Boolean);
  if(pf==='aluno'&&typeof alunoCache!=='undefined'&&alunoCache){const n=alunoCache.atividades.filter(x=>x.tipo!=='desafio'&&(x.situacao==='pendente'||x.situacao==='atrasada'&&x.podeEnviar)).length;at.forEach(x=>{if(x.v==='a_lista'&&n)x.d=n+' pendente'+(n>1?'s':'')})}
  const h=new Date().getHours();const sd=h<12?'Bom dia':h<18?'Boa tarde':'Boa noite';
  const hoje=new Date().toLocaleDateString('pt-BR',{weekday:'long',day:'numeric',month:'long'});
  const hero=`<div class="ly-hero ${pf}"><div class="ly-hl"><span class="ly-chip">${pf==='admin'?'🛡️':pf==='professor'?'🧑‍🏫':'🎒'} ${LY_PERFIL[pf]}</span><h1>Olá, ${esc(String(u.nome||'').split(' ')[0])}! 👋</h1><p>${pf==='admin'?'Painel administrativo · ':''}${sd} · ${esc(hoje)}</p></div><div class="ly-hav">${esc(lyIniciais(u.nome).toUpperCase())}</div></div>
  <div class="ly-sect"><h2>Acesso rápido</h2></div>
  <div class="ly-grid">${at.map((x,i)=>{const b=S.badge[x.v];return `<button class="ly-at" data-go="${x.v}"${Object.keys(x.p).length?` data-p="${P(x.p)}"`:''}><span class="ly-ai" style="background:${LY_FUNDO[i%8]};color:${LY_COR[i%8]}">${x.ic}</span><b>${esc(x.l)}</b><small>${esc(x.d)}</small>${b?`<i class="ly-ab">${b==='novo'?'novo':b}</i>`:''}</button>`}).join('')}</div>
  <div class="ly-sect"><h2>Resumo</h2></div>`;
  const ph=m.querySelector(':scope > .ph');
  if(ph)ph.outerHTML=hero;else m.insertAdjacentHTML('afterbegin',hero);
  // avisos importantes (prova pendente, alunos que não fizeram…) logo abaixo do cartão de boas-vindas
  const avisos=[...m.querySelectorAll(':scope > .note, :scope > .ft-alerta, :scope > .aviso-prova')];const sec=m.querySelector('.ly-sect');
  if(avisos.length&&sec){const box=document.createElement('div');box.className='ly-avisos';avisos.forEach(x=>box.appendChild(x));sec.before(box)}
}

if('serviceWorker' in navigator){window.addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(()=>{})})}

  try{S.info=await api('info');document.title=S.info.nome}catch(e){}
  if(S.token){try{const r=await api('eu');S.u=r.usuario;S.cfg=r.cfg;iaVerificar()}catch(e){S.token=null;LS.del('sd_token')}}
  render();
})();
</script>
