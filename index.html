  ${ED.indiv?`<div class="chks" style="margin-bottom:12px">${uniq.map(x=>`<label class="chk"><input type="checkbox" data-aluno="${x.id}" ${a.alunos.includes(x.id)?'checked':''}><span>${esc(x.nome)} <span class="muted small">${esc(x.turma)}</span></span></label>`).join('')||'<span class="muted small">Escolha uma turma com alunos.</span>'}</div>`:''}
  <div class="row2"><label>Abertura <span class="opt">(vazio = imediata)</span><input type="datetime-local" data-e="abertura" value="${toLocalInput(a.abertura)}"></label><label>Encerramento <span class="opt">(vazio = sem prazo)</span><input type="datetime-local" data-e="encerramento" value="${toLocalInput(a.encerramento)}"></label></div>
  <label class="chk"><input type="checkbox" data-e="aceitaAtraso" ${a.aceitaAtraso?'checked':''}><span>Aceitar entregas depois do encerramento (ficam marcadas como atrasadas)</span></label></div>
  <h3 style="margin:16px 0 10px">Questões</h3>`;
  a.questoes.forEach((q,i)=>{h+=`<div class="qed"><div class="qh"><span class="qn">${i+1}</span><span class="qtag">${TIPOQ[q.tipo]}</span><div class="tools"><button data-a="qMv" data-i="${i}" data-v="-1" title="Subir">↑</button><button data-a="qMv" data-i="${i}" data-v="1" title="Descer">↓</button><button data-a="qDup" data-i="${i}" title="Duplicar">⧉</button><button data-a="qDel" data-i="${i}" title="Excluir" style="color:var(--bad)">✕</button></div></div>
    <label>Enunciado<textarea data-qe="${i}" data-f="enunciado" rows="2">${esc(q.enunciado)}</textarea></label>
    ${q.textoApoio||ED.abrirApoio[i]?`<label>Texto de apoio<textarea data-qe="${i}" data-f="textoApoio" rows="4" placeholder="Texto, poema, trecho, tabela…">${esc(q.textoApoio)}</textarea></label>`:''}
    ${q.imagem?`<div style="position:relative;margin-bottom:10px"><img class="qimg" data-img="${esc(q.imagem)}" style="max-height:220px"><button class="btn sm dan" data-a="qImgRm" data-i="${i}">Remover imagem</button></div>`:''}
    <div class="fbtns" style="margin:0 0 10px">${!q.textoApoio&&!ED.abrirApoio[i]?`<button class="btn sm" data-a="qApoio" data-i="${i}">+ Texto de apoio</button>`:''}<label class="btn sm" style="margin:0">${q.imagem?'Trocar imagem':'+ Imagem'}<input type="file" accept="image/*" data-qimg="${i}" hidden></label></div>`;
    if(q.tipo==='mc')h+=`<div class="small muted" style="font-weight:800;margin-bottom:6px">Alternativas — marque a correta</div>${q.opcoes.map((o,j)=>`<div class="opt"><input type="radio" name="c${i}" data-a="qCor" data-i="${i}" data-j="${j}" ${q.correta===j?'checked':''}><b>${L(j)})</b><input data-qo="${i}" data-j="${j}" value="${esc(o)}" placeholder="Alternativa ${L(j)}">${q.opcoes.length>2?`<button class="rm" data-a="qOpRm" data-i="${i}" data-j="${j}">✕</button>`:''}</div>`).join('')}${q.opcoes.length<8?`<button class="lnk" data-a="qOpAdd" data-i="${i}">+ alternativa</button>`:''}`;
    if(q.tipo==='vf')h+=`<div class="small muted" style="font-weight:800;margin-bottom:6px">A afirmação é:</div><div class="vf" style="margin-bottom:8px"><label class="ch ${q.correta===true?'right':''}"><input type="radio" name="c${i}" data-a="qVf" data-i="${i}" data-v="1" ${q.correta===true?'checked':''}>Verdadeira</label><label class="ch ${q.correta===false?'right':''}"><input type="radio" name="c${i}" data-a="qVf" data-i="${i}" data-v="" ${q.correta===false?'checked':''}>Falsa</label></div>`;
    h+=`<div class="row2" style="margin-top:10px"><label>Pontuação<input type="number" min="0" step="0.5" data-qe="${i}" data-f="pontos" value="${esc(q.pontos)}"></label><label class="chk" style="align-self:end"><input type="checkbox" data-qe="${i}" data-f="permiteFoto" ${q.permiteFoto?'checked':''}><span>Aluno pode enviar foto (ex.: do caderno)</span></label></div>
    <label>${q.tipo==='disc'?'Resposta esperada / critérios <span class="opt">(o aluno vê depois da correção)</span>':'Explicação <span class="opt">(o aluno vê depois da correção)</span>'}<textarea data-qe="${i}" data-f="explicacao" rows="2">${esc(q.explicacao)}</textarea></label></div>`;});
  h+=`<div class="addq"><button class="btn" data-a="qAdd" data-t="mc">+ Múltipla escolha</button><button class="btn" data-a="qAdd" data-t="vf">+ Verdadeiro/Falso</button><button class="btn" data-a="qAdd" data-t="disc">+ Discursiva</button></div>
  <div class="err" id="edErr"></div><div class="savebar"><span class="st">${pts(total)} pontos no total</span><button class="btn" data-a="edSalvar" data-s="rascunho">Salvar rascunho</button><button class="btn pri" data-a="edSalvar" data-s="publicada">${a.status==='publicada'?'Salvar e manter publicada':'Publicar'}</button></div>`;
  $('#edw').innerHTML=h;carregaImgs();
  $$('#edw [data-e]').forEach(el=>el.addEventListener(el.type==='checkbox'||el.tagName==='SELECT'?'change':'input',()=>{const k=el.dataset.e;a[k]=el.type==='checkbox'?el.checked:(el.type==='datetime-local'?fromLocalInput(el.value):el.value)}));
  $$('#edw [data-qe]').forEach(el=>el.addEventListener(el.type==='checkbox'?'change':'input',()=>{const q=a.questoes[+el.dataset.qe];const f=el.dataset.f;q[f]=el.type==='checkbox'?el.checked:(f==='pontos'?Number(el.value):el.value);if(f==='pontos')$('#edw .savebar .st').textContent=pts(a.questoes.reduce((s,x)=>s+(Number(x.pontos)||0),0))+' pontos no total'}));
  $$('#edw [data-qo]').forEach(el=>el.addEventListener('input',()=>{a.questoes[+el.dataset.qo].opcoes[+el.dataset.j]=el.value}));
  $$('#edw [data-turma]').forEach(el=>el.addEventListener('change',()=>{const id=el.dataset.turma;a.turmas=el.checked?[...new Set([...a.turmas,id])]:a.turmas.filter(x=>x!==id);if(ED.indiv)redraw()}));
  const iv=$('#indiv');iv.onchange=()=>{ED.indiv=iv.checked;if(!iv.checked)a.alunos=[];redraw()};
  $$('#edw [data-aluno]').forEach(el=>el.addEventListener('change',()=>{const id=el.dataset.aluno;a.alunos=el.checked?[...new Set([...a.alunos,id])]:a.alunos.filter(x=>x!==id)}));
  $$('#edw [data-qimg]').forEach(el=>el.addEventListener('change',async()=>{const i=+el.dataset.qimg;const f=el.files[0];if(!f)return;toast('Enviando imagem…');
    try{const url=await comprimir(f);const r=await api('uploadImagem',{dataUrl:url});S.img[r.id]=Promise.resolve(url);a.questoes[i].imagem=r.id;redraw();toast('Imagem adicionada ✓')}catch(e){toast(e.message)}}));
}
function redraw(){const y=window.scrollY;drawEditor();window.scrollTo(0,y)}
ACOES.qAdd=d=>{ED.a.questoes.push(novaQ(d.t));drawEditor();setTimeout(()=>{const q=$$('#edw .qed');if(q.length)q[q.length-1].scrollIntoView({behavior:'smooth',block:'center'})},50)};
ACOES.qDel=async d=>{if(ED.a.questoes.length===1){toast('A atividade precisa de pelo menos uma questão.');return}if(!await confirmar('Excluir questão',`Excluir a questão ${+d.i+1}?`,'Excluir',true))return;ED.a.questoes.splice(+d.i,1);redraw()};
ACOES.qDup=d=>{const i=+d.i;ED.a.questoes.splice(i+1,0,JSON.parse(JSON.stringify(ED.a.questoes[i])));redraw()};
ACOES.qMv=d=>{const i=+d.i,j=i+(+d.v);const Q=ED.a.questoes;if(j<0||j>=Q.length)return;[Q[i],Q[j]]=[Q[j],Q[i]];redraw()};
ACOES.qCor=d=>{ED.a.questoes[+d.i].correta=+d.j};
ACOES.qVf=d=>{ED.a.questoes[+d.i].correta=!!d.v;redraw()};
ACOES.qOpAdd=d=>{ED.a.questoes[+d.i].opcoes.push('');redraw()};
ACOES.qOpRm=d=>{const q=ED.a.questoes[+d.i],j=+d.j;q.opcoes.splice(j,1);if(q.correta===j)q.correta=null;else if(q.correta>j)q.correta--;redraw()};
ACOES.qApoio=d=>{ED.abrirApoio[+d.i]=true;redraw()};
ACOES.qImgRm=d=>{ED.a.questoes[+d.i].imagem='';redraw()};
ACOES.edSalvar=async(d,b)=>{const a=ED.a;a.status=d.s;$('#edErr').textContent='';
  if(d.s==='publicada'&&ED.indiv&&!a.alunos.length){$('#edErr').textContent='Escolha os alunos ou desmarque "Publicar só para alguns alunos".';return}
  await busy(b,async()=>{try{const r=await api('atividadeSalvar',{atividade:a});toast(d.s==='publicada'?'Atividade publicada ✓':'Rascunho salvo ✓');go('p_entregas',{id:r.id})}catch(e){$('#edErr').textContent=e.message;toast(e.message)}})};

/* ---- correção ---- */
VIEWS.p_correcoes=async function(){
  const L2=await api('correcoesPendentes');S.badge.p_correcoes=L2.length;
  return `<div class="ph"><div><h1>Correções</h1><p>Entregas aguardando correção e pedidos de revisão</p></div></div>
  <div class="list">${L2.length?L2.map(x=>`<button class="it" data-go="p_corrigir" data-p="${P({id:x.id})}"><div class="ic">${x.revisao?'🔁':'📄'}</div><div class="mid"><div class="t">${esc(x.aluno)}</div><div class="s">${esc(x.atividade)} · enviada ${fdh(x.enviadoEm)}${x.atrasada?' · atrasada':''}</div></div><div class="end"><span class="pill ${x.revisao?'agendada':'enviada'}">${x.revisao?'Revisão pedida':'Corrigir'}</span></div></button>`).join(''):empty('✅','Tudo corrigido!','As questões objetivas são corrigidas automaticamente.')}</div>`;
};
let CO=null;
VIEWS.p_corrigir=async function(p){
  const r=await api('entregaObter',{id:p.id});const e=r.entrega,a=r.atividade;
  const c=e.correcao||{pontos:[],comentarios:[]};
  CO={id:e.id,aId:a.id,pontos:a.questoes.map((q,i)=>c.pontos[i]==null?'':c.pontos[i]),coms:a.questoes.map((q,i)=>(c.comentarios||[])[i]||'')};
  const idx=r.irmas.findIndex(x=>x.id===e.id);const prox=r.irmas[idx+1],ant=r.irmas[idx-1];
  let h=`<button class="back" data-go="p_entregas" data-p="${P({id:a.id})}">← ${esc(a.titulo)}</button>
  <div class="ph"><div><h1>${esc(r.aluno?r.aluno.nome:'Aluno')}</h1><p>${esc(a.titulo)} · enviada ${fdh(e.enviadoEm)}${e.atrasada?' · <b style="color:var(--bad)">atrasada</b>':''}</p></div><div style="display:flex;gap:6px">${ant?`<button class="btn sm" data-go="p_corrigir" data-p="${P({id:ant.id})}">← Anterior</button>`:''}${prox?`<button class="btn sm" data-go="p_corrigir" data-p="${P({id:prox.id})}">Próximo →</button>`:''}</div></div>`;
  if(e.revisaoPedida)h+=`<div class="note">🔁 <b>Pedido de revisão do aluno:</b> ${esc(e.revisaoMsg)}</div>`;
  if((e.historico||[]).length)h+=`<details class="card"><summary style="font-weight:800;cursor:pointer">Histórico de notas (${e.historico.length})</summary><div class="small" style="margin-top:8px">${e.historico.map(x=>`${fdh(x.em)} — ${esc(x.por)}: ${x.anterior!=null?pts(x.anterior)+' → ':''}<b>${pts(x.nota)}</b> pts`).join('<br>')}</div></details>`;
  a.questoes.forEach((q,i)=>{const resp=(e.respostas||[])[i];const fs=(e.fotos||{})[i]||[];
    h+=`<div class="q"><div class="qh"><span class="qn">${i+1}</span><span class="qtag">${TIPOQ[q.tipo]}${q.tipo!=='disc'?' · correção automática':''}</span><span class="qpts">vale ${pts(q.pontos)}</span></div><div class="enun">${esc(q.enunciado)}</div>`;
    if(q.tipo==='mc')h+=`<div class="resp">Aluno marcou: <b>${resp!=null?L(resp)+') '+esc(q.opcoes[resp]):'(em branco)'}</b><br>Correta: <b>${L(q.correta)}) ${esc(q.opcoes[q.correta])}</b> ${resp===q.correta?'✅':'❌'}</div>`;
    if(q.tipo==='vf')h+=`<div class="resp">Aluno: <b>${resp===true?'Verdadeiro':resp===false?'Falso':'(em branco)'}</b> · Correta: <b>${q.correta?'Verdadeiro':'Falso'}</b> ${resp===q.correta?'✅':'❌'}</div>`;
    if(q.tipo==='disc')h+=`<div class="resp">${esc(resp||'(sem resposta escrita)')}</div>${q.explicacao?`<div class="fb">📋 Esperado: ${esc(q.explicacao)}</div>`:''}`;
    if(q.permiteFoto)h+=fs.length?`<div class="small muted" style="margin-top:8px;font-weight:800">📷 ${fs.length} foto${fs.length>1?'s':''} — toque para ampliar</div><div class="fotos">${fs.map(id=>`<div class="ft" style="width:130px;height:130px"><img data-img="${esc(id)}" alt="Foto do aluno"></div>`).join('')}</div>`:'<div class="small muted" style="margin-top:6px">Sem fotos.</div>';
    h+=`<div class="row2" style="margin-top:12px"><label>Pontos (0 a ${pts(q.pontos)})<input type="number" min="0" max="${q.pontos}" step="0.25" data-cp="${i}" value="${esc(CO.pontos[i])}"></label><label>Comentário <span class="opt">(opcional)</span><input data-cc="${i}" value="${esc(CO.coms[i])}"></label></div>
    <div style="display:flex;gap:6px"><button class="btn sm ok" data-a="cpSet" data-i="${i}" data-v="${q.pontos}">Certo (${pts(q.pontos)})</button><button class="btn sm" data-a="cpSet" data-i="${i}" data-v="${q.pontos/2}">Metade</button><button class="btn sm dan" data-a="cpSet" data-i="${i}" data-v="0">Errado (0)</button></div></div>`;});
  h+=`<div class="card"><label>Comentário geral para o aluno<textarea id="coG" rows="3">${esc(e.comentario||'')}</textarea></label>
  ${a.notasLiberadas?'<div class="small muted">As notas desta atividade já estão liberadas: o aluno verá a correção ao salvar.</div>':`<label class="chk"><input type="checkbox" id="coL"><span>Liberar as notas desta atividade para todos os alunos agora</span></label>`}</div>
  <div class="err" id="coE"></div><div class="savebar"><span class="st" id="coT"></span><button class="btn pri" data-a="coSalvar" data-prox="${prox?prox.id:''}">Salvar correção${prox?' e ir para o próximo':''}</button></div>`;
  return {html:h,depois(){
    const tot=()=>{const s=CO.pontos.reduce((x,p)=>x+(p===''?0:Number(p)),0);$('#coT').textContent=`Total: ${pts(s)} / ${pts(a.questoes.reduce((x,q)=>x+q.pontos,0))} pts · nota ${nota(s,a.questoes.reduce((x,q)=>x+q.pontos,0))}`};
    $$('[data-cp]').forEach(el=>el.addEventListener('input',()=>{CO.pontos[+el.dataset.cp]=el.value;tot()}));
    $$('[data-cc]').forEach(el=>el.addEventListener('input',()=>{CO.coms[+el.dataset.cc]=el.value}));tot();CO.tot=tot}};
};
ACOES.cpSet=d=>{CO.pontos[+d.i]=Number(d.v);const el=$(`[data-cp="${d.i}"]`);el.value=Number(d.v);CO.tot()};
ACOES.coSalvar=async(d,b)=>{$('#coE').textContent='';const l=$('#coL');
  await busy(b,async()=>{try{await api('entregaCorrigir',{id:CO.id,pontos:CO.pontos.map(p=>p===''?null:Number(p)),comentarios:CO.coms,comentario:$('#coG').value,liberar:!!(l&&l.checked)});toast('Correção salva ✓');
    if(d.prox)go('p_corrigir',{id:d.prox});else go('p_entregas',{id:CO.aId})}catch(e){$('#coE').textContent=e.message;toast(e.message)}})};

/* ---- relatórios do professor ---- */
VIEWS.p_relatorios=async function(p){
  const ts=(await api('turmas')).filter(t=>!t.arquivada||t.id===p.turma);const id=p.turma||(ts[0]&&ts[0].id);
  if(!id)return `<div class="ph"><div><h1>Relatórios</h1></div></div>`+empty('📊','Crie uma turma para ver relatórios','');
  const r=await api('relatorioTurma',{id});const AT=r.atividades;
  const cel=c=>c.s==='corrigida'?`<b>${nota(c.n,c.m)}</b>`:c.s==='enviada'?'<span class="pill enviada">enviada</span>':c.s==='atrasada'?'<span class="pill atrasada">não entregou</span>':c.s==='na'?'<span class="muted">—</span>':'<span class="pill pendente">pendente</span>';
  return `<div class="ph"><div><h1>Relatórios</h1><p>Desempenho individual e coletivo</p></div><button class="btn sm" onclick="window.print()">🖨️ Imprimir</button></div>
  <label style="max-width:420px">Turma<select id="selT">${ts.map(t=>`<option value="${t.id}" ${t.id===id?'selected':''}>${esc(t.nome)}</option>`).join('')}</select></label>
  <div class="grid g3" style="margin-bottom:14px"><div class="stat"><b>${r.linhas.length}</b><span>Alunos</span></div><div class="stat"><b>${AT.length}</b><span>Atividades publicadas</span></div><div class="stat"><b>${(()=>{const v=r.linhas.filter(l=>l.pct!=null);return v.length?pct(Math.round(v.reduce((s,l)=>s+l.pct,0)/v.length*10)/10):'—'})()}</b><span>Aproveitamento médio</span></div></div>
  ${r.disciplinas.length?`<div class="card"><h3>Desempenho por disciplina</h3>${r.disciplinas.map(x=>`<div class="srow"><div class="l"><span>${ic(x.nome)} ${esc(x.nome)}</span><span>${pct(x.pct)}</span></div><div class="bar"><i style="width:${x.pct||0}%"></i></div></div>`).join('')}</div>`:''}
  <h3 style="margin:14px 0 8px">Notas por aluno (escala 0–${S.cfg.escalaNota})</h3>
  ${r.linhas.length&&AT.length?`<div class="tbl"><table><tr><th>Aluno</th>${AT.map(a=>`<th title="${esc(a.titulo)}">${esc(a.titulo.length>22?a.titulo.slice(0,21)+'…':a.titulo)}</th>`).join('')}<th>Aproveit.</th></tr>
  ${r.linhas.map(l=>`<tr><td><button class="lnk" data-go="p_aluno" data-p="${P({id:l.id,turma:id})}">${esc(l.nome)}</button></td>${l.cel.map(cel).join('')}<td><b>${pct(l.pct)}</b></td></tr>`).join('')}
  <tr style="background:#f7f8fc"><td><b>Média / entregas</b></td>${r.medias.map(m=>`<td><b>${pct(m.pct)}</b><div class="small muted">${m.entregues}/${r.linhas.length}</div></td>`).join('')}<td></td></tr></table></div>`:empty('📊','Sem dados ainda','Publique atividades e aguarde as entregas.')}`;
};
document.addEventListener('change',e=>{if(e.target.id==='selT')go('p_relatorios',{turma:e.target.value})});

/* =================== ADMINISTRADOR =================== */
VIEWS.ad_inicio=async function(){
  const d=await api('adminPainel');
  return `<div class="ph"><div><h1>Painel administrativo</h1><p>Visão geral da plataforma</p></div></div>
  <div class="grid g4" style="margin-bottom:16px"><div class="stat click" data-go="ad_usuarios" data-p='{"perfil":"aluno"}'><b>${d.alunos}</b><span>Alunos</span></div><div class="stat click" data-go="ad_usuarios" data-p='{"perfil":"professor"}'><b>${d.professores}</b><span>Professores ativos</span></div><div class="stat click" data-go="p_turmas"><b>${d.turmas}</b><span>Turmas ativas</span></div><div class="stat click" data-go="p_atividades"><b>${d.atividades}</b><span>Atividades publicadas</span></div>
  <div class="stat"><b>${d.entregas}</b><span>Entregas recebidas</span></div><div class="stat click ${d.corrigir?'alert':''}" data-go="p_correcoes"><b>${d.corrigir}</b><span>Aguardando correção</span></div><div class="stat"><b>${d.bloqueados}</b><span>Contas bloqueadas</span></div><div class="stat"><b style="font-size:15px">${d.ultimoBackup?fdh(+d.ultimoBackup):'Ainda não feito'}</b><span>Último backup</span></div></div>
  ${d.professoresPendentes.length?`<h3 style="margin:8px 0">👨‍🏫 Professores aguardando aprovação</h3><div class="list" style="margin-bottom:16px">${d.professoresPendentes.map(u=>`<div class="it static"><div class="ic">👨‍🏫</div><div class="mid"><div class="t">${esc(u.nome)}</div><div class="s">${esc(u.login)} · ${esc(u.email)} · ${fdh(u.criadoEm)}</div></div><div class="end"><button class="btn sm ok" data-a="aprovProf" data-u="${P(u)}">Aprovar</button><button class="btn sm dan" data-a="usDel" data-id="${u.id}" data-n="${esc(u.nome)}">Recusar</button></div></div>`).join('')}</div>`:''}
  <div class="grid g2"><div class="card"><h3>Segurança e cópias</h3><p class="small muted">Cópia de segurança automática diária no banco de dados (mantém 30 dias).</p><button class="btn" data-a="backup">💾 Fazer backup agora</button> <button class="btn" data-a="verLogs">📜 Registro de atividades</button></div>
  <div class="card"><h3>Atalhos</h3><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn" data-a="usNovo">+ Novo usuário</button><button class="btn" data-go="ad_relatorios">📊 Relatórios</button><button class="btn" data-go="ad_config">⚙️ Configurações</button></div></div></div>`;
};
ACOES.aprovProf=async(d,b)=>{const u=JSON.parse(d.u);await busy(b,async()=>{try{await api('usuarioSalvar',{id:u.id,nome:u.nome,email:u.email,perfil:'professor',status:'ativo'});toast('Professor aprovado ✓');render()}catch(e){toast(e.message)}})};
ACOES.backup=async(d,b)=>{await busy(b,async()=>{try{await api('backupAgora');toast('Backup feito ✓');render()}catch(e){toast(e.message)}})};
ACOES.verLogs=async()=>{modal(`<div class="hd"><h2>Registro de atividades</h2><button class="x" data-a="fechar">✕</button></div>${spin()}`);try{const l=await api('logs');$('#sheet').innerHTML=`<div class="hd"><h2>Registro de atividades</h2><button class="x" data-a="fechar">✕</button></div><div class="tbl"><table><tr><th>Data</th><th>Usuário</th><th>Ação</th><th>Detalhe</th></tr>${l.map(x=>`<tr><td>${fdh(x.data)}</td><td>${esc(x.usuario)}</td><td>${esc(x.acao)}</td><td class="wrap">${esc(x.detalhe)}</td></tr>`).join('')}</table></div>`}catch(e){toast(e.message)}};
VIEWS.ad_usuarios=async function(p){
  const lista=await api('usuarios',{busca:p.b||'',perfil:p.perfil||''});
  const tab=(k,l)=>`<button class="${(p.perfil||'')===k?'on':''}" data-go="ad_usuarios" data-p="${P({perfil:k,b:p.b})}">${l}</button>`;
  return {html:`<div class="ph"><div><h1>Usuários</h1><p>Professores, alunos e administradores</p></div><button class="btn pri" data-a="usNovo">+ Novo usuário</button></div>
  <div class="tabs">${tab('','Todos')}${tab('aluno','Alunos')}${tab('professor','Professores')}${tab('admin','Administradores')}</div>
  <form id="fB" style="display:flex;gap:8px;margin-bottom:12px"><input name="b" placeholder="🔎 Nome, usuário ou e-mail" value="${esc(p.b||'')}"><button class="btn">Buscar</button></form>
  ${lista.length?`<div class="tbl"><table><tr><th>Nome</th><th>Usuário</th><th>Perfil</th><th>Situação</th><th>Último acesso</th><th></th></tr>${lista.map(u=>`<tr><td><b>${esc(u.nome)}</b>${u.menor?' <span class="pill pendente" title="Responsável: '+esc(u.responsavelNome+' '+u.responsavelEmail)+'">menor</span>':''}<div class="small muted">${esc(u.email)}</div></td><td>${esc(u.login)}</td><td><span class="pill ${u.perfil==='admin'?'admin':''}">${{aluno:'Aluno',professor:'Professor',admin:'Admin'}[u.perfil]}</span></td><td><span class="pill ${u.status}">${{ativo:'Ativo',bloqueado:'Bloqueado',pendente:'Aguardando aprovação'}[u.status]}</span></td><td>${fdh(u.ultimoAcesso)}</td><td style="text-align:right"><button class="btn sm" data-a="usEdit" data-u="${P(u)}">Editar</button> <button class="btn sm" data-a="usSenha" data-id="${u.id}" data-n="${esc(u.nome)}">Nova senha</button></td></tr>`).join('')}</table></div>`:empty('🔎','Nenhum usuário encontrado','')}`,
  depois(){const f=$('#fB');f.onsubmit=ev=>{ev.preventDefault();go('ad_usuarios',{perfil:p.perfil,b:f.elements.b.value})}}};
};
ACOES.usNovo=()=>{modal(`<div class="hd"><h2>Novo usuário</h2><button class="x" data-a="fechar">✕</button></div><form id="fU"><label>Perfil<select name="perfil"><option value="aluno">Aluno</option><option value="professor">Professor</option><option value="admin">Administrador</option></select></label>
  <label>Nome completo<input name="nome" required></label><div class="row2"><label>Usuário<input name="login" autocapitalize="none" required></label><label>E-mail <span class="opt">(opcional)</span><input name="email" type="email" autocapitalize="none"></label></div>
  <label>Senha provisória <span class="opt">(vazio = gerar)</span><input name="senha"></label><div class="err" id="err"></div><div class="ft2"><button type="button" class="btn" data-a="fechar">Cancelar</button><button class="btn pri">Criar</button></div></form>`);
  const f=$('#fU');f.onsubmit=async ev=>{ev.preventDefault();await busy(f.querySelector('.pri'),async()=>{try{const r=await api('usuarioCriar',{perfil:f.elements.perfil.value,nome:f.elements.nome.value,login:f.elements.login.value,email:f.elements.email.value,senha:f.elements.senha.value});mostraSenha(r.login,r.senha,'Usuário criado ✓');if(S.view==='ad_usuarios')render()}catch(e){$('#err').textContent=e.message}})}};
ACOES.usEdit=d=>{const u=JSON.parse(d.u);modal(`<div class="hd"><h2>Editar usuário</h2><button class="x" data-a="fechar">✕</button></div><form id="fE"><label>Nome completo<input name="nome" value="${esc(u.nome)}" required></label><label>E-mail<input name="email" type="email" value="${esc(u.email)}"></label>
  <div class="row2"><label>Perfil<select name="perfil">${['aluno','professor','admin'].map(x=>`<option value="${x}" ${u.perfil===x?'selected':''}>${{aluno:'Aluno',professor:'Professor',admin:'Administrador'}[x]}</option>`).join('')}</select></label><label>Situação<select name="status">${['ativo','bloqueado','pendente'].map(x=>`<option value="${x}" ${u.status===x?'selected':''}>${{ativo:'Ativo',bloqueado:'Bloqueado',pendente:'Aguardando aprovação'}[x]}</option>`).join('')}</select></label></div>
  <div class="kv small" style="margin-bottom:12px"><b>Usuário</b><span>${esc(u.login)}</span><b>Cadastro</b><span>${fdh(u.criadoEm)}</span>${u.nascimento?`<b>Nascimento</b><span>${esc(u.nascimento.split('-').reverse().join('/'))}</span>`:''}${u.responsavelNome?`<b>Responsável</b><span>${esc(u.responsavelNome)} · ${esc(u.responsavelEmail)}</span>`:''}</div>
  <div class="err" id="err"></div><div class="ft2"><button type="button" class="btn dan" data-a="usDel" data-id="${u.id}" data-n="${esc(u.nome)}">Excluir</button><button class="btn pri">Salvar</button></div></form>`);
  const f=$('#fE');f.onsubmit=async ev=>{ev.preventDefault();await busy(f.querySelector('.pri'),async()=>{try{await api('usuarioSalvar',{id:u.id,nome:f.elements.nome.value,email:f.elements.email.value,perfil:f.elements.perfil.value,status:f.elements.status.value});fechar();toast('Usuário atualizado ✓');render()}catch(e){$('#err').textContent=e.message}})}};
ACOES.usSenha=async d=>{if(!await confirmar('Gerar nova senha',`Gerar senha provisória para <b>${esc(d.n)}</b>?`,'Gerar'))return;try{const r=await api('usuarioSenha',{id:d.id});mostraSenha(r.login,r.senha,'Nova senha gerada')}catch(e){toast(e.message)}};
ACOES.usDel=async d=>{fechar();if(!await confirmar('Excluir usuário',`Excluir <b>${esc(d.n)}</b> definitivamente? Para alunos, todas as respostas, fotos e notas são apagadas (LGPD).`,'Excluir',true))return;try{await api('usuarioExcluir',{id:d.id});toast('Usuário excluído');render()}catch(e){toast(e.message)}};
VIEWS.ad_config=async function(){
  const c=await api('configObter');
  return {html:`<div class="ph"><div><h1>Configurações</h1><p>Regras gerais da plataforma</p></div></div><form id="fC"><div class="grid g2"><div class="card"><h3 style="margin-bottom:10px">Geral</h3>
  <label>Nome da plataforma<input name="nomePlataforma" value="${esc(c.nomePlataforma)}"></label><label>E-mail de contato da escola <span class="opt">(aparece no login)</span><input name="emailContato" type="email" value="${esc(c.emailContato||'')}"></label>
  <label>Escala da nota<select name="escalaNota"><option value="10" ${c.escalaNota==10?'selected':''}>0 a 10</option><option value="100" ${c.escalaNota==100?'selected':''}>0 a 100</option></select></label></div>
  <div class="card"><h3 style="margin-bottom:10px">Cadastros</h3><label class="chk"><input type="checkbox" name="cadastroAlunos" ${c.cadastroAlunos?'checked':''}><span>Alunos podem criar a própria conta</span></label>
  <label class="chk"><input type="checkbox" name="cadastroProfessores" ${c.cadastroProfessores?'checked':''}><span>Professores podem criar a própria conta</span></label><label class="chk"><input type="checkbox" name="aprovarProfessores" ${c.aprovarProfessores?'checked':''}><span>Novos professores precisam de aprovação do administrador</span></label></div>
  <div class="card"><h3 style="margin-bottom:10px">Fotos</h3><div class="row2"><label>Tamanho máximo por foto (MB)<input name="fotoMaxMB" type="number" min="1" max="10" value="${esc(c.fotoMaxMB)}"></label><label>Fotos por questão<input name="fotosPorQuestao" type="number" min="1" max="20" value="${esc(c.fotosPorQuestao)}"></label></div><p class="small muted">Formatos aceitos: JPG, PNG e WEBP (fotos do celular são convertidas e comprimidas automaticamente).</p></div></div>
  <div class="err" id="err"></div><button class="btn pri">Salvar configurações</button></form>`,
  depois(){const f=$('#fC');f.onsubmit=async ev=>{ev.preventDefault();const o={};['nomePlataforma','emailContato','escalaNota','fotoMaxMB','fotosPorQuestao'].forEach(k=>o[k]=f.elements[k].value);['cadastroAlunos','cadastroProfessores','aprovarProfessores'].forEach(k=>o[k]=f.elements[k].checked);
    await busy(f.querySelector('.pri'),async()=>{try{const r=await api('configSalvar',{config:o});S.info.nome=r.nomePlataforma;S.cfg.escalaNota=r.escalaNota;S.cfg.fotoMaxMB=r.fotoMaxMB;S.cfg.fotosPorQuestao=r.fotosPorQuestao;shell();toast('Configurações salvas ✓')}catch(e){$('#err').textContent=e.message}})}}};
};
VIEWS.ad_relatorios=async function(){
  const r=await api('relatorioGeral');const t=r.totais;
  return `<div class="ph"><div><h1>Relatórios gerais</h1><p>Toda a plataforma</p></div><div style="display:flex;gap:6px"><button class="btn sm" onclick="window.print()">🖨️ Imprimir</button><button class="btn sm pri" data-a="exportar">⬇️ Baixar relatórios (CSV)</button></div></div>
  <div class="grid g4" style="margin-bottom:14px"><div class="stat"><b>${t.alunos}</b><span>Alunos cadastrados (${t.alunosMenores} menores)</span></div><div class="stat"><b>${t.professores}</b><span>Professores</span></div><div class="stat"><b>${t.publicadas}</b><span>Atividades publicadas</span></div><div class="stat"><b>${t.rascunhos}</b><span>Rascunhos</span></div>
  <div class="stat"><b>${t.respondidas}</b><span>Atividades respondidas</span></div><div class="stat"><b>${t.corrigidas}</b><span>Corrigidas</span></div><div class="stat ${t.aguardando?'alert':''}"><b>${t.aguardando}</b><span>Aguardando correção</span></div><div class="stat"><b>${t.pendentes}</b><span>Pendentes (não entregues)</span></div></div>
  <h3 style="margin:10px 0">Desempenho por turma</h3>${r.turmas.length?`<div class="tbl"><table><tr><th>Turma</th><th>Professor</th><th>Alunos</th><th>Atividades</th><th>Entregues</th><th>Pendentes</th><th>Aproveitamento</th></tr>${r.turmas.map(x=>`<tr><td><button class="lnk" data-go="p_relatorios" data-p="${P({turma:x.id})}">${esc(x.nome)}</button>${x.arquivada?' <span class="pill">arquivada</span>':''}</td><td>${esc(x.professor)}</td><td>${x.alunos}</td><td>${x.atividades}</td><td>${x.entregues}</td><td>${x.pendentes}</td><td><b>${pct(x.pct)}</b></td></tr>`).join('')}</table></div>`:empty('👥','Nenhuma turma','')}
  <div class="card" style="margin-top:14px"><h3>Desempenho por disciplina</h3>${r.disciplinas.length?r.disciplinas.map(x=>`<div class="srow"><div class="l"><span>${ic(x.nome)} ${esc(x.nome)}</span><span>${pct(x.pct)} · ${x.correcoes} correções</span></div><div class="bar"><i style="width:${x.pct||0}%"></i></div></div>`).join(''):'<p class="muted">Sem correções ainda.</p>'}</div>
  <p class="small muted">Notas por aluno: abra a turma em Relatórios por turma, ou baixe os relatórios em CSV (turmas, disciplinas, alunos e notas).</p>`;
};
ACOES.exportar=async(d,b)=>{await busy(b,async()=>{try{const r=await api('exportarPlanilha');
  modal(`<div class="hd"><h2>Baixar relatórios</h2><button class="x" data-a="fechar">✕</button></div><p>Arquivos CSV (abrem no Excel e no Google Planilhas):</p><div class="list">${r.arquivos.map(f=>`<a class="btn full" download="${esc(f.nome)}" href="${URL.createObjectURL(new Blob([f.csv],{type:'text/csv;charset=utf-8'}))}">⬇️ ${esc(f.nome)}</a>`).join('')}</div>`)}catch(e){toast(e.message)}})};

/* =================== INÍCIO =================== */
if('serviceWorker' in navigator){window.addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(()=>{})})}
(async function iniciar(){
  try{S.info=await api('info');document.title=S.info.nome}catch(e){}
  if(S.token){try{const r=await api('eu');S.u=r.usuario;S.cfg=r.cfg}catch(e){S.token=null;LS.del('sd_token')}}
  render();
})();
</script>
</body>
</html>
