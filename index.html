<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2f5bea">
<meta name="description" content="Sala Digital – ambiente virtual de aprendizagem">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icone.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icone-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Sala Digital</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f6fb;--card:#fff;--ink:#16203a;--mut:#647089;--line:#e3e7f0;--pri:#2f5bea;--pri2:#e9efff;--pri3:#1b3fb8;
--ok:#14915a;--okb:#e5f6ee;--bad:#d63c3c;--badb:#fdecec;--warn:#b26a00;--warnb:#fff3dc;--vio:#7a3fe0;--viob:#f1eaff;--r:16px;--sh:0 1px 2px rgba(22,32,58,.05),0 4px 16px rgba(22,32,58,.05)}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Nunito,system-ui,-apple-system,sans-serif;font-size:16px;-webkit-text-size-adjust:100%}
button,input,textarea,select{font:inherit;color:inherit}
a{color:var(--pri)}
h1,h2,h3{line-height:1.2;margin:0}
.hidden{display:none!important}
/* ---- login ---- */
.auth{min-height:100vh;display:grid;place-items:center;padding:24px 16px;background:radial-gradient(1200px 500px at 0% 0%,#dfe7ff 0,transparent 60%),radial-gradient(900px 500px at 100% 100%,#eadfff 0,transparent 60%),var(--bg)}
.auth-box{width:100%;max-width:440px}
.logo{display:flex;align-items:center;gap:12px;margin-bottom:18px}
.logo .mk{width:48px;height:48px;border-radius:14px;background:linear-gradient(135deg,var(--pri),var(--vio));display:grid;place-items:center;color:#fff;font-size:26px;box-shadow:0 6px 16px rgba(47,91,234,.3)}
.logo b{font-size:24px;font-weight:900;letter-spacing:-.4px}.logo small{display:block;color:var(--mut);font-weight:700;font-size:13px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--sh);margin-bottom:14px}
.seg{display:flex;background:#e9edf6;border-radius:12px;padding:4px;gap:4px;margin-bottom:16px}
.seg button{flex:1;border:0;background:transparent;border-radius:9px;padding:9px 6px;font-weight:800;cursor:pointer;color:var(--mut);font-size:14px}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
label{display:block;font-weight:800;font-size:14px;margin-bottom:12px}
label .opt{color:var(--mut);font-weight:600}
input:not([type=checkbox]):not([type=radio]):not([type=file]),textarea,select{display:block;width:100%;margin-top:5px;border:1.5px solid var(--line);border-radius:11px;padding:11px 12px;background:#fff;font-weight:600;outline:none;min-height:44px}
input:focus,textarea:focus,select:focus{border-color:var(--pri);box-shadow:0 0 0 3px var(--pri2)}
textarea{resize:vertical;min-height:80px}
.chk{display:flex;gap:10px;align-items:flex-start;font-weight:600;font-size:14px;margin:6px 0 12px;cursor:pointer}
.chk input{width:20px;height:20px;flex:none;margin:1px 0 0;accent-color:var(--pri)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:520px){.row2{grid-template-columns:1fr}}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:10px 14px;font-weight:800;cursor:pointer;min-height:44px;text-decoration:none;color:var(--ink);white-space:nowrap}
.btn:hover{border-color:#c9d1e3}
.btn.pri{background:var(--pri);border-color:var(--pri);color:#fff}.btn.pri:hover{background:var(--pri3)}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.dan{color:var(--bad)}.btn.dan.f{background:var(--bad);border-color:var(--bad);color:#fff}
.btn.sm{min-height:34px;padding:6px 10px;font-size:13px;border-radius:10px}
.btn.full{width:100%}.btn:disabled{opacity:.55;cursor:default}
.lnk{border:0;background:none;color:var(--pri);font-weight:800;cursor:pointer;padding:6px 0}
.err{color:var(--bad);font-weight:800;font-size:14px;margin:8px 0}
.msg{background:var(--okb);color:#0d6b42;border-radius:12px;padding:10px 12px;font-weight:700;font-size:14px;margin-bottom:12px}
.note{background:var(--warnb);color:#7a4a00;border-radius:12px;padding:10px 12px;font-weight:700;font-size:14px;margin-bottom:12px}
.info{background:var(--pri2);color:var(--pri3);border-radius:12px;padding:10px 12px;font-weight:700;font-size:14px;margin-bottom:12px}
.muted{color:var(--mut)}.small{font-size:13px}.center{text-align:center}
/* ---- app shell ---- */
.top{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.top-in{display:flex;align-items:center;gap:10px;padding:10px 16px;max-width:1200px;margin:0 auto}
.top .logo{margin:0}.top .logo .mk{width:36px;height:36px;font-size:19px;border-radius:11px}.top .logo b{font-size:18px}
.who{text-align:right;font-size:13px;line-height:1.2}.top-atu{margin-left:auto;display:inline-flex;align-items:center;gap:5px;border:1px solid var(--pri);background:var(--pri);color:#fff;font:inherit;font-size:13px;font-weight:700;padding:6px 11px;border-radius:999px;cursor:pointer;white-space:nowrap}.top-atu:hover{filter:brightness(1.08)}.top-atu:active{transform:scale(.96)}@media(max-width:420px){.top-atu{padding:6px 9px;font-size:12px}}.who b{display:block;font-size:14px}
.role{display:inline-block;font-size:11px;font-weight:900;text-transform:uppercase;letter-spacing:.5px;padding:2px 8px;border-radius:20px;background:var(--pri2);color:var(--pri3)}
.role.admin{background:var(--viob);color:var(--vio)}.role.aluno{background:var(--okb);color:var(--ok)}
.nav{display:flex;gap:6px;overflow-x:auto;padding:8px 16px 10px;max-width:1200px;margin:0 auto;scrollbar-width:none}
.nav::-webkit-scrollbar{display:none}
.nav button{flex:none;border:0;background:transparent;border-radius:11px;padding:8px 12px;font-weight:800;color:var(--mut);cursor:pointer;display:flex;gap:6px;align-items:center;font-size:14px}
.nav button.on{background:var(--ink);color:#fff}
.nav .bdg{background:var(--bad);color:#fff;border-radius:10px;padding:0 6px;font-size:11px}
main{max-width:1200px;margin:0 auto;padding:18px 16px 90px}
.ph{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.ph h1{font-size:24px;font-weight:900;letter-spacing:-.3px}.ph p{margin:4px 0 0;color:var(--mut);font-weight:600}
.back{border:0;background:none;color:var(--mut);font-weight:800;cursor:pointer;padding:0 0 8px;display:inline-flex;gap:4px}
.grid{display:grid;gap:12px}
.g4{grid-template-columns:repeat(4,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g2{grid-template-columns:repeat(2,1fr)}
@media(max-width:860px){.g4{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:1fr 1fr}}
@media(max-width:560px){.g3,.g2{grid-template-columns:1fr}}
.stat{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:14px;box-shadow:var(--sh)}
.stat b{display:block;font-size:28px;font-weight:900;letter-spacing:-.5px}.stat span{color:var(--mut);font-weight:700;font-size:13px}
.stat.click{cursor:pointer}.stat.alert b{color:var(--bad)}
.list{display:flex;flex-direction:column;gap:8px}
.it{display:flex;gap:12px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px;box-shadow:var(--sh);text-align:left;width:100%;cursor:pointer}
.it.static{cursor:default}
.it .ic{flex:none;width:42px;height:42px;border-radius:12px;display:grid;place-items:center;font-size:20px;background:var(--pri2)}
.it .mid{flex:1;min-width:0}.it .t{font-weight:800;line-height:1.25;overflow-wrap:anywhere}.it .s{font-size:13px;color:var(--mut);margin-top:3px;font-weight:600}
.it .end{flex:none;display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.pill{display:inline-block;font-size:12px;font-weight:900;padding:4px 9px;border-radius:20px;white-space:nowrap;background:#eef1f7;color:var(--mut)}
.pill.pendente,.pill.rascunho{background:var(--warnb);color:var(--warn)}.pill.atrasada,.pill.nao{background:var(--badb);color:var(--bad)}
.pill.enviada{background:var(--pri2);color:var(--pri3)}.pill.corrigida,.pill.publicada,.pill.aprovado,.pill.ativo{background:var(--okb);color:var(--ok)}
.pill.agendada,.pill.admin{background:var(--viob);color:var(--vio)}.pill.bloqueado,.pill.recusado{background:var(--badb);color:var(--bad)}
.tabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:12px;scrollbar-width:none}
.tabs button{flex:none;border:1.5px solid var(--line);background:#fff;border-radius:20px;padding:6px 12px;font-weight:800;font-size:13px;cursor:pointer}
.tabs button.on{background:var(--ink);border-color:var(--ink);color:#fff}
.empty{text-align:center;padding:30px 16px;color:var(--mut)}.empty .e{font-size:42px}.empty h3{color:var(--ink);margin:6px 0}
.code{font-family:ui-monospace,Menlo,monospace;font-weight:900;font-size:26px;letter-spacing:4px;background:var(--pri2);color:var(--pri3);padding:8px 14px;border-radius:12px;display:inline-block}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:14px;background:#fff}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th{background:#f7f8fc;font-weight:900;font-size:12px;text-transform:uppercase;letter-spacing:.3px;color:var(--mut);position:sticky;top:0}
td.wrap{white-space:normal;min-width:180px}
tr:last-child td{border-bottom:0}
.bar{height:10px;background:#edf0f6;border-radius:6px;overflow:hidden}.bar i{display:block;height:100%;border-radius:6px;background:var(--pri)}
.srow{margin:12px 0}.srow .l{display:flex;justify-content:space-between;font-weight:800;font-size:14px;margin-bottom:4px}
/* ---- questões / player ---- */
.q{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:12px;box-shadow:var(--sh)}
.q.ok{border-color:#9dd8bb}.q.bad{border-color:#f0b4b4}
.qh{display:flex;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.qn{width:28px;height:28px;border-radius:9px;background:var(--ink);color:#fff;display:grid;place-items:center;font-weight:900;font-size:13px;flex:none}
.qtag{font-size:12px;font-weight:800;color:var(--mut)}.qpts{margin-left:auto;font-size:12px;font-weight:900;color:var(--pri3);background:var(--pri2);padding:3px 8px;border-radius:20px}
.enun{font-weight:800;line-height:1.4;white-space:pre-wrap;margin-bottom:12px;overflow-wrap:anywhere}
.apoio{background:#f7f8fc;border-left:4px solid var(--pri);border-radius:10px;padding:12px;margin-bottom:12px;white-space:pre-wrap;line-height:1.5;font-size:15px;overflow-wrap:anywhere}
.qimg{max-width:100%;max-height:420px;border-radius:12px;display:block;margin:0 auto 12px;background:#f1f3f8;min-height:60px;cursor:zoom-in}
.ch{display:flex;gap:10px;align-items:flex-start;border:1.5px solid var(--line);border-radius:12px;padding:11px;margin-bottom:7px;cursor:pointer;font-weight:600;line-height:1.35}
.ch input{width:20px;height:20px;flex:none;margin:0;accent-color:var(--pri)}
.ch.sel{border-color:var(--pri);background:var(--pri2)}
.ch.ro{cursor:default}.ch.right{border-color:var(--ok);background:var(--okb)}.ch.wrong{border-color:var(--bad);background:var(--badb)}
.ch .L{font-weight:900;flex:none}
.vf{display:flex;gap:8px}.vf .ch{flex:1;justify-content:center}
.resp{background:#f7f8fc;border-radius:12px;padding:12px;white-space:pre-wrap;font-weight:600;overflow-wrap:anywhere}
.fb{margin-top:10px;font-size:14px;border-radius:10px;padding:9px 11px;background:#f5f1ff;color:#43308a;font-weight:600;white-space:pre-wrap}
.mk{font-weight:900;font-size:14px;margin-top:10px}.mk.ok{color:var(--ok)}.mk.bad{color:var(--bad)}.mk.wait{color:var(--pri)}
.fotos{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.ft{position:relative;width:96px;height:96px;border-radius:12px;overflow:hidden;background:#eef1f7;border:1px solid var(--line)}
.ft img{width:100%;height:100%;object-fit:cover;cursor:zoom-in}
.ft .x{position:absolute;top:4px;right:4px;width:26px;height:26px;border-radius:50%;border:0;background:rgba(0,0,0,.65);color:#fff;font-weight:900;cursor:pointer}
.ft .ld{position:absolute;inset:0;display:grid;place-items:center;background:rgba(255,255,255,.7);font-size:12px;font-weight:900}
.fbtns{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.savebar{position:sticky;bottom:0;background:rgba(244,246,251,.95);backdrop-filter:blur(6px);padding:10px 0 14px;display:flex;gap:8px;align-items:center;z-index:5}
.savebar .st{flex:1;font-size:13px;font-weight:800;color:var(--mut)}
/* ---- editor ---- */
.qed{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:12px}
.qed .tools{display:flex;gap:4px;margin-left:auto}
.qed .tools button{border:1px solid var(--line);background:#fff;border-radius:8px;width:32px;height:32px;cursor:pointer;font-weight:900}
.opt{display:flex;gap:8px;align-items:center;margin-bottom:6px}
.opt input[type=radio]{width:22px;height:22px;flex:none;accent-color:var(--ok)}
.opt input:not([type=radio]){margin:0!important}
.opt .rm{border:0;background:none;color:var(--bad);font-weight:900;cursor:pointer;padding:6px}
.addq{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.chks{display:flex;flex-direction:column;gap:2px;max-height:240px;overflow:auto;border:1.5px solid var(--line);border-radius:11px;padding:8px 10px;background:#fff;margin-top:5px}
.chks .chk{margin:4px 0}
/* ---- modal / toast ---- */
.modal{position:fixed;inset:0;background:rgba(14,20,38,.55);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:640px;max-height:92vh;overflow-y:auto;border-radius:20px 20px 0 0;padding:18px 16px 22px}
@media(min-width:700px){.modal{align-items:center}.sheet{border-radius:20px}}
.sheet .hd{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;margin-bottom:12px}.sheet .hd h2{font-size:20px}
.x{border:0;background:#e3e7f0;border-radius:10px;padding:6px 10px;font-weight:900;cursor:pointer}
.ft2{display:flex;gap:8px;margin-top:14px}.ft2 .btn{flex:1}
.viewer{background:#000;position:fixed;inset:0;z-index:60;display:grid;place-items:center}
.viewer img{max-width:100vw;max-height:100vh;object-fit:contain}
.viewer button{position:fixed;top:12px;right:12px;background:#fff;border:0;border-radius:10px;padding:8px 12px;font-weight:900}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(140px);background:var(--ink);color:#fff;padding:11px 16px;border-radius:12px;font-weight:800;z-index:70;transition:transform .25s;max-width:92vw;text-align:center}
#toast.show{transform:translateX(-50%) translateY(0)}
.spin{width:34px;height:34px;border:4px solid var(--line);border-top-color:var(--pri);border-radius:50%;animation:sp .9s linear infinite;margin:50px auto}
@keyframes sp{to{transform:rotate(360deg)}}
.score{font-size:40px;font-weight:900;letter-spacing:-1px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;font-size:14px}.kv b{color:var(--mut)}
@media(min-width:900px){
  .shell{display:grid;grid-template-columns:230px 1fr;max-width:1240px;margin:0 auto}
  .shell .nav{flex-direction:column;position:sticky;top:64px;align-self:start;padding:18px 10px;max-width:none;margin:0}
  .shell .nav button{width:100%;padding:11px 12px}
  .shell main{margin:0;width:100%}
}
@media print{.top,.nav,.savebar,.btn{display:none!important}main{padding:0}}
.hub{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 16px;padding:4px;background:#eef1f7;border-radius:16px}
.hub button{flex:none;border:0;background:transparent;border-radius:12px;padding:10px 14px;font-weight:800;font-size:14px;cursor:pointer;color:var(--mut)}
.hub button.on{background:#fff;color:var(--ink);box-shadow:var(--sh)}.hub .novo{background:var(--pri);color:#fff}
.desafio{background:linear-gradient(135deg,#2f5bea,#7b4dff);color:#fff;border-radius:var(--r);padding:18px;margin-bottom:16px;box-shadow:var(--sh)}
.desafio p{margin:6px 0;opacity:.95}.desafio .small{opacity:.9}.desafio .pill{background:rgba(255,255,255,.2);color:#fff;margin-left:6px}
.desafio .btn{margin-top:10px}.desafio .btn:not(.pri){background:#fff;color:var(--ink)}.desafio .btn.pri{background:#fff;color:#2f5bea}
.desafio .bar{background:rgba(255,255,255,.3)}.desafio .bar i{background:#fff}
.dz-t{font-size:19px;font-weight:900}.dz-cd{font-size:16px;font-weight:800;margin-top:8px}.cd{font-variant-numeric:tabular-nums;font-weight:900}.cd.urg{color:#ffd166}
.dz-placar{display:flex;gap:10px;flex-wrap:wrap;margin:8px 0;font-weight:800}.dz-placar span{background:rgba(255,255,255,.18);padding:5px 10px;border-radius:20px}
.card .dz-placar span,.modal .dz-placar span{background:#eef1f7}.ok{color:var(--ok)}.bad{color:var(--bad)}.desafio .ok,.desafio .bad{color:#fff}
.dz-barra{position:sticky;top:0;z-index:5;background:var(--warnb);color:var(--warn);border-radius:12px;padding:10px 14px;margin-bottom:12px;font-weight:800;box-shadow:var(--sh)}.dz-barra .cd.urg{color:var(--bad)}
.pv-folha{background:#fff;border:1px solid #d9dde8;border-radius:14px;padding:22px;margin-bottom:16px;box-shadow:0 2px 0 #e9ecf3,0 8px 24px rgba(20,30,60,.06)}
.pv-capa{border-top:6px solid var(--pri);text-align:left}.pv-tit{font-size:24px;font-weight:900;letter-spacing:.5px;color:var(--ink)}.pv-sub{color:var(--mut);font-weight:700;margin-top:2px}
.pv-cab{background:#fff;border:2px solid var(--ink);border-radius:12px;padding:16px 18px;margin-bottom:14px}
.pv-topo{display:flex;gap:12px;align-items:center;border-bottom:2px solid var(--ink);padding-bottom:10px;margin-bottom:10px}
.pv-logo{width:46px;height:46px;border-radius:12px;background:var(--pri);display:grid;place-items:center;font-size:24px;flex:none}
.pv-escola{font-size:12px;font-weight:800;color:var(--mut);text-transform:uppercase;letter-spacing:1px}
.pv-campos{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px 14px;margin-top:12px}
.pv-campos div{border-bottom:1px dashed #cdd3e0;padding-bottom:4px;min-width:0}.pv-campos span{display:block;font-size:11px;font-weight:800;color:var(--mut);text-transform:uppercase;letter-spacing:.5px}
.pv-campos b{font-size:15px;overflow-wrap:anywhere}
.pv-est{font-weight:800;margin-top:14px}.pv-cd{font-size:18px;font-weight:900;margin-top:8px;color:var(--pri)}.pv-btn{width:100%;margin-top:16px;min-height:54px;font-size:16px;letter-spacing:.5px}
.pv-vazio{text-align:center;background:#fff;border:1px dashed #cdd3e0;border-radius:14px;padding:30px 18px;margin-bottom:16px}
.pv-resumo{display:flex;gap:16px;flex-wrap:wrap;margin-bottom:10px;color:var(--mut)}.pv-resumo b{color:var(--ink);font-size:18px}
.pv-outras{display:block;width:100%;text-align:left;background:transparent;border:1px solid var(--line);border-radius:12px;padding:14px;margin-top:18px;font-weight:700;color:var(--mut);cursor:pointer}
.pv-instr{padding-left:20px;line-height:1.6}.pv-instr li{margin-bottom:6px}
.pv-tab{width:100%;border-collapse:collapse;margin:10px 0}.pv-tab th,.pv-tab td{border:1px solid #d9dde8;padding:8px 10px;text-align:left}.pv-tab th{background:#f3f5fa;font-size:13px}
.pv-barra{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--ink);color:#fff;border-radius:12px;padding:10px 14px;margin-bottom:12px;box-shadow:var(--sh)}
.pv-relogio{font-size:20px;font-weight:900;font-variant-numeric:tabular-nums}.pv-relogio .cd.urg,.pv-relogio [data-cd].urg{color:#ffd166}.pv-cont{flex:1;font-size:14px}.pv-barra .btn{background:#fff;color:var(--ink);margin:0}
.pv-grade{display:grid;grid-template-columns:1fr;gap:14px}@media(min-width:900px){.pv-grade{grid-template-columns:1fr 290px}.pv-dir{display:block!important;position:sticky;top:76px;align-self:start}}

<body>
<div id="root"><div class="spin"></div></div>
<div id="modal" class="modal hidden"><div class="sheet" id="sheet"></div></div>
<div id="toast"></div>

<script>
/* =================== BASE =================== */
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const linkify=s=>esc(s).replace(/(https?:\/\/[^\s<]+)/g,'<a href="$1" target="_blank" rel="noopener">$1</a>');
const L=j=>String.fromCharCode(65+j);
const LS={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}},del(k){try{localStorage.removeItem(k)}catch(e){}}};
const S={token:LS.get('sd_token'),u:null,cfg:{escalaNota:10,fotoMaxMB:4,fotosPorQuestao:5},info:{nome:'Sala Digital'},view:'',p:{},img:{},badge:{}};
const TIPO={atividade:'Atividade',exercicio:'Exercício',prova:'Prova',simulado:'Simulado'};
const TIPOQ={mc:'Múltipla escolha',vf:'Verdadeiro ou falso',disc:'Discursiva'};
const SIT={pendente:'Pendente',atrasada:'Atrasada',enviada:'Enviada',corrigida:'Corrigida',agendada:'Em breve',rascunho:'Rascunho',publicada:'Publicada',nao_iniciada:'Não entregou'};
const DISC_IC={'Português':'📖','Matemática':'➗','Ciências':'🔬','História':'🏛️','Geografia':'🌎','Inglês':'🇬🇧','Educação Física':'🏐','Artes':'🎨','Física':'⚛️','Química':'⚗️','Biologia':'🧬','Filosofia':'💭','Sociologia':'👥','Espanhol':'🇪🇸','Redação':'✍️'};
const ic=d=>DISC_IC[d]||'📝';
function fd(ms){if(!ms)return '—';const d=new Date(ms);return d.toLocaleDateString('pt-BR')}
function fdh(ms){if(!ms)return '—';const d=new Date(ms);return d.toLocaleDateString('pt-BR')+' '+d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})}
function toLocalInput(ms){if(!ms)return '';const d=new Date(ms);const p=n=>String(n).padStart(2,'0');return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}T${p(d.getHours())}:${p(d.getMinutes())}`}
function fromLocalInput(v){if(!v)return null;const t=new Date(v).getTime();return isNaN(t)?null:t}
function nota(n,m){if(n==null||!m)return '—';const e=S.cfg.escalaNota||10;const v=Math.round(n/m*e*10)/10;return String(v).replace('.',',')}
function pts(n){return n==null?'—':String(Math.round(n*100)/100).replace('.',',')}
function pl(n,a,b){return n+' '+(n==1?a:b)}
function pct(p){return p==null?'—':String(p).replace('.',',')+'%'}
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(toast.h);toast.h=setTimeout(()=>t.classList.remove('show'),3000)}
function spin(){return '<div class="spin"></div>'}
function empty(e,t,s){return `<div class="card empty"><div class="e">${e}</div><h3>${esc(t)}</h3><p>${s||''}</p></div>`}

const API_URL='https://xrlkokbdnydntgpotrlk.supabase.co/functions/v1/api';
async function api(acao,d){
  let r;
  for(let tent=0;tent<2;tent++){
    try{const resp=await fetch(API_URL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token:S.token||'',acao,d:d||{}})});
      r=await resp.json();break}
    catch(e){if(tent===1)throw new Error('Falha de conexão. Verifique a internet e tente de novo.');await new Promise(z=>setTimeout(z,900))}
  }
  if(r&&r.ok)return r.d;
  if(r&&r.sessao){sairLocal();toast('Sua sessão expirou. Entre novamente.')}
  if(r&&r.trocar){S.u&&(S.u.trocarSenha=true);if(S.view!=='trocarSenha')go('trocarSenha')}
  throw new Error((r&&r.erro)||'Erro inesperado.');
}
async function busy(btn,fn){if(btn){btn.disabled=true;btn.dataset.t=btn.innerHTML;btn.innerHTML='Aguarde…'}try{return await fn()}finally{if(btn&&document.body.contains(btn)){btn.disabled=false;btn.innerHTML=btn.dataset.t}}}

/* =================== MODAL =================== */
function modal(html){$('#sheet').innerHTML=html;$('#modal').classList.remove('hidden');$('#sheet').scrollTop=0}
function fechar(){$('#modal').classList.add('hidden');$('#sheet').innerHTML=''}
function confirmar(titulo,texto,botao,perigo){return new Promise(r=>{modal(`<div class="hd"><h2>${esc(titulo)}</h2></div><p>${texto}</p><div class="ft2"><button class="btn" id="cNo">Cancelar</button><button class="btn ${perigo?'dan f':'pri'}" id="cOk">${esc(botao||'Confirmar')}</button></div>`);$('#cNo').onclick=()=>{fechar();r(false)};$('#cOk').onclick=()=>{fechar();r(true)}})}
function mostraSenha(login,senha,titulo){modal(`<div class="hd"><h2>${esc(titulo||'Acesso criado')}</h2><button class="x" data-a="fechar">✕</button></div><p>Anote e entregue ao usuário. No primeiro acesso ele deverá criar uma nova senha.</p><div class="card"><div class="kv"><b>Usuário</b><span style="font-weight:900">${esc(login)}</span><b>Senha provisória</b><span class="code" style="font-size:20px">${esc(senha)}</span></div></div><button class="btn pri full" data-a="fechar">Pronto</button>`)}
document.addEventListener('click',e=>{if(e.target.id==='modal')fechar()});
function verImagem(src){const v=document.createElement('div');v.className='viewer';v.innerHTML=`<img src="${src}"><button>Fechar ✕</button>`;v.onclick=()=>v.remove();document.body.appendChild(v)}

/* imagens protegidas (carregadas pela API, com cache) */
async function carregaImgs(){
  for(const el of $$('img[data-img]')){
    const id=el.dataset.img;el.removeAttribute('data-img');
    try{if(!S.img[id])S.img[id]=api('imagem',{id});const src=await S.img[id];el.src=src;el.onclick=()=>verImagem(src)}catch(e){delete S.img[id];el.alt='Imagem indisponível'}
  }
}
function comprimir(file){
  return new Promise((res,rej)=>{
    if(file.size>25*1024*1024)return rej(new Error('Arquivo muito grande.'));
    const fr=new FileReader();
    fr.onerror=()=>rej(new Error('Não foi possível ler o arquivo.'));
    fr.onload=()=>{const img=new Image();img.onload=()=>{const max=1600;let w=img.naturalWidth,h=img.naturalHeight;const k=Math.min(1,max/Math.max(w,h));w=Math.round(w*k);h=Math.round(h*k);
      const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,w,h);x.drawImage(img,0,0,w,h);
      let q=.82,url=c.toDataURL('image/jpeg',q);const lim=(S.cfg.fotoMaxMB||4)*1024*1024*1.33;while(url.length>lim&&q>.4){q-=.12;url=c.toDataURL('image/jpeg',q)}res(url)};
      img.onerror=()=>rej(new Error('Formato não suportado. Envie foto em JPG ou PNG.'));img.src=fr.result};
    fr.readAsDataURL(file);
  });
}

let PL=null;
VIEWS.a_fazer=async function(p){
  const r=await api('abrirAtividade',{id:p.id});const a=r.atividade,e=r.entrega;
  const enviado=e&&(e.status==='enviada'||e.status==='corrigida');
  PL={a,e,resp:(e&&e.respostas)||[],fotos:(e&&e.fotos)||{},dirty:false,timer:null,salvoEm:e&&e.atualizadoEm,pode:r.podeEnviar,envi:enviado,sit:r.situacao};
  const lib=enviado&&e.correcao&&(e.status==='corrigida'||a.tipo==='desafio');
  let h=`<button class="back" data-go="a_atividades">← Atividades</button><div class="ph"><div><h1>${esc(a.titulo)}</h1><p>${TIPO[a.tipo]||''} · ${esc(a.disciplina||'')} · ${pl(a.questoes.length,'questão','questões')} · ${pts(a.questoes.reduce((s,q)=>s+q.pontos,0))} pontos</p></div></div>`;
  h+=`<div class="card"><div class="kv"><b>Abertura</b><span>${fdh(a.abertura)}</span><b>Encerramento</b><span>${fdh(a.encerramento)}${a.aceitaAtraso&&a.encerramento?' (aceita entrega atrasada)':''}</span>${enviado?`<b>Enviada em</b><span>${fdh(e.enviadoEm)}${e.atrasada?' <span class="pill atrasada">atrasada</span>':''}</span><b>Protocolo</b><span>${esc(e.id.toUpperCase())}</span>`:''}</div></div>`;
  if(lib){h+=`<div class="card center"><div class="muted" style="font-weight:800">Sua nota</div><div class="score">${nota(e.nota,e.notaMax)}</div><div class="muted">${pts(e.nota)} de ${pts(e.notaMax)} pontos</div>${e.comentario?`<div class="fb" style="text-align:left"><b>💬 Comentário do professor:</b>\n${esc(e.comentario)}</div>`:''}
    ${e.revisaoPedida?'<div class="info" style="margin-top:12px">Pedido de revisão enviado. Aguarde o professor.</div>':`<button class="btn sm" style="margin-top:12px" data-a="pedirRevisao">Pedir revisão da nota</button>`}${a.tipo==='desafio'&&e.status!=='corrigida'?'<div class="info" style="margin-top:10px">✍️ As questões discursivas ainda serão corrigidas pelo professor. A nota final aparece depois.</div>':''}</div>`}
  else if(enviado)h+=a.tipo==='desafio'?`<div class="msg">📨 Desafio enviado! O gabarito com as explicações aparece ${a.encerramento>Date.now()?'depois do encerramento ('+quando(a.encerramento)+')':'quando o professor liberar'}.</div>`:`<div class="msg">📨 Atividade enviada! A nota aparecerá aqui quando o professor liberar a correção.</div>`;
  else if(!r.podeEnviar)h+=`<div class="note">O prazo desta atividade terminou e ela não aceita entregas atrasadas.</div>`;
  else if(r.situacao==='atrasada')h+=`<div class="note">O prazo terminou, mas o professor aceita entrega atrasada.</div>`;
  if(a.instrucoes)h+=`<div class="apoio">${linkify(a.instrucoes)}</div>`;
  if(S.iaTutor)h+=`<button class="btn sm" style="margin-bottom:12px" data-go="a_tutor" data-p="${P({atividade:a.id})}">🤖 Pedir ajuda ao Tutor IA</button>`;
  a.questoes.forEach((q,i)=>h+=htmlQuestaoAluno(q,i,lib?e:null,enviado||!r.podeEnviar));
  if(!enviado&&r.podeEnviar)h+=`<div class="savebar"><span class="st" id="svst">${PL.salvoEm?'Rascunho salvo às '+new Date(PL.salvoEm).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'}):'Suas respostas são salvas automaticamente'}</span><button class="btn" data-a="salvarAgora">Salvar</button><button class="btn pri" data-a="enviarAtiv">Enviar ✓</button></div>`;
  return {html:h,depois:()=>{bindPlayer()}};
};
function htmlQuestaoAluno(q,i,eCorr,ro){
  const r=PL.resp[i];const c=eCorr&&eCorr.correcao;const pt=c?c.pontos[i]:null;
  const cls=c?(pt>=q.pontos&&q.pontos>0?'ok':(pt===0?'bad':'')):'';
  let h=`<div class="q ${cls}" id="q${i}"><div class="qh"><span class="qn">${i+1}</span><span class="qtag">${TIPOQ[q.tipo]}</span>${q.disciplina?`<span class="qtag">${ic(q.disciplina)} ${esc(q.disciplina)}</span>`:''}<span class="qpts">${c?pts(pt)+' / ':''}${pts(q.pontos)} pt${q.pontos==1?'':'s'}</span></div>`;
  if(q.textoApoio)h+=`<div class="apoio">${linkify(q.textoApoio)}</div>`;
  if(q.imagem)h+=`<img class="qimg" data-img="${esc(q.imagem)}" alt="Imagem da questão">`;
  h+=`<div class="enun">${esc(q.enunciado)}</div>`;
  if(q.tipo==='mc')h+=q.opcoes.map((o,j)=>{let k='';if(c){if(j===q.correta)k='right';else if(j===r)k='wrong'}else if(r===j)k='sel';
    return `<label class="ch ${ro?'ro':''} ${k}"><input type="radio" name="r${i}" value="${j}" ${r===j?'checked':''} ${ro?'disabled':''} data-q="${i}"><span class="L">${L(j)})</span><span>${esc(o)}${c&&j===r?' <b>← sua resposta</b>':''}</span></label>`}).join('');
  if(q.tipo==='vf')h+=`<div class="vf">${[[true,'Verdadeiro'],[false,'Falso']].map(([v,l])=>{let k='';if(c){if(v===q.correta)k='right';else if(v===r)k='wrong'}else if(r===v)k='sel';
    return `<label class="ch ${ro?'ro':''} ${k}"><input type="radio" name="r${i}" value="${v}" ${r===v?'checked':''} ${ro?'disabled':''} data-q="${i}"><span>${l}</span></label>`}).join('')}</div>`;
  if(q.tipo==='disc'){if(ro)h+=`<div class="resp">${esc(r||'(sem resposta escrita)')}</div>`;else h+=`<textarea data-q="${i}" rows="4" placeholder="Escreva sua resposta…">${esc(r||'')}</textarea>`}
  if(q.permiteFoto){const fs=PL.fotos[i]||[];
    h+=`<div class="fotos" id="fotos${i}">${fs.map(id=>`<div class="ft"><img data-img="${esc(id)}" alt="Foto">${ro?'':`<button class="x" data-a="rmFoto" data-q="${i}" data-id="${esc(id)}" title="Remover">✕</button>`}</div>`).join('')}</div>`;
    if(!ro)h+=`<div class="fbtns"><label class="btn sm" style="margin:0">📷 Tirar foto<input type="file" accept="image/*" capture="environment" data-foto="${i}" hidden></label><label class="btn sm" style="margin:0">🖼️ Galeria<input type="file" accept="image/*" multiple data-foto="${i}" hidden></label><span class="small muted" style="align-self:center">Até ${S.cfg.fotosPorQuestao} fotos</span></div>`;
    else if(!fs.length)h+=`<div class="small muted" style="margin-top:6px">Nenhuma foto enviada.</div>`;}
  if(c){h+=pt==null?'<div class="mk wait">⏳ Aguardando correção</div>':'';if(c.comentarios&&c.comentarios[i])h+=`<div class="fb">💬 ${esc(c.comentarios[i])}</div>`;if(q.explicacao)h+=`<div class="fb">💡 ${q.tipo==='disc'?'Resposta esperada: ':''}${esc(q.explicacao)}</div>`}
  return h+'</div>';
}
function bindPlayer(){
  $$('#main [data-q]').forEach(el=>{
    const ev=el.tagName==='TEXTAREA'?'input':'change';
    el.addEventListener(ev,()=>{const i=+el.dataset.q;const q=PL.a.questoes[i];
      if(q.tipo==='mc')PL.resp[i]=+el.value;else if(q.tipo==='vf')PL.resp[i]=el.value==='true';else PL.resp[i]=el.value;
      if(el.type==='radio')$$(`input[name="r${i}"]`).forEach(x=>x.closest('.ch').classList.toggle('sel',x.checked));
      sujo()});
  });
  $$('#main input[data-foto]').forEach(inp=>inp.addEventListener('change',()=>enviarFotos(+inp.dataset.foto,[...inp.files]).finally(()=>inp.value='')));
}
function sujo(){PL.dirty=true;const s=$('#svst');if(s)s.textContent='Alterações não salvas…';clearTimeout(PL.timer);PL.timer=setTimeout(()=>salvarRasc(),2500)}
async function salvarRasc(){if(!PL||PL.envi||!PL.dirty)return;PL.dirty=false;const s=$('#svst');if(s)s.textContent='Salvando…';
  try{const r=await api('salvarRascunho',{id:PL.a.id,respostas:PL.resp});PL.salvoEm=r.atualizadoEm;const s2=$('#svst');if(s2)s2.textContent='Rascunho salvo às '+new Date(r.atualizadoEm).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})+' ✓'}
  catch(e){PL.dirty=true;const s2=$('#svst');if(s2)s2.textContent='⚠️ Não foi possível salvar: '+e.message}}
ACOES.salvarAgora=async(d,b)=>{PL.dirty=true;await busy(b,salvarRasc)};
async function enviarFotos(i,files){
  const box=$('#fotos'+i);const lim=S.cfg.fotosPorQuestao||5;
  for(const f of files){
    if((PL.fotos[i]||[]).length>=lim){toast('Limite de '+lim+' fotos nesta questão.');break}
    const tmp=document.createElement('div');tmp.className='ft';tmp.innerHTML='<div class="ld">Enviando…</div>';box.appendChild(tmp);
    try{const url=await comprimir(f);tmp.innerHTML=`<img src="${url}"><div class="ld">Enviando…</div>`;
      const r=await api('enviarFoto',{id:PL.a.id,q:i,dataUrl:url});PL.fotos=r.fotos;const nid=r.fotos[i][r.fotos[i].length-1];S.img[nid]=Promise.resolve(url);
      tmp.innerHTML=`<img src="${url}" alt="Foto"><button class="x" data-a="rmFoto" data-q="${i}" data-id="${esc(nid)}" title="Remover">✕</button>`;tmp.querySelector('img').onclick=()=>verImagem(url);
      const s=$('#svst');if(s)s.textContent='Foto salva ✓'}
    catch(e){tmp.remove();toast(e.message)}
  }
}

VIEWS.p_turmas=async function(){
  const ts=await api('turmas');const adm=S.u.perfil==='admin';const at=ts.filter(t=>!t.arquivada),ar=ts.filter(t=>t.arquivada);
  const it=t=>`<button class="it" data-go="p_turma" data-p="${P({id:t.id})}"><div class="ic">👥</div><div class="mid"><div class="t">${esc(t.nome)}</div><div class="s">${esc([t.disciplina,t.serie].filter(Boolean).join(' · '))}${adm?' · Prof. '+esc(t.professor):''} · ${t.alunos} aluno${t.alunos==1?'':'s'} · ${t.atividades} atividade${t.atividades==1?'':'s'}</div></div><div class="end">${t.pendentes?`<span class="pill pendente">${t.pendentes} pedido${t.pendentes>1?'s':''}</span>`:''}<span class="code" style="font-size:13px;letter-spacing:1px;padding:4px 8px">${esc(t.codigo)}</span></div></button>`;
  return `<div class="ph"><div><h1>Turmas</h1><p>${adm?'Todas as turmas da plataforma':'Crie turmas e compartilhe o código com os alunos'}</p></div><button class="btn pri" data-a="turmaForm">+ Nova turma</button></div>
  <div class="list">${at.length?at.map(it).join(''):empty('👥','Nenhuma turma ainda','Crie a primeira turma e passe o código para os alunos.')}</div>
  ${ar.length?`<h3 style="margin:18px 0 8px" class="muted">Arquivadas</h3><div class="list" style="opacity:.75">${ar.map(it).join('')}</div>`:''}`;
};
ACOES.turmaForm=(d)=>{const t=d.t?JSON.parse(d.t):{};
  modal(`<div class="hd"><h2>${t.id?'Editar turma':'Nova turma'}</h2><button class="x" data-a="fechar">✕</button></div><form id="fT"><label>Nome da turma<input name="nome" value="${esc(t.nome||'')}" placeholder="Ex.: 6º Ano A – Matemática" required></label>
  <div class="row2"><label>Disciplina / curso<input name="disciplina" value="${esc(t.disciplina||'')}" list="dlDisc"></label><label>Série / nível<input name="serie" value="${esc(t.serie||'')}" placeholder="Ex.: 6º ano"></label></div>
  <datalist id="dlDisc">${Object.keys(DISC_IC).map(x=>`<option value="${esc(x)}">`).join('')}<option value="Multidisciplinar"></datalist>
  <label>Descrição <span class="opt">(opcional)</span><textarea name="descricao" rows="2">${esc(t.descricao||'')}</textarea></label><div class="err" id="err"></div>
  <div class="ft2"><button type="button" class="btn" data-a="fechar">Cancelar</button><button class="btn pri">Salvar</button></div></form>`);
  const f=$('#fT');f.onsubmit=async ev=>{ev.preventDefault();await busy(f.querySelector('.pri'),async()=>{try{const r=await api('turmaSalvar',{id:t.id,nome:f.elements.nome.value,disciplina:f.elements.disciplina.value,serie:f.elements.serie.value,descricao:f.elements.descricao.value});fechar();toast('Turma salva ✓');if(t.id)render();else go('p_turma',{id:r.id})}catch(e){$('#err').textContent=e.message}})}};
VIEWS.p_turma=async function(p){
  const d=await api('turmaDetalhe',{id:p.id});const t=d.turma;
  return `<button class="back" data-go="p_turmas">← Turmas</button><div class="ph"><div><h1>${esc(t.nome)}</h1><p>${esc([t.disciplina,t.serie].filter(Boolean).join(' · '))}${S.u.perfil==='admin'?' · Prof. '+esc(t.professor):''}${t.arquivada?' · <b>Arquivada</b>':''}</p></div>
  <div style="display:flex;gap:6px;flex-wrap:wrap"><button class="btn sm" data-a="turmaForm" data-t="${P(t)}">✏️ Editar</button><button class="btn sm" data-go="p_relatorios" data-p="${P({turma:t.id})}">📊 Relatório</button><button class="btn sm" data-a="turmaArq" data-id="${t.id}" data-v="${t.arquivada?'':'1'}">${t.arquivada?'Desarquivar':'Arquivar'}</button><button class="btn sm dan" data-a="turmaDel" data-id="${t.id}">Excluir</button></div></div>
  <div class="grid g2"><div class="card"><div class="muted" style="font-weight:800;font-size:13px">CÓDIGO PARA OS ALUNOS ENTRAREM</div><div style="display:flex;gap:10px;align-items:center;margin-top:8px;flex-wrap:wrap"><span class="code">${esc(t.codigo)}</span><button class="btn sm" data-a="novoCodigo" data-id="${t.id}">Gerar novo código</button></div>
  <p class="small muted" style="margin-bottom:0">O aluno cria a conta, vai em <b>Turmas</b> e digita este código. Você aprova o pedido aqui.</p>${t.descricao?`<p style="margin-bottom:0">${esc(t.descricao)}</p>`:''}</div>
  <div class="card"><h3>Adicionar aluno</h3><p class="small muted">Para alunos sem e-mail ou menores: você cria o acesso e entrega o usuário e a senha provisória.</p><button class="btn pri" data-a="alunoForm" data-id="${t.id}">+ Cadastrar aluno nesta turma</button></div></div>
  ${d.pendentes.length?`<h3 style="margin:14px 0 8px">🙋 Pedidos para entrar (${d.pendentes.length})</h3><div class="list">${d.pendentes.map(a=>`<div class="it static"><div class="ic">🙋</div><div class="mid"><div class="t">${esc(a.nome)}</div><div class="s">${esc(a.login)} · pediu em ${fdh(a.pedidoEm)}</div></div><div class="end"><button class="btn sm ok" data-a="matDec" data-id="${a.matriculaId}" data-v="1">Aprovar</button><button class="btn sm dan" data-a="matDec" data-id="${a.matriculaId}" data-v="">Recusar</button></div></div>`).join('')}</div>`:''}
  <h3 style="margin:16px 0 8px">Alunos (${d.alunos.length})</h3>${d.alunos.length?`<div class="tbl"><table><tr><th>Nome</th><th>Usuário</th><th>Na turma desde</th><th></th></tr>${d.alunos.map(a=>`<tr><td><b>${esc(a.nome)}</b></td><td>${esc(a.login)}</td><td>${fd(a.desde)}</td><td style="text-align:right"><button class="btn sm" data-go="p_aluno" data-p="${P({id:a.id,turma:t.id})}">Desempenho</button> <button class="btn sm" data-a="resetAluno" data-id="${a.id}" data-n="${esc(a.nome)}">Nova senha</button> <button class="btn sm dan" data-a="matRem" data-id="${a.matriculaId}" data-n="${esc(a.nome)}">Remover</button></td></tr>`).join('')}</table></div>`:empty('🎒','Nenhum aluno na turma','Passe o código acima ou cadastre alunos.')}
  <div class="ph" style="margin-top:18px"><h3>Atividades da turma (${d.atividades.length})</h3><button class="btn sm pri" data-go="p_editor" data-p="${P({turma:t.id})}">+ Nova atividade</button></div>
  <div class="list">${d.atividades.map(itemAtivProf).join('')||empty('📝','Nenhuma atividade','')}</div>`;
};
ACOES.novoCodigo=async d=>{if(!await confirmar('Gerar novo código','O código atual deixará de funcionar. Alunos que já estão na turma continuam nela.','Gerar novo'))return;try{await api('turmaNovoCodigo',{id:d.id});render()}catch(e){toast(e.message)}};
ACOES.turmaArq=async d=>{try{await api('turmaArquivar',{id:d.id,arquivada:!!d.v});toast(d.v?'Turma arquivada':'Turma reativada');render()}catch(e){toast(e.message)}};
ACOES.turmaDel=async d=>{if(!await confirmar('Excluir turma','Os alunos serão desvinculados e as atividades ligadas só a esta turma voltarão para rascunho. As entregas já feitas são mantidas. Continuar?','Excluir turma',true))return;try{await api('turmaExcluir',{id:d.id});toast('Turma excluída');go('p_turmas')}catch(e){toast(e.message)}};
ACOES.matDec=async(d,b)=>{await busy(b,async()=>{try{await api('matriculaDecidir',{id:d.id,aprovar:!!d.v});toast(d.v?'Aluno aprovado ✓':'Pedido recusado');render()}catch(e){toast(e.message)}})};
ACOES.matRem=async d=>{if(!await confirmar('Remover aluno',`Remover <b>${esc(d.n)}</b> desta turma? As entregas já feitas continuam guardadas.`,'Remover',true))return;try{await api('matriculaRemover',{id:d.id});render()}catch(e){toast(e.message)}};
ACOES.resetAluno=async d=>{if(!await confirmar('Gerar nova senha',`Gerar uma senha provisória para <b>${esc(d.n)}</b>? A senha atual deixará de funcionar.`,'Gerar senha'))return;try{const r=await api('alunoSenha',{alunoId:d.id});mostraSenha(r.login,r.senha,'Nova senha gerada')}catch(e){toast(e.message)}};
ACOES.alunoForm=d=>{modal(`<div class="hd"><h2>Cadastrar aluno</h2><button class="x" data-a="fechar">✕</button></div><form id="fA"><label>Nome completo<input name="nome" required></label>
  <div class="row2"><label>Usuário<input name="login" autocapitalize="none" placeholder="ex.: joao.silva" required></label><label>Data de nascimento <span class="opt">(opcional)</span><input name="nascimento" type="date"></label></div>
  <label>E-mail <span class="opt">(opcional)</span><input name="email" type="email" autocapitalize="none"></label><label>Senha provisória <span class="opt">(deixe vazio para gerar)</span><input name="senha"></label>
  <label class="chk"><input type="checkbox" name="aut"><span>Confirmo que a escola e/ou o responsável autorizaram o cadastro deste aluno (LGPD).</span></label><div class="err" id="err"></div>
  <div class="ft2"><button type="button" class="btn" data-a="fechar">Cancelar</button><button class="btn pri">Cadastrar</button></div></form>`);
  const f=$('#fA');f.onsubmit=async ev=>{ev.preventDefault();await busy(f.querySelector('.pri'),async()=>{try{const r=await api('alunoCriar',{turmaId:d.id,nome:f.elements.nome.value,login:f.elements.login.value,email:f.elements.email.value,nascimento:f.elements.nascimento.value,senha:f.elements.senha.value,autorizacao:f.elements.aut.checked});mostraSenha(r.login,r.senha,'Aluno cadastrado ✓');render()}catch(e){$('#err').textContent=e.message}})}};
VIEWS.p_aluno=async function(p){
  const d=await api('relatorioAluno',{id:p.id});const A=d.atividades;const c=A.filter(a=>a.status==='corrigida');const s=c.reduce((x,a)=>x+a.nota,0),m=c.reduce((x,a)=>x+a.notaMax,0);
  return `<button class="back" data-go="${p.turma?'p_turma':'p_turmas'}" data-p="${P({id:p.turma})}">← Voltar</button><div class="ph"><div><h1>${esc(d.aluno.nome)}</h1><p>${esc(d.aluno.login)} · desempenho individual</p></div></div>
  <div class="grid g4" style="margin-bottom:14px"><div class="stat"><b>${A.length}</b><span>Atividades</span></div><div class="stat"><b>${A.filter(a=>a.status==='enviada'||a.status==='corrigida').length}</b><span>Entregues</span></div><div class="stat"><b>${A.filter(a=>a.status==='pendente'||a.status==='atrasada'||a.status==='rascunho').length}</b><span>Não entregues</span></div><div class="stat"><b>${m?nota(s,m):'—'}</b><span>Média</span></div></div>
  <div class="tbl"><table><tr><th>Atividade</th><th>Disciplina</th><th>Prazo</th><th>Situação</th><th>Nota</th><th></th></tr>${A.map(a=>`<tr><td class="wrap"><b>${esc(a.titulo)}</b></td><td>${esc(a.disciplina||'')}</td><td>${fdh(a.encerramento)}</td><td><span class="pill ${a.status==='rascunho'?'pendente':a.status}">${a.status==='rascunho'?'Iniciou, não enviou':SIT[a.status]}${a.atrasada?' (atrasada)':''}</span></td><td><b>${a.nota!=null?nota(a.nota,a.notaMax):'—'}</b></td><td>${a.entregaId&&a.status!=='rascunho'?`<button class="btn sm" data-go="p_corrigir" data-p="${P({id:a.entregaId})}">Abrir</button>`:''}</td></tr>`).join('')}</table></div>`;
};
/* ---- atividades ---- */
function itemAtivProf(a){
  const prazo=a.encerramento?'até '+fdh(a.encerramento):'sem prazo';
  return `<button class="it" data-go="p_entregas" data-p="${P({id:a.id})}"><div class="ic">${ic(a.disciplina)}</div><div class="mid"><div class="t">${esc(a.titulo)}</div><div class="s">${TIPO[a.tipo]||''} · ${esc(a.disciplina||'')} · ${pl(a.qtd,'questão','questões')} · ${prazo}${a.turmas&&a.turmas.length?' · '+a.turmas.map(t=>esc(t.nome)).join(', '):''}${a.individual?' · individual':''}${a.professor&&S.u.perfil==='admin'?' · Prof. '+esc(a.professor):''}</div></div>
  <div class="end">${a.status!=='publicada'?'<span class="pill rascunho">Rascunho</span>':''}${a.totalAlunos!=null&&a.status==='publicada'?`<span class="pill">${a.entregues}/${a.totalAlunos} entregas</span>`:''}${a.aCorrigir?`<span class="pill enviada">${a.aCorrigir} p/ corrigir</span>`:''}${a.status==='publicada'&&!a.notasLiberadas?'<span class="pill">notas ocultas</span>':''}</div></button>`;
}
VIEWS.p_atividades=async function(p){
  const A=(await api('atividades')).filter(a=>a.tipo!=='desafio');const f=p.f||'todas';const b=(p.b||'').toLowerCase();
  const g={todas:A,publicada:A.filter(a=>a.status==='publicada'),rascunho:A.filter(a=>a.status!=='publicada'),corrigir:A.filter(a=>a.aCorrigir>0)};
  const l=g[f].filter(a=>!b||(a.titulo+' '+a.disciplina).toLowerCase().includes(b));
  const tab=(k,t)=>`<button class="${f===k?'on':''}" data-go="p_atividades" data-p="${P({f:k,b:p.b})}">${t} (${g[k].length})</button>`;
  return {html:`<div class="ph"><div><h1>Atividades</h1><p>Atividades, exercícios, provas e simulados</p></div><button class="btn pri" data-go="p_editor">+ Nova atividade</button></div>
  <div class="tabs">${tab('todas','Todas')}${tab('publicada','Publicadas')}${tab('rascunho','Rascunhos')}${tab('corrigir','Para corrigir')}</div>
  <input id="busca" placeholder="🔎 Buscar por título ou disciplina" value="${esc(p.b||'')}" style="margin-bottom:12px">
  <div class="list">${l.length?l.map(itemAtivProf).join(''):empty('📝','Nenhuma atividade','Crie uma atividade com questões de múltipla escolha, V ou F e discursivas.')}</div>`,
  depois(){const i=$('#busca');let t;i.oninput=()=>{clearTimeout(t);t=setTimeout(()=>{S.p.b=i.value;VIEWS.p_atividades(S.p).then(r=>{$('#main').innerHTML=r.html;r.depois();const j=$('#busca');j.focus();j.setSelectionRange(j.value.length,j.value.length)})},350)}}};
};
VIEWS.p_entregas=async function(p){
  const d=await api('atividadeEntregas',{id:p.id});const a=d.atividade;const L2=d.linhas;
  const env=L2.filter(x=>x.status==='enviada'||x.status==='corrigida'),nao=L2.filter(x=>!(x.status==='enviada'||x.status==='corrigida'));
  const cor=L2.filter(x=>x.status==='corrigida');const med=cor.length?cor.reduce((s,x)=>s+x.nota,0)/cor.length:null;
  return `<button class="back" data-go="p_atividades">← Atividades</button><div class="ph"><div><h1>${esc(a.titulo)}</h1><p>${TIPO[a.tipo]} · ${esc(a.disciplina||'')} · ${pl(a.qtd,'questão','questões')} · ${pts(a.notaMax)} pontos · ${a.turmas.map(t=>esc(t.nome)).join(', ')||'sem turma'}</p></div>
  <div style="display:flex;gap:6px;flex-wrap:wrap"><button class="btn sm" data-go="p_editor" data-p="${P({id:a.id})}">✏️ Editar</button><button class="btn sm" data-a="duplicar" data-id="${a.id}">⧉ Duplicar</button><button class="btn sm dan" data-a="ativDel" data-id="${a.id}">Excluir</button></div></div>
  ${a.status!=='publicada'?`<div class="note">Esta atividade é um rascunho: os alunos ainda não a veem. Abra em Editar e toque em Publicar.</div>`:''}
  <div class="grid g4" style="margin-bottom:14px"><div class="stat"><b>${env.length}/${L2.length}</b><span>Entregaram</span></div><div class="stat ${env.length-cor.length?'alert':''}"><b>${env.length-cor.length}</b><span>Para corrigir</span></div><div class="stat"><b>${med!=null?nota(med,a.notaMax):'—'}</b><span>Média da turma</span></div>
  <div class="stat"><b style="font-size:16px;margin-bottom:4px">${a.notasLiberadas?'✅ Liberadas':'🔒 Ocultas'}</b><button class="btn sm" data-a="liberar" data-id="${a.id}" data-v="${a.notasLiberadas?'':'1'}">${a.notasLiberadas?'Ocultar notas':'Liberar notas aos alunos'}</button></div></div>
  <div class="tbl"><table><tr><th>Aluno</th><th>Situação</th><th>Enviada em</th><th>Nota</th><th></th></tr>${L2.map(x=>{const st=x.status==='nao_iniciada'?(d.encerrada?'atrasada':'pendente'):x.status;const lab=x.status==='nao_iniciada'?'Não entregou':x.status==='rascunho'?'Iniciou, não enviou':x.status==='enviada'?'Aguardando correção':'Corrigida';
    return `<tr><td><b>${esc(x.nome)}</b><div class="small muted">${esc(x.login)}</div></td><td><span class="pill ${x.status==='rascunho'?'pendente':st}">${lab}</span>${x.atrasada?' <span class="pill atrasada">atrasada</span>':''}${x.revisao?' <span class="pill agendada">pediu revisão</span>':''}</td><td>${fdh(x.enviadoEm)}</td><td><b>${x.nota!=null?nota(x.nota,a.notaMax):'—'}</b>${x.nota!=null?`<div class="small muted">${pts(x.nota)}/${pts(a.notaMax)} pts</div>`:''}</td><td>${x.entregaId&&x.status!=='rascunho'?`<button class="btn sm ${x.status==='enviada'||x.revisao?'pri':''}" data-go="p_corrigir" data-p="${P({id:x.entregaId})}">${x.status==='enviada'?'Corrigir':'Ver / revisar'}</button>`:''}</td></tr>`}).join('')||'<tr><td colspan="5" class="muted">Nenhum aluno nesta atividade. Verifique as turmas.</td></tr>'}</table></div>`;
};
ACOES.liberar=async(d,b)=>{await busy(b,async()=>{try{await api('notasLiberar',{id:d.id,liberar:!!d.v});toast(d.v?'Notas liberadas aos alunos ✓':'Notas ocultadas');render()}catch(e){toast(e.message)}})};
ACOES.duplicar=async(d,b)=>{await busy(b,async()=>{try{const r=await api('atividadeDuplicar',{id:d.id});toast('Cópia criada como rascunho');go('p_editor',{id:r.id})}catch(e){toast(e.message)}})};
ACOES.ativDel=async d=>{if(!await confirmar('Excluir atividade','A atividade, todas as respostas, fotos e notas dos alunos serão apagadas definitivamente.','Excluir',true))return;try{await api('atividadeExcluir',{id:d.id});toast('Atividade excluída');go('p_atividades')}catch(e){toast(e.message)}};

/* ---- editor de atividade ---- */
let ED=null;
function novaQ(t){return t==='mc'?{tipo:'mc',enunciado:'',textoApoio:'',imagem:'',opcoes:['','','',''],correta:null,pontos:1,permiteFoto:false,explicacao:''}:
  t==='vf'?{tipo:'vf',enunciado:'',textoApoio:'',imagem:'',correta:null,pontos:1,permiteFoto:false,explicacao:''}:{tipo:'disc',enunciado:'',textoApoio:'',imagem:'',pontos:2,permiteFoto:true,explicacao:''}}
VIEWS.p_editor=async function(p){
  let a,turmas;
  if(p.id){const r=await api('atividadeObter',{id:p.id});a=r.atividade;turmas=await api('opcoesAtividade',{professorId:a.professorId})}
  else{turmas=await api('opcoesAtividade',{});a={titulo:'',tipo:'atividade',disciplina:'',instrucoes:'',turmas:p.turma?[p.turma]:[],alunos:[],abertura:null,encerramento:null,aceitaAtraso:false,questoes:[novaQ('mc')],status:'rascunho'};
    if(p.turma){const t=turmas.find(x=>x.id===p.turma);if(t&&t.disciplina&&t.disciplina!=='Multidisciplinar')a.disciplina=t.disciplina}}
  if(p.ia&&S.rascunhoIA){Object.assign(a,{titulo:S.rascunhoIA.titulo,disciplina:S.rascunhoIA.disciplina||a.disciplina,instrucoes:S.rascunhoIA.instrucoes,questoes:JSON.parse(JSON.stringify(S.rascunhoIA.questoes))})}
  ED={a:JSON.parse(JSON.stringify(a)),turmas,abrirApoio:{},ia:(p.ia&&S.rascunhoIA)||null};ED.a.questoes.forEach(q=>q.textoApoio=q.textoApoio||'');
  ED.indiv=!!(ED.a.alunos&&ED.a.alunos.length);
  return {html:'<div id="edw"></div>',depois:drawEditor};
};
function drawEditor(){
  const a=ED.a;const T=ED.turmas;const sc=$('#main').scrollTop;
  const alunosSel=T.filter(t=>a.turmas.includes(t.id)).flatMap(t=>t.alunos.map(x=>({...x,turma:t.nome})));
  const uniq=[...new Map(alunosSel.map(x=>[x.id,x])).values()];
  const total=a.questoes.reduce((s,q)=>s+(Number(q.pontos)||0),0);
  let h=`<button class="back" data-go="p_atividades">← Atividades</button><div class="ph"><div><h1>${a.id?'Editar atividade':'Nova atividade'}</h1><p>${pl(a.questoes.length,'questão','questões')} · ${pts(total)} pontos${a.id?' · '+(a.status==='publicada'?'Publicada':'Rascunho'):''}</p></div></div>
  ${ED.ia&&ED.ia.origem==='banco'?`<div class="info">📚 <b>${ED.a.questoes.length} questões do Banco de Atividades</b>${ED.ia.pedidas>ED.a.questoes.length?` (só havia ${ED.a.questoes.length} com esses filtros)`:''}. Revise, ajuste o que quiser, escolha a turma e salve ou publique.</div>`:ED.ia?`<div class="info">✨ <b>${ED.a.questoes.length} questões geradas pela IA</b>${ED.ia.pedidas&&ED.ia.pedidas>ED.a.questoes.length?` (de ${ED.ia.pedidas} pedidas)`:''}. Revise com atenção, corrija o que precisar, escolha a turma e salve ou publique.${ED.ia.custo?` Custo desta geração: US$ ${ED.ia.custo.toFixed(3)}.`:''}</div>`:''}
  <div class="card"><label>Título<input data-e="titulo" value="${esc(a.titulo)}" placeholder="Ex.: Prova – Frações e decimais"></label>
  <div class="row2"><label>Tipo<select data-e="tipo">${Object.entries(TIPO).filter(([k])=>k!=='desafio'||a.tipo==='desafio').map(([k,v])=>`<option value="${k}" ${a.tipo===k?'selected':''}>${v}</option>`).join('')}</select></label>

  <label>Instruções / texto de apoio geral <span class="opt">(opcional — links viram clicáveis)</span><textarea data-e="instrucoes" rows="3">${esc(a.instrucoes)}</textarea></label></div>
  <div class="card"><h3 style="margin-bottom:10px">Publicação</h3>
  <label>Turmas ${T.length?'':'<span class="opt">— crie uma turma primeiro</span>'}<div class="chks">${T.map(t=>`<label class="chk"><input type="checkbox" data-turma="${t.id}" ${a.turmas.includes(t.id)?'checked':''}><span>${esc(t.nome)} <span class="muted">(${pl(t.alunos.length,'aluno','alunos')})</span></span></label>`).join('')||'<span class="muted small">Nenhuma turma ativa.</span>'}</div></label>
  <label class="chk"><input type="checkbox" id="indiv" ${ED.indiv?'checked':''}><span>Publicar só para alguns alunos (atividade individual)</span></label>
  ${ED.indiv?`<div class="chks" style="margin-bottom:12px">${uniq.map(x=>`<label class="chk"><input type="checkbox" data-aluno="${x.id}" ${a.alunos.includes(x.id)?'checked':''}><span>${esc(x.nome)} <span class="muted small">${esc(x.turma)}</span></span></label>`).join('')||'<span class="muted small">Escolha uma turma com alunos.</span>'}</div>`:''}
  <div class="row2"><label>Abertura <span class="opt">(vazio = imediata)</span><input type="datetime-local" data-e="abertura" value="${toLocalInput(a.abertura)}"></label><label>Encerramento <span class="opt">(vazio = sem prazo)</span><input type="datetime-local" data-e="encerramento" value="${toLocalInput(a.encerramento)}"></label></div>
  <label class="chk"><input type="checkbox" data-e="aceitaAtraso" ${a.aceitaAtraso?'checked':''}><span>Aceitar entregas depois do encerramento (ficam marcadas como atrasadas)</span></label></div>
  <h3 style="margin:16px 0 10px">Questões</h3>`;
  a.questoes.forEach((q,i)=>{h+=`<div class="qed"><div class="qh"><span class="qn">${i+1}</span><span class="qtag">${TIPOQ[q.tipo]}</span>${q.disciplina?`<span class="qtag">${ic(q.disciplina)} ${esc(q.disciplina)}</span>`:''}<div class="tools"><button data-a="qMv" data-i="${i}" data-v="-1" title="Subir">↑</button><button data-a="qMv" data-i="${i}" data-v="1" title="Descer">↓</button><button data-a="qDup" data-i="${i}" title="Duplicar">⧉</button><button data-a="qDel" data-i="${i}" title="Excluir" style="color:var(--bad)">✕</button></div></div>
    <label>Enunciado<textarea data-qe="${i}" data-f="enunciado" rows="2">${esc(q.enunciado)}</textarea></label>
    ${q.textoApoio||ED.abrirApoio[i]?`<label>Texto de apoio<textarea data-qe="${i}" data-f="textoApoio" rows="4" placeholder="Texto, poema, trecho, tabela…">${esc(q.textoApoio)}</textarea></label>`:''}
    ${q.imagem?`<div style="position:relative;margin-bottom:10px"><img class="qimg" data-img="${esc(q.imagem)}" style="max-height:220px"><button class="btn sm dan" data-a="qImgRm" data-i="${i}">Remover imagem</button></div>`:''}
    <div class="fbtns" style="margin:0 0 10px">${!q.textoApoio&&!ED.abrirApoio[i]?`<button class="btn sm" data-a="qApoio" data-i="${i}">+ Texto de apoio</button>`:''}<label class="btn sm" style="margin:0">${q.imagem?'Trocar imagem':'+ Imagem'}<input type="file" accept="image/*" data-qimg="${i}" hidden></label></div>`;
    if(q.tipo==='mc')h+=`<div class="small muted" style="font-weight:800;margin-bottom:6px">Alternativas — marque a correta</div>${q.opcoes.map((o,j)=>`<div class="opt"><input type="radio" name="c${i}" data-a="qCor" data-i="${i}" data-j="${j}" ${q.correta===j?'checked':''}><b>${L(j)})</b><input data-qo="${i}" data-j="${j}" value="${esc(o)}" placeholder="Alternativa ${L(j)}">${q.opcoes.length>2?`<button class="rm" data-a="qOpRm" data-i="${i}" data-j="${j}">✕</button>`:''}</div>`).join('')}${q.opcoes.length<8?`<button class="lnk" data-a="qOpAdd" data-i="${i}">+ alternativa</button>`:''}`;
    if(q.tipo==='vf')h+=`<div class="small muted" style="font-weight:800;margin-bottom:6px">A afirmação é:</div><div class="vf" style="margin-bottom:8px"><label class="ch ${q.correta===true?'right':''}"><input type="radio" name="c${i}" data-a="qVf" data-i="${i}" data-v="1" ${q.correta===true?'checked':''}>Verdadeira</label><label class="ch ${q.correta===false?'right':''}"><input type="radio" name="c${i}" data-a="qVf" data-i="${i}" data-v="" ${q.correta===false?'checked':''}>Falsa</label></div>`;
    h+=`<div class="row2" style="margin-top:10px"><label>Pontuação<input type="number" min="0" step="0.5" data-qe="${i}" data-f="pontos" value="${esc(q.pontos)}"></label><label class="chk" style="align-self:end"><input type="checkbox" data-qe="${i}" data-f="permiteFoto" ${q.permiteFoto?'checked':''}><span>Aluno pode enviar foto (ex.: do caderno)</span></label></div>
    <label>${q.tipo==='disc'?'Resposta esperada / critérios <span class="opt">(o aluno vê depois da correção)</span>':'Explicação <span class="opt">(o aluno vê depois da correção)</span>'}<textarea data-qe="${i}" data-f="explicacao" rows="2">${esc(q.explicacao)}</textarea></label></div>`;});
  h+=`<div class="addq"><button class="btn" data-a="qAdd" data-t="mc">+ Múltipla escolha</button><button class="btn" data-a="qAdd" data-t="vf">+ Verdadeiro/Falso</button><button class="btn" data-a="qAdd" data-t="disc">+ Discursiva</button></div>
  <div class="err" id="edErr"></div><div class="savebar"><span class="st">${pts(total)} pontos no total</span><button class="btn" data-a="edSalvar" data-s="rascunho">Salvar rascunho</button><button class="btn pri" data-a="edSalvar" data-s="publicada">${a.status==='publicada'?'Salvar e manter publicada':'Publicar'}</button></div>`;
  $('#edw').innerHTML=h;carregaImgs();
  $$('#edw [data-e]').forEach(el=>el.addEventListener(el.type==='checkbox'||el.tagName==='SELECT'?'change':'input',()=>{const k=el.dataset.e;a[k]=el.type==='checkbox'?el.checked:(el.type==='datetime-local'?fromLocalInput(el.value):el.value)}));
  $$('#edw [data-qe]').forEach(el=>el.addEventListener(el.type==='checkbox'?'change':'input',()=>{const q=a.questoes[+el.dataset.qe];const f=el.dataset.f;q[f]=el.type==='checkbox'?el.checked:(f==='pontos'?Number(el.value):el.value);if(f==='pontos')$('#edw .savebar .st').textContent=pts(a.questoes.reduce((s,x)=>s+(Number(x.pontos)||0),0))+' pontos no total'}));
  $$('#edw [data-qo]').forEach(el=>el.addEventListener('input',()=>{a.questoes[+el.dataset.qo].opcoes[+el.dataset.j]=el.value}));
  $$('#edw [data-turma]').forEach(el=>el.addEventListener('change',()=>{const id=el.dataset.turma;a.turmas=el.checked?[...new Set([...a.turmas,id])]:a.turmas.filter(x=>x!==id);if(ED.indiv)redraw()}));
  const iv=$('#indiv');iv.onchange=()=>{ED.indiv=iv.checked;if(!iv.checked)a.alunos=[];redraw()};
  $$('#edw [data-aluno]').forEach(el=>el.addEventListener('change',()=>{const id=el.dataset.aluno;a.alunos=el.checked?[...new Set([...a.alunos,id])]:a.alunos.filter(x=>x!==id)}));
  $$('#edw [data-qimg]').forEach(el=>el.addEventListener('change',async()=>{const i=+el.dataset.qimg;const f=el.files[0];if(!f)return;toast('Enviando imagem…');
    try{const url=await comprimir(f);const r=await api('uploadImagem',{dataUrl:url});S.img[r.id]=Promise.resolve(url);a.questoes[i].imagem=r.id;redraw();toast('Imagem adicionada ✓')}catch(e){toast(e.message)}}));
}
function redraw(){const y=window.scrollY;drawEditor();window.scrollTo(0,y)}
ACOES.qAdd=d=>{ED.a.questoes.push(novaQ(d.t));drawEditor();setTimeout(()=>{const q=$$('#edw .qed');if(q.length)q[q.length-1].scrollIntoView({behavior:'smooth',block:'center'})},50)};
ACOES.qDel=async d=>{if(ED.a.questoes.length===1){toast('A atividade precisa de pelo menos uma questão.');return}if(!await confirmar('Excluir questão',`Excluir a questão ${+d.i+1}?`,'Excluir',true))return;ED.a.questoes.splice(+d.i,1);redraw()};
ACOES.qDup=d=>{const i=+d.i;ED.a.questoes.splice(i+1,0,JSON.parse(JSON.stringify(ED.a.questoes[i])));redraw()};
ACOES.qMv=d=>{const i=+d.i,j=i+(+d.v);const Q=ED.a.questoes;if(j<0||j>=Q.length)return;[Q[i],Q[j]]=[Q[j],Q[i]];redraw()};
ACOES.qCor=d=>{ED.a.questoes[+d.i].correta=+d.j};
ACOES.qVf=d=>{ED.a.questoes[+d.i].correta=!!d.v;redraw()};
ACOES.qOpAdd=d=>{ED.a.questoes[+d.i].opcoes.push('');redraw()};
ACOES.qOpRm=d=>{const q=ED.a.questoes[+d.i],j=+d.j;q.opcoes.splice(j,1);if(q.correta===j)q.correta=null;else if(q.correta>j)q.correta--;redraw()};
ACOES.qApoio=d=>{ED.abrirApoio[+d.i]=true;redraw()};
ACOES.qImgRm=d=>{ED.a.questoes[+d.i].imagem='';redraw()};
ACOES.edSalvar=async(d,b)=>{const a=ED.a;a.status=d.s;$('#edErr').textContent='';
  if(d.s==='publicada'&&ED.indiv&&!a.alunos.length){$('#edErr').textContent='Escolha os alunos ou desmarque "Publicar só para alguns alunos".';return}
  await busy(b,async()=>{try{const r=await api('atividadeSalvar',{atividade:a});toast(d.s==='publicada'?'Atividade publicada ✓':'Rascunho salvo ✓');go('p_entregas',{id:r.id})}catch(e){$('#edErr').textContent=e.message;toast(e.message)}})};

/* ---- correção ---- */
VIEWS.p_correcoes=async function(){
  const L2=await api('correcoesPendentes');S.badge.p_correcoes=L2.length;
  return `<div class="ph"><div><h1>Correções</h1><p>Entregas aguardando correção e pedidos de revisão</p></div></div>
  <div class="list">${L2.length?L2.map(x=>`<button class="it" data-go="p_corrigir" data-p="${P({id:x.id})}"><div class="ic">${x.revisao?'🔁':'📄'}</div><div class="mid"><div class="t">${esc(x.aluno)}</div><div class="s">${esc(x.atividade)} · enviada ${fdh(x.enviadoEm)}${x.atrasada?' · atrasada':''}</div></div><div class="end"><span class="pill ${x.revisao?'agendada':'enviada'}">${x.revisao?'Revisão pedida':'Corrigir'}</span></div></button>`).join(''):empty('✅','Tudo corrigido!','As questões objetivas são corrigidas automaticamente.')}</div>`;
};
let CO=null;
VIEWS.p_corrigir=async function(p){
  const r=await api('entregaObter',{id:p.id});const e=r.entrega,a=r.atividade;
  const c=e.correcao||{pontos:[],comentarios:[]};
  CO={id:e.id,aId:a.id,pontos:a.questoes.map((q,i)=>c.pontos[i]==null?'':c.pontos[i]),coms:a.questoes.map((q,i)=>(c.comentarios||[])[i]||'')};
  const idx=r.irmas.findIndex(x=>x.id===e.id);const prox=r.irmas[idx+1],ant=r.irmas[idx-1];
  let h=`<button class="back" data-go="p_entregas" data-p="${P({id:a.id})}">← ${esc(a.titulo)}</button>
  <div class="ph"><div><h1>${esc(r.aluno?r.aluno.nome:'Aluno')}</h1><p>${esc(a.titulo)} · enviada ${fdh(e.enviadoEm)}${e.atrasada?' · <b style="color:var(--bad)">atrasada</b>':''}</p></div><div style="display:flex;gap:6px">${ant?`<button class="btn sm" data-go="p_corrigir" data-p="${P({id:ant.id})}">← Anterior</button>`:''}${prox?`<button class="btn sm" data-go="p_corrigir" data-p="${P({id:prox.id})}">Próximo →</button>`:''}</div></div>`;
  if(e.revisaoPedida)h+=`<div class="note">🔁 <b>Pedido de revisão do aluno:</b> ${esc(e.revisaoMsg)}</div>`;
  if((e.historico||[]).length)h+=`<details class="card"><summary style="font-weight:800;cursor:pointer">Histórico de notas (${e.historico.length})</summary><div class="small" style="margin-top:8px">${e.historico.map(x=>`${fdh(x.em)} — ${esc(x.por)}: ${x.anterior!=null?pts(x.anterior)+' → ':''}<b>${pts(x.nota)}</b> pts`).join('<br>')}</div></details>`;
  a.questoes.forEach((q,i)=>{const resp=(e.respostas||[])[i];const fs=(e.fotos||{})[i]||[];
    h+=`<div class="q"><div class="qh"><span class="qn">${i+1}</span><span class="qtag">${TIPOQ[q.tipo]}${q.tipo!=='disc'?' · correção automática':''}</span><span class="qpts">vale ${pts(q.pontos)}</span></div><div class="enun">${esc(q.enunciado)}</div>`;
    if(q.tipo==='mc')h+=`<div class="resp">Aluno marcou: <b>${resp!=null?L(resp)+') '+esc(q.opcoes[resp]):'(em branco)'}</b><br>Correta: <b>${L(q.correta)}) ${esc(q.opcoes[q.correta])}</b> ${resp===q.correta?'✅':'❌'}</div>`;
    if(q.tipo==='vf')h+=`<div class="resp">Aluno: <b>${resp===true?'Verdadeiro':resp===false?'Falso':'(em branco)'}</b> · Correta: <b>${q.correta?'Verdadeiro':'Falso'}</b> ${resp===q.correta?'✅':'❌'}</div>`;
    if(q.tipo==='disc')h+=`<div class="resp">${esc(resp||'(sem resposta escrita)')}</div>${q.explicacao?`<div class="fb">📋 Esperado: ${esc(q.explicacao)}</div>`:''}`;
    if(q.permiteFoto)h+=fs.length?`<div class="small muted" style="margin-top:8px;font-weight:800">📷 ${fs.length} foto${fs.length>1?'s':''} — toque para ampliar</div><div class="fotos">${fs.map(id=>`<div class="ft" style="width:130px;height:130px"><img data-img="${esc(id)}" alt="Foto do aluno"></div>`).join('')}</div>`:'<div class="small muted" style="margin-top:6px">Sem fotos.</div>';
    h+=`<div class="row2" style="margin-top:12px"><label>Pontos (0 a ${pts(q.pontos)})<input type="number" min="0" max="${q.pontos}" step="0.25" data-cp="${i}" value="${esc(CO.pontos[i])}"></label><label>Comentário <span class="opt">(opcional)</span><input data-cc="${i}" value="${esc(CO.coms[i])}"></label></div>
    <div style="display:flex;gap:6px"><button class="btn sm ok" data-a="cpSet" data-i="${i}" data-v="${q.pontos}">Certo (${pts(q.pontos)})</button><button class="btn sm" data-a="cpSet" data-i="${i}" data-v="${q.pontos/2}">Metade</button><button class="btn sm dan" data-a="cpSet" data-i="${i}" data-v="0">Errado (0)</button></div></div>`;});
  h+=`<div class="card"><label>Comentário geral para o aluno<textarea id="coG" rows="3">${esc(e.comentario||'')}</textarea></label>
  ${a.notasLiberadas?'<div class="small muted">As notas desta atividade já estão liberadas: o aluno verá a correção ao salvar.</div>':`<label class="chk"><input type="checkbox" id="coL"><span>Liberar as notas desta atividade para todos os alunos agora</span></label>`}</div>
  <div class="err" id="coE"></div><div class="savebar"><span class="st" id="coT"></span><button class="btn pri" data-a="coSalvar" data-prox="${prox?prox.id:''}">Salvar correção${prox?' e ir para o próximo':''}</button></div>`;
  return {html:h,depois(){
    const tot=()=>{const s=CO.pontos.reduce((x,p)=>x+(p===''?0:Number(p)),0);$('#coT').textContent=`Total: ${pts(s)} / ${pts(a.questoes.reduce((x,q)=>x+q.pontos,0))} pts · nota ${nota(s,a.questoes.reduce((x,q)=>x+q.pontos,0))}`};
    $$('[data-cp]').forEach(el=>el.addEventListener('input',()=>{CO.pontos[+el.dataset.cp]=el.value;tot()}));
    $$('[data-cc]').forEach(el=>el.addEventListener('input',()=>{CO.coms[+el.dataset.cc]=el.value}));tot();CO.tot=tot}};
};
ACOES.cpSet=d=>{CO.pontos[+d.i]=Number(d.v);const el=$(`[data-cp="${d.i}"]`);el.value=Number(d.v);CO.tot()};
ACOES.coSalvar=async(d,b)=>{$('#coE').textContent='';const l=$('#coL');
  await busy(b,async()=>{try{await api('entregaCorrigir',{id:CO.id,pontos:CO.pontos.map(p=>p===''?null:Number(p)),comentarios:CO.coms,comentario:$('#coG').value,liberar:!!(l&&l.checked)});toast('Correção salva ✓');
    if(d.prox)go('p_corrigir',{id:d.prox});else go('p_entregas',{id:CO.aId})}catch(e){$('#coE').textContent=e.message;toast(e.message)}})};

/* ---- relatórios do professor ---- */
VIEWS.p_relatorios=async function(p){
  const ts=(await api('turmas')).filter(t=>!t.arquivada||t.id===p.turma);const id=p.turma||(ts[0]&&ts[0].id);
  if(!id)return `<div class="ph"><div><h1>Relatórios</h1></div></div>`+empty('📊','Crie uma turma para ver relatórios','');
  const r=await api('relatorioTurma',{id});const AT=r.atividades;
  const cel=c=>c.s==='corrigida'?`<b>${nota(c.n,c.m)}</b>`:c.s==='enviada'?'<span class="pill enviada">enviada</span>':c.s==='atrasada'?'<span class="pill atrasada">não entregou</span>':c.s==='na'?'<span class="muted">—</span>':'<span class="pill pendente">pendente</span>';
  return `<div class="ph"><div><h1>Relatórios</h1><p>Desempenho individual e coletivo</p></div><button class="btn sm" onclick="window.print()">🖨️ Imprimir</button></div>
  <label style="max-width:420px">Turma<select id="selT">${ts.map(t=>`<option value="${t.id}" ${t.id===id?'selected':''}>${esc(t.nome)}</option>`).join('')}</select></label>
  <div class="grid g3" style="margin-bottom:14px"><div class="stat"><b>${r.linhas.length}</b><span>Alunos</span></div><div class="stat"><b>${AT.length}</b><span>Atividades publicadas</span></div><div class="stat"><b>${(()=>{const v=r.linhas.filter(l=>l.pct!=null);return v.length?pct(Math.round(v.reduce((s,l)=>s+l.pct,0)/v.length*10)/10):'—'})()}</b><span>Aproveitamento médio</span></div></div>
  ${r.disciplinas.length?`<div class="card"><h3>Desempenho por disciplina</h3>${r.disciplinas.map(x=>`<div class="srow"><div class="l"><span>${ic(x.nome)} ${esc(x.nome)}</span><span>${pct(x.pct)}</span></div><div class="bar"><i style="width:${x.pct||0}%"></i></div></div>`).join('')}</div>`:''}
  <h3 style="margin:14px 0 8px">Notas por aluno (escala 0–${S.cfg.escalaNota})</h3>
  ${r.linhas.length&&AT.length?`<div class="tbl"><table><tr><th>Aluno</th>${AT.map(a=>`<th title="${esc(a.titulo)}">${esc(a.titulo.length>22?a.titulo.slice(0,21)+'…':a.titulo)}</th>`).join('')}<th>Aproveit.</th></tr>
  ${r.linhas.map(l=>`<tr><td><button class="lnk" data-go="p_aluno" data-p="${P({id:l.id,turma:id})}">${esc(l.nome)}</button></td>${l.cel.map(cel).join('')}<td><b>${pct(l.pct)}</b></td></tr>`).join('')}
  <tr style="background:#f7f8fc"><td><b>Média / entregas</b></td>${r.medias.map(m=>`<td><b>${pct(m.pct)}</b><div class="small muted">${m.entregues}/${r.linhas.length}</div></td>`).join('')}<td></td></tr></table></div>`:empty('📊','Sem dados ainda','Publique atividades e aguarde as entregas.')}`;
};
document.addEventListener('change',e=>{if(e.target.id==='selT')go('p_relatorios',{turma:e.target.value})});

/* =================== ADMINISTRADOR =================== */
VIEWS.ad_inicio=async function(){

async function iaVerificar(){if(!S.u||S.u.trocarSenha)return;try{const r=await api('iaStatus');const antes=S.iaAtiva;S.iaAtiva=!!r.ativa;S.iaTutor=!!r.tutor;S.iaFotoTutor=!!r.fotoTutor;S.iaProv=r.provedor;if(antes!==S.iaAtiva){if($('#nav'))shell();const hb=$('.hub');if(hb&&typeof hubAtiv==='function'){const on=hb.querySelector('button.on');hb.outerHTML=hubAtiv(on?on.dataset.go:'')}}}catch(e){}}
function mdSimples(t){return esc(t).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/^\s*[-•]\s+/gm,'• ').replace(/\n/g,'<br>')}
function lerArquivo(f){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=()=>rej(new Error('Não foi possível ler '+f.name));r.readAsDataURL(f)})}

/* ---- PROFESSOR: gerar atividade por foto/PDF ---- */
let GER={arquivos:[]};
VIEWS.p_ia=async function(){
  const st=await api('iaStatus').catch(()=>null);
  const lista=()=>GER.arquivos.map((a,i)=>`<div class="ft" style="width:110px;height:110px">${a.tipo==='pdf'?`<div style="display:grid;place-items:center;height:100%;font-size:13px;font-weight:800;text-align:center;padding:6px">📄<br>${esc(a.nome.slice(0,28))}</div>`:`<img src="${a.url}">`}<button class="x" data-a="iaRm" data-i="${i}">✕</button></div>`).join('');
  return {html:`<div class="ph"><div><h1>✨ Gerar atividade com IA</h1><p>Informe o assunto e o nível, ou envie fotos e PDFs do material. A IA cria as questões com gabarito e explicação. Você revisa antes de publicar.</p></div></div>
  ${st&&!st.ativa?'<div class="note">A IA está desligada nas configurações da plataforma.</div>':''}
  ${st&&st.provedor==='gemini'?'<div class="note">🔒 O material é enviado ao Google Gemini (cota gratuita), que pode usá-lo para melhorar os produtos dele. <b>Não envie fotos com nomes, rostos ou dados de alunos</b>: só páginas de livros e materiais de aula.</div>':''}
  ${st?`<div class="info">Usos hoje: <b>${st.usados}</b> de ${st.limite}.</div>`:''}
  <div class="card"><h3 style="margin-bottom:10px">1. Assunto e nível</h3>
   <div class="row2"><label>Assunto<input id="iaAssunto" placeholder="Ex.: Frações, Ciclo da água, Independência do Brasil" value="${esc(GER.assunto||'')}"></label>
   <label>Nível de ensino<select id="iaNivel"><option value="">Escolha…</option>${[['infantil','Educação Infantil'],['f1','Ensino Fundamental I (1º ao 5º ano)'],['f2','Ensino Fundamental II (6º ao 9º ano)'],['em','Ensino Médio'],['livre','Curso livre']].map(([v,t])=>`<option value="${v}" ${GER.nivel===v?'selected':''}>${t}</option>`).join('')}</select></label></div>
   <p class="small muted" style="margin:0">Só com o assunto a IA já cria a atividade, com um texto de apoio original. Se quiser, envie também o seu material abaixo.</p></div>
  <div class="card"><h3 style="margin-bottom:10px">2. Material <span class="opt">(opcional)</span></h3>
   <div class="fbtns" style="margin-top:0"><label class="btn" style="margin:0">📷 Tirar foto<input type="file" accept="image/*" capture="environment" data-iaf="img" hidden></label>
   <label class="btn" style="margin:0">🖼️ Fotos da galeria<input type="file" accept="image/*" multiple data-iaf="img" hidden></label>
   <label class="btn" style="margin:0">📄 PDF<input type="file" accept="application/pdf" multiple data-iaf="pdf" hidden></label></div>
   <div class="fotos" id="iaLista">${lista()}</div>
   <label style="margin-top:12px">Ou cole um texto <span class="opt">(opcional)</span><textarea id="iaTexto" rows="3" placeholder="Cole aqui um trecho do livro, resumo da aula…">${esc(GER.texto||'')}</textarea></label>
   <p class="small muted" style="margin:0">Até 12 arquivos • fotos são comprimidas automaticamente • PDF até 10 MB</p></div>
  <div class="card"><h3 style="margin-bottom:10px">3. Como devem ser as questões</h3>
   <div class="row2"><label>Quantidade<select id="iaQtd">${[5,10,15,20,30].map(n=>`<option ${n===(GER.qtd||10)?'selected':''}>${n}</option>`).join('')}</select></label>
   <label>Dificuldade<select id="iaDif"><option value="facil">Fácil</option><option value="medio" selected>Média</option><option value="dificil">Difícil</option><option value="misto">Misturada</option></select></label></div>
   <label>Tipos de questão</label><div style="display:flex;gap:14px;flex-wrap:wrap;margin:-4px 0 12px">
    <label class="chk" style="margin:0"><input type="checkbox" class="iaTipo" value="mc" checked><span>Múltipla escolha</span></label>
    <label class="chk" style="margin:0"><input type="checkbox" class="iaTipo" value="vf" checked><span>Verdadeiro ou falso</span></label>
    <label class="chk" style="margin:0"><input type="checkbox" class="iaTipo" value="disc"><span>Discursiva</span></label></div>
   <div class="row2"><label>Disciplina<input id="iaDisc" list="dlDia" placeholder="Ex.: Ciências" value="${esc(GER.disc||'')}"></label><label>Série / nível<input id="iaSerie" placeholder="Ex.: 6º ano" value="${esc(GER.serie||'')}"></label></div>
   <datalist id="dlDia">${Object.keys(DISC_IC).map(x=>`<option value="${esc(x)}">`).join('')}</datalist>
   <label>Orientações para a IA <span class="opt">(opcional)</span><input id="iaObs" placeholder="Ex.: foco no ciclo da água; linguagem simples" value="${esc(GER.obs||'')}"></label></div>
  <div class="err" id="iaErr"></div>
  <button class="btn pri full" data-a="iaGerar" style="min-height:52px;font-size:17px">✨ Gerar questões</button>
  <p class="small muted center">As questões geradas abrem no editor para você revisar, editar e então salvar ou publicar.</p>`,
  depois(){
    $$('[data-iaf]').forEach(inp=>inp.addEventListener('change',async()=>{
      for(const f of [...inp.files]){
        if(GER.arquivos.length>=12){toast('Máximo de 12 arquivos.');break}
        try{
          if(inp.dataset.iaf==='pdf'){if(f.size>10*1024*1024){toast(f.name+': PDF maior que 10 MB');continue}GER.arquivos.push({tipo:'pdf',nome:f.name,url:await lerArquivo(f)})}
          else GER.arquivos.push({tipo:'img',nome:f.name,url:await comprimir(f)})
        }catch(e){toast(e.message)}
      }
      inp.value='';$('#iaLista').innerHTML=lista();
    }));
  }};
};
ACOES.iaRm=d=>{GER.arquivos.splice(+d.i,1);render()};
ACOES.iaGerar=async(d,b)=>{
  $('#iaErr').textContent='';

  const tipos=$$('.iaTipo').filter(x=>x.checked).map(x=>x.value);
  if(!GER.arquivos.length&&!GER.texto.trim()&&!GER.assunto){$('#iaErr').textContent='Escreva o assunto ou envie uma foto, um PDF ou um texto.';return}
  if(!tipos.length){$('#iaErr').textContent='Escolha pelo menos um tipo de questão.';return}
  modal(`<div class="center"><div class="spin" style="margin:20px auto"></div><h2>${GER.arquivos.length?'A IA está lendo o material…':'A IA está criando as questões…'}</h2><p class="muted">Isso costuma levar de 20 segundos a 1 minuto. Não feche esta tela.</p></div>`);
  try{
    const r=await api('iaGerarQuestoes',{arquivos:GER.arquivos.map(a=>a.url),texto:GER.texto,quantidade:GER.qtd,dificuldade:$('#iaDif').value,tipos,disciplina:GER.disc,serie:GER.serie,observacoes:GER.obs,assunto:GER.assunto,nivelEnsino:GER.nivel});
    fechar();
    S.rascunhoIA={titulo:r.titulo,disciplina:r.disciplina||GER.disc,instrucoes:r.resumo||'',questoes:r.questoes,custo:r.custoUSD,pedidas:r.pedidas};
    GER={arquivos:[]};toast(r.questoes.length+' questões geradas ✓');go('p_editor',{ia:1});
  }catch(e){fechar();$('#iaErr').textContent=e.message;toast(e.message)}
};

let TUT={msgs:[],ativ:'',img:null};
VIEWS.a_tutor=async function(p){
  if(p&&p.atividade)TUT.ativ=p.atividade;
